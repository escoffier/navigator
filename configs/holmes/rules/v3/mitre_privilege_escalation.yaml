      zh: "K8s-token是用于身份验证和授权的敏感令牌，它们用于访问 Kubernetes 集群中的各种资源和服务。正常用户通常不会直接尝试读取或滥用 K8s-token，大概率是攻击者在进行攻击后，尝试读取 Kubernetes（K8s）的令牌（K8s-token）并进行 RBAC（基于角色的访问控制）权限绕过进行执行恶意操作，或者在集群内部进行横向移动。"
    suggestion:
