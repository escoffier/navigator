apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ printf "%s-daemon" (include "common.names.fullname" .) }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: sec-prof-man-daemon
spec:
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: sec-prof-man-daemon
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      name: {{ printf "%s-daemon" (include "common.names.fullname" .) }}
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component: sec-prof-man-daemon
    spec:
      serviceAccountName: {{ printf "%s-daemon" (include "common.names.fullname" .) }}
      restartPolicy: Always
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: sec-prof-man-daemon-loader-audit
        image: {{ include "secProfilesAudit.image" . }}
        imagePullPolicy: {{ .Values.audit.image.pullPolicy }}
        env:
          - name: EVENT_GRPC_URL
            value: {{ .Values.eventcenter.eventGrpcUrl }}
          - name: EVENT_GRPC_CERT_PATH
            value: /auth/server/tls.crt
          - name: EVENT_GRPC_CERT_SERVER_NAME
            value: {{ .Values.eventcenter.eventGrpcCertServerName }}
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: sys
          mountPath: /sys
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - mountPath: /auth/server
          name: server-cert
          readOnly: true
        resources:
{{ toYaml .Values.audit.resources | indent 10 }}
      - name: sec-prof-man-daemon-loader
        image: {{ include "secProfilesLoader.image" . }}
        imagePullPolicy: {{ .Values.loader.image.pullPolicy }}
        env:
          - name: MY_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: SEC_PROFILES_CONTAINER_CONFIGMAP
            value: {{ printf "%s-container" (include "common.names.fullname" .) }}
        securityContext:
          privileged: true
        volumeMounts: 
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: apparmor-includes
          mountPath: /etc/apparmor.d
        - name: kubelet
          mountPath: /var/lib/kubelet
        resources:
{{ toYaml .Values.loader.resources | indent 10 }}
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.image.pullSecret }}
      {{- else if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      hostPID: true
      volumes:
      - name: kubelet
        hostPath:
          path: "/var/lib/kubelet"
      - name: sys
        hostPath:
          path: /sys
      - name: apparmor-includes
        hostPath:
          path: /etc/apparmor.d
      - name: proc
        hostPath:
          path: /proc
      - name: server-cert
        secret:
          defaultMode: 400
          secretName: eventcenter-tls-server-cert-secret
