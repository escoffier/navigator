{{- if .Values.persistence.enabled -}}
apiVersion: {{ include "tensorsec.common.capabilities.cronjob.apiVersion" . }}
kind: CronJob
metadata:
  name: {{ .Values.persistence.tensorsecCleaner.hotLogicCronjob.fullnameOverride }}
  labels:
    app: {{ .Values.persistence.tensorsecCleaner.hotLogicCronjob.nameOverride }}
spec:
  schedule: {{ .Values.persistence.tensorsecCleaner.hotLogicCronjob.cronString }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      completions: 1
      template:
        spec:
          containers:
            - command:
                - /app/tensor-cleaner
                -  hot-logic-storage-tool
              env:
                - name: CONF_PATH
                  value: /app/hot-logic-conf.json
                - name: PGSQL_HOST
                  value: tensorsec-postgresql
                - name: PGSQL_USER
                  value: postgres
                - name: PGSQL_DBNAME
                  value: postgres
                - name: PGSQL_SSL_MODE
                  value: disable
                - name: PGSQL_PASSWORD
                  value: password
              image: {{ include "jobs.cleaner.image" . }}
              imagePullPolicy: {{ .Values.persistence.tensorsecCleaner.image.pullPolicy }}
              name: {{ .Values.persistence.tensorsecCleaner.hotLogicCronjob.nameOverride }}
              resources:
{{ toYaml .Values.persistence.tensorsecCleaner.hotLogicCronjob.resources | trim | indent 16 }}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /audit
                  name: audit
          restartPolicy: Never
          {{- if .Values.global.image.pullSecret }}
          imagePullSecrets:
          - name: {{ .Values.global.image.pullSecret }}
          {{- else if .Values.image.pullSecret }}
          imagePullSecrets:
          - name: {{ .Values.image.pullSecret }}
          {{- end }}
          volumes:
            - name: audit
              persistentVolumeClaim:
                claimName: audit-pvc
{{- end -}}
