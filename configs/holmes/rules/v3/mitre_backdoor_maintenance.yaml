- key: Remove bulk data from disk
  hid: pers_04
  condition: >
    spawned_process and clear_data_procs and not user_known_remove_data_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Remove bulk data from disk"
      zh: "发现大量数据从硬盘删除"
    desc:
      en: "Usually we think that the deletion of large amounts of data from the hard disk is usually judged as an attack, because this may be a sign of malicious behavior. The high probability is that the attacker deliberately destroys sensitive data, clears logs and evidence related to his activities in order to permanently destroy sensitive data, clear logs and evidence related to his activities after conducting an attack. data or systems and carry out threats of extortion."
      zh: "通常我们认为大量数据从硬盘删除通常被判断为攻击，因为这可能是恶意行为的迹象，大概率是攻击者在进行攻击后，为了永久销毁敏感数据、清除与其活动相关的日志和证据、蓄意破坏数据或系统以及进行威胁勒索。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process name is shred, mkfs, mke2fs. Contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为shred、mkfs、 mke2fs，及时联系安全人员进一步排查"
    rule_type: Persistence
    priority: WARNING
    urgency: true
    tags: [ATT&CK, file, mitre_backdoor_maintenance, L4]

- key: Modify shell configuration file
  hid: pers_05
  condition: >
    open_write and shell_parent_procs and
    (fd.filename in (shell_config_filenames) or
     fd.name in (shell_config_files) or
     fd.directory in (shell_config_directories))
    and not proc.name in (shell_binaries)
    and not exe_running_docker_save
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Modify shell configuration file"
      zh: "修改shell配置文件"
    desc:
      en: "Usually we think that normal users will basically not modify files such as: bash_history, bash_login, bash_history, etc. There is a high probability that the attacker will modify the shell configuration file after carrying out the attack in order to include elevating privileges, obtaining persistent access rights, avoiding detection, and executing backdoors. Operate, steal sensitive information and inject malicious functions (such as obtaining user ssh password, etc.)."
      zh: "通常我们认为正常用户基本上不会修改如：bash_history、bash_login、bash_history等文件，大概率是攻击者在进行攻击后，修改shell配置文件为了包括提权、获得持久性访问权限、避免检测、执行后门操作、窃取敏感信息和注入恶意功能(如:获取用户ssh密码等)。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the system call is write and whether the file descriptor is (~/.bash_profile, ~/.bashrc, etc.), promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为write及文件描述符是否为（~/.bash_profile、~/.bashrc等），及时联系安全人员进一步排查"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, filesystem, mitre_backdoor_maintenance, L4]

