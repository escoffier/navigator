      zh: "CVE-2022-0185(Linux_kernel_bug可导致Kubernetes容器逃逸)"
    desc:
      en: "CVE-2022-0185 is a vulnerability affecting the Linux kernel that may cause Kubernetes containers to escape. The main problem with this vulnerability lies in the implementation of the Linux kernel. When a process creates a child process in a control group (cgroup), there are some security issues that allow attackers to escape the restrictions of the container and gain access to the host system. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "CVE-2022-0185是一个影响Linux内核的漏洞，它可能导致Kubernetes容器逃逸。这个漏洞的主要问题在于Linux内核的实现，当进程在控制组（cgroup）中创建子进程时，会存在一些安全问题，使得攻击者能够逃离容器的限制，获得对宿主系统的访问权限。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the process name is unshare and whether the parameter contains mount , promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为unshare及参数是否包含mount，及时联系安全人员进一步排查"
