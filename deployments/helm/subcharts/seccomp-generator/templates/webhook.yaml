apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ template "seccompGenerator.serviceAccount" . }}-webhook
  labels:
    app: "{{ template "seccompGenerator.fullname" . }}-webhook"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
  annotations:
    certmanager.k8s.io/inject-ca-from: "{{ .Release.Namespace }}/{{ template "seccompGenerator.fullname" . }}-webhook-certificate"
webhooks:
  - name: {{ template "seccompGenerator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
    clientConfig:
      service:
        name: "{{ template "seccompGenerator.fullname" . }}-webhook-service"
        namespace: "{{ .Release.Namespace }}"
        path: "/mutate"
        port: 443
    rules:
      - operations: [ "CREATE" ]
        apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        resources: [ "pods" ]
    failurePolicy: Ignore
    timeoutSeconds: 10
    namespaceSelector:
      matchExpressions:
        - key: "name"
          operator: "NotIn"
          values:
            - "kube-system"
