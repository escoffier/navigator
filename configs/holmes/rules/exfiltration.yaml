- rule: Access k8s component ports detected
  hid: exf_20
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "The K8S sensitive port access behavior is detected. Please confirm whether it is legal access in combination with specific commands. If not, it may be used by attackers. Please isolate the pod in time"
    zh:
      key: "处置建议"
      value: "测到k8s敏感端口访问行为,请结合具体命令确认是否为合法访问，如果不是则可能遭到攻击者利用，请及时隔离该pod。"
  desc: Access k8s component ports detected
  condition: >
