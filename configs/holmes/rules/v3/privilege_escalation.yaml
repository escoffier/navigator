- key: Linux Privilege Escalation using nmap suid binaries
  hid: priv_15
  condition: >
    (evt.type = stat and evt.arg.path contains "nmap.xsl" and user.uid != 0 and ((proc.cmdline contains "interactive") or (proc.cmdline contains "script") or (proc.cmdline contains "-oG"))) and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Linux Privilege Escalation using nmap suid binaries"
      zh: "尝试利用nmap_suid进行linux提权"
    desc:
      en: "Linux Privilege Escalation using nmap suid binaries"
      zh: "尝试利用nmap_suid进行linux提权"
    suggestion:
      en: "Please check whether the nmap command in the container has been granted S permission, so that hackers try to use it to improve their rights. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "请排查容器内nmap命令是否被授予s权限，从而被黑客尝试利用提权，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, filesystem, mitre_privilege_escalation, L4]

- key: Linux Privilege Escalation using find suid binaries
  hid: priv_16
  condition: >
    spawned_process and user.uid != 0 and evt.res != ENOENT and (
    proc.name = find and
    ((proc.cmdline contains "-exec" or proc.cmdline contains "-ok") and proc.cmdline contains ";")
    ) and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  steps:
    - name: checkRelatedExists
      params: [ 'Generated child process shell after starting the container', 10s, trigger.payload.output_map.proc_pid, payload.output_map.proc_ppid ]
  info:
    name:
      en: "Linux Privilege Escalation using find suid binaries"
      zh: "尝试利用find_suid进行linux提权"
    desc:
      en: "Linux Privilege Escalation using find suid binaries"
      zh: "尝试利用find_suid进行linux提权"
    suggestion:
      en: "Please check whether the find command in the container has been granted s permission, so that hackers try to use it to improve their rights. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "请排查容器内find命令是否被授予s权限，从而被黑客尝试利用提权，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
