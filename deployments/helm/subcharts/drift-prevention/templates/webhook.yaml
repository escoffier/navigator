apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ template "driftPrevention.fullname" . }}-{{ .Release.Namespace }}
  labels:
    app: "{{ template "driftPrevention.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
  annotations:
    certmanager.k8s.io/inject-ca-from: "{{ .Release.Namespace }}/{{ template "driftPrevention.fullname" . }}-certificate"
webhooks:
  - name: {{ template "driftPrevention.fullname" . }}-service.{{ .Release.Namespace }}.svc
    clientConfig:
      caBundle: 
      service:
        name: "{{ template "driftPrevention.fullname" . }}-service"
        namespace: "{{ .Release.Namespace }}"
        path: "/mutate"
    rules:
      - operations: [ "CREATE" ]
        apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        resources: [ "pods" ]
    failurePolicy: Ignore
    namespaceSelector:
      matchExpressions:
        - key: "name"
          operator: "NotIn"
          values:
            - "kube-system"
