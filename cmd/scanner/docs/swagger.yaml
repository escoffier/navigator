  model.RejectPolicyConfigResponse:
    properties:
      cicd:
        type: boolean
      k8s_deployment:
        type: boolean
      mode:
        type: string
      online_monitor:
        type: boolean
      policies:
        items:
          $ref: '#/definitions/model.RejectPolicy'
        type: array
    type: object
  model.RejectRecord:
    properties:
      created_at:
        type: string
      deleted_at:
        type: integer
      digest:
        type: string
      full_repo_name:
        type: string
      id:
        type: integer
      library:
        type: string
      reject_at:
        type: string
      reject_detail:
        type: string
      reject_reason:
        items:
          type: integer
        type: array
      tag:
        type: string
      vuln_level:
        type: string
      vuln_score:
