##attck_rule_type=Watson
- key: Unauthorized access to Tomcat-Web in Redis
  hid: hp_01
  category: Watson
  categoryZh: 主动防御
  condition: >
    k8s.pod.name contains "51c1c6" and (inbound_outbound) and fd.sport=8080
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Unauthorized access to Tomcat-Web in Redis"
      zh: "Redis容器内未授权访问Tomcat-Web"
    desc:
      en: "Unauthorized access to Tomcat-Web in Redis"
      zh: "Redis容器内未授权访问Tomcat-Web"
    suggestion:
      en: "It is recommended to check whether an attacker has obtained internal container permissions, and use immune defense to restrict attackers from further attacks"
      zh: "建议排查是否有攻击者已获取内部容器权限，同时使用免疫防御限制攻击者进行进一步攻击。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [Watson, L4]

