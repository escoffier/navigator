  info:
    name:
      en: "Access k8s component ports detected"
      zh: "检测到访问k8s组件端口"
    desc:
      en: "Access k8s component ports detected"
      zh: "检测到访问k8s组件端口"
    suggestion:
      en: "The K8S sensitive port access behavior is detected. Please confirm whether it is legal access in combination with specific commands. If not, it may be used by attackers. Please isolate the pod in time"
