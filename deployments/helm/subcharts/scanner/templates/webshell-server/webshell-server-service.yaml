apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-webshell-server" (include "common.names.fullname" .) }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: webshell
spec:
  type: {{ .Values.webshell.service.type }}
  {{- if (and (eq .Values.webshell.service.type "ClusterIP") (not (empty .Values.webshell.service.clusterIP))) }}
  clusterIP: {{ .Values.webshell.service.clusterIP }}
  {{- end }}
  ports:
  - port: {{ .Values.webshell.service.port }}
    protocol: TCP
    name: http
    targetPort: 80
    {{- if (and (eq .Values.webshell.service.type "NodePort") (not (empty .Values.webshell.service.nodePort))) }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  selector: {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: webshell