## tensorsec scannner image name
image:
  registry:  localhost:32000
  repository: tensorsecurity
  name: tensorsec-scanner
  tag: latest
  pullPolicy: Always
  pullSecret: harbor-admin-secret

## Deployment pod host aliases
hostAliases: []

nameOverride: "scanner"
fullnameOverride: "tensorsec-scanner"

restartPolicy: Always

service:
  type: NodePort
  ApiPort: 8888
  ApiContainerPort: 8080
  LayerPort: 9278
  LayerContainerPort: 9278

replicaCount: 1

apiInstallLabel: "scanner.tensorsec/install"

resources:
  requests:
    cpu: "100m"
    memory: "200Mi"
  limits:
    cpu: "1000m"
    memory: "2000Mi"

clair:
  postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"

redis:
  password: qweqwe
  redisSecretName: redis-secret

mongo:
  mongoUsername: redstone
  mongoDatabase: vegeta
  mongoSecretName: tensorsec-mongodb # needs keey mongodb-password


harbor:
  harborURL: https://192.168.1.152:30003
  harborUsername: tensorsec
  harborSecretName: harbor-api-tensorsec

init: 
  resources:
    limits:
      cpu: 50m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 128Mi