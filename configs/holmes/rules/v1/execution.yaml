- rule: Reverse shell through socket and dup
  hid: exec_08
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "If the container is intruded, we need to isolate the container, get the remote ip address of the attacker, and check other attacks to confirm the security of the cluster."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，需隔离该容器，获取攻击者远程ip地址，同时排查其他攻击行为，确认集群安全。"
  desc: Reverse shell through socket and dup
  condition: >
    evt.type in (dup, dup2) and
    fd.num in (0, 1, 2) and fd.type in ("ipv4", "ipv6", "pipe") and fd.name contains "->" and
    container and shell_family_procs and
    not k8s.pod.name contains "98166d" and not k8s.pod.name contains "42cca6"
  output: >
    Reverse shell through socket and dup (zh_msg=容器内通过socket和dup反弹shell,rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name %container.info process=%proc.name parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository fd_name=%fd.name fd.num=%fd.num fd.type=%fd.type connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport)
  priority: ALERT
  tags: [ATT&CK, container, shell, mitre_execution]

- rule: Running k8s malicious tools in the container
  hid: exec_09
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "Please confirm whether the container has been invaded. You can use the immune defense training application to block new or modified executables, and limit the users and recipients who execute commands."
    zh:
      key: "处置建议"
      value: "请确认容器是否遭到入侵，可使用免疫防御训练应用，阻拦新的或被修改的可执行文件，限制执行命令的用户和接收对象。"
  desc: Running malicious tools in the container
  condition: >
    evt.type = execve and container and
    shell_parent_procs and 
    (not tensorsec_namespace) and
    (proc.cmdline contains "cdk eva" or
     proc.cmdline contains "k0otkit" or
     proc.cmdline contains "kubesploit" or
     proc.cmdline contains "red-kube" or
     proc.cmdline contains "kubestriker" or
     proc.cmdline contains "kube-hunter" or
     proc.cmdline contains "kubiscan"
      )
  output: >
    Running malicious tools in the container (zh_msg=容器内运行k8s恶意工具,rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,
    original_info=user=%user.name user_loginuid=%user.loginuid %container.info
    shell=%proc.name parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: WARNING
  tags: [ATT&CK, container, shell, mitre_execution, strict]

- rule: Connecting to a remote server through redis client in container
  hid: exec_10
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "Please use the process tree to determine whether the command is executed by malware, confirm whether the redis connection is a normal business connection, and investigate the reason for the connection."
    zh:
      key: "处置建议"
      value: 请通过进程树判断该命令是否由恶意软件执行，确认该redis连接是否为业务正常连接，排查出现该连接原因。"
  desc: Connecting to a remote server through redis client in container
  condition: >
    evt.type=openat and container and evt.arg.name contains ".rediscli_history" and proc.cmdline  contains " -h " and not proc.cmdline contains "localhost" and not proc.cmdline contains "127.0. 0.1" and not k8s.pod.name contains "51c1c6"
  output: >
    Connecting to a remote server through redis client in container (zh_msg=容器内通过redis客户端连接远程服务器,rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name user_loginuid=%user.loginuid parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: WARNING
  tags: [ATT&CK, container, shell, mitre_execution, strict]

- rule: Docker build vulnerability(CVE-2019-13139)
  hid: exec_11
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "Ensure your Docker engine is up to date and if possible avoid using remote context’s for builds, especially if supplied by third-parties."
    zh:
      key: "处置建议"
      value: "确保Docker版本是最新的,尽可能避免使用远程环境进行构建，特别是由第三方提供的。"
  desc: Docker build vulnerability
  condition: >
    evt.type=execve and proc.name=docker and
    (proc.cmdline contains "build" and proc.cmdline contains "git@" and proc.cmdline contains "--upload-pack") and
    shell_parent_procs
  output: >
    Docker build vulnerability (zh_msg=Docker构建漏洞导致代码执行(CVE-2019-13139),rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,
    original_info=user=%user.name user_loginuid=%user.loginuid %container.info
    shell=%proc.name parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: CRITICAL
  tags: [ATT&CK, container, shell, mitre_execution]