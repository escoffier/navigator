apiVersion: {{ include "tensorsec.common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ template "cluster-manager.fullname" . }}
  labels:
{{ include "cluster-manager.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cluster-manager.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cluster-manager.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccount: {{ template "cluster-manager.fullname" . }}
      containers:
      - name: {{ template "cluster-manager.fullname" . }}
        image: {{ include "clusterManager.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- if .Values.global.multiCluster.isMasterCluster }}
        - --cluster-name=default
        - --master-addr=tensorsec-console:8889
        - --console-postgres=postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable
        - --postgres-pvc=data-tensorsec-db-postgresql-0
        - --postgres-pod=tensorsec-db-postgresql-0
        - --postgres-data-path={{ .Values.postgresql.postgresqlDataDir }}
        - --vegeta-scanner-host=tensorsec-scanner
        - --vegeta-scanner-port=8888
        - --redis-endpoint=tensorsec-redis-ha-announce-0:26379,tensorsec-redis-ha-announce-1:26379,tensorsec-redis-ha-announce-2:26379
        {{- else if .Values.global.multiCluster.isMemberCluster }}
        - --master-addr={{ .Values.args.masterAddr }}
        - --cluster-name={{ .Values.args.clusterName }}
        - --api-server-address={{ .Values.args.apiServerAddr }}
        {{- end }}
        env:
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.global.multiCluster.isMasterCluster }}
        - name: TENSORSEC_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.redisSecretName }}
              key: auth
        {{- end }}
        resources:
{{ toYaml .Values.resources | trim | indent 10 }}
        volumeMounts:
        - name: cluster-admin-secret
          readOnly: true
          mountPath: "/etc/secrets/cluster-admin"
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      restartPolicy: Always
      volumes:
      - name: cluster-admin-secret
        secret:
          secretName: {{ include "cluster-manager.fullname" . }}

