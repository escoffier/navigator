  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,connection=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Interpreted procs outbound network activity"
      zh: "出站流量中包含解释型二进制"
    desc:
      en: "any network activity performed by interpreted binaries that are not expected to send or receive any network traffic"
      zh: "出站流量中包含解释型二进制，可能从外部下载/上传应用"
    suggestion:
      en: "Please judge whether the command belongs to the normal behavior of known processes through the process tree, judge whether the server IP address is as expected, confirm whether the traffic is abnormal, and can use micro-isolation to block the traffic."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，判断服务端ip地址是否符合预期，确认该流量是否异常，可使用微隔离阻拦流量。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, mitre_exfiltration]

- key: Unexpected outbound connection destination
  hid: exf_04
  condition: >
    consider_all_outbound_conns and outbound and not
    ((fd.sip in (allowed_outbound_destination_ipaddrs)) or
     (fd.snet in (allowed_outbound_destination_networks)) or
     (fd.sip.name in (allowed_outbound_destination_domains)))
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Unexpected outbound connection destination"
      zh: "出站流量中包含未知目的地址"
    desc:
      en: "Detect any outbound connection to a destination outside of an allowed set of ips, networks, or domain names"
      zh: "检测到出站流量中包含未知目的地址"
    suggestion:
      en: "Please judge whether the command belongs to the normal behavior of known processes through the process tree, judge whether the server IP address is as expected, confirm whether the traffic is abnormal, and can use micro-isolation to block the traffic."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，判断服务端ip地址是否符合预期，确认该流量是否异常，可使用微隔离阻拦流量。"
    rule_type: Exfiltration
    priority: INFO
    urgency: false
    tags: [ATT&CK, network]

# On EC2 instances, 169.254.169.254 is a special IP used to fetch
# metadata about the instance. It may be desirable to prevent access
# to this IP from containers.
- key: Contact EC2 Instance Metadata Service From Container
  hid: exf_05
  condition: >
    outbound and fd.sip="169.254.169.254" and container and not ec2_metadata_containers
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Contact EC2 Instance Metadata Service From Container"
      zh: "从容器获取EC2实例元数据"
    desc:
      en: "Detect attempts to contact the EC2 Instance Metadata Service from a container"
      zh: "检测到从容器获取EC2实例元数据"
    suggestion:
      en: "Please confirm if the behavior is normal for the process, train the application using immune defense, block traffic using micro-isolation, and restrict user permissions for sensitive files and commands."
      zh: "请确认该行为是否属于进程的正常行为，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, aws, container, mitre_discovery]

# On GCP, AWS and Azure, 169.254.169.254 is a special IP used to fetch
# metadata about the instance. The metadata could be used to get credentials by attackers.
- key: Contact cloud metadata service from container
  hid: exf_06
  condition: >
    outbound and fd.sip="169.254.169.254" and container and consider_metadata_access and not user_known_metadata_access
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Contact cloud metadata service from container"
      zh: "容器内与云元数据服务通信"
    desc:
      en: "Detect attempts to contact the Cloud Instance Metadata Service from a container"
      zh: "检测到从容器获取云元数据"
    suggestion:
      en: "Please confirm if the behavior is normal for the process, train the application using immune defense, block traffic using micro-isolation, and restrict user permissions for sensitive files and commands."
      zh: "请确认该行为是否属于进程的正常行为，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, container, mitre_discovery]

- key: Program run with disallowed http proxy env
  hid: exf_07
  condition: >
    spawned_process and
    http_proxy_procs and
    not allowed_ssh_proxy_env and
    proc.env icontains HTTP_PROXY
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Program run with disallowed http proxy env"
      zh: "尝试运行带有不允许的HTTP_PROXY环境变量的程序"
    desc:
      en: "Detect attempts to run a program with a disallowed HTTP_PROXY environment variable"
      zh: "检测到程序运行时设置了不允许的http代理环境变量"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, use immune defense to train the application, use micro-isolation to block traffic, and restrict user permissions for sensitive files and commands."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: INFO
    urgency: false
    tags: [ATT&CK, host, users]

- key: Unexpected K8s NodePort Connection
  hid: exf_08
  condition: >
    (inbound_outbound) and fd.sport >= 30000 and fd.sport <= 32767 and container and not nodeport_containers
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Unexpected K8s NodePort Connection"
      zh: "未知的K8s-NodePort连接"
    desc:
      en: "Detect attempts to use K8s NodePorts from a container"
      zh: "检测到从容器中连接K8s NodePort"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, use immune defense to train the application, use micro-isolation to block traffic, and restrict user permissions for sensitive files and commands."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, k8s, container, mitre_port_knocking]

- key: Launch Remote File Copy Tools in Container
  hid: exf_09
  condition: >
    spawned_process
    and container
    and remote_file_copy_procs
    and not user_known_remote_file_copy_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent_process=%proc.pname,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Launch Remote File Copy Tools in Container"
      zh: "容器内运行远程文件复制工具"
    desc:
      en: "Detect remote file copy tools launched in container"
      zh: "检测到容器内运行远程文件复制工具"
    suggestion:
      en: "Please confirm whether the behavior belongs to the normal behavior of the process, judge whether the server-side ip address is as expected, and confirm whether the behavior is a trusted person and program operation; otherwise, you can use the immune defense training application to limit the abnormal behavior."
      zh: "请确认该行为是否属于进程的正常行为，判断服务端ip地址是否符合预期，确认该行为是否为可信人员和程序操作，否则可使用免疫防御训练应用，限制异常行为。"
    rule_type: Exfiltration
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, process, mitre_lateral_movement, mitre_exfiltration]

- key: Unexpected UDP Traffic
  hid: exf_10
