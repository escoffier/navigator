{{- if .Values.persistence.enabled -}}
apiVersion: {{ include "common.capabilities.cronjob.apiVersion" . }}
kind: CronJob
metadata:
  name: cron-data-gc-hotlogiccleaner
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: hotlogiccleaner
spec:
  schedule: {{ .Values.persistence.Cleaner.hotLogicCronjob.cronString }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      completions: 1
      template:
        spec:
          containers:
            - command:
                - /app/cleaner
                -  hot-logic-storage-tool
              env:
                - name: CONF_PATH
                  value: /app/hot-logic-conf.json
                - name: PGSQL_HOST
                  value: {{ include "common.pgpool.defaultName" . }}
                - name: PGSQL_USER
                  value: postgres
                - name: PGSQL_DBNAME
                  value: postgres
                - name: PGSQL_SSL_MODE
                  value: disable
                - name: PGSQL_PASSWORD
                  value: password
              image: {{ include "jobs.cleaner.image" . }}
              imagePullPolicy: {{ .Values.persistence.Cleaner.image.pullPolicy }}
              name: hotlogiccleaner
              resources:
{{ toYaml .Values.persistence.Cleaner.hotLogicCronjob.resources | trim | indent 16 }}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /audit
                  name: audit
          restartPolicy: Never
          {{- if .Values.global.image.pullSecret }}
          imagePullSecrets:
          - name: {{ .Values.global.image.pullSecret }}
          {{- else if .Values.image.pullSecret }}
          imagePullSecrets:
          - name: {{ .Values.image.pullSecret }}
          {{- end }}
          volumes:
            - name: audit
              persistentVolumeClaim:
                claimName: audit-pvc
{{- end -}}
