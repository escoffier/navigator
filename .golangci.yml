run:
  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 10m
  skip-dirs: 
    - cmd/go-audit
    - cmd/immune-test
    - cmd/security-profiles-loader
    - cmd/security-profiles-manager
  skip-dirs-use-default: true
  skip-files: 
    - ".+_test\\.go$"

output:
  sort-results: true

linters:
  enable:
    - errcheck
    - goimports
    - golint
    - govet
    - staticcheck
    - bodyclose
    - goconst
    - gocritic
    - nilerr
    - gosec

  disable:
    - deadcode
    - unused
    - gomnd

linters-settings:
  gosec:
    # To select a subset of rules to run.
    # Available rules: https://github.com/securego/gosec#available-rules
    excludes:
      - G501
      - G502
      - G503
      - G504
      - G505
      - G307
      - G401
      - G204
    exclude-generated: true
    severity: medium
    confidence: medium
  gosimple:
    go: "1.17"  
    checks: [ "all" ]

  staticcheck:
    go: "1.17"
    # https://staticcheck.io/docs/options#checks
    checks: [ "all" ]
  stylecheck:
    go: "1.17"
    # https://staticcheck.io/docs/options#checks
    checks: [ "all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022" ]
  unused:
    go: "1.17"
  godox:
    keywords:
      - TODO
      - FIXME
  gofmt:
    simplify: true
  
  goimports:
    local-prefixes: gitlab.com/piccolo_su/vegeta
  
  gomnd:
    settings:
      mnd:
        # the list of enabled checks, see https://github.com/tommy-muehle/go-mnd/#checks for description.
        checks: argument,case,condition,operation,return,assign