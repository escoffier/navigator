apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "scanner.fullname" . }}-webshell-server
  labels:
    app: {{ template "scanner.fullname" . }}-webshell-server
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app: {{ template "scanner.fullname" . }}-webshell-server
      release: {{ .Release.Name }}
  replicas: {{ .Values.webshell.replicas | default 2 }}
  template:
    metadata:
      labels:
        app: {{ template "scanner.fullname" . }}-webshell-server
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.image.pullSecret }}
      {{- else if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-webshell-server
          image: {{ include "scanner.webshell.server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
          - containerPort: 5000
            protocol: TCP
          resources:
{{ toYaml .Values.webshell.resources | indent 12 }}