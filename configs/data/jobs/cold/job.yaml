---
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorsec-cold-cleaner
spec:
  template:
    metadata:
      labels:
        app: cold-cleaner
    spec:
      containers:
        - name: cold-cleaner
          image: localhost:32000/tensorsec-cleaner:latest
          command: ["/app/tensor-cleaner", "clear-cold-storage-tool"]
          imagePullPolicy: Always
          env:
            - name: PGSQL_HOST
              value: tensorsec-postgresql
            - name: PGSQL_USER
              value: postgres
            - name: PGSQL_DBNAME
              value: postgres
            - name: PGSQL_SSL_MODE
              value: disable
            - name: PGSQL_PASSWORD
              value: password
            - name: AUDIT_PATH
              value: /audit
          volumeMounts:
            - name: audit
              mountPath: /audit
          resources:
            requests:
              memory: "100Mi"
              cpu: "0.1"
            limits:
              memory: "100Mi"
              cpu: "0.1"
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-admin-secret
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: audit-pvc

  backoffLimit: 0
