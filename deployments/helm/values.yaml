    password: Redis12345
    redisSecretName: redis-secret
  clair:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"
  harbor:
    harborURL: https://harbor.example
    harborUsername: admin
    harborSecretName: harbor-api-tensorsec


drift-prevention:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    tag: latest
    pullSecret: harbor-admin-secret
  eventcenter:
    addr: tensorsec-eventcenter.tensorsec.svc.cluster.local
    port: "8080"

console:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    tag: latest
    pullSecret: harbor-admin-secret
  # TODO: reference below variables from the original setting (maybe Helm enables it?)
