apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster-manager.fullname" . }}
  labels:
{{ include "cluster-manager.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "cluster-manager.name" . }}