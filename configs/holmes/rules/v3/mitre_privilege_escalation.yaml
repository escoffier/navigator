      zh: "CVE-2021-4034(Polkit本地提权漏洞)它存在于 Polkit 的一个特定组件中，允许本地攻击者通过构造特殊的授权请求来获得提升的权限。攻击者可以利用这个漏洞绕过授权检查，以 root 权限执行恶意操作。攻击者可以利用它来绕过Polkit的授权检查，以root权限运行特权命令。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
