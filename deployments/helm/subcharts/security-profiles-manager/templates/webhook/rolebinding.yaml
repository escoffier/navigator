apiVersion: {{ include "tensorsec.common.capabilities.rbac.apiVersion" . }}
kind: RoleBinding
metadata:
  name: {{ template "secProfilesManager.serviceAccount" . }}-rolebinding
  labels:
    app: "{{ template "secProfilesManager.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "secProfilesManager.serviceAccount" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ template "secProfilesManager.serviceAccount" . }}-webhook-service-account
    namespace: {{ .Release.Namespace }}
