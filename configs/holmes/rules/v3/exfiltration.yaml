##attck_rule_type=Exfiltration
- key: System procs network activity
  hid: exf_01
  condition: >
    (fd.sockfamily = ip and system_procs)
    and (inbound_outbound)
    and not proc.name in (known_system_procs_network_activity_binaries)
    and not login_doing_dns_lookup
    and not user_expected_system_procs_network_activity_conditions
    and container
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,connection=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "System procs network activity"
      zh: "网络流量中包含系统二进制"
    desc:
      en: "any network activity performed by system binaries that are not expected to send or receive any network traffic"
      zh: "网络流量中包含系统二进制，可能从外部下载/上载应用"
    suggestion:
      en: "Please confirm whether the behavior is the normal behavior of the process and determine whether the server-side ip address is as expected, otherwise you can use the immune defense training container to prevent this type of behavior."
      zh: "请确认该行为是否属于进程的正常行为，判断服务端ip地址是否符合预期，否则可使用免疫防御训练容器，防止该类行为。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, mitre_exfiltration]

- key: Interpreted procs inbound network activity
  hid: exf_02
  condition: >
    (inbound and consider_interpreted_inbound
     and interpreted_procs)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,connection=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Interpreted procs inbound network activity"
      zh: "入站流量中包含解释型二进制"
    desc:
      en: "any network activity performed by interpreted binaries that are not expected to send or receive any network traffic"
      zh: "入站流量中包含解释型二进制，可能从外部下载/上传应用"
    suggestion:
      en: "Please judge whether the command belongs to the normal behavior of known processes through the process tree, judge whether the server IP address is as expected, confirm whether the traffic is abnormal, and can use micro-isolation to block the traffic."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，判断服务端ip地址是否符合预期，确认该流量是否异常，可使用微隔离阻拦流量。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, mitre_exfiltration]

- key: Interpreted procs outbound network activity
  hid: exf_03
  condition: >
    (outbound and consider_interpreted_outbound
