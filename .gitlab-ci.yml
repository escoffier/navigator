## api test
api-test:
  stage: test
  resource_group: api-test
  retry: 2
  tags:
    - k8s
  before_script:
    - apt-get update
    - apt-get install python3 python3-pip -y
    - git clone ssh://git@10.77.218.241/tensorsecurity-rd/tensor-api-test.git
    - pip3 install -i https://pypi.tuna.tsinghua.edu.cn/simple -r tensor-api-test/requirements.txt
    - cp ~/.docker/tensor-scanner-cicd /root/tensor-scanner-cicd
  script:
    - python3 tensor-api-test/run_suite.py
  artifacts:
    paths:
      - report/*.html
    when: always
    expire_in: 1 day
  when: delayed
  start_in: 2 minutes
