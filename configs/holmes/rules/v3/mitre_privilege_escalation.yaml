- key: Linux dirty cow vulnerability leads to container escape(CVE-2016-5195)
  hid: priv_25
  condition: >
    evt.type = openat and fd.name=/proc/self/mem and shell_family_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name,evt.args=%evt.args,fd.name=%fd.name,parent=%proc.pname,gparent=%proc.aname[2],ggparent=%proc.aname[3]
  steps:
    - name: checkRelatedExists
      params: [Read /etc/passwd in binaries, 10s, trigger.payload.output_map.proc_pid, payload.output_map.proc_pid]
  info:
    name:
      en: "Linux dirty cow vulnerability leads to container escape(CVE-2016-5195)"
      zh: "Linux脏牛漏洞导致容器逃逸(CVE-2016-5195)"
    desc:
      en: "The Linux Dirty Cow vulnerability is also known as CVE-2016-5195. The core problem of the vulnerability is that there are flaws in the implementation of Copy-On-Write (COW) technology in the Linux kernel, which allows malicious users to modify the system through specially crafted operations. System files that should be read-only. An attacker could exploit this vulnerability to modify critical files on the system, including the passwd file, to gain root privileges or other privilege levels. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "Linux脏牛漏洞也称为CVE-2016-5195，漏洞的核心问题在于Linux内核中关于写时复制（Copy-On-Write，COW）技术的实现存在缺陷，允许恶意用户通过特制的操作来修改本应只读的系统文件。攻击者可以利用这个漏洞来修改系统上的关键文件，包括passwd文件，从而获得root权限或其他特权级别。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container id, associated alarm list, etc., and check whether the file descriptor contains /proc/self/ mem, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否包含/proc/self/mem，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: EMERGENCY
    urgency: true
    tags: [ATT&CK, kernel, users, filesystem, mitre_privilege_escalation, L4]

# ln -s /etc/passwd /var/tmp/test1
- key: Create Symlink Over Sensitive Files
  hid: priv_26
  condition: >
    create_symlink
    and (evt.arg.target in (sensitive_file_names) or evt.arg.target in (sensitive_directory_names) or link_sensitive_files)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,target=%evt.arg.target,linkpath=%evt.arg.linkpath,parent_process=%proc.pname,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Create Symlink Over Sensitive Files"
      zh: "通过敏感文件创建符号链接"
    desc:
      en: "Attack techniques that create symbolic links from sensitive files are often used by hackers to gain unauthorized access or perform malicious actions. The attacker selects a sensitive file as a target and creates a symbolic link that points to a file or directory containing a malicious script or privileged command. When the system executes the sensitive file, it actually executes the content pointed to by the symbolic link, allowing hackers to perform malicious actions."
      zh: "通过敏感文件创建符号链接的攻击技术常被黑客用来获取未授权的访问权限或执行恶意操作。攻击者选择一个敏感文件作为目标，并创建一个符号链接，将其指向包含恶意脚本或特权命令的文件或目录。当系统执行该敏感文件时，实际上执行的是符号链接所指向的内容，从而使黑客能够执行恶意操作。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the system call is symlink, symlinkat, and contact us in time Security personnel further investigate"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为symlink, symlinkat，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ERROR
    urgency: true
    tags: [ATT&CK, file, mitre_privilege_escalation, L3]

- key: Docker build vulnerability(CVE-2019-13139)
  hid: priv_27
  condition: >
    evt.type=execve and proc.name=docker and
    (proc.cmdline contains "build" and proc.cmdline contains "git@" and proc.cmdline contains "--upload-pack") and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,shell=%proc.name,parent=%proc.pname,terminal=%proc.tty,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Docker build vulnerability(CVE-2019-13139)"
      zh: "Docker构建漏洞导致代码执行(CVE-2019-13139)"
    desc:
      en: "CVE-2019-13139 is a vulnerability affecting Docker, also known as Docker Build Vulnerability. The problem is that Docker improperly handles the build context when building images, allowing attackers to include malicious content in the build context. An attacker could abuse this vulnerability to insert malicious code or execute unauthorized commands in a Docker image. This can lead to data leaks, container escapes, denial-of-service attacks, or other malicious activity. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "CVE-2019-13139 是一个影响 Docker 的漏洞，也被称为 Docker 构建漏洞。问题在于 Docker 在构建镜像时对构建上下文（build context）进行了不正确的处理，允许攻击者在构建上下文中包含恶意内容。攻击者可以滥用这个漏洞来在 Docker 镜像中插入恶意代码或执行未经授权的命令。这可能导致数据泄露、容器逃逸、拒绝服务攻击或其他恶意活动。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains docker and whether the parameters include build and --upload-pack, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含docker及参数是否包含build和--upload-pack，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: CRITICAL
    urgency: true
    tags: [ATT&CK, container, docker, shell, mitre_privilege_escalation, L4]

- key: CVE-2020-14386(Packet socket created in container)
  hid: priv_28
  condition: >
    evt.type=socket and (evt.arg[0]=AF_PACKET or evt.arg[0]=17) and
    consider_packet_socket_communication and container and not proc.name in (user_known_packet_socket_binaries) and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,socket_info=%evt.args,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "CVE-2020-14386(Packet socket created in container)"
      zh: "CVE-2020-14386(容器内创建Packet-socket)"
    desc:
      en: "CVE-2020-14386 is a vulnerability involving containers that allows attackers to create Packet Sockets within the container, which can be abused to conduct ARP spoofing attacks and privilege escalation. Packet Socket is a socket that operates at OSI Layer 2 (Data Link Layer) and is typically used to process network packets. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "CVE-2020-14386 是一个涉及容器的漏洞，攻击者可以在容器内创建 Packet Socket，这可以被滥用用来进行 ARP 欺骗攻击和提权。Packet Socket 是一种在 OSI Layer 2（数据链路层）操作的套接字，通常用于处理网络数据包。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the system call is socket and the parent process is sh. , bash, etc., contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为socket及父进程为sh、bash等，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, docker, mitre_privilege_escalation, L4]

- key: Execute commands through the docker api
  hid: priv_29
  condition: >
    evt.type in (sendto, sendmsg, connect) and fd.sport = 2375 and shell_parent_procs and not fd.name contains "->127.0.0.1" and not fd.name contains "->0.0.0.0:" and not fd.name contains "->::1"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Execute commands through the docker api"
      zh: "通过Docker-api执行命令"
    desc:
      en: "The Docker API can be used to interact with and manage Docker containers. Normal users usually do not perform these operations by calling the Docker API directly. Instead, they use the Docker command line tool or other user-friendly interfaces to interact with the container. There is a high probability that after carrying out the attack, the attacker will try to use the Docker API to perform malicious operations, such as container escape, malicious code injection and unauthorized access, which may lead to data leakage, destruction or other bad behaviors."
      zh: "Docker API 可以用于与 Docker 容器进行交互和管理，正常用户通常不会通过直接调用 Docker API 来执行这些操作，而是使用 Docker 命令行工具或其他用户友好的界面来与容器进行交互。大概率是攻击者在进行攻击后，尝试利用 Docker API 来执行恶意操作，如容器逃逸、恶意代码注入和非授权访问，可能导致数据泄漏、破坏或其他不良行为。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the server port is 2375 and whether the system call is For sendto, sendmsg, and connect, promptly contact security personnel for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看服务端端口是否为2375及系统调用是否为sendto,、sendmsg、connect，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, network, docker, mitre_privilege_escalation, L4]

