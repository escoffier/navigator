apiVersion: batch/v1
kind: Job
metadata:
  labels:
    job-name: tensorsec-job-loadcev 
  name: tensorsec-job-loadcev
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  selector:
    matchLabels:
      job-name: tensorsec-job-loadcev 
  template:
    metadata:
      labels:
        job-name: tensorsec-job-loadcev
    spec:
      containers:
      - args:
        - /bin/bash
        - -c
        - psql postgres://postgres:password@tensorsec-postgresql:5432/postgres < /var/lib/postgresql/vulnerability.sql 
        image: registry.t-appagile.com/tensorsecurity/tensorsec-postgres:latest 
        imagePullPolicy: Always
        name: tensorsec-job-loadcev 
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-admin-secret
      initContainers:
      - command:
        - sh
        - -c
        - until pg_isready -h tensorsec-postgresql -p 5432; do echo waiting for database;
          sleep 1; done;
        image: postgres:11.3
        imagePullPolicy: IfNotPresent
        name: pg-ready-wait
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
