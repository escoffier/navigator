  image:
    name: tensorsec-cluster-manager
    tag: latest
    pullSecret: harbor-admin-secret
  resources:
    limits:
      cpu: 50m
      memory: 200Mi
    requests:
      cpu: 50m
      memory: 200Mi
#  args:
#    masterAddr:
#    clusterName:
#    apiServerAddr:

eventcenterAuth:
  enabled: true

redis-ha:
  enabled: true
  image:
    name: redis
    tag: 6.2.5-alpine
    pullSecret: harbor-admin-secret
  auth: true
  redisPassword: Redis12345
  hardAntiAffinity: false
  persistentVolume:
    enabled: true
    storageClass: ""
  redis:
    resources:
      requests:
        memory: 500Mi
        cpu: 200m
      limits:
        memory: 500Mi
        cpu: 200m

elasticsearch:
  enabled: true
  image:
    name: elasticsearch
    tag: 7.9.1
    pullSecret: harbor-admin-secret
  persistence:
    enabled: true
    storageClass: ""
  minimumMasterNodes: 1
  replicas: 1
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: Elastic12345
    - name: ELASTIC_USERNAME
      value: elasticsearch
  # Below settings for local dev environment
  # sysctlInitContainer:
  #   enabled: false
  # esConfig:
  #   elasticsearch.yml: |
  #     node.store.allow_mmap: false
  # antiAffinity: "soft"
  # esJavaOpts: "-Xmx128m -Xms128m"
  resources:
    requests:
      cpu: "1000m"
      memory: "2000Mi"
    limits:
      cpu: "1000m"
      memory: "2000Mi"
  # volumeClaimTemplate:
  #   accessModes: [ "ReadWriteOnce" ]
  #   resources:
  #     requests:
  #       storage: 100M
  lifecycle:
    postStart:
       exec:
         command:
           - bash
           - -c
           - |
             #!/bin/bash
             # Add a template to adjust number of shards/replicas
             ES_URL=http://localhost:9200
             while [[ "$(curl -s -o /dev/null -w '%{http_code}\n' $ES_URL)" != "200" ]]; do sleep 1; done
             while true ; do
               curl -s -XGET "http://localhost:9200/_cluster/health?pretty=true"  |grep green
               if [ "$?" == "0" ]; then   break; fi
               curl -s -XGET "http://localhost:9200/_cluster/health?pretty=true"  |grep yellow
               if [ "$?" == "0" ]; then   curl -H "Content-Type: application/json" -XPUT 'http://localhost:9200/_settings' -d '{"index":{"number_of_replicas":0}}'; break; fi
               sleep 1;
             done


postgresql-ha:
  # Note for maintainers:
  # Some confusion may appear here because we use docker image created from "official" dockerhub base image postgresql
  # but we use helm chart designed for bitnami/postgresql.
  enabled: true
  postgresqlImage:
    name: postgresql-repmgr
    tag: 12.8.0
    pullSecrets: ["harbor-admin-secret"]
    pullPolicy: Always
  postgresql:
    username: postgres
    password: password
    database: postgres
    maxConnections: "1024"
    resources:
      limits:
        memory: 500Mi
        cpu: 500m
      requests:
        memory: 500Mi
        cpu: 500m
  pgpoolImage:
    name: pgpool
    tag: 4.2.3-debian-10-r38
    pullSecrets: ["harbor-admin-secret"]
    pullPolicy: Always
  pgpool:
    numInitChildren: "64"
    maxPool: "15"
    resources:
      limits:
        memory: 350Mi
        cpu: 250m
      requests:
        memory: 350Mi
        cpu: 250m
  volumePermissionsImage:
    name: bitnami-shell
    tag: 10-debian-10-r125
    pullSecrets: ["harbor-admin-secret"]
    pullPolicy: Always
  volumePermissions:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi


holmes:
  enabled: true
  image:
    name: tensorsec-holmes
    tag: latest
    pullSecret: harbor-admin-secret
  extraArgs:
    - "-A"
  resources:
    requests:
      cpu: 1
      memory: 500Mi
    limits:
      cpu: 1
      memory: 500Mi
  tensorsecDaemon:
    image:
      name: tensorsec-daemon
      tag: latest
    resources:
      requests:
        memory: "250Mi"
        cpu: "100m"
      limits:
         memory: "250Mi"
         cpu: "100m"
  ebpf:
    enabled: true
  falco:
    rulesFile:
      - /etc/holmes/rules.d
      # - /etc/holmes/holmes_rules.yaml
    jsonOutput: true
    jsonIncludeOutputProperty: true
    httpOutput:
      enabled: false
      url: http://tensorsec-holmessidekick:2801
    grpc:
      enabled: true
      threadiness: 3
      # gRPC unix socket with no authentication
      unixSocketPath: "unix:///var/run/falco/falco.sock"
    grpcOutput:
      enabled: true
    webserver:
      enabled: false
    programOutput:
      enabled: false
      keepAlive: false
      program: /bin/bash /holmes_export.sh
    syslogOutput:
      enabled: false
    stdoutOutput:
      enabled: true
  eventcenter:
    eventGrpcUrl: tensorsec-eventcenter:9090
    eventGrpcCertServerName: tensorsec-eventcenter
  multicluster:
    clusterinfo: http://tensorsec-cluster-manager:9443
    consoleaddr: http://tensorsec-console:8889
  stan:
    host: tensorsec-stan-headless
    port: "4222"

