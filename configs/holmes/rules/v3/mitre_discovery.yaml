##attck_rule_type=Discovery
- key: View network information in the container
  hid: disc_01
  condition: >
    spawned_process and container and proc.name in (namespace_bypass_cmds) and shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "View network information in the container"
      zh: "容器内查看网络信息"
    desc:
      en: "Generally, we believe that normal users in the container will not perform this behavior. There is a high probability that the attacker will view network information in the container after carrying out the attack and it will be judged as an attack behavior. This behavior may imply some potential malicious activities or risks, especially without explicit authorization. An attacker may obtain the network configuration and connection information inside the container, use this information to determine the network location and scope of the container, and Detect network topology and possible attack paths. Gain deeper access to launch further attacks."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，为了在容器内查看网络信息被判断为攻击行为。这种行为可能暗示着一些潜在的恶意活动或风险，尤其是在没有明确授权的情况下攻击者可能通过获取容器内部的网络配置和连接信息，利用这些信息来确定容器的网络位置和范围，并探测网络拓扑和可能的攻击路径。获得更深入的访问权限发起进一步的攻击。"
    suggestion:
      en: "Please use the process tree to determine whether the behavior is executed by the operation and maintenance personnel or initiated by a trusted probe type program, if not, please correlate other attacks to confirm whether the container has been compromised."
      zh: "请通过进程树判断该行为是否为运维人员执行或可信探针类程序发起，如果不是请关联其他攻击行为，确认容器是否遭到入侵。"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, network, container, mitre_discovery, L3]

