---
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  labels:
    app: test1
  name: test1
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: test1
  template:
    metadata:
      labels:
        app: test1
        driftprevent: detect
    spec:
      containers:
      - image: {{ include "test.image" . }}
        imagePullPolicy: Always
        name: test1

