---
## Controls Files.
# These are YAML files that hold all the details for running checks.
# In here you can set all parameter substitution for cri-bench

chroot: /host

components:
  - docker
  - audit

docker:
  storages:
    - "/var/lib/docker"
  defaultstorage: /var/lib/docker

  confs:
    - /etc/docker/daemon.json
  defaultconf: /etc/docker/daemon.json

audit:
  logs:
    - /var/log/audit/audit.log
  defaultlog: /var/log/audit/audit.log

version_mapping:
  "cis-1.3.1": ">= 20.10"
  "cis-1.2": ">= 18.09, < 20.10"
  "cis-1.1": ">= 17.06, < 18.09"
  "cis-1.0": ">= 1.13.0, < 17.06"