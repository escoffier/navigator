global:
  # Not sure if it's good practice to pas our docker repo address to our subcharts like this.
  ourDockerRepo: localhost:32000

clair:
  enabled: true
  config:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"

scanner:
  enabled: true
  # TODO: reference below variables from the original setting (maybe Helm enables it?)
  redis:
    password: Redis12345
    redisSecretName: redis-secret
  clair:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"

console:
  # TODO: reference below variables from the original setting (maybe Helm enables it?)
  elasticsearch:
    elasticSecretName: elastic-secret
    extraEnvs:
      - name: ELASTIC_PASSWORD
        value: Elastic12345
      - name: ELASTIC_USERNAME
        value: elasticsearch
  enabled: true

  eventcenter:
    eventGrpcUrl: tensorsec-eventcenter:9090
    eventGrpcCertServerName: tensorsec-eventcenter
  postgresql:
    postgresqlDataDir: /bitnami/postgresql/data
    postgresqlUsername: postgres
    postgresqlPassword: password
    postgresqlDatabase: postgres

daemon:
  enabled: true
  eventcenter:
    eventGrpcUrl: tensorsec-eventcenter:9090
    eventGrpcCertServerName: tensorsec-eventcenter

eventcenterAuth:
  enabled: true

redis:
  enabled: true
  password: Redis12345
  usePassword: true
  cluster:
    slaveCount: 1
  master:
    disableCommands: []

elasticsearch:
  enabled: true
  minimumMasterNodes: 1
  replicas: 1
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: Elastic12345
    - name: ELASTIC_USERNAME
      value: elasticsearch
  # Below settings for local dev environment
