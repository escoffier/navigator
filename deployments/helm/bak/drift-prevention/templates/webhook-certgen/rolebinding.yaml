apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "driftPrevention.serviceAccount" . }}-rolebinding
  labels:
    app: "{{ template "driftPrevention.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "driftPrevention.serviceAccount" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ template "driftPrevention.serviceAccount" . }}-service-account
    namespace: {{ .Release.Namespace }}