- key: Detect release_agent File Container Escapes
  hid: priv_19
  condition: >
    open_write and container and fd.name endswith release_agent and user.uid=0
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Detect release_agent File Container Escapes"
      zh: "尝试修改release_agent进行Linux_Cgroup容器逃逸"
    desc:
      en: "Detect an attempt to exploit a container escape vulnerability in the Linux Kernel (CVE-2022-0492). By running a container with certains capabilities, a privileged user can modify release_agent file and escape from the container"
      zh: "检测到尝试利用Linux内核（CVE-2022-0492）中的容器逃逸漏洞。通过运行具有某些特权的容器，特权用户可以修改release_agent文件并从容器中逃逸。"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, troubleshoot whether the hacker has obtained host privileges and has other host operations, and use the immune defense training application to restrict user privileges for sensitive files and commands."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，排查黑客是否已获取主机权限并有其它主机操作，使用免疫防御训练应用，限制敏感文件和命令的用户权限。"
