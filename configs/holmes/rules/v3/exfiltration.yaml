  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,connection=%fd.name,proto=%fd.l4proto,evt=%evt.type,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Unexpected UDP Traffic"
      zh: "未知的UDP流量"
    desc:
      en: "Detect unexpected UDP traffic"
      zh: "检测到未知的UDP流量"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, use immune defense to train the application, use micro-isolation to block traffic, and restrict user permissions for sensitive files and commands."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, mitre_exfiltration]

- key: Launch Suspicious Network Tool in Container
  hid: exf_11
  condition: >
    spawned_process and container and network_tool_procs and shell_parent_procs and not ignore_proc_args and not user_known_network_tool_activities and not proc.cmdline contains "-w 2 localhost 2181" and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent_process=%proc.pname,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Launch Suspicious Network Tool in Container"
      zh: "容器内运行可疑网络工具"
    desc:
      en: "Detect network tools launched inside container"
      zh: "检测到容器内运行可疑网络工具"
    suggestion:
      en: "Please confirm the specific behavior of the tool. Hackers may scan the intranet. It is recommended to use offset defense to limit the execution of the tool, and check whether the container has been invaded."
      zh: "请确认该工具具体行为，可能存在黑客扫描内网情况，推荐使用偏移防御限制该工具执行，并排查容器是否遭到入侵。"
    rule_type: Exfiltration
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, process, mitre_discovery, mitre_exfiltration]

- key: Detect outbound connections to common miner pool ports
  disable: true
  hid: exf_12
  condition: >
    net_miner_pool and not trusted_images_query_miner_domain_dns
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,domain_name=%fd.sip.name,container=%container.info,image=%container.image.repository,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Detect outbound connections to common miner pool ports"
      zh: "检测到连接到常见挖矿池端口的出站连接"
    desc:
      en: "Miners typically connect to miner pools on common ports"
      zh: "挖矿程序通常会连接到挖矿池的常见端口"
    suggestion:
      en: "Use micro isolation to block the flow, delete the backdoor of mining in time, and check whether the container is invaded."
      zh: "使用微隔离阻拦流量，及时删除挖矿后门，同时排查容器是否遭到入侵。"
    rule_type: Exfiltration
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, mitre_execution]

- key: Detect crypto miners using the Stratum protocol
  hid: exf_13
  condition: >
    spawned_process and (proc.cmdline contains "stratum+tcp" or proc.cmdline contains "stratum2+tcp" or proc.cmdline contains "stratum+ssl" or proc.cmdline contains "stratum2+ssl")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,image=%container.image.repository,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Detect crypto miners using the Stratum protocol"
      zh: "检测到使用Stratum协议的挖矿程序"
    desc:
      en: "Miners typically specify the mining pool to connect to with a URI that begins with 'stratum+tcp'"
      zh: "挖矿程序通常会使用以'stratum+tcp'开头的URI指定挖矿池连接"
    suggestion:
      en: "Check the corresponding mining program and limit the operation of the program through offset defense, while troubleshooting system application vulnerabilities."
      zh: "查看对应挖矿程序并通过偏移防御限制程序运行，同时排查系统应用漏洞。"
    rule_type: Exfiltration
    priority: ALERT
    urgency: false
    tags: [ATT&CK, process, mitre_execution]

- key: CVE-2020-14386(Packet socket created in container)
  hid: exf_14
  condition: >
    evt.type=socket and (evt.arg[0]=AF_PACKET or evt.arg[0]=17) and consider_packet_socket_communication and container and not proc.name in (user_known_packet_socket_binaries)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,socket_info=%evt.args,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "CVE-2020-14386(Packet socket created in container)"
      zh: "CVE-2020-14386(容器内创建Packet-socket)"
    desc:
      en: "Detect new packet socket at the device driver (OSI Layer 2) level in a container. Packet socket could be used for ARP Spoofing and Privilege_Escalation(CVE-2020-14386) by attacker."
      zh: "检测到容器中在设备驱动(OSI Layer 2)层创建新的packet socket，packet socket可被攻击者利用进行ARP欺骗和提权(CVE-2020-14386)。"
    suggestion:
      en: "If an authorization raising behavior is found in the container, please confirm whether the container has been invaded. You can use the immune defense training application to limit the user permissions of sensitive files and commands."
      zh: "容器中发现提权行为，请确认容器是否遭到入侵，可使用免疫防御训练应用，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, mitre_discovery]

- key: Try ssh connection in container
  hid: exf_16
  condition: >
    (inbound_outbound) and allowed_ssh_hosts and container and shell_parent_procs
  output: >
    connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Try ssh connection in container"
      zh: "检测到在容器内尝试ssh连接"
    desc:
      en: "Detect ssh connection in container"
      zh: "检测到在容器内尝试ssh连接"
    suggestion:
      en: "SSH burst may occur. It is recommended to confirm whether there is a weak password in the container and limit the number of incorrect login attempts by modifying/etc/pam.d/sshd."
      zh: "可能存在ssh爆破行为，建议确认主机和容器是否存在弱口令，并通过修改/etc/pam.d/sshd限制错误登录尝试次数。"
    rule_type: Exfiltration
    priority: WARNING
    urgency: false
    tags: [ATT&CK]

- key: Try ssh connection in host
  hid: exf_17
