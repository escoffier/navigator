---
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
    spec:
      initContainers:
      - name: "elasticsearch-listener"
        image: {{ include "console.init.image" . }}
        imagePullPolicy: "IfNotPresent"
        resources:
{{ toYaml .Values.initResources | trim | indent 10 }}
        command: [
          "sh", "-c",
          "for i in $(seq 1 200); do nc -z -w3 {{ include "common.elasticsearch.defaultName" . }} 9200 && exit 0 || sleep 3; done; exit 1"
        ]
      serviceAccount: {{ include "common.names.fullname" . }}
      containers:
      - name: {{ include "common.names.name" . }}
        image: {{ include "console.image" . }}
        command: ["/console"]
        args: [
          "--console-postgres={{ include "common.pgpool.DSN" . }}",
          "--postgres-pvc=data-{{ include "common.postgresql.defaultName" . }}-0",
          "--postgres-pod={{ include "common.postgresql.defaultName" . }}-0",
          "--postgres-data-path={{ .Values.postgresql.postgresqlDataDir }}",
          "--email-check={{ .Values.emailCheck.smtpEnabled }}",
          {{- if .Values.emailCheck.smtpEnabled }}
          "--email-username={{ .Values.emailCheck.smtpUsername }}",
          "--email-host={{ .Values.emailCheck.smtpHost }}",
          "--email-port={{ .Values.emailCheck.smtpPort }}",
          {{- end }}
          "--vegeta-scanner-host={{ include "common.scanner.defaultName" . }}",
          "--vegeta-scanner-port=8888",
          "--clustermanager-host={{ include "common.cluster-manager.defaultName" . }}",
          "--clustermanager-port=9443",
          "--redis-endpoint={{ include "common.redis.sentinel.address" . }}",
          "--scap-job-repo={{ include "console.registryPath" . }}",
          "--scap-job-tag={{ .Values.scap.tag }}",
          "--cluster-addr=http://{{ include "common.cluster-manager.defaultName" . }}:9443",
          "--elastic-host={{ include "common.elasticsearch.defaultName" . }}",
          "--elastic-port={{ .Values.elasticsearch.port }}",
          "--elastic-index={{ .Values.elasticsearch.index }}",
          "--elastic-username={{ (index .Values.elasticsearch.extraEnvs 0).value }}",
          "--elastic-pvc=data-{{ include "common.elasticsearch.defaultName" . }}-0",
          "--elastic-pod={{ include "common.elasticsearch.defaultName" . }}-0",
          "--elastic-data-path={{ .Values.elasticsearch.elasticDataPath }}",
          "--security-profiles-host={{ include "common.security-profiles-manager.defaultName" . }}",
          "--security-profiles-port=8887",
          "--webhook-host={{ include "common.webhook.defaultName" . }}",
          "--webhook-port=443",
          "-v"]

        volumeMounts:
          - mountPath: /auth/server
            name: server-cert
            readOnly: true
        env:
        # Required for managing scap jobs
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "common.redis-ha.defaultName" . }}
              key: auth
        {{- if .Values.emailCheck.smtpEnabled }}
        - name: EMAIL_PASSWORD
          value: {{ .Values.emailCheck.smtpPassword }}
        {{- end }}
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ printf "%s-elasticsearch" (include "common.names.fullname" .) }}
              key: password
        - name: ELASTIC_URL
          value: "http://{{ include "common.elasticsearch.defaultName" . }}:9200"
        - name: ELASTIC_USERNAME
          value: "{{ (index .Values.elasticsearch.extraEnvs 0).value }}"
        - name: EVENT_GRPC_URL
          value: {{ include "common.eventcenter.defaultName" . }}:9090
        - name: EVENT_GRPC_CERT_PATH
          value: /auth/server/tls.crt
        - name: EVENT_GRPC_CERT_SERVER_NAME
          value: {{ include "common.eventcenter.defaultName" . }}
        - name: CONSOLE_EXTERNAL_URL
          value: {{ .Values.global.consoleExternalAdd }}
        - name: CONSOLE_INTERNAL_URL
          value: "http://{{ include "common.console.defaultName" . }}:{{ .Values.service.port }}"
        - name: CLEANER_IMAGE
          value: "{{ include "jobs.cleaner.image" . }}"
        - name: HUNTER_IMAGE
          value: "{{ include "jobs.hunter.image" . }}"
        - name: HUNTER_ORIGIN_IMAGE
          value: "{{ include "jobs.hunter.originImage" . }}"
        - name: APISCANJOB_IMAGE
          value: "{{ include "jobs.apiscan.image" . }}"
        - name: PLATFORM_REPORTER_IMAGE
          value: "{{ include "jobs.platform.image" . }}"
        - name: AUDIT_PVC
          value: audit-pvc
        - name: AUDIT_PATH
          value: /audit
        - name: PPROF_PORT
          value: "{{ .Values.debugService.containerPort }}"
        - name: SOFT_NAME
          value: {{ .Values.version.softName }}
        - name: SOFT_VERSION
          value: {{ .Values.version.softVersion }}
        - name: K8S_AUDIT_INDEX_PREFIX
          value: {{ .Values.k8sAudit.prefix }}
        - name: MICROSEG_HOST
          value: "http://{{ include "common.microseg.defaultName" . }}:8090"
        - name: OPEN_API_GUIDE_URL
          value: {{ .Values.openapi.guideURL }}
        - name: PGSQL_HOST
          value: {{ include "common.pgpool.defaultName" . }}
        - name: PGSQL_USER
          value: postgres
        - name: PGSQL_DBNAME
          value: postgres
        - name: PGSQL_SSL_MODE
          value: disable
        - name: PGSQL_PASSWORD
          value: password
        - name: PGSQL_PORT
          value: "5432"
        - name: EMAIL_OFFICIAL_NAME
          value: {{ .Values.global.emailOfficialName }}
        - name: CONTACT_EMAIL
          value: {{ .Values.global.contactEmail }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources:
{{ toYaml .Values.resources | trim | indent 10 }}
        ports:
          - containerPort: {{ .Values.service.containerPort }}
            name: {{ include "common.names.name" . }}
          - containerPort: {{ .Values.debugService.containerPort }}
            name: pprof
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.image.pullSecret }}
      {{- else if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
      - name: tmp
        hostPath:
          path: /tmp/
      - name: server-cert
        secret:
          defaultMode: 400
          secretName: eventcenter-tls-server-cert-secret
