    awk runs inside container that allows remote code execution (zh_msg=黑客在容器内通过awk反弹shell),rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,evt.args=%evt.args
    original_info=user=%user.name user_loginuid=%user.loginuid
    container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag
    connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport)
  priority: ALERT
  tags: [ATT&CK, network, process, mitre_execution]

- rule: Reverse shell through socket and dup
  hid: exec_08
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container is intruded, it is necessary to isolate the container, investigate other attacks, and confirm the security of the cluster."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，需隔离该容器，同时排查其他攻击行为，确认集群安全。"
  desc: Reverse shell through socket and dup
  condition: evt.type=dup and container and fd.num in (0, 1, 2) and fd.type in ("ipv4", "ipv6") and not k8s.pod.name contains "98166d" and not k8s.pod.name contains "42cca6"
  output: >
    Reverse shell through socket and dup (zh_msg=黑客在容器内通过socket和dup反弹shell,rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name %container.info process=%proc.name parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository fd_name=%fd.name fd.num=%fd.num fd.type=%fd.type connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport)
  priority: ALERT
  tags: [ATT&CK, container, shell, mitre_execution]

- rule: Running k8s malicious tools in the container
  hid: exec_09
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "Please confirm whether the container has been invaded. You can use the immune defense training application to block new or modified executables, and limit the users and recipients who execute commands."
    zh:
      key: "处置建议"
      value: "请确认容器是否遭到入侵，可使用免疫防御训练应用，阻拦新的或被修改的可执行文件，限制执行命令的用户和接收对象。"
  desc: Running malicious tools in the container
  condition: >
   evt.type = execve and container and
   (not tensorsec_namespace) and 
   (proc.cmdline contains "cdk evaluate" or
    proc.cmdline contains "k0otkit" or
    proc.cmdline contains "kubesploit" or
    proc.cmdline contains "red-kube" or
    proc.cmdline contains "kubestriker" or
    proc.cmdline contains "kube-hunter" or
    proc.cmdline contains "kubiscan"
     )
  output: >
    Running malicious tools in the container (zh_msg=容器内运行恶意工具,rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,
    original_info=user=%user.name user_loginuid=%user.loginuid %container.info
    shell=%proc.name parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: WARNING
  tags: [ATT&CK, container, shell, mitre_execution, strict]

- rule: Connecting to a remote server through redis client in container
  hid: exec_10
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "Please confirm whether the Redis connection is a normal service connection and check the cause of the connection."
    zh:
      key: "处置建议"
      value: "请确认该redis连接是否为业务正常连接，排查出现该连接原因。"
  desc: Connecting to a remote server through redis client in container
  condition: >
   evt.type=openat and container and evt.arg.name contains ".rediscli_history" and proc.cmdline contains " -h " and not proc.cmdline contains "localhost" and not proc.cmdline contains "127.0.0.1" and not k8s.pod.name contains "51c1c6"
  output: >
    Connecting to a remote server through redis client in container (zh_msg=容器内通过redis客户端连接远程服务器,rule_type=Execution,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name user_loginuid=%user.loginuid parent=%proc.pname terminal=%proc.tty container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: WARNING
  tags: [ATT&CK, container, shell, mitre_execution, strict]