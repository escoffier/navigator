##attck_rule_type=Privilege_Escalation
- key: Launch Privileged Container
  disable: true
  hid: priv_01
  condition: >
    container_started and container
    and container.privileged=true
    and not falco_privileged_containers
    and not user_privileged_containers
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Launch Privileged Container"
      zh: "启动特权容器"
    desc:
      en: "Detect the initial process started in a privileged container"
      zh: "检测到在特权容器中启动的初始进程"
    suggestion:
      en: "This behavior is likely to cause hackers to escape from the container to the host. Please confirm whether it is necessary to start the privileged container with privileges. This can be controlled through the privileged parameter when the container starts."
      zh: "该行为容易导致黑客从容器中逃逸到主机，请确认该特权容器采用特权启动是否必要，可通过容器启动时privileged参数进行控制。"
    rule_type: Privilege_Escalation
    priority: INFO
    urgency: false
    tags: [ATT&CK, container, cis, mitre_privilege_escalation, mitre_lateral_movement, L1]

- key: Non sudo setuid
  hid: priv_02
  condition: >
    evt.type=setuid and evt.dir=>
    and (known_user_in_container or not container)
    and shell_parent_procs
    and not user.name=root
    and not somebody_becoming_themself
    and not proc.name in (known_setuid_binaries, userexec_binaries, mail_binaries, docker_binaries,
                          nomachine_binaries)
    and not proc.name startswith "runc:"
    and not java_running_sdjagent
    and not nrpe_becoming_nagios
    and not user_known_non_sudo_setuid_conditions
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,cur_uid=%user.uid,parent=%proc.pname,uid=%evt.arg.uid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Non sudo setuid"
      zh: "非sudo、非root程序意外调用setuid"
    desc:
      en: "an attempt to change users by calling setuid. sudo/su are excluded. users 'root' and 'nobody'. suing to itself are also excluded, as setuid calls typically involve dropping privileges."
      zh: "试图通过调用setuid来改变用户，sudo/su除外。用户root和nobody也除外，因为调用setuid通常涉及放弃权限。"
    suggestion:
      en: "Setuid is usually a system management permission operation. A non root call may be a hacker's authorization act. Please confirm whether the system has been invaded."
      zh: "setuid通常为系统管理权限操作，非root调用可能为黑客提权行为，请确认系统是否遭到入侵。"
    rule_type: Privilege_Escalation
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, users, mitre_privilege_escalation, L2]

- key: System user interactive
  hid: priv_03
  condition: >
    spawned_process and system_users and interactive and not user_known_system_user_login
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "System user interactive"
      zh: "未登录用户试图运行交互式命令"
    desc:
      en: "an attempt to run interactive commands by a system (i.e. non-login) user"
      zh: "未登录用户试图运行交互式命令"
    suggestion:
      en: "This behavior usually exists when hackers use application vulnerabilities to execute commands. Please confirm whether any applications have been attacked by hackers."
      zh: "该行为通常存在于黑客利用应用漏洞执行命令，请确认是否有应用遭到黑客攻击。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: false
    tags: [ATT&CK, users, mitre_remote_access_tools, L4]

- key: Set Setuid or Setgid bit
  hid: priv_04
  condition: >
    consider_all_chmods and chmod and (evt.arg.mode contains "S_ISUID" or evt.arg.mode contains "S_ISGID")
    and shell_parent_procs
    and not proc.name in (user_known_chmod_applications)
    and not exe_running_docker_save
    and not user_known_set_setuid_or_setgid_bit_conditions
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,fd=%evt.arg.fd,filename=%evt.arg.filename,mode=%evt.arg.mode,user=%user.name,user_loginuid=%user.loginuid,process=%proc.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Set Setuid or Setgid bit"
      zh: "设置Setuid或Setgid位"
    desc:
      en: "When the setuid or setgid bits are set for an application, this means that the application will run with the privileges of the owning user or group respectively. Detect setuid or setgid bits set via chmod"
      zh: "当为应用程序设置setuid或setgid位时，这意味着应用程序将以所属用户或组的权限运行。检测通过chmod设置的setuid或setgid位"
    suggestion:
      en: "Please confirm the purpose of this operation, and whether the modified file is an externally imported dangerous file."
      zh: "请确认该操作行为目的，被修改文件是否为外部引入危险文件。"
    rule_type: Privilege_Escalation
    priority: WARNING
    urgency: true
    tags: [ATT&CK, process, mitre_persistence, L4]

- key: Delete or rename shell history
  hid: priv_05
  condition: >
    (modify_shell_history or truncate_shell_history) and
    not var_lib_docker_filepath and
    not proc.name in (docker_binaries) and
    shell_parent_procs and
    container
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,fd=%evt.arg.fd,filename=%evt.arg.filename,mode=%evt.arg.mode,user=%user.name,user_loginuid=%user.loginuid,process=%proc.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Delete or rename shell history"
      zh: "删除或重命名shell历史记录"
    desc:
      en: "Detect shell history deletion"
      zh: "删除或重命名shell历史记录"
    suggestion:
      en: "Usually, this behavior occurs when the hacker clears the attack trace. Please confirm whether it is invaded."
      zh: "通常该行为发生于黑客清除攻击痕迹，请确认是否遭到入侵。"
    rule_type: Privilege_Escalation
    priority: WARNING
    urgency: true
    tags: [ATT&CK, process, mitre_defense_evasion, L3]

- key: Escape to access by chroot
  hid: priv_06
  condition: >
    (evt.type=chroot and container and proc.name !=sshd and proc.name !=vsftpd)
    and not (tensorsec_namespace and (k8s.pod.name contains "-host-" or k8s.pod.name contains "-docker-" or k8s.pod.name contains "-kube-")) and shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access by chroot"
      zh: "容器内挂载主机目录逃逸"
    desc:
      en: "Escape to access by chroot"
      zh: "容器内挂载主机目录逃逸"
    suggestion:
      en: "The container is intruded, and the hacker escapes by attaching the directory. Please check whether the cluster permissions are trapped, and confirm whether the container is started by privileges. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "容器遭到入侵，黑客通过挂载目录逃逸，请排查集群权限是否陷落，并确认该容器是否通过特权启动，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, L4]

- key: Escape to access rule by procfs
  hid: priv_07
  condition: >
    open_write and container and fd.name contains /sys/kernel/core_pattern
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access rule by procfs"
      zh: "容器内挂载procfs目录逃逸"
    desc:
      en: "Escape to access rule by procfs"
      zh: "容器内挂载procfs目录逃逸"
    suggestion:
      en: "The container is intruded, and the hacker escapes by attaching the directory. Please check whether the cluster permissions are trapped, and confirm whether the container is started by privileges. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "容器遭到入侵，黑客通过挂载目录逃逸，请排查集群权限是否陷落，并确认该容器是否通过特权启动，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, L4]

- key: Escape to access rule by debugfs
  hid: priv_08
  condition: >
    evt.type = write and container and evt.arg.data contains "debugfs " and not evt.arg.data contains "-w" and proc.cmdline contains " -w"
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access rule by debugfs"
      zh: "容器内通过debugfs逃逸"
    desc:
      en: "Detect file system debugger debugfs launched inside a privileged container which might lead to container escape"
      zh: "容器内通过debugfs逃逸"
    suggestion:
      en: "The container is intruded, and the hacker escapes by attaching the directory. Please check whether the cluster permissions are trapped, and confirm whether the container is started by privileges. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "容器遭到入侵，黑客通过挂载目录逃逸，请排查集群权限是否陷落，并确认该容器是否通过特权启动，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, L4]

- key: Escape to access rule by cgroup
  hid: priv_09
  condition: >
    evt.type=mount and evt.arg.type = "cgroup" and container and user.uid=0
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access rule by cgroup"
      zh: "特权容器挂载cgroup逃逸"
    desc:
      en: "Container escape to access host system"
      zh: "特权容器挂载cgroup逃逸"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, troubleshoot whether the hacker has obtained host privileges and has other host operations, and use the immune defense training application to restrict user privileges for sensitive files and commands."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，排查黑客是否已获取主机权限并有其它主机操作，使用免疫防御训练应用，限制敏感文件和命令的用户权限。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, L4]

- key: CVE-2021-3156(Linux sudo Privilege_Escalation)
  hid: priv_10
  condition: >
    evt.type=execve and container and proc.name in (sensitive_cmd)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2021-3156(Linux sudo Privilege_Escalation)"
      zh: "CVE-2021-3156(sudo权限提升)"
    desc:
      en: "Linux sudo Privilege_Escalation"
      zh: "Linux sudo 提权"
    suggestion:
      en: "In case of power raising in the container, please check whether the cluster authority has fallen, and try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "容器内出现提权行为，请排查集群权限是否陷落，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, L4]

- key: CVE-2019-5736(Modify Container Entrypoint)
  hid: priv_11
  condition: >
    open_read and container
    and (fd.name=/proc/self/exe or fd.name startswith /proc/self/fd/)
    and not docker_procs
    and not (tensorsec_namespace
    and proc.pname != "<NA>"
    and (k8s.pod.name contains "-host-" or k8s.pod.name contains "-docker-" or k8s.pod.name contains "-kube-" or k8s.pod.name contains "-holmes-" or k8s.pod.name contains "-webhook-" or k8s.pod.name contains "-scanner"))
    and not proc.cmdline contains "runc init"
    and not proc.cmdline = "runc:[1:CHILD] init"
    and not proc.cmdline contains "kube-bench "
    and not proc.cmdline contains "scanner "
    and shell_family_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,proc_name=%proc.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2019-5736(Modify Container Entrypoint)"
      zh: "CVE-2019-5736(runc逃逸漏洞)"
    desc:
      en: "Modify Container Entrypoint"
      zh: "修改容器入口"
    suggestion:
      en: "If the container escapes, please check whether the cluster permissions fall. You can use immune defense to prevent the risk from spreading further and use immune defense training applications to limit the user permissions of sensitive files and commands."
      zh: "容器出现逃逸行为，请排查集群权限是否陷落，可采用免疫防御阻止风险进一步扩散使用免疫防御训练应用，限制敏感文件和命令的用户权限。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, L4]

- key: CVE-2019-14287(Sudo Potential bypass of Run as user restrictions)
  hid: priv_12
  condition: >
    open_read and evt.args contains "/usr/lib/sudo/sudoers.so" and
    (proc.cmdline contains "-u#-1" or proc.cmdline contains "-u#4294967295")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2019-14287(Sudo Potential bypass of Run as user restrictions)"
      zh: "CVE-2019-14287(sudo有可能绕过以用户身份运行的限制)"
    desc:
      en: "When sudo is configured to allow a user to run commands as an arbitrary user via the ALL keyword in a Runas specification, it is possible to run commands as root by specifying the user ID -1 or 4294967295. This can be used by a user with sufficient sudo privileges to run commands as root even if the Runas specification explicitly disallows root access as long as the ALL keyword is listed first in the Runas specification"
      zh: "当sudo配置为允许用户通过Runas规范中的ALL关键字以任意用户身份运行命令时，可以通过指定用户ID -1或4294967295来运行命令作为root。这可以由具有足够sudo权限的用户用来运行命令作为root，即使Runas规范不包含ALL关键字。这可以用来绕过由Runas规范施加的限制。"
    suggestion:
      en: "The container has been invaded. Please check whether the hacker has obtained host permissions and has other host operations. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "容器遭到入侵，请排查黑客是否已获取主机权限并有其它主机操作，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, filesystem, mitre_privilege_escalation, L4]

