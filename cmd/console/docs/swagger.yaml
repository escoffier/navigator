basePath: /
definitions:
  api.LoginResponse:
    properties:
      currentAuthority:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  api.User:
    properties:
      avatar:
        type: string
      email:
        type: string
      group:
        type: string
      name:
        type: string
      title:
        type: string
      userid:
        type: string
      username:
        type: string
    type: object
  api.cluster:
    properties:
      config:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        description: Kubenetes 1, OpenShift 2, Docker 3
        type: integer
    type: object
  response.EmptyResponse:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: This is the Vegeta central server - Console
  license: {}
  title: Vegeta API
  version: "1.0"
paths:
  /api/v1/config/cluster:
    post:
      description: Add new cluster
      operationId: v1-config-cluster-post
      parameters:
      - description: clusterName
        in: body
        name: name
        required: true
        schema:
          type: string
      - description: 'kubeConfig -- base64String '
        in: body
        name: config
        required: true
        schema:
          type: string
      - description: Kubenetes 1, OpenShift 2, Docker 3
        in: body
        name: type
        required: true
        schema:
          type: integer
      produces:
      - application/json
      summary: Add new cluster
  /api/v1/config/cluster/{clusterID}:
    delete:
      description: Delete a cluster by cluster ID
      operationId: v1-config-cluster-delete
      parameters:
      - description: clusterID
        in: path
        name: clusterID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: MongoDB DeletedCount
          schema:
            type: string
      summary: Delete a cluster
    get:
      description: Get single cluster information
      operationId: v1-config-cluster-get
      parameters:
      - description: clusterID
        in: path
        name: clusterID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.cluster'
        "400":
          description: clusterID is not provided
          schema:
            type: string
      summary: Get single cluster information
    put:
      description: Update single cluster information
      operationId: v1-config-cluster-put
      parameters:
      - description: clusterID
        in: path
        name: clusterID
        required: true
        type: string
      - description: clusterID
        in: body
        name: name
        required: true
        schema:
          type: string
      - description: kubeConfig -- base64String
        in: body
        name: config
        required: true
        schema:
          type: string
      - description: Kubenetes 1, OpenShift 2, Docker 3
        in: body
        name: type
        required: true
        schema:
          type: integer
      produces:
      - application/json
      summary: Update single cluster information
  /api/v1/config/clusters:
    get:
      description: Get all cluster information
      operationId: v1-config-cluster-get-all
      parameters:
      - description: from offset
        in: query
        name: offset
        type: integer
      - description: returned data limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      summary: Get all clusters information
  /api/v1/rest-auth/login:
    post:
      consumes:
      - application/json
      description: Login by username/password
      operationId: v1-rest-auth-login
      parameters:
      - description: Username
        in: body
        name: username
        required: true
        schema:
          type: string
      - description: Password
        in: body
        name: password
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Login response
          schema:
            $ref: '#/definitions/api.LoginResponse'
      summary: Login API
  /api/v1/rest-auth/logout:
    post:
      description: Logout
      operationId: v1-rest-auth-logout
      produces:
      - application/json
      responses:
        "200":
          description: Logout response
          schema:
            $ref: '#/definitions/response.EmptyResponse'
      summary: Logout API
  /api/v1/rest-auth/user:
    get:
      description: Get current user
      operationId: v1-rest-auth-user
      produces:
      - application/json
      responses:
        "200":
          description: Current user
          schema:
            $ref: '#/definitions/api.User'
      summary: User API
  /api/v1/scanner/scan:
    post:
      description: Tell scanner to scan an image
      operationId: v1-scanner-scan
      parameters:
      - description: image name
        in: body
        name: image
        required: true
        schema:
          type: string
      - description: force rescan the image
        in: body
        name: rescan
        required: true
        schema:
          type: boolean
      produces:
      - application/json
      summary: Tell scanner to scan an image
  /api/v1/scanner/task/{taskID}:
    get:
      description: Get a scan task
      operationId: v1-scanner-task-get
      parameters:
      - description: scan task ID
        in: path
        name: taskID
        required: true
        type: string
      produces:
      - application/json
      summary: Get a scan task by scantask ID
  /api/v1/scap/{checkType}/{clusterID}:
    post:
      description: Run compliance check on specified cluster
      operationId: v1-scap-check
      parameters:
      - description: kube/docker/host
        in: path
        name: checkType
        required: true
        type: string
      - description: cluster ID
        in: path
        name: clusterID
        required: true
        type: string
      produces:
      - application/json
      summary: Run compliance check on specified cluster
  /api/v1/scap/{checkType}/{clusterID}/reports:
    get:
      description: Get scap report for cluster and filter criteria
      operationId: v1-scap-job-get
      parameters:
      - description: kube/docker/host
        in: path
        name: checkType
        required: true
        type: string
      - description: cluster ID
        in: path
        name: clusterID
        required: true
        type: string
      - description: check ID
        in: query
        name: checkID
        type: string
      - description: node name
        in: query
        name: nodeName
        type: string
      - description: status (inprogress/failed/completed)
        in: query
        name: status
        type: string
      produces:
      - application/json
      summary: Get scap reports
swagger: "2.0"
