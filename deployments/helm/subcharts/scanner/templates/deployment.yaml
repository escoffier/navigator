apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "scanner.fullname" . }}
  labels:
{{ include "scanner.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "scanner.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "scanner.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
    # {{- with .Values.imagePullSecrets }}
    #   imagePullSecrets:
    #     {{- toYaml . | nindent 8 }}
    # {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        command: ["/vegeta-scanner"]
        args: [
          "--mongo-endpoint=vegeta-mongodb:27017",
          "--clair-remote-address=vegeta-clair",
          # clair-address and clair-port refer to Scanner Service address. Clair service needs to have access to layers published by Scanner service.
          # Path to them is sent in Scan request to Clair.
          # TODO: maybe rename? I spent hours on this because I was confused.
          "--clair-address=scanner",
          "--clair-port={{ .Values.service.LayerPort }}",
          "-v"]

        ports:
          - containerPort: {{ .Values.service.ApiContainerPort }}
            name: {{ include "scanner.name" . }}-api
          - containerPort: {{ .Values.service.LayerContainerPort }}
            name: {{ include "scanner.name" . }}-layer

        volumeMounts:
          - name: dockersock
            mountPath: "/var/run/docker.sock"
          - name: tmp
            mountPath: "/tmp/"
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
      - name: tmp
        hostPath:
          path: /tmp/


