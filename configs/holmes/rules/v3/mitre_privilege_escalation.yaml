      zh: "Containerd漏洞（CVE-2020-15257）是一种影响容器运行时工具Containerd的漏洞，漏洞的根本问题在于Containerd未能正确处理容器的文件系统路径。攻击者可以构造恶意容器，通过特制的文件系统路径实现逃逸，从而访问宿主系统上的文件和资源。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
