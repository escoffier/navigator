# On EC2 instances, 169.254.169.254 is a special IP used to fetch
# metadata about the instance. It may be desirable to prevent access
# to this IP from containers.
- key: Contact EC2 Instance Metadata Service From Container
  hid: exf_04
  condition: >
    outbound and fd.sip="169.254.169.254" and container
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Contact EC2 Instance Metadata Service From Container"
      zh: "从容器获取EC2实例元数据"
    desc:
      en: "EC2 instance metadata is a metadata service about sensitive information and configuration of cloud service instances, which can be accessed through HTTP requests. Generally, we believe that normal users in the container will not perform this behavior. There is a high probability that the attacker can obtain sensitive information including instance ID, IAM role credentials, security group configuration and other sensitive information by initiating HTTP requests in the container after carrying out the attack."
      zh: "EC2实例元数据是关于云服务实例的敏感信息和配置的元数据服务，可以通过HTTP请求访问。通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，通过在容器内发起HTTP请求，可以获取到包括实例ID、IAM角色凭证、安全组配置等敏感信息。"
    suggestion:
      en: "Please confirm if the behavior is normal for the process, train the application using immune defense, block traffic using micro-isolation, and restrict user permissions for sensitive files and commands."
      zh: "请确认该行为是否属于进程的正常行为，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, cloud_service, container, mitre_data_leakage, L2]

# On GCP, AWS and Azure, 169.254.169.254 is a special IP used to fetch
# metadata about the instance. The metadata could be used to get credentials by attackers.
- key: Contact cloud metadata service from container
  hid: exf_05
  condition: >
    outbound and fd.sip="169.254.169.254" and container and consider_metadata_access and not user_known_metadata_access
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Contact cloud metadata service from container"
      zh: "容器内与云元数据服务通信"
    desc:
      en: "Generally, we believe that normal users in the container will not perform this behavior. The high probability is that after the attack, the attacker communicates with the cloud metadata service in the container to obtain sensitive credentials, detect cloud environment configuration, lateral movement and side channel attacks. Steal sensitive information and abuse cloud resources."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，在容器内与云元数据服务通信，获取敏感凭证，探测云环境配置，横向移动和侧信道攻击，窃取敏感信息，滥用云资源。"
    suggestion:
      en: "Please confirm if the behavior is normal for the process, train the application using immune defense, block traffic using micro-isolation, and restrict user permissions for sensitive files and commands."
      zh: "请确认该行为是否属于进程的正常行为，使用免疫防御训练应用，使用微隔离阻拦流量，限制敏感文件和命令的用户权限。"
    rule_type: Exfiltration
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, network, cloud_service, container, mitre_data_leakage, L2]

