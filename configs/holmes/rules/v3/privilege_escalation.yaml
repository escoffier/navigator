  hid: priv_13
  condition: >
    evt.type = unshare and proc.name=unshare and proc.args contains r and not proc.args contains "mount" and container
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2022-0185(in Linux Kernel Can Allow Container Escape in Kubernetes Linux)"
      zh: "CVE-2022-0185(Linux_kernel_bug可导致Kubernetes容器逃逸)"
    desc:
      en: "In Linux Kernel Can Allow Container Escape in Kubernetes Linux"
      zh: "Linux内核漏洞可导致在Kubernetes中逃逸容器"
    suggestion:
      en: "The container has been invaded. Please check whether the hacker has obtained host permissions and has other host operations. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
      zh: "容器遭到入侵，请排查黑客是否已获取主机权限并有其它主机操作，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, filesystem, mitre_privilege_escalation, L4]

