global:
  prefixName: csec
  image:
    registry: harbor.local.example.com
    repository: library
  verison: &Verison 1.0.0
  persistence:
    enabled: &persistenceStorage true
  #storageClass: "nfs-client"
  imagePullSecret:
    url: &imageRegistryURL harbor.local.example.com
    username: &imageRegistryUsername admin
    password: &imageRegistryPassword Harbor12345
  bufRegistryExternalUrl: console.localhost.com
  consoleExternalAdd: https://console-external.localhost.com
  emailOfficialName: "Navigator"
  contactEmail: "info@example.com"
  multiCluster:
    ## Both 'isMainCluster' and 'isMemberCluster' all need be modified 
    ## and the values of them must be opposite
    isMainCluster: &isMainCluster true
    isMemberCluster: &isMemberCluster false
    configs:
      ## Unique cluster name, use "default" for MainCluster and other name for MemberCluster
      clusterName: default
      ## ApiServer address of cluster
      apiServerAddr: 192.168.0.1:6443
      consoleExternalAdd: https://console-external.localhost.com
      eventcenterGrpcExternalAddr: 192.168.0.2:30090
      stanExternalHost: 192.168.0.2
      stanExternalPort: 30422
      
      


console:
  enabled: *isMainCluster
  image:
    tag: *Verison
  scap:
    tag: *Verison
  persistence:
    enabled: *persistenceStorage
  jobs:
    Cleaner:
      image:
        tag: *Verison
    Hunter:
      image:
        tag: *Verison
    ApiScan:
      image:
        tag: *Verison
    Platform:
      image:
        tag: *Verison
  imagePullSecret:
    imageRegistryURL: *imageRegistryURL
    imageRegistryUsername: *imageRegistryUsername
    imageRegistryPassword: *imageRegistryPassword
  emailCheck:
    smtpEnabled: false
    smtpHost: smtp.feishu.cn
    smtpPort: 465
    smtpUsername: console-robot@example.com
    smtpPassword: password
  version:
    softName: ManagerPlatform
    softVersion: v1.9

scanner:
  enabled: *isMainCluster
  image:
    tag: *Verison
  dockerregistry:
    persistence:
      enabled: *persistenceStorage
      size: 50Gi
    secrets:
      # If you update the username or password of registry, make sure use cli tool htpasswd to generate the bcrypt hash
      # e.g. "htpasswd -nbBC10 $username $password"
      # Default: registry:Registry@Passw0rd
      htpasswd: "registry:$2y$10$lxSxhkgwiq9fyvKBOmOkjuOW6x2Z4krBAJDa4fQV9IBiCoK2aXHRu"
    service:
      type: ClusterIP
      # clusterIP:
      httpPort: 5000
      gcPort: 8081
      # httpNodePort:
      # gcNodePort:
  webshell:
    image:
      tag: *Verison
    replicas: 2
  scanreport:
    image: 
      tag: *Verison
    emailCheck:
      smtpHost: smtp.feishu.cn
      smtpPort: 465
      smtpUsername: console-robot@example.com
      smtpPassword: password
    interval: 5m
  persistence:
    enabled: *persistenceStorage
    size: 4Gi

holmes:
  enabled: true
  image:
    tag: *Verison
  daemon:
    image:
      tag: *Verison

webhook:
  enabled: true
  image:
    tag: *Verison
  sidecar:
    image:
      tag: *Verison


cluster-manager:
  enabled: true
  image:
    tag: *Verison

eventcenterAuth:
  enabled: true

security-profiles-manager:
  enabled: *isMainCluster
  image:
    tag: *Verison
  webhook:
    image:
      tag: *Verison
  loader:
    image:
      tag: *Verison
  audit:
    image:
      tag: *Verison

stan:
  enabled: *isMainCluster
  store:
    volume:
      enabled: *persistenceStorage

safenode-image:
  enabled: true
  image:
    tag: *Verison
  pushConfigs:
    pushInterval: 10
    batchInterval: 60
    batchSize: 60

palace:
  enabled: *isMainCluster
  image:
    tag: *Verison

redis-ha:
  enabled: *isMainCluster
  persistentVolume:
    enabled: *persistenceStorage
postgresql-ha:
  enabled: *isMainCluster
  persistence:
    enabled: *persistenceStorage
elasticsearch:
  enabled: *isMainCluster
  persistence:
    enabled: *persistenceStorage
