apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "console.fullname" . }}
  labels:
{{ include "console.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "console.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "console.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
    # {{- with .Values.imagePullSecrets }}
    #   imagePullSecrets:
    #     {{- toYaml . | nindent 8 }}
    # {{- end }}
      initContainers:
      - name: "elasticsearch-listener"
        image: "alpine"
        imagePullPolicy: "IfNotPresent"
        command: [
          "sh", "-c",
          "for i in $(seq 1 200); do nc -z -w3 tensorsec-elasticsearch-master 9200 && exit 0 || sleep 3; done; exit 1"
        ]    
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.global.ourDockerRepo }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        command: ["/vegeta-console"]
        args: [
          "--mongo-endpoint=tensorsec-mongodb:27017",
          "--mongo-database={{ .Values.mongo.mongoDatabase }}",
          "--mongo-username={{ .Values.mongo.mongoUsername }}",
          "--mongo-k8secretname={{ .Values.mongo.mongoSecretName }}",
          "--mongo-pvc=datadir-tensorsec-mongodb-primary-0",
          "--mongo-pod=tensorsec-mongodb-primary-0",
          "--mongo-data-path={{ .Values.mongo.mongoDataPath }}",
          "--vegeta-scanner-host=tensorsec-scanner",
          "--vegeta-scanner-port=8888",
          "--microsegmentation-host=tensorsec-calico-core",
          "--microsegmentation-port=2137",
          "--redis-endpoint=tensorsec-redis-master:6379",
          "--scap-job-repo={{ .Values.global.ourDockerRepo }}",
          "--scap-job-tag={{ .Values.scap.tag }}",
          "--available-rules-folder=/available-rules",
          "--elastic-host={{ .Values.elastic.host }}",
          "--elastic-port={{ .Values.elastic.port }}",
          "--elastic-index={{ .Values.elastic.index }}",
          "--elastic-username={{ (index .Values.elasticsearch.extraEnvs 0).value }}",
          "--harbor-username={{ .Values.harbor.harborUsername }}",
          "--harbor-url={{ .Values.harbor.harborURL }}",
          "--harbor-skiptlsverify", # Insecure
          "-v"]

        volumeMounts:
          - name: available-rules-volume
            mountPath: "/available-rules"

        env:
        # Required for managing scap jobs
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TENSORSEC_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.redisSecretName }}
              key: redis-password 
        - name: TENSORSEC_HARBOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.harbor.harborSecretName }}
              key: password
        - name: TENSORSEC_MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongo.mongoSecretName }}
              key: mongodb-password
        - name: TENSORSEC_ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.elasticsearch.elasticSecretName }}
              key: password
      
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        ports:
          - containerPort: {{ .Values.service.containerPort }}
            name: {{ include "console.name" . }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
      - name: tmp
        hostPath:
          path: /tmp/
      - name: available-rules-volume
        configMap:
          name: available-rules-config
          defaultMode: 0600
