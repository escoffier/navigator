- key: Access k8s component port
  hid: exec_10
  condition: >
    easy_outbound and
    fd.sport in (k8s_ports)
    and not fd.name contains "->127.0.0.1"
    and not fd.name contains "->0.0.0.0:"
    and not fd.name contains "->::1"
    and not fd.sport = 10250
    and not (proc.cmdline contains "docker -H tcp://" and proc.cmdline contains ":2375")
    and not k8s.ns.name = "kube-system"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Access k8s component port"
      zh: "访问k8s组件端口"
    desc:
      en: "Generally, we believe that normal users will not use shell (such as bash, sh) to access k8s ports. There is a high probability that attackers may take a variety of malicious activities after detecting the port information of Kubernetes components after conducting an attack. These include attempts to gain unauthorized access to components, steal sensitive information, move laterally and gain greater privileges, and tamper with or destroy configurations and resources, potentially resulting in service disruption and data corruption."
      zh: "通常我们认为正常用户不会使用shell(如：bash、sh)的方式去访问k8s端口，大概率是攻击者在进行攻击后，探测Kubernetes组件的端口信息后可能采取多种恶意活动。包括尝试未经授权地访问组件、窃取敏感信息、横向移动并获取更大权限，以及篡改或破坏配置和资源，可能导致服务中断和数据损坏。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the system call is connect, sendto, sendmsg and Check whether the server port is a k8s component port such as 2375, 2379, 2380, etc. Contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为connect、sendto、sendmsg并且服务端端口是否为2375、2379、2380等k8s组件端口，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: WARNING
    urgency: false
    tags: [ATT&CK, k8s, network, mitre_execution, L4]

- key: Reverse shell
  hid: exec_11
  condition: >
    evt.type in (connect,sendto,sendmsg)
    and fd.name contains "->"
    and not fd.sport in ("", 53, 22)
    and fd.name != "" and fd.name exists and fd.type in ("ipv4", "ipv6")
    and not proc.name in (known_system_procs_network_activity_binaries)
    and not proc.pname in (known_system_procs_network_activity_binaries)
    and not (package_mgmt_procs or package_mgmt_ancestor_procs)
    and not login_doing_dns_lookup
    and not user_expected_system_procs_network_activity_conditions and container
    and not tensorsec_namespace
    and not proc.cmdline contains "redis-cli -h"
    and not proc.cmdline contains "curl -k"
    and not k8s.ns.name = "kube-system"
    and not k8s.ns.name = "deepflow"
    and not fd.name contains "->127.0.0.1"
    and not fd.name contains "->0.0.0.0:"
    and not fd.name contains "->::1"
    and not (proc.cmdline contains "docker -H tcp://" and proc.cmdline contains ":2375")
#and not k8s.pod.name contains "51c1c6" and (inbound_outbound) and fd.sport=8080
  output: >
    pod_id=%k8s.pod.id,syscall_name=%syscall.type,terminal=%proc.tty,user_uid=%user.uid,container_id=%container.id,container_name=%container.name,fd.num=%fd.num,fd.type=%fd.type,fd_name=%fd.name,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pgid=%proc.vpgid,proc_pname=%proc.pname,proc_name=%proc.name,parent=%proc.pname,proc.aname[0]=%proc.aname[0],proc.aname[1]=%proc.aname[1],gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4]
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.fd_name ]
    - name: branches
      params: MARCO::reverseShell
  info:
    name:
      en: "Reverse shell through {reverse_tool: socket and dup}"
      zh: "容器内通过{reverse_tool_zh: socket和dup}反弹shell"
    desc:
      en: "Rebound shell (Reverse Shell) is a computer attack technique usually used by attackers to establish a command line interface with the target computer in order to remotely control the target computer. Normal users usually do not perform this behavior. The high probability is that after the attack, the attacker uses {reverse_tool: socket and dup} to rebound the shell in the container to gain control of the container. The purpose is to move laterally, steal or tamper with sensitive data. and the creation of backdoors, posing a persistent threat. These behaviors pose potential threats to the security of the container and the entire environment."
      zh: "反弹 shell（Reverse Shell）是一种计算机攻击技术，通常由攻击者使用，目的是建立一个与目标计算机的命令行接口，以便在远程控制目标计算机。正常用户通常不会进行此行为，大概率是攻击者在进行攻击后，在容器内通过{reverse_tool_zh: socket和dup}反弹shell，获取容器内控制权，目的是横向移动、窃取或篡改敏感数据，以及建立后门，构成持久性威胁。这些行为对容器和整个环境的安全性构成潜在威胁。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, file path and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a recurring expectation Behavior, and after investigation, it is judged that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the system call is connect, sendto , sendmsg and whether the command line includes the IP address and port number, and whether the process name is python, nc, awk, etc. that can execute rebound programs, programming languages, etc., contact security personnel in a timely manner for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为connect、sendto、sendmsg并且命令行中是否包括ip地址与端口号，并且进程名是否为python、nc、awk等可以执行反弹的程序、编程语言等，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: ALERT
    urgency: true
    tags: [ATT&CK, shell, network, mitre_execution, L4]

