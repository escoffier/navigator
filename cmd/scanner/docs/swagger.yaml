      k8s_enable:
        type: boolean
      library:
        items:
          type: string
        type: array
      malicious_policy:
        type: string
      mode:
        type: string
      name:
        type: string
      online_monitor:
        type: boolean
      operator:
        type: string
      reject_vulns:
        items:
