---
apiVersion: batch/v1
kind: Job
metadata:
  name: hot-logic-cleaner
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: hot-logic-cleaner
    spec:
      containers:
        - name: hot-logic-cleaner
          image: localhost:32000/cleaner:latest
          command: ["/app/cleaner", "hot-logic-storage-tool"]
          imagePullPolicy: Always
          env:
            - name: CONF_PATH
              value: /app/hot-logic-conf.json
          volumeMounts:
            - name: audit
              mountPath: /audit
          resources:
            requests:
              memory: "200Mi"
              cpu: "0.5"
            limits:
              memory: "200Mi"
              cpu: "0.5"
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-admin-secret
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: audit-pvc

  backoffLimit: 0
