- rule: CVE-2021-3156(Linux sudo Privilege_Escalation)
  hid: priv_10
  hthreats: 1
  ruletype:
    en: "Privilege_Escalation"
    zh: "权限提升"
  suggestion:
    en:
      key: "Suggestions"
      value: "In case of power raising in the container, please check whether the cluster authority has fallen, and try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器内出现提权行为，请排查集群权限是否陷落，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: Linux sudo Privilege_Escalation
  condition: (evt.type=execve and container and proc.name in (sensitive_cmd))
  output: >
    Linux sudo Privilege_Escalation (zh_msg=CVE-2021-3156(Linux sudo 权限提升),rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK]

- rule: CVE-2019-5736(Modify Container Entrypoint)
  hid: priv_11
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "If the container escapes, please check whether the cluster permissions fall. You can use immune defense to prevent the risk from spreading further and use immune defense training applications to limit the user permissions of sensitive files and commands."
    zh:
      key: "处置建议"
      value: "容器出现逃逸行为，请排查集群权限是否陷落，可采用免疫防御阻止风险进一步扩散使用免疫防御训练应用，限制敏感文件和命令的用户权限。"
  desc: Detect file write activities on container entrypoint symlink (/proc/self/exe)
  condition: >
    open_write and container and (fd.name=/proc/self/exe or fd.name startswith /proc/self/fd/) and not docker_procs and not
    (tensorsec_namespace and (k8s.pod.name contains "-host-" or k8s.pod.name contains "-docker-" or k8s.pod.name contains "-kube-" or k8s.pod.name contains "-holmes-" or k8s.pod.name contains "-webhook-" or k8s.pod.name contains "-scanner")) and not
    proc.cmdline contains "runc init" and not proc.cmdline = "runc:[1:CHILD] init" and not proc.cmdline contains "kube-bench " and not proc.cmdline contains "scanner "
  output: >
    %fd.name is open to write by process (zh_msg=CVE-2019-5736修改容器入口,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,original_info=%proc.name %proc.exeline,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK]

- rule: CVE-2019-14287(Sudo Potential bypass of Run as user restrictions)
  hid: priv_12
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container has been invaded. Please check whether the hacker has obtained host permissions and has other host operations. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，请排查黑客是否已获取主机权限并有其它主机操作，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: When sudo is configured to allow a user to run commands as an arbitrary user via the ALL keyword in a Runas specification, it is possible to run commands as root by specifying the user ID -1 or 4294967295. This can be used by a user with sufficient sudo privileges to run commands as root even if the Runas specification explicitly disallows root access as long as the ALL keyword is listed first in the Runas specification
  condition: >
    open_read and evt.args contains "/usr/lib/sudo/sudoers.so" and
    (proc.cmdline contains "-u#-1" or proc.cmdline contains "-u#4294967295")
  output: >
    (zh_msg=CVE-2019-14287(sudo有可能绕过以用户身份运行的限制),rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name container=%container.info,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK, filesystem, mitre_privilege_escalation]

- rule: CVE-2022-0185(in Linux Kernel Can Allow Container Escape in Kubernetes Linux)
  hid: priv_13
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container has been invaded. Please check whether the cluster permissions have fallen. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，请排查集群权限是否陷落，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: in Linux Kernel Can Allow Container Escape in Kubernetes Linux
  condition: >
    evt.type = unshare and proc.name=unshare and proc.args contains r and not proc.args contains "mount" and container
  output: >
    in Linux Kernel Can Allow Container Escape in Kubernetes Linux (zh_msg=CVE-2022-0185：Linux_kernel_bug可实现Kubernetes容器逃逸,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name container=%container.info container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK, filesystem, mitre_privilege_escalation]

- rule: CVE-2021-4034(Polkit Local Privilege Escalation Vulnerability)
  hid: priv_14
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container has been invaded. Please check whether the hacker has obtained host permissions and has other host operations. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，请排查黑客是否已获取主机权限并有其它主机操作，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: This rule detects an attempt to exploit a privilege escalation vulnerability in Polkit's pkexec. By running specially crafted code, a local user can leverage this flaw to gain root privileges on a compromised system
  condition: >
    spawned_process and user.uid != 0 and proc.name=pkexec and proc.args = ''
  output: >
    Polkit Local Privilege Escalation Vulnerability (zh_msg=CVE-2021-4034：Polkit本地提权漏洞,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK, filesystem, mitre_privilege_escalation]

- rule: Linux Privilege Escalation using nmap suid binaries
  hid: priv_15
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "Please check whether the nmap command in the container has been granted S permission, so that hackers try to use it to improve their rights. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "请排查容器内nmap命令是否被授予s权限，从而被黑客尝试利用提权，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: Linux Privilege Escalation using nmap suid binaries
  condition: >
    (evt.type = stat and evt.arg.path contains "nmap.xsl" and user.uid != 0 and ((proc.cmdline contains "interactive") or (proc.cmdline contains "script") or (proc.cmdline contains "-oG"))) and not tensorsec_namespace
  output: >
    Linux Privilege Escalation using nmap suid binaries (zh_msg=尝试利用nmap_suid进行linux提权,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK, filesystem, mitre_privilege_escalation]

