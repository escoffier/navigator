image: registry.t-appagile.com/library/reviewdog:v5

variables:
  GOPROXY: "https://goproxy.cn"
  GO111MODULE: "on"
  GOPRIVATE: "gitlab.com,scm.tensorsecurity.cn"
  CGO_LDFLAGS: "-no-pie"
  HARBORPASSWD: "Hrbr12@Tensor.*#)"

workflow:
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master/'
      when: always

stages:
  - reviewdog
  - build
  - test

## reviewdog
reviewdog:
  stage: reviewdog
  tags:
    - k8s
  before_script:
    - export REVIEWDOG_GITLAB_API_TOKEN=Ux_Ex4z5-payZMS_evgC
    - export GITLAB_API="http://gitlab.gitlab-ce.svc.cluster.local/api/v4"
    - export CI_REPO_OWNER=tensorsecurity-rd
    - export CI_REPO_NAME=tensornavigator
    - export CI_COMMIT=$(git rev-parse HEAD)
    - export REVIEWDOG_INSECURE_SKIP_VERIFY=true
    - git config --global --add url."git@gitlab.com:".insteadOf "https://gitlab.com/"
    - git config --global --add url."ssh://git@10.77.218.241/".insteadOf "http://scm.tensorsecurity.cn/"
    - sed -i 's#scm.tensorsecurity.cn:30022#10.77.218.241#g' .gitmodules
    - git submodule init
    - git submodule update
    - git submodule update --init --recursive
  script:
    - reviewdog -reporter=gitlab-mr-discussion -debug -tee
  rules:
    - changes:
        - cmd/**/*

### build & deploy
all:
  stage: build
  retry: 2
  resource_group: all
  tags:
    - k8s
  before_script:
    ## Configuration of Git
    - git merge origin/master
    - git config --global --add url."git@gitlab.com:".insteadOf "https://gitlab.com/"
    - git config --global --add url."ssh://git@10.77.218.241/".insteadOf "http://scm.tensorsecurity.cn/"
    - git submodule init
    - git submodule update
    - git submodule update --init --recursive
    - go get -u github.com/swaggo/swag/cmd/swag
    - go get -u golang.org/x/lint/golint
    ## Configuration of Make
    - sed -i 's#RELEASEVERSION?=v0.0.1#RELEASEVERSION?=ci#g' Makefile
    - sed -i "s#latest#ci#g" Makefile
    - sed -i "s#DOCKER_REGISTRY=$(REPOPREFIX)#DOCKER_REGISTRY=registry.t-appagile.com/tensorsecurity#g" Makefile
    - sed -i "s#REPOPREFIX?=localhost:32000#REPOPREFIX?=registry.t-appagile.com/tensorsecurity#g" Makefile
    - sed -i "s#GO111MODULE=on#GO111MODULE=on GOPROXY=https://goproxy.cn#g" configs/scap/jobs/kube-bench/Dockerfile
    ## Copy tools
    - mkdir ~/.kube/
    - cp ~/.docker/config-ci ~/.kube/config
    - cp ~/.docker/kubectl /bin/
    - chmod +755 /bin/kubectl
    - cp ~/.docker/helm3 /bin/
  script:
    - USEMIRROR=true make all
    - make pushimages
    - kubectl get pod --no-headers -n tensorsec-ci|grep -v "db\|mongodb\|redis\|elasticsearch\|frontend\|eventcenter\|microseg"|awk '{print $1}'|xargs -i kubectl delete pod {} -n tensorsec-ci --force --grace-period=0

  rules:
    - changes:
        - pkg/**/*
        - Makefile
        - go.mod
        - configs/**/*

helm-upgrade:
  stage: build
  resource_group: helm-upgrade
  tags:
    - k8s
  before_script:
    ## Configuration of Git
    - git merge origin/master
    ## Configuration of Helm
    - 'sed -i "s#harbor.local.tensorsecurity.cn#registry.t-appagile.com#g" deployments/helm/example-values.yaml'
    - 'sed -i "s#1.0.0#ci#g" deployments/helm/example-values.yaml'
    - 'sed -i "s|Harbor12345|$HARBORPASSWD|g" deployments/helm/example-values.yaml'
    - 'sed -i "s#smtpEnabled: false#smtpEnabled: true#g" deployments/helm/example-values.yaml'
    - 'sed -i "s#smtpPassword: password#smtpPassword: r8UJgg7ejpSoDOAF#g" deployments/helm/example-values.yaml'
    ## Copy tools
    - mkdir ~/.kube/
    - cp ~/.docker/config-ci ~/.kube/config
    - cp ~/.docker/helm3 /bin/
  script:
    - cd deployments/helm
    - helm3 dep up
    - helm3 upgrade --install tensorsec -f example-values.yaml ./ --namespace tensorsec-ci
  rules:
    - changes:
        - deployments/helm/**/*

