---
apiVersion: batch/v1
kind: Job
metadata:
  name: cold-cleaner
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: cold-cleaner
    spec:
      containers:
        - name: cold-cleaner
          image: localhost:32000/cleaner:latest
          command: ["/app/cleaner", "clear-cold-storage-tool"]
          imagePullPolicy: Always
          env:
            - name: AUDIT_PATH
              value: /audit
          volumeMounts:
            - name: audit
              mountPath: /audit
          resources:
            requests:
              memory: "100Mi"
              cpu: "0.1"
            limits:
              memory: "100Mi"
              cpu: "0.1"
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-admin-secret
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: audit-pvc

  backoffLimit: 0
