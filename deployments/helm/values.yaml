    tag: latest
  persistence:
    enabled: true
    tensorsecCleaner:
      image:
        registry: "{{ .Values.global.image.registry }}"
        repository: "{{ .Values.global.image.repository }}"
        name: tensorsec-cleaner
        tag: latest
