apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "console.fullname" . }}
  labels:
{{ include "console.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "console.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "console.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
    # {{- with .Values.imagePullSecrets }}
    #   imagePullSecrets:
    #     {{- toYaml . | nindent 8 }}
    # {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        command: ["/vegeta-console"]
        args: [
          "--mongo-endpoint=vegeta-mongodb:27017",
          "--etcd-endpoints=etcd-cluster-client:2379",
          "--es-urls=elasticsearch-master:9200",
          "--vegeta-scanner-host=scanner",
          "--vegeta-scanner-port=8888",
          "-v"]   
    
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - containerPort: {{ .Values.service.containerPort }}
            name: {{ include "console.name" . }}

        volumeMounts:
          - name: dockersock
            mountPath: "/var/run/docker.sock"
          - name: tmp
            mountPath: "/tmp/"
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
      - name: tmp
        hostPath:
          path: /tmp/


