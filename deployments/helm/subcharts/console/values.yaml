image:
  registry:  localhost:32000
  repository: tensorsecurity
  name: tensorsec-console
  tag: latest
  pullPolicy: Always
  pullSecret: harbor-admin-secret

scap:
  tag: latest

persistence:
  enabled: true
  claimName: audit-pvc
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  tensorsecCleaner:
    image:
      registry: localhost:32000
      repository: tensorsecurity
      name: tensorsec-cleaner
      tag: latest
      pullPolicy: Always
      pullSecret: harbor-admin-secret
    coldCronjob:
      cronString: "0 4 * * *"
      nameOverride: "cron-cold-cleaner"
      fullnameOverride: "tensorsec-cron-cold-cleaner"
      resources:
        limits:
          cpu: "0.1"
          memory: 100Mi
        requests:
          cpu: "0.1"
          memory: 100Mi
    hotLogicCronjob:
      cronString: "0 2 * * *"
      nameOverride: "cron-hot-logic-cleaner"
      fullnameOverride: "tensorsec-cron-hot-logic-cleaner"
      resources:
        limits:
          cpu: "0.3"
          memory: 300Mi
        requests:
          cpu: "0.3"
          memory: 300Mi
    hotOfflineCronjob:
      cronString: "0 3 * * *"
      nameOverride: "cron-hot-offline-cleaner"
      fullnameOverride: "tensorsec-cron-hot-offline-cleaner"
      resources:
        limits:
          cpu: "0.2"
          memory: 200Mi
        requests:
          cpu: "0.2"
          memory: 200Mi


## Deployment pod host aliases
#  hostAliases:
#  - ip: "192.168.x.x"
#    hostnames:
#    - "xxx.xxx.com"
hostAliases: []

## config user email check
emailCheck:
  enabled: false
  host: smtp.feishu.cn
  port: 465
  username: console-robot@tensorsecurity.cn
  password: password 
  


nameOverride: "console"
fullnameOverride: "tensorsec-console"
debugServiceName: "tensorsec-console-debug"

# Custom service account override that the pod will use
serviceAccount: ""

restartPolicy: Always

service:
  type: ClusterIP
  port: 8889
  containerPort: 8080

debugService:
  type:  NodePort
  port: 18889
  containerPort: 18080

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "200Mi"
  limits:
    cpu: "200m"
    memory: "500Mi"

initResources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "50m"
    memory: "128Mi"

apiInstallLabel: "console.tensorsec/install"

eventcenter:
  eventGrpcUrl: tensorsec-eventcenter:9090
  eventGrpcCertServerName: tensorsec-eventcenter

elasticsearch:
  elasticSecretName: elastic-secret
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: Elastic12345
    - name: ELASTIC_USERNAME
      value: elasticsearch
elastic:
  host: tensorsec-elasticsearch-master
  port: 9200
  index: filebeat-*
  elasticDataPath: /usr/share/elasticsearch/data
postgresql:
  postgresqlDataDir: /bitnami/postgresql/data
  postgresqlUsername: postgres
  postgresqlPassword: password
  postgresqlDatabase: postgres

harbor:
  harborURL: https://192.168.1.152:30003
  harborUsername: tensorsec
  harborPassword: Tensorsec123!
  harborSecretName: harbor-api-tensorsec
  
mongo:
  mongoUsername: redstone
  mongoDatabase: vegeta
  mongoSecretName: tensorsec-mongodb # needs keey mongodb-password
  mongoDataPath: /bitnami/mongodb/data

redis:
  redisSecretName: tensorsec-redis

