apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: faulty
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      completions: 1
      template:
        metadata:
          labels:
            tensorsec.driftprevent: "prevent"
        spec:
          containers:
            - name: faulty
              image: registry.t-appagile.com/tensorsecurity/faulty:test
              imagePullPolicy: Always
              args:
                - /bin/bash
                - -c
                - ( /app/entrypoint.sh ; exit 0 )
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - name: tmp
                  mountPath: /host/tmp
          restartPolicy: Never
          imagePullSecrets:
          - name: harbor-admin-secret
          volumes:
          - name: tmp
            hostPath:
              path: /tmp
