- key: Modify binary dirs
  hid: pers_13
  condition: >
    bin_dir_rename and modify and not package_mgmt_procs and not exe_running_docker_save and not user_known_modify_bin_dir_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,operation=%evt.type,file=%fd.name,evt.args=%evt.args,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
