- key: Remove Bulk Data from Disk
  hid: pers_06
  condition: >
    spawned_process and clear_data_procs and not user_known_remove_data_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Remove bulk data from disk"
      zh: "发现大量数据从硬盘删除"
    desc:
      en: "Bulk data has been removed from disk"
      zh: "大量数据从硬盘删除"
    suggestion:
      en: "Please go through the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, and whether the data deletion operation is as expected."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该数据删除操作是否符合预期。"
    rule_type: Persistence
    priority: WARNING
    urgency: true
    tags: [ATT&CK, process, mitre_persistence, L4]

- key: Modify shell configuration file
  hid: pers_07
  condition: >
    open_write and shell_parent_procs and
    (fd.filename in (shell_config_filenames) or
     fd.name in (shell_config_files) or
     fd.directory in (shell_config_directories))
    and not proc.name in (shell_binaries)
    and not exe_running_docker_save
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Modify shell configuration file"
      zh: "修改shell配置文件"
    desc:
      en: "Modify shell configuration file"
      zh: "修改shell配置文件"
    suggestion:
      en: "Please go through the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, and whether the modification is operated by the operation and maintenance personnel."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该修改是否为运维人员操作。"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, file, mitre_persistence, L4]

- key: Create files below dev
  hid: pers_08
  condition: >
    fd.directory = /dev and
    (evt.type = creat or (evt.type in (open,openat,openat2) and evt.arg.flags contains O_CREAT))
    and not proc.name in (dev_creation_binaries)
    and not fd.name in (allowed_dev_files)
    and not fd.name startswith /dev/tty
    and not user_known_create_files_below_dev_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Create files below dev"
      zh: "在/dev目录下创建文件"
    desc:
      en: "Create files below dev"
      zh: "在/dev目录下创建文件"
    suggestion:
      en: "Please judge through the process tree whether the command belongs to the normal behavior of the known process, whether it is executed by malware, and confirm whether the modification is operated by the operation and maintenance personnel, otherwise it may have the risk of intrusion, and it is recommended to exclude it."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该修改是否为运维人员操作，否则可能会有入侵风险，建议排查。"
    rule_type: Persistence
    priority: INFO
    urgency: false
    tags: [ATT&CK, filesystem, mitre_persistence, L3]

