      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否包含/var/run/secrets/kubernetes.io/serviceaccount/token，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: WARNING
    urgency: true
    tags: [ATT&CK, k8s, filesystem, mitre_privilege_escalation, L2]

- key: Docker copy vulnerability leads to container escape(CVE-2019-14271)
  hid: priv_21
  condition: >
    evt.type in (unlinkat, rename) and evt.args contains "libnss_" and evt.args contains ".so" and
    container and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Docker copy vulnerability leads to container escape(CVE-2019-14271)"
      zh: "Docker-copy漏洞导致容器逃逸(CVE-2019-14271)"
    desc:
      en: "The Docker-copy vulnerability (CVE-2019-14271) is a container escape vulnerability. The core problem of the vulnerability lies in Docker's improper handling of file copy operations inside the container. An attacker can construct a malicious container and overwrite or modify key files on the host system through copy operations within the container, thereby escaping and affecting the host system. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "Docker-copy漏洞（CVE-2019-14271）是一种容器逃逸漏洞，漏洞的核心问题在于 Docker 在处理容器内部的文件复制操作时存在不当处理。攻击者可以构造恶意容器，在容器内通过复制操作覆盖或修改宿主系统上的关键文件，从而实现逃逸并影响宿主系统。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the command parameters contain libnss_, and contact the security personnel in time Further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令参数是否包含libnss_，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: CRITICAL
    urgency: true
    tags: [ATT&CK, docker, filesystem, mitre_privilege_escalation, L4]

