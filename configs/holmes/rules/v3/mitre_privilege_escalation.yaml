- key: Linux Privilege Escalation by modifying sensitive files with suid binaries
  hid: priv_17
  condition: >
    evt.type = write and sensitive_files and user.uid != 0 and container and not docker_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Linux Privilege Escalation by modifying sensitive files with suid binaries"
      zh: "尝试使用suid二进制修改敏感文件进行linux提权"
    desc:
      en: "SUID is a special permission bit. When an executable file has SUID permissions, it will have the permissions of the file owner when executed, not the permissions of the executor. Because this operation may cause security issues such as malicious changes to the system, information leakage, or privilege escalation. Normal users generally do not use SUID binaries to modify sensitive files. There is a high probability that the attacker will use this permission to modify files such as passwd and escalate privileges after carrying out the attack."
      zh: "SUID 是一种特殊的权限位，当一个可执行文件具有 SUID 权限时，它在执行时将拥有文件所有者的权限，而不是执行者的权限。因为这种操作可能会导致对系统的恶意更改、信息泄露或权限提升等安全问题。正常用户通常不会使用SUID二进制文件来修改敏感文件。大概率是攻击者在进行攻击后，利用该权限对passwd等文件进行修改提权。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the file descriptor contains /etc/passwd, etc. , promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否包含/etc/passwd等，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, filesystem, mitre_privilege_escalation, L4]

- key: Detect release_agent File Container Escapes
  hid: priv_18
  condition: >
    open_write and container and fd.name endswith release_agent and user.uid=0
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Detect release_agent File Container Escapes"
      zh: "尝试修改release_agent进行Linux_Cgroup容器逃逸"
    desc:
      en: "CVE-2022-0492 is a container escape vulnerability affecting the Linux kernel that can be abused by an attacker to gain control of the host system while running a privileged container. Normal users usually do not modify the release_agent file because this requires in-depth knowledge of the system kernel and container technology and is not a routine task. This operation is generally considered an unusual and potentially dangerous behavior. There is a high probability that the attacker triggers this vulnerability by modifying the release_agent attribute in the /proc/sys/kernel/panic file after performing the attack, thereby executing malicious code. And escape from the container to gain access to the host."
      zh: "CVE-2022-0492 是一个影响 Linux 内核的容器逃逸漏洞，攻击者可以在运行特权容器的情况下滥用该漏洞来获取对主机系统的控制权限。正常用户通常不会修改 release_agent 文件，因为这需要对系统内核和容器技术的深入了解，而且不是常规任务。此操作通常被认为是一种不寻常且潜在危险的行为，大概率是攻击者在进行攻击后，通过修改 /proc/sys/kernel/panic 文件中的 release_agent 属性来触发此漏洞，从而执行恶意代码并逃逸出容器，获取对主机的访问权限。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the file descriptor ends with release_agent, and contact us in time Security personnel further investigate"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否以release_agent结尾，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: CRITICAL
    urgency: true
    tags: [ATT&CK, users, kernel, filesystem, mitre_privilege_escalation, L4]

- key: Connect to docker.sock in container
  hid: priv_19
  condition: >
    evt.type = connect and evt.args contains "docker.sock" and container and not tensorsec_namespace and
    shell_parent_procs and
    (proc.cmdline contains "docker -H unix:" or proc.cmdline contains "docker --host unix:")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Connect to docker.sock in container"
      zh: "容器内与docker.sock通信"
    desc:
      en: "docker.sock is a UNIX socket file for the Docker daemon, used for local communication and management of Docker containers. Normal users generally do not need to communicate directly with docker.sock inside the container, as this is usually a task handled by container orchestration tools (such as Kubernetes) and Docker clients. Therefore, direct docker.sock communication within a container is considered unusual and potentially dangerous behavior. There is a high probability that after the attack, the attacker communicates with the Docker daemon by accessing the /var/run/docker.sock file inside the container. Once he obtains permission, he can perform various malicious operations, including modifying the container and creating a new container. Even run malicious commands on the host system."
      zh: "docker.sock 是 Docker 守护进程的 UNIX 套接字文件，用于与 Docker 容器进行本地通信和管理。正常用户通常不需要在容器内部直接与 docker.sock 通信，因为这通常是由容器编排工具（如 Kubernetes）和 Docker 客户端处理的任务。因此，容器内的直接 docker.sock 通信被视为不寻常且潜在危险的行为。大概率是攻击者在进行攻击后，在容器内部通过访问 /var/run/docker.sock 文件与 Docker 守护进程进行通信，一旦获得权限，可以执行各种恶意操作，包括修改容器、创建新容器，甚至在宿主系统上运行恶意命令。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains 'docker -H unix: ', promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含‘docker -H unix:’，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: CRITICAL
    urgency: true
    tags: [ATT&CK, users, docker, filesystem, mitre_privilege_escalation, L4]

- key: Try to read the k8s token and bypass RBAC
