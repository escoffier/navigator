# imagePullSecrets:
#   - name: vegeta-gitlab

nameOverride: "console"
fullnameOverride: "tensorsec-console"

restartPolicy: Always

service:
  type: ClusterIP
  port: 8889
  containerPort: 8080

replicaCount: 1

resources:
  requests:
    cpu: "200m"
    memory: "500Mi"
  limits:
    cpu: "200m"
    memory: "500Mi"

apiInstallLabel: "console.tensorsec/install"

scap:
  tag: test

elastic:
  host: tensorsec-elasticsearch-master
  port: 9200
  index: filebeat-*

audit:
  nameOverride: "audit"
  fullnameOverride: "tensorsec-audit"
  cronString: "0 4 * * *"
  mountPath: /audits
  image:
    name: tensorsec-audit
    tag: latest
    pullPolicy: Always
    pullSecret: harbor-admin-secret

auditCleanup:
  nameOverride: "audit-cleanup"
  fullnameOverride: "tensorsec-audit-cleanup"
  cronString: "0 4 * * *"
  image:
    name: tensorsec-audit-cleanup
    tag: latest
    pullPolicy: Always
    pullSecret: harbor-admin-secret

image:
  name: tensorsec-console
  # repository: localhost:32000
  tag: latest
  pullPolicy: Always
  pullSecret: harbor-admin-secret

mongo:
  mongoUsername: redstone
  mongoDatabase: vegeta
  mongoSecretName: tensorsec-mongodb # needs keey mongodb-password
  mongoDataPath: /bitnami/mongodb/data

redis:
  redisSecretName: tensorsec-redis
