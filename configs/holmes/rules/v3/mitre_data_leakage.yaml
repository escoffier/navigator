- key: Read sensitive file untrusted
  hid: exf_08
  condition: >
    (sensitive_files or proc.cmdline contains "/etc/passwd") and open_read and container
    and proc_name_exists
    and shell_parent_procs
    and not proc.name in (user_mgmt_binaries, userexec_binaries, package_mgmt_binaries,
     cron_binaries, read_sensitive_file_binaries, shell_binaries, hids_binaries,
     vpn_binaries, mail_config_binaries, nomachine_binaries, sshkit_script_binaries,
     in.proftpd, mandb, salt-minion, postgres_mgmt_binaries,
     google_oslogin_
     )
    and not cmp_cp_by_passwd
    and not ansible_running_python
    and not proc.cmdline contains /usr/bin/mandb
    and not run_by_qualys
    and not run_by_chef
    and not run_by_google_accounts_daemon
    and not user_read_sensitive_file_conditions
    and not perl_running_plesk
    and not perl_running_updmap
    and not veritas_driver_script
    and not perl_running_centrifydc
    and not runuser_reading_pam
    and not linux_bench_reading_etc_shadow
    and not user_known_read_sensitive_files_activities
    and not user_read_sensitive_file_containers
    and not runc_writing_passwd
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,program=%proc.name,file=%fd.name,parent=%proc.pname,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Read sensitive file untrusted"
      zh: "未受信任的程序试图读取敏感文件"
    desc:
      en: "Generally, we believe that normal users will not use untrusted programs to perform this type of behavior (such as reading /etc/passwd). There is a high probability that the attacker will use untrusted programs to try to read files containing user, Files of sensitive data such as passwords, authentication information, etc. This situation can lead to information leakage, identity theft, and other malicious behavior. Exceptions are made for known trusted programs."
      zh: "通常我们认为正常用户不会使用未受信任的程序进行该类行为(如：读取/etc/passwd)，大概率是攻击者在进行攻击后，使用未受信任的程序试图读取包含用户、密码、身份验证信息等敏感数据的文件。这种情况可能会导致信息泄露、身份盗窃和其他恶意行为。对于已知的受信任程序除外。"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process and whether it is executed by malware. You can use the immune defense training application to restrict the user rights of sensitive files and commands and prohibit the mounting of sensitive directories and files."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，可使用免疫防御训练应用，限制敏感文件和命令的用户权限，禁止挂载敏感目录和文件。"
    rule_type: Exfiltration
    priority: WARNING
    urgency: true
    tags: [ATT&CK, filesystem, mitre_data_leakage, L1]

- key: Read Shell Configuration File
  hid: exf_09
  condition: >
    open_read and
    shell_parent_procs and
    (fd.filename in (shell_config_filenames) or
    fd.name in (shell_config_files) or
    fd.directory in (shell_config_directories)) and
    not proc.name in (shell_binaries) and
    not fd.name contains "history"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Read Shell Configuration File"
      zh: "非shell程序读取shell配置文件"
    desc:
      en: "Non-shell programs usually refer to applications that are not command line shells, such as web applications, code libraries or modules, databases, etc. Reading the user's shell configuration file in a non-shell program may be an attacker reading the shell configuration file through a command execution vulnerability to obtain some sensitive information, such as environment variables, credentials, keys, etc. This may lead to further attacks or abuse."
      zh: "非shell程序通常指的是不是命令行 Shell 的应用程序如：Web 应用程序、代码库或模块、数据库等。在非shell程序中读取用户的shell配置文件，可能是攻击者通过如命令执行漏洞读取shell配置文件获取一些敏感信息，例如环境变量、凭证、密钥等。这可能导致进一步的攻击或滥用。"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of known processes and whether it is executed by malware, otherwise you can use offset defense to restrict its execution."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，否则可使用偏移防御限制其执行。"
    rule_type: Exfiltration
    priority: WARNING
    urgency: true
    tags: [ATT&CK, file, shell, mitre_data_leakage, L1]