apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "seccompGenerator.fullname" . }}
  labels:
{{ include "seccompGenerator.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "seccompGenerator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "seccompGenerator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ template "seccompGenerator.serviceAccount" . }}-service-account
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.global.ourDockerRepo }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
{{ toYaml .Values.resources | indent 10 }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      ports:
        - containerPort: {{ .Values.service.containerPort }}
          name: {{ include "seccompGenerator.name" . }}
