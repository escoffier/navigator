- key: Write below monitored dir
  hid: pers_11
  condition: >
    evt.dir = < and open_write and monitored_dir
    and shell_family_procs
    and not package_mgmt_procs
    and not coreos_write_ssh_dir
    and not exe_running_docker_save
    and not python_running_get_pip
    and not python_running_ms_oms
    and not google_accounts_daemon_writing_ssh
    and not cloud_init_writing_ssh
    and not user_known_write_monitored_dir_conditions
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,parent=%proc.pname,gparent=%proc.aname[2],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Write below monitored dir"
      zh: "尝试修改受监控的目录下的文件"
    desc:
      en: "Write below monitored dir"
      zh: "尝试修改受监控的目录下的文件"
    suggestion:
      en: "Please use the process tree to determine whether the command belongs to the normal behavior of known processes, whether it is executed by malware, confirm whether the modification is operated by operation and maintenance personnel, and check whether the file content is safe."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该修改是否为运维人员操作，排查文件内容是否安全。"
    rule_type: Persistence
    priority: ERROR
    urgency: true
    tags: [ATT&CK, filesystem, mitre_persistence, L1]

