apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dockerregistry" (include "common.names.fullname" .) }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: dockerregistry
data:
  config.yml: |-
{{ toYaml .Values.dockerregistry.configData | indent 4 }}