global:
  # Not sure if it's good practice to pas our docker repo address to our subcharts like this.
  ourDockerRepo: 192.168.1.203:5000 

clair:
  enabled: true
  config:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"
  
scanner:
  enabled: true
  # TODO: reference below variables from the original setting (maybe Helm enables it?) 
  redis:
    password: Redis12345
    redisSecretName: redis-secret
  clair:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"

console:
  # TODO: reference below variables from the original setting (maybe Helm enables it?) 
  elasticsearch:
    elasticSecretName: elastic-secret
    extraEnvs:
      - name: ELASTIC_PASSWORD
        value: Elastic12345
      - name: ELASTIC_USERNAME
        value: elasticsearch
  enabled: true

daemon:
  enabled: true

redis:
  enabled: true
  password: Redis12345
  usePassword: true
  cluster:
    slaveCount: 1
  master:
    disableCommands: []

elasticsearch:
  enabled: true
  minimumMasterNodes: 1
  replicas: 1
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: Elastic12345
    - name: ELASTIC_USERNAME
      value: elasticsearch

postgresql:
  # Note for maintainers:
  # Some confusion may appear here because we use docker image created from "official" dockerhub base image postgresql 
  # but we use helm chart designed for bitnami/postgresql.
  enabled: true
  image:
    repository: arminc/clair-db # Custom image with prefilled vulnerabilities info
    tag: "2020-10-29" # Use specific tag for now until we fix TEN-31
  # Use the same PGDATA as the travis job that builds arminc/clair-db
  # (https://github.com/arminc/clair-local-scan/blob/master/.travis.yml)
  postgresqlDataDir: /var/lib/postgresql/clair
  postgresqlUsername: postgres
  postgresqlPassword: password
  postgresqlDatabase: postgres
  # Based on https://github.com/timescale/timescaledb/issues/522#issuecomment-437162196
  # Otherwise we get CrashLoopBackoff: chmod: /var/lib/postgresql/clair: Operation not permitted
  securityContext:
    enabled: true
    fsGroup: 70
    runAsUser: 70

  replication:
    enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
  persistence:
    enabled: true
    size: 10Gi
  metrics:
    enabled: false

mongodb:
  enabled: true
  image:
    tag: 4.2.0-debian-9-r37
  mongodbUsername: redstone
  mongodbPassword: redstoneMongo123
  mongodbRootPassword: redstoneMongo123
  mongodbDatabase: vegeta

  # https://github.com/helm/charts/issues/18588
  useStatefulSet: true
  replicaSet:
    enabled: true 

  # mongodbDatabase: elasticalert
  # NOTE: we need to create elasticalert database as well.
  volumePermissions:
    enabled: true
