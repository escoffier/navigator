global:
  image:
    registry: harbor.local.tensorsecurity.cn
    #persistence enabled config
    #storageClass: 
  verison: &tensorsecVerison 1.6.8
  persistence:
    enabled: &persistenceStorage true
  harbor:
    url: &harborURL https://harbor.local.tensorsecurity.cn
    username: &harborUsername admin
    password: &harborPassword Harbor12345
    type: &harborType harbor-v2.0





console:
  image:
    tag: *tensorsecVerison
  scap:
    tag: *tensorsecVerison
  persistence:
    #enabled: false
    enabled: *persistenceStorage
    tensorsecCleaner:
      image:
        tag: *tensorsecVerison
  harbor:
    harborURL: *harborURL
    harborUsername: *harborUsername
    harborPassword: *harborPassword
  email:
    enabled: false

scanner:
  image:
    tag: *tensorsecVerison
  harbor:
    harborURL: *harborURL
    harborUsername: *harborUsername
    harborPassword: *harborPassword
  dockerregistry:
    persistence:
      enabled: *persistenceStorage
      size: 10Gi
    secrets:
      # If you update the username or password of registry, make sure use cli tool htpasswd to generate the bcrypt hash
      # e.g. "htpasswd -nbBC10 $username $password"
      # Default: tensorse:TensorSec@Passw0rd
      htpasswd: "tensorsec:$2y$10$zYHR.AGhdeKnjpxIKU3.3.XH9MeEUdmSJZil9MUWlqB8b2Q3th7PK"
    service:
      type: ClusterIP
      # clusterIP:
      port: 5000
      # nodePort:
#  hostAliases:
#  - ip: "192.168.3.2"
#    hostnames:
#    - "harbor.local.tensorsecurity.cn"
  # scanner registry config
  # 
  config:
    registry:
      scanner:
      # -
      #   registry:
      #      type: harbor-v2.0
      #      options:
      #        url: https://my.harbor.com
      #        username: myusername
      #        password: mypassword
      #        skiptlsverify: true
      #        paginationkey:
      #        usetype: 1
      # -
      #   registry:
      #      type: registry-v2
      #      options:
      #        url: https://my.registry.com
      #        username: myusername
      #        password: mypassword
      #        skiptlsverify: true
      #        paginationkey:
      #        usetype: 1
      # This part used "usetype: 2" is the default configs for internel docker-registry
        -
          registry:
            type: registry-v2
            options:
              # Service FQDN of docker-registry service.
              url: http://tensorsec-scanner-dockerregistry:5000
              # Username & password must be consistent with ".Values.scanner.dockerregistry.secrets.htpasswd".
              username: tensorsec
              password: TensorSec@Passw0rd
              skiptlsverify: true
              paginationkey:
              # Value "1" is for internel docker-registry, and "2" is for customer's external harbor or registry.
              usetype: 2
        -
          registry:
            type: *harborType
            options:
              url: *harborURL
              username: *harborUsername
              password: *harborPassword
              skiptlsverify: true
              paginationkey:
              usetype: 1

drift-prevention:
  image:
    tag: *tensorsecVerison

holmes:
  image:
    tag: *tensorsecVerison
  tensorsecDaemon:
    image:
      tag: *tensorsecVerison

image-validator:
  image:
    #tag: 1.6.8
    tag: *tensorsecVerison

redis:
  master:
    persistence:
      enabled: *persistenceStorage
  slave:
    persistence:
      enabled: *persistenceStorage
postgresql:
  persistence:
    enabled: *persistenceStorage
mongodb:
  persistence:
    enabled: *persistenceStorage
elasticsearch:
  persistence:
    enabled: *persistenceStorage

