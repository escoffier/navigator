- key: Container ports are scanned
  hid: exec_33
  condition: >
    container and inbound and fd.sport in (vulnerable_ports) and not tensorsec_namespace and k8s.pod.name contains "dvwa" 
  output: >
    connection=%fd.name,file=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Container ports are scanned"
      zh: "容器端口被扫描"
    desc:
      en: "There is a high probability that attackers use port scanning tools (such as nmap) to conduct reconnaissance and scan the target network, trying to discover vulnerabilities, exposed services or weaknesses in the network in order to prepare for subsequent attacks."
      zh: "大概率是攻击者使用端口扫描工具(如：nmap)进行侦察和扫描目标网络，尝试发现网络中的漏洞、暴露的服务或弱点，以便为后续攻击做准备。"
    suggestion:
      en: "Check whether the open port of k8s Service is a high-risk port and whether the port service has security risks"
      zh: "查看 k8s Service开放端口是否为高危险端口、端口服务是否有安全风险"
    rule_type: Discovery
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, mitre_execution, L1]

