    connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport)
  priority: ALERT
  tags: [ATT&CK, network, process, mitre_execution]

- rule: Reverse shell through awk
  hid: exec_07
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container is intruded, it is necessary to isolate the container, investigate other attacks, and confirm the security of the cluster."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，需隔离该容器，同时排查其他攻击行为，确认集群安全。"
  desc: awk Program runs inside container that allows remote code execution(Risk of Reverse Shell exploit)
