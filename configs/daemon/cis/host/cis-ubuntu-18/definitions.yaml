  - id: 3.5
    test: "Firewall Configuration"
    checks:
      - id: 3.5.1.1
        text: "Ensure ufw is installed"
        audit: "dpkg -s ufw | grep 'Status: install'"
        tests:
          test_items:
            - flag: "Status: install ok installed"
        type: ""
        scored: true

      - id: 3.5.1.2
        text: "Ensure iptables-persistent is not installed with ufw"
        audit: "dpkg-query -s iptables-persistent"
        tests:
          test_items:
            - flag: "package 'iptables-persistent' is not installed and no information is available"
        type: ""
        scored: true

      - id: 3.5.1.3
        text: "Ensure ufw service is enabled"
        audit: |
          systemctl is-enabled ufw
          ufw status | grep Status
        tests:
          bin_op: and
          test_items:
            - flag: "enabled"
            - flag: "Status: active"
        type: ""
        scored: true

      - id: 3.5.1.4
        text: "Ensure ufw loopback traffic is configured"
        audit: "ufw status verbose"
        type: "manual"
        scored: false

      - id: 3.5.1.5
        text: "Ensure ufw outbound connections are configured"
        audit: "ufw status numbered"
        type: "manual"
        scored: false

      - id: 3.5.1.6
        text: "Ensure ufw firewall rules exist for all open ports"
        audit: "ss -4tuln"
        type: "manual"
        scored: false

      - id: 3.5.1.7
        text: "Ensure ufw default deny firewall policy"
        audit: "ufw status verbose"
        type: "manual"
        scored: false

      - id: 3.5.2.1
        text: "Ensure nftables is installed"
        audit: "dpkg-query -s nftables | grep 'Status: install ok installed'"
        tests:
          test_items:
            - flag: "Status: install ok installed"
        type: ""
        scored: true

      - id: 3.5.2.2
        text: "Ensure ufw is uninstalled or disabled with nftables"
        audit: |
          dpkg-query -s ufw | grep 'Status: install ok installed'
          ufw status
        tests:
          bin_op: and
          test_items:
            - flag: "package 'ufw' is not installed and no information is available"
            - flag: "Status: inactive"
        type: ""
        scored: true

      - id: 3.5.2.3
        text: "Ensure iptables are flushed with nftables"
        audit: "iptables -L"
        type: "manual"
        scored: false

      - id: 3.5.2.4
        text: "Ensure an nftables table exists"
        audit: 'nft list tables'
        tests:
          test_items:
            - flag: "table"
        type: ""
        scored: true

      - id: 3.5.2.5
        text: "Ensure nftables base chains exist"
        audit: |
          nft list ruleset | grep 'hook input'
          nft list ruleset | grep 'hook forward'
          nft list ruleset | grep 'hook output'
        tests:
          bin_op: and
          test_items:
            - flag: "type filter hook input priority"
            - flag: "type filter hook forward priority"
            - flag: "type filter hook output priority"
        type: ""
        scored: true

      - id: 3.5.2.6
        text: "Ensure nftables loopback traffic is configured"
        audit: |
          nft list ruleset | awk '/hook input/,/}/' | grep 'iif "lo" accept'
          nft list ruleset | awk '/hook input/,/}/' | grep 'ip saddr'
        tests:
          bin_op: and
          test_items:
            - flag: 'iif "lo" accept'
            - flag: "ip saddr"
        type: ""
        scored: true

      - id: 3.5.2.7
        text: "Ensure nftables outbound and established connections are configured"
        audit: ""
        type: "manual"
        scored: true

      - id: 3.5.2.8
        text: "Ensure nftables default deny firewall policy"
        audit: |
          nft list ruleset | grep 'hook input'
          nft list ruleset | grep 'hook forward'
          nft list ruleset | grep 'hook output'
        tests:
          bin_op: and
          test_items:
            - flag: "type filter hook input priority 0; policy drop;"
            - flag: "type filter hook forward priority 0; policy drop;"
            - flag: "type filter hook output priority 0; policy drop;"
        type: ""
        scored: false

      - id: 3.5.2.9
        text: "Ensure nftables service is enabled"
        audit: "systemctl is-enabled nftables"
        tests:
          test_items:
            - flag: "enabled"
        type: ""
        scored: true

      - id: 3.5.2.10
        text: "Ensure nftables rules are permanent"
        audit: |
          [ -n "$(grep -E '^\s*include' /etc/nftables.conf)" ] && awk '/hook input/,/}/' $(awk '$1 ~ /^\s*include/ { gsub("\"","",$2);print $2 }' /etc/nftables.conf)
        type: "manual"
        scored: false

      - id: 3.5.3.1.1
        text: "Ensure iptables packages are installed"
        audit: "apt list iptables iptables-persistent | grep installed"
        tests:
          bin_op: and
          test_items:
            - flag: "iptables-persistent/"
            - flag: "iptables/"
        type: ""
        scored: true

      - id: 3.5.3.1.2
        text: "Ensure nftables is not installed with iptables"
        audit: "dpkg -s nftables"
        tests:
          test_items:
            - flag: "dpkg-query: package 'nftables' is not installed"
        type: ""
        scored: true

      - id: 3.5.3.1.3
        text: "Ensure ufw is uninstalled or disabled with iptables"
        audit: |
          dpkg-query -s ufw
          ufw status
          systemctl is-enabled ufw
        tests:
          bin_op: or
          test_items:
            - flag: "package 'ufw' is not installed and no information is available"
            - flag: "Status: inactive"
            - flag: "masked"
        type: ""
        scored: true

      - id: 3.5.3.2.1
        text: "Ensure iptables default deny firewall policy"
        audit: "iptables -L"
        tests:
          bin_op: and
          test_items:
            - flag: "Chain INPUT (policy DROP)"
            - flag: "Chain FORWARD (policy DROP)"
            - flag: "Chain OUTPUT (policy DROP)"
        type: ""
        scored: true

      - id: 3.5.3.2.2
        text: "Ensure iptables loopback traffic is configured"
        audit: "iptables -L INPUT -v -n"
        type: "manual"
        scored: false

      - id: 3.5.3.2.3
        text: "Ensure iptables outbound and established connections are configured"
        audit: 'iptables -L -v -n'
        type: "manual"
        scored: true

      - id: 3.5.3.2.4
        text: "Ensure iptables firewall rules exist for all open ports"
        audit: "ss -4tuln"
        type: "manual"
        scored: false

      - id: 3.5.3.3.1
        text: "Ensure ip6tables default deny firewall policy"
        audit: "ip6tables -L"
        tests:
          bin_op: and
          test_items:
            - flag: "Chain INPUT (policy DROP)"
            - flag: "Chain FORWARD (policy DROP)"
            - flag: "Chain OUTPUT (policy DROP)"
        type: ""
        scored: true

      - id: 3.5.3.3.2
        text: "Ensure ip6tables loopback traffic is configured"
        audit: "ip6tables -L INPUT -v -n"
        type: "manual"
        scored: true

      - id: 3.5.3.3.3
        text: "Ensure ip6tables outbound and established connections are configured"
        audit: "ip6tables -L -v -n"
        type: "manual"
        scored: true

      - id: 3.5.3.3.4
        text: "Ensure ip6tables firewall rules exist for all open ports"
        audit: "ss -6tuln"
        type: "manual"
        scored: true

  - id: 4.1
    text: "Configure System Accounting (auditd)"
    checks:
      - id: 4.1.1.1
        text: "Ensure auditd is installed"
        audit: "dpkg -s auditd audispd-plugins | grep -E '(Status:|not installed)'"
        tests:
          bin_op: and
          test_items:
            - flag: "Status: install ok installed"
            - flag: "dpkg-query: package 'auditd' is not installed and no information is available"
              set: false
            - flag: "dpkg-query: package 'audispd-plugins' is not installed and no information is available"
              set: false
        type: ""
        scored: true

      - id: 4.1.1.2
        text: "Ensure auditd service is enabled"
        audit: "systemctl is-enabled auditd"
        tests:
          test_items:
            - flag: "enabled"
        type: ""
        scored: true

      - id: 4.1.1.3
        text: "Ensure auditing for processes that start prior to auditd is enabled"
        audit: "grep \"^\\s*linux\" /boot/grub/grub.cfg | grep -v \"audit=1\""
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 4.1.1.4
        text: "Ensure audit_backlog_limit is sufficient"
        audit: "grep \"^\\s*linux\" /boot/grub/grub.cfg | grep -v \"audit_backlog_limit=\""
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 4.1.2.1
        text: "Ensure audit log storage size is configured"
        audit: "grep max_log_file /etc/audit/auditd.conf"
        tests:
          test_items:
            - flag: "max_log_file"
        type: ""
        scored: true

      - id: 4.1.2.2
        text: "Ensure audit logs are not automatically deleted"
        audit: "grep max_log_file_action /etc/audit/auditd.conf"
        tests:
          test_items:
            - flag: "max_log_file_action"
              compare:
                op: eq
                value: "keep_logs"
        type: ""
        scored: true

      - id: 4.1.2.3
        text: "Ensure system is disabled when audit logs are full"
        audit: |
          grep space_left_action /etc/audit/auditd.conf
          grep action_mail_acct /etc/audit/auditd.conf
          grep admin_space_left_action /etc/audit/auditd.conf
        tests:
          bin_op: and
          test_items:
            - flag: "space_left_action"
              compare:
                op: eq
                value: "email"
            - flag: "action_mail_acct"
              compare:
                op: eq
                value: "root"
            - flag: "admin_space_left_action"
              compare:
                op: eq
                value: "halt"
        type: ""
        scored: true

      - id: 4.1.3
        text: "Ensure events that modify date and time information are collected"
        audit: |
          grep time-change /etc/audit/rules.d/*.rules
          auditctl -l | grep time-change
        tests:
          bin_op: and
          test_items:
            - flag: "-a always,exit -F arch=b64 -S adjtimex -S settimeofday -k time-change"
            - flag: "-a always,exit -F arch=b32 -S adjtimex -S settimeofday -S stime -k time-change"
            - flag: "-a always,exit -F arch=b64 -S clock_settime -k time-change"
            - flag: "-a always,exit -F arch=b32 -S clock_settime -k time-change"
            - flag: "-w /etc/localtime -p wa -k time-change"
        type: ""
        scored: true

      - id: 4.1.4
        text: "Ensure events that modify user/group information are collected"
        audit: "grep identity /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-w /etc/group -p wa -k identity"
            - flag: "-w /etc/passwd -p wa -k identity"
            - flag: "-w /etc/gshadow -p wa -k identity"
            - flag: "-w /etc/shadow -p wa -k identity"
            - flag: "-w /etc/security/opasswd -p wa -k identity"
        type: ""
        scored: true

      - id: 4.1.5
        text: "Ensure events that modify the system's network environment are collected"
        audit: "grep system-locale /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale"
            - flag: "-a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale"
            - flag: "-w /etc/issue -p wa -k system-locale"
            - flag: "-w /etc/issue.net -p wa -k system-locale"
            - flag: "-w /etc/hosts -p wa -k system-locale"
            - flag: "-w /etc/sysconfig/network -p wa -k system-locale"
        type: ""
        scored: true

      - id: 4.1.6
        text: "Ensure events that modify the system's Mandatory Access Controls are collected"
        audit: "grep MAC-policy /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-w /etc/selinux/ -p wa -k MAC-policy"
            - flag: "-w /usr/share/selinux/ -p wa -k MAC-policy"
        type: ""
        scored: true

      - id: 4.1.7
        text: "Ensure login and logout events are collected"
        audit: "grep logins /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-w /var/log/faillog -p wa -k logins"
            - flag: "-w /var/log/lastlog -p wa -k logins"
            - flag: "-w /var/log/tallylog -p wa -k logins"
        type: ""
        scored: true

      - id: 4.1.8
        text: "Ensure session initiation information is collected"
        audit: "grep -E '(session|logins)' /etc/audit/rules.d/*.rules"
        tests:
          test_items:
            - flag: "-w /var/run/utmp -p wa -k session"
            - flag: "-w /var/log/wtmp -p wa -k logins"
            - flag: "-w /var/log/btmp -p wa -k logins"
        type: ""
        scored: true

      - id: 4.1.9
        text: "Ensure discretionary access control permission modification events are collected"
        audit: "grep perm_mod /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=500 -F auid!=4294967295 -k perm_mod"
            - flag: "-a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=500 -F auid!=4294967295 -k perm_mod"
            - flag: "-a always,exit -F arch=b64 -S chown -S fchown -S fchownat -S lchown -F auid>=500 -F auid!=4294967295 -k perm_mod"
            - flag: "-a always,exit -F arch=b32 -S chown -S fchown -S fchownat -S lchown -F auid>=500 -F auid!=4294967295 -k perm_mod"
            - flag: "-a always,exit -F arch=b64 -S setxattr -S lsetxattr -S fsetxattr -S removexattr -S lremovexattr -S fremovexattr -F auid>=500 -F auid!=4294967295 -k perm_mod"
            - flag: "-a always,exit -F arch=b32 -S setxattr -S lsetxattr -S fsetxattr -S removexattr -S lremovexattr -S fremovexattr -F auid>=500 -F auid!=4294967295 -k perm_mod"
        type: ""
        scored: true

      - id: 4.1.10
        text: "Ensure unsuccessful unauthorized file access attempts are collected"
        audit: "grep access /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-a always,exit -F arch=b64 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EACCES -F auid>=500 -F auid!=4294967295 -k access"
            - flag: "-a always,exit -F arch=b32 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EACCES -F auid>=500 -F auid!=4294967295 -k access"
            - flag: "-a always,exit -F arch=b64 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EPERM -F auid>=500 -F auid!=4294967295 -k access"
            - flag: "-a always,exit -F arch=b32 -S creat -S open -S openat -S truncate -S ftruncate -F exit=-EPERM -F auid>=500 -F auid!=4294967295 -k access"
        type: ""
        scored: true

      - id: 4.1.11
        text: "Ensure use of privileged commands is collected"
        audit: "find <partition> -xdev \\( -perm -4000 -o -perm -2000 \\) -type f | awk '{print \"-a always,exit -F path=\" $1 \" -F perm=x -F auid>='\"$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\"' -F auid!=4294967295 \ -k privileged\" }' "
        type: "manual"
        scored: false

      - id: 4.1.12
        text: "Ensure successful file system mounts are collected"
        audit: "grep mounts /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-a always,exit -F arch=b64 -S mount -F auid>=500 -F auid!=4294967295 -k mounts"
            - flag: "-a always,exit -F arch=b32 -S mount -F auid>=500 -F auid!=4294967295 -k mounts"
        type: ""
        scored: true

      - id: 4.1.13
        text: "Ensure file deletion events by users are collected"
        audit: "grep delete /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=500 -F auid!=4294967295 -k delete"
            - flag: "-a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=500 -F auid!=4294967295 -k delete"
        type: ""
        scored: true

      - id: 4.1.14
        text: "Ensure changes to system administration scope (sudoers) is collected"
        audit: "grep scope /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-w /etc/sudoers -p wa -k scope"
            - flag: "-w /etc/sudoers.d/ -p wa -k scope"
        type: ""
        scored: true

      - id: 4.1.15
        text: "Ensure system administrator command executions (sudo) are collected"
        audit: "grep actions /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-a exit,always -F arch=b64 -C euid!=uid -F euid=0 -Fauid>=1000 -F auid!=4294967295 -S execve -k action"
            - flag: "-a exit,always -F arch=b32 -C euid!=uid -F euid=0 -Fauid>=1000 -F auid!=4294967295 -S execve -k actions"
        type: ""
        scored: true

      - id: 4.1.16
        text: "Ensure kernel module loading and unloading is collected"
        audit: "grep modules /etc/audit/rules.d/*.rules"
        tests:
          bin_op: and
          test_items:
            - flag: "-w /sbin/insmod -p x -k modules"
            - flag: "-w /sbin/rmmod -p x -k modules"
            - flag: "-w /sbin/modprobe -p x -k modules"
            - flag: "-a always,exit -F arch=b64 -S init_module -S delete_module -k modules"
        type: ""
        scored: true

      - id: 4.1.17
        text: "Ensure the audit configuration is immutable"
        audit: "grep \"^\\s*[^#]\" /etc/audit/rules.d/*.rules | tail -1"
        tests:
          test_items:
            - flag: "-e 2"
        type: ""
        scored: true

  - id: 4.2
    text: "Configure Logging"
    checks:
      - id: 4.2.1.1
        text: "Ensure rsyslog is installed"
        audit: "dpkg-query -s rsyslog | grep 'Status: install ok installed'"
        tests:
          test_items:
            - flag: "Status: install ok installed"
        type: ""
        scored: true

      - id: 4.2.1.2
        text: "Ensure rsyslog Service is enabled and running"
        audit: "systemctl is-enabled rsyslog"
        tests:
          test_items:
            - flag: "enabled"
        type: ""
        scored: true

      - id: 4.2.1.3
        text: "Ensure logging is configured"
        audit: "ls -l /var/log/"
        type: "manual"
        scored: true

      - id: 4.2.1.4
        text: "Ensure rsyslog default file permissions configured"
        audit: "grep ^\\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
        tests:
          test_items:
            - flag: "FileCreateMode"
              compare:
                op: bitmask
                value: "0640"
        type: ""
        scored: true

      - id: 4.2.1.5
        text: "Ensure rsyslog is configured to send logs to a remote log host"
        audit: "grep -E '^\\s*([^#]+\\s+)?action\\(([^#]+\\s+)?\\btarget=\"?[^#\"]+\\\"?\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf"
        type: "manual"
        scored: false

      - id: 4.2.1.6
        text: "Ensure remote rsyslog messages are only accepted on designated log hosts"
        audit: ""
        type: "manual"
        scored: false

      - id: 4.2.2.1
        text: "Ensure journald is configured to send logs to rsyslog"
        audit: "grep -E ^\\s*ForwardToSyslog /etc/systemd/journald.conf"
        tests:
          test_items:
            - flag: "ForwardToSyslog=yes"
        type: ""
        scored: false

      - id: 4.2.2.2
        text: "Ensure journald is configured to compress large log files"
        audit: "grep -E ^\\s*Compress /etc/systemd/journald.conf"
        tests:
          test_items:
            - flag: "Compress=yes"
        type: ""
        scored: false

      - id: 4.2.2.3
        text: "Ensure journald is configured to write logfiles to persistent disk"
        audit: "grep -E ^\\s*Storage /etc/systemd/journald.conf"
        tests:
          test_items:
            - flag: "Storage=persistent"
        type: ""
        scored: false

      - id: 4.2.3
        text: "Ensure permissions on all logfiles are configured"
        audit: "find /var/log -type f -perm /g+wx,o+rwx -exec ls -l {} \\;"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

  - id: 4.3
    text: ""
    checks:
      - id: 4.3
        text: "Ensure logrotate is configured"
        audit: "cat /etc/logrotate.conf; cat /etc/logrotate.d/* ;"
        type: "manual"
        scored: true

  - id: 4.4
    text: ""
    checks:
      - id: 4.4
        text: "Ensure logrotate assigns appropriate permissions"
        audit: "grep -Es \"^\\s*create\\s+\\S+\" /etc/logrotate.conf /etc/logrotate.d/* | grep - E -v \"\\s(0)?[0-6][04]0\\s\""
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

  - id: 5.1
    text: "Configure time-based job schedulers"
    checks:
      - id: 5.1.1
        text: "Ensure cron daemon is enabled and running"
        audit: "systemctl is-enabled cron"
        tests:
          test_items:
            - flag: "enabled"
        type: ""
        scored: true

      - id: 5.1.2
        text: "Ensure permissions on /etc/crontab are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/crontab"
        tests:
          test_items:
            - flag: "600/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.1.3
        text: "Ensure permissions on /etc/cron.hourly are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/cron.hourly"
        tests:
          test_items:
            - flag: "700/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.1.4
        text: "Ensure permissions on /etc/cron.daily are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/cron.daily"
        tests:
          test_items:
            - flag: "700/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.1.5
        text: "Ensure permissions on /etc/cron.weekly are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/cron.weekly"
        tests:
          test_items:
            - flag: "700/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.1.6
        text: "Ensure permissions on /etc/cron.monthly are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/cron.monthly"
        tests:
          test_items:
            - flag: "700/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.1.7
        text: "Ensure permissions on /etc/cron.d are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/cron.d"
        tests:
          test_items:
            - flag: "700/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.1.8
        text: "Ensure cron is restricted to authorized users"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/cron.deny"
        tests:
          test_items:
            - flag: "/etc/cron.deny"
              set: false
        type: ""
        scored: true

      - id: 5.1.9
        text: "Ensure at is restricted to authorized users"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/at.deny"
        tests:
          test_items:
            - flag: "/etc/at.deny"
              set: false
        type: ""
        scored: true

  - id: 5.2
    text: "Configure sudo"
    checks:
      - id: 5.2.1
        text: "Ensure sudo is installed"
        audit: |
          dpkg -s sudo | grep 'Status: install ok installed'
          dpkg -s sudo-ldap | grep 'Status: install ok installed'
        tests:
          test_items:
            - flag: "Status: install ok installed"
        type: ""
        scored: true

      - id: 5.2.2
        text: "Ensure sudo commands use pty"
        audit: "grep -Ei '^\\s*Defaults\\s+([^#]\\S+,\\s*)?use_pty\\b' /etc/sudoers /etc/sudoers.d/*"
        tests:
          test_items:
            - flag: "Defaults use_pty"
        type: ""
        scored: true

      - id: 5.2.3
        text: "Ensure sudo log file exists"
        audit: "grep -Ei '^\\s*Defaults\\s+([^#;]+,\\s*)?logfile\\s*=\\s*(\")?[^#;]+(\")?' /etc/sudoers /etc/sudoers.d/*"
        tests:
          test_items:
            - flag: "Defaults logfile="
        type: ""
        scored: true

  - id: 5.3
    text: "Configure SSH Server"
    checks:
      - id: 5.3.1
        text: "Ensure permissions on /etc/ssh/sshd_config are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/ssh/sshd_config"
        tests:
          test_items:
            - flag: "600/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 5.3.2
        text: "Ensure permissions on SSH private host key files are configured"
        audit: "find /etc/ssh -xdev -type f -name 'ssh_host_*_key' -exec stat -c \"%N permissions=%a Uid:%U/%u Gid:%G/%g\" {} \\;"
        use_multiple_values: true
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0 Gid:root/0"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "600"
        type: ""
        scored: true

      - id: 5.3.3
        text: "Ensure permissions on SSH public host key files are configured"
        audit: "find /etc/ssh -xdev -type f -name 'ssh_host_*_key.pub' -exec stat -c \"%N permissions=%a Uid:%U/%u Gid:%G/%g\" {} \\;"
        use_multiple_values: true
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0 Gid:root/0"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "600"
        type: ""
        scored: true

        references: [ ]
      - id: 5.3.4
        text: "Ensure SSH access is limited"
        audit: "sshd -T | grep -e allowusers -e allowgroups -e denyusers -e denygroups"
        tests:
          bin_op: and
          test_items:
            - flag: ""
              compare:
                op: regex
                value: "[aA]llow[uU]sers"
            - flag: ""
              compare:
                op: regex
                value: "[aA]llow[gG]roups"
            - flag: ""
              compare:
                op: regex
                value: "[dD]eny[uU]sers"
            - flag: ""
              compare:
                op: regex
                value: "[dD]eny[gG]roups"
        type: ""
        scored: true

      - id: 5.3.5
        text: "Ensure SSH LogLevel is appropriate"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep loglevel"
        tests:
          bin_op: or
          test_items:
            - flag: "loglevel VERBOSE"
            - flag: "loglevel INFO"
        type: ""
        scored: true

      - id: 5.3.6
        text: "Ensure SSH X11 forwarding is disabled"
        audit: "grep -Ei '^\\s*x11forwarding\\s+yes' /etc/ssh/sshd_config"
        tests:
          bin_op: or
          test_items:
            - flag: "X11Forwarding no"
            - flag: "x11forwarding no"
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.3.7
        text: "Ensure SSH MaxAuthTries is set to 4 or less"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep maxauthtries"
        tests:
          test_items:
            - flag: "maxauthtries"
              compare:
                op: lte
                value: "4"
        type: ""
        scored: true

      - id: 5.3.8
        text: "Ensure SSH IgnoreRhosts is enabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep ignorerhosts"
        tests:
          test_items:
            - flag: "ignorerhosts yes"
        type: ""
        scored: true

      - id: 5.3.9
        text: "Ensure SSH HostbasedAuthentication is disabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep hostbasedauthentication"
        tests:
          test_items:
            - flag: "hostbasedauthentication no"
        type: ""
        scored: true

      - id: 5.3.10
        text: "Ensure SSH root login is disabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep permitrootlogin"
        tests:
          test_items:
            - flag: "permitrootlogin no"
        type: ""
        scored: true

      - id: 5.3.11
        text: "Ensure SSH PermitEmptyPasswords is disabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep permitemptypasswords"
        tests:
          test_items:
            - flag: "permitemptypasswords no"
        type: ""
        scored: true

      - id: 5.3.12
        text: "Ensure SSH PermitUserEnvironment is disabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep permituserenvironment"
        tests:
          test_items:
            - flag: "permituserenvironment no"
        type: ""
        scored: true

      - id: 5.3.13
        text: "Ensure only strong Ciphers are used"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -Ei '^\\s*ciphers\\s+([^#]+,)?(3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|arcfour|arcfour128|arcfour256|blowfish- cbc|cast128-cbc|rijndael-cbc@lysator.liu.se)\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.3.14
        text: "Ensure only strong MAC algorithms are used"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -Ei '^\\s*macs\\s+([^#]+,)?(hmac- md5|hmac-md5-96|hmac-ripemd160|hmac-sha1|hmac-sha1-96|umac-64@openssh\\.com|hmac-md5-etm@openssh\\.com|hmac-md5-96-etm@openssh\\.com|hmac- ripemd160-etm@openssh\\.com|hmac-sha1-etm@openssh\\.com|hmac-sha1-96-etm@openssh\\.com|umac-64-etm@openssh\\.com|umac-128-etm@openssh\\.com)\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.3.15
        text: "Ensure only strong Key Exchange algorithms are used"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -Ei '^\\s*kexalgorithms\\s+([^#]+,)?(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.3.16
        text: "Ensure SSH Idle Timeout Interval is configured"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep clientaliveinterval"
        tests:
          bin_op: and
          test_items:
            - flag: "clientaliveinterval"
              compare:
                op: lte
                value: "900"
            - flag: "clientaliveinterval"
              compare:
                op: gte
                value: "1"
        type: ""
        scored: true

      - id: 5.3.17
        text: "Ensure SSH LoginGraceTime is set to one minute or less"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep logingracetime"
        tests:
          bin_op: and
          test_items:
            - flag: "logingracetime"
              compare:
                op: lte
                value: "60"
            - flag: "logingracetime"
              compare:
                op: gte
                value: "1"
        type: ""
        scored: true

      - id: 5.3.18
        text: "Ensure SSH warning banner is configured"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep banner"
        tests:
          test_items:
            - flag: "banner /etc/issue.net"
        type: ""
        scored: true

      - id: 5.3.19
        text: "Ensure SSH PAM is enabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -i usepam"
        tests:
          test_items:
            - flag: "usepam yes"
        type: ""
        scored: true

      - id: 5.3.20
        text: "Ensure SSH AllowTcpForwarding is disabled"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -i allowtcpforwarding"
        tests:
          test_items:
            - flag: "allowtcpforwarding no"
        type: ""
        scored: true

      - id: 5.3.21
        text: "Ensure SSH MaxStartups is configured"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -i maxstartups"
        tests:
          test_items:
            - flag: "maxstartups 10:30:60"
        type: ""
        scored: true

      - id: 5.3.22
        text: "Ensure SSH MaxSessions is limited"
        audit: "sshd -T -C user=root -C host=\"$(hostname)\" -C addr=\"$(grep $(hostname) /etc/hosts | awk '{print $1}')\" | grep -i maxsessions"
        tests:
          test_items:
            - flag: "maxsessions 10"
        type: ""
        scored: true

  - id: 5.4
    text: "Configure PAM"
    checks:
      - id: 5.4.1
        text: "Ensure password creation requirements are configured"
        audit: "grep '^\\s*minlen\\s*' /etc/security/pwquality.conf; grep -E '^\\s*[duol]credit\\s*' /etc/security/pwquality.conf"
        tests:
          bin_op: and
          test_items:
            - flag: "minlen"
              compare:
                op: gte
                value: "14"
            - flag: "dcredit"
              compare:
                op: eq
                value: "-1"
            - flag: "ucredit"
              compare:
                op: eq
                value: "-1"
            - flag: "ocredit"
              compare:
                op: eq
                value: "-1"
            - flag: "lcredit"
              compare:
                op: eq
                value: "-1"
        type: ""
        scored: true

      - id: 5.4.2
        text: "Ensure lockout for failed password attempts is configured"
        audit: "grep \"pam_tally2\" /etc/pam.d/common-auth"
        tests:
          test_items:
            - flag: "auth required pam_tally2.so onerr=fail audit silent deny=5 unlock_time=900"
        scored: true

      - id: 5.4.3
        text: "Ensure password reuse is limited"
        audit: "grep -P '^\\s*password\\s+(sufficient|requisite|required)\\s+pam_unix\\.so\\s+([^#]+\\s+)*remember=([5-9]|[1-9][0-9]+)\\b' /etc/pam.d/system-auth /etc/pam.d/password-auth"
        tests:
          test_items:
            - flag: "remember=5"
        type: ""
        scored: true

      - id: 5.4.4
        text: "Ensure password hashing algorithm is SHA-512"
        audit: "grep -P '^\\h*password\\h+(sufficient|requisite|required)\\h+pam_unix\\.so\\h+([^#\\n\\r]+)?sha512(\\h+.*)?$' /etc/pam.d/system-auth /etc/pam.d/password-auth"
        tests:
          test_items:
            - flag: "sha512"
        type: ""
        scored: true

  - id: 5.5
    text: "User Accounts and Environment"
    checks:
      - id: 5.5.1.1
        text: "Ensure minimum days between password changes is configured"
        audit: "grep ^\\s*PASS_MIN_DAYS /etc/login.defs"
        tests:
          test_items:
            - flag: "PASS_MIN_DAYS"
              compare:
                op: gte
                value: "1"
        type: ""
        scored: true

      - id: 5.5.1.2
        text: "Ensure password expiration is 365 days or less"
        audit: "grep ^\\s*PASS_MAX_DAYS /etc/login.defs"
        tests:
          test_items:
            - flag: "PASS_MAX_DAYS"
              compare:
                op: lte
                value: "365"
        type: ""
        scored: true

      - id: 5.5.1.3
        text: "Ensure password expiration warning days is 7 or more"
        audit: "grep ^\\s*PASS_WARN_AGE /etc/login.defs"
        tests:
          test_items:
            - flag: "PASS_WARN_AGE"
              compare:
                op: gte
                value: "7"
        type: ""
        scored: true

      - id: 5.5.1.4
        text: "Ensure inactive password lock is 30 days or less"
        audit: "useradd -D | grep INACTIVE"
        tests:
          test_items:
            - flag: "INACTIVE"
              compare:
                op: lte
                value: "30"
        type: ""
        scored: true

      - id: 5.5.1.5
        text: "Ensure all users last password change date is in the past"
        audit: |
          awk -F : '/^[^:]+:[^!*]/{print $1}' /etc/shadow | while read -r usr; do [ "$(date --date="$(chage --list "$usr" | grep '^Last password change' | cut - d: -f2)" +%s)" -gt "$(date "+%s")" ] && echo "user: $usr password change date: $(chage --list "$usr" | grep '^Last password change' | cut -d: -f2)"; done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.5.2
        text: "Ensure system accounts are secured"
        audit: |
          awk -F: '$1!~/(root|sync|shutdown|halt|^\+)/ && $3<'"$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"' && $7!~/((\/usr)?\/sbin\/nologin)/ && $7!~/(\/bin)?\/false/ {print}' /etc/passwd
          awk -F: '($1!~/(root|^\+)/ && $3<'"$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"') {print $1}' /etc/passwd | xargs -I '{}' passwd -S '{}' | awk '($2!~/LK?/) {print $1}'
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.5.3
        text: "Ensure default group for the root account is GID 0"
        audit: "grep \"^root:\" /etc/passwd | cut -f4 -d:"
        tests:
          test_items:
            - flag: "0"
        type: ""
        scored: true

      - id: 5.5.4
        text: "Ensure default user umask is 027 or more restrictive"
        audit: ""
        type: "manual"
        scored: false

      - id: 5.5.5
        text: "Ensure default user shell timeout is 900 seconds or less"
        audit: ""
        type: "manual"
        scored: true

  - id: 5.6
    text: ""
    checks:
      - id: "5.6"
        text: "Ensure root login is restricted to system console"
        audit: "cat /etc/securetty"
        type: "manual"
        scored: true

  - id: 5.7
    text: ""
    checks:
      - id: "5.7"
        text: "Ensure access to the su command is restricted"
        audit: "grep -Pi '^\\h*auth\\h+(?:required|requisite)\\h+pam_wheel\\.so\\h+(?:[^#\\n\\r]+\\h+)?((?!\\2) (use_uid\\b|group=\\H+\\b))\\h+(?:[^#\\n\\r]+\\h+)?((?!\\1)(use_uid\\b|group=\\H+\\b))(\\h+.*)?$' /etc/pam.d/su"
        tests:
          test_items:
            - flag: "auth required pam_wheel.so use_uid group="
        type: ""
        scored: true

  - id: 6.1
    text: "System File Permissions"
    checks:
      - id: 6.1.1
        text: "Audit system file permissions"
        audit: "rpm -Va --nomtime --nosize --nomd5 --nolinkto > <filename> | grep -vw c"
        type: "manual"
        scored: false

      - id: 6.1.2
        text: "Ensure permissions on /etc/passwd are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/passwd"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 6.1.3
        text: "Ensure permissions on /etc/passwd- are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G/%g permissions=%a" /etc/passwd-'
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0 Gid:root/0"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "644"
        type: ""
        scored: true

      - id: 6.1.4
        text: "Ensure permissions on /etc/group are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G/%g permissions=%a" /etc/group'
        tests:
          test_items:
            - flag: "Uid:root/0 Gid:root/0 permissions=644"
        type: ""
        scored: true

      - id: 6.1.5
        text: "Ensure permissions on /etc/group- are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G/%g permissions=%a" /etc/group-'
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0 Gid:root/0"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "644"
        type: ""
        scored: true

      - id: 6.1.6
        text: "Ensure permissions on /etc/shadow are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G permissions=%a" /etc/shadow'
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0"
            - flag: "Gid:root/0"
              compare:
                op: regex
                value: "shadow|root"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "000"
        type: ""
        scored: true

      - id: 6.1.7
        text: "Ensure permissions on /etc/shadow- are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G permissions=%a" /etc/shadow-'
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0"
            - flag: "Gid"
              compare:
                op: regex
                value: "shadow|root"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "000"
        type: ""
        scored: true

      - id: 6.1.8
        text: "Ensure permissions on /etc/gshadow are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G permissions=%a" /etc/gshadow'
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0"
            - flag: "Gid"
              compare:
                op: regex
                value: "shadow|root"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "000"
        type: ""
        scored: true

      - id: 6.1.9
        text: "Ensure permissions on /etc/gshadow- are configured"
        audit: 'stat -c "Uid:%U/%u Gid:%G permissions=%a" /etc/gshadow-'
        tests:
          bin_op: and
          test_items:
            - flag: "Uid:root/0"
            - flag: "Gid"
              compare:
                op: regex
                value: "shadow|root"
            - flag: "permissions"
              compare:
                op: bitmask
                value: "000"
        type: ""
        scored: true

      - id: 6.1.10
        text: "Ensure no world writable files exist"
        audit: "df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -0002 | head -n 100"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.1.11
        text: "Ensure no unowned files or directories exist"
        audit: "df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser | head -n 100"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.1.12
        text: "Ensure no ungrouped files or directories exist"
        audit: "df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nogroup | head -n 100"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.1.13
        text: "Audit SUID executables"
        audit: ""
        type: "manual"
        scored: false

      - id: 6.1.14
        text: "Audit SGID executables"
        audit: "df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type f -perm -2000 | head -n 100"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: "manual"
        scored: true

  - id: 6.2
    text: "User and Group Settings"
    checks:
      - id: 6.2.1
        text: "Ensure accounts in /etc/passwd use shadowed passwords"
        audit: "awk -F: '($2 != \"x\" ) { print $1 \" is not set to shadowed passwords \"}' /etc/passwd"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.2
        text: "Ensure /etc/shadow password fields are not empty"
        audit: "awk -F: '($2 == \"\" ) { print $1 \" does not have a password \"}' /etc/shadow"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.3
        text: "Ensure all groups in /etc/passwd exist in /etc/group"
        audit: |
          #!/bin/bash
          for i in $(cut -s -d: -f4 /etc/passwd | sort -u ); do 
            grep -q -P "^.*?:[^:]*:$i:" /etc/group
            if [ $? -ne 0 ]; then
              echo "Group $i is referenced by /etc/passwd but does not exist in /etc/group"
            fi
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.4
        text: "Ensure all users' home directories exist"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(halt|sync|shutdown|nfsnobody)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) { print $1 " " $6 }' /etc/passwd | while read -r user dir; do
            if [ ! -d "$dir" ]; then
              echo "User: \"$user\" home directory: \"$dir\" does not exist."
            fi
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.5
        text: "Ensure users own their home directories"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(halt|sync|shutdown)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) { print $1 " " $6 }' | while read -r user dir; do
            if [ ! -d "$dir" ]; then
              echo "User: \"$user\" home directory: \"$dir\" does not exist."
            else
              owner=$(stat -L -c "%U" "$dir")
              if [ "$owner" != "$user" ]; then
                echo "User: \"$user\" home directory: \"$dir\" is owned by \"$owner\"" 
              fi
            fi 
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.6
        text: "Ensure users' home directories permissions are 750 or more restrictive"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(halt|sync|shutdown)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) {print $1 " " $6}' /etc/passwd | while read -r user dir; do
            if [ ! -d "$dir" ]; then
              echo "User: \"$user\" home directory: \"$dir\" doesn't exist"
            else
              dirperm=$(stat -L -c "%A" "$dir")
              if [ "$(echo "$dirperm" | cut -c6)" != "-" ] || [ "$(echo "$dirperm" | cut -c8)" != "-" ] || [ "$(echo "$dirperm" | cut -c9)" != "-" ] || [ "$(echo "$dirperm" | cut -c10)" != "-" ]; then
                echo "User: \"$user\" home directory: \"$dir\" has permissions: \"$(stat -L -c "%a" "$dir")\""
              fi
            fi
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.7
        text: "Ensure users' dot files are not group or world writable"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(halt|sync|shutdown|nfsnobody)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) { print $1 " " $6 }' /etc/passwd | while read -r user dir; do
             if [ -d "$dir" ]; then
                for file in "$dir"/.*; do
                  if [ ! -h "$file" ] && [ -f "$file" ]; then
                    fileperm=$(stat -L -c "%A" "$file")
                    if [ "$(echo "$fileperm" | cut -c6)" != "-" ] || [ "$(echo "$fileperm" | cut -c9)" != "-" ]; then
                      echo "User: \"$user\" file: \"$file\" has permissions:\"$fileperm\""
                    fi
                  fi 
                done
            fi 
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.8
        text: "Ensure no users have .netrc files"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(halt|sync|shutdown)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) { print $1 " " $6 }' /etc/passwd | while read -r user dir; do
            if [ -d "$dir" ]; then
              file="$dir/.netrc"
              if [ ! -h "$file" ] && [ -f "$file" ]; then
                if stat -L -c "%A" "$file" | cut -c4-10 | grep -Eq '[^-]+'; then echo "FAILED: User: \"$user\" file: \"$file\" exists with permissions: \"$(stat -L -c "%a" "$file")\", remove file or excessive permissions"
                else
                  echo "WARNING: User: \"$user\" file: \"$file\" exists with permissions: \"$(stat -L -c "%a" "$file")\", remove file unless required"
                fi
              fi
            fi
          done
        type: "manual"
        scored: true

      - id: 6.2.9
        text: "Ensure no users have .forward files"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(root|halt|sync|shutdown)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) { print $1 " " $6 }' /etc/passwd | while read -r user dir; do
            if [ -d "$dir" ]; then
              file="$dir/.forward"
              if [ ! -h "$file" ] && [ -f "$file" ]; then
                echo "User: \"$user\" file: \"$file\" exists"
              fi
            fi
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.10
        text: "Ensure no users have .rhosts files"
        audit: |
          #!/bin/bash
          awk -F: '($1!~/(root|halt|sync|shutdown|nfsnobody)/ && $7!~/^(\/usr)?\/sbin\/nologin(\/)?$/ && $7!~/(\/usr)?\/bin\/false(\/)?$/) { print $1 " " $6 }' /etc/passwd | while read -r user dir; do
            if [ -d "$dir" ]; then
              file="$dir/.rhosts"
              if [ ! -h "$file" ] && [ -f "$file" ]; then
                echo "User: \"$user\" file: \"$file\" exists" 
              fi
            fi 
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.11
        text: "Ensure root is the only UID 0 account"
        audit: "awk -F: '($3 == 0) { print $1 }' /etc/passwd"
        tests:
          test_items:
            - flag: "root"
        type: ""
        scored: true

      - id: 6.2.12
        text: "Ensure root PATH Integrity"
        audit: |
          #!/bin/bash
          RPCV="$(sudo -Hiu root env | grep '^PATH' | cut -d= -f2)"
          echo "$RPCV" | grep -q "::" && echo "root's path contains a empty directory (::)"
          echo "$RPCV" | grep -q ":$" && echo "root's path contains a trailing (:)"
          for x in $(echo "$RPCV" | tr ":" " "); do
            if [ -d "$x" ]; then
              ls -ldH "$x" | awk '$9 == "." {print "PATH contains current working directory (.)"} $3 != "root" {print $9, "is not owned by root"} substr($1,6,1) != "-" {print $9, "is group writable"} substr($1,9,1) != "-" {print $9, "is world writable"}'
             else
                echo "$x is not a directory"
            fi
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.13
        text: "Ensure no duplicate UIDs exist"
        audit: |
          #!/bin/bash
          cut -f3 -d":" /etc/passwd | sort -n | uniq -c | while read x ; do 
            [ -z "$x" ] && break
            set - $x
            if [ $1 -gt 1 ]; then
              users=$(awk -F: '($3 == n) { print $1 }' n=$2 /etc/passwd | xargs)
              echo "Duplicate UID ($2): $users"
            fi
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.14
        text: "Ensure no duplicate GIDs exist"
        audit: |
          #!/bin/bash
          cut -d: -f3 /etc/group | sort | uniq -d | while read x ; do 
            echo "Duplicate GID ($x) in /etc/group"
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.15
        text: "Ensure no duplicate user names exist"
        audit: |
          #!/bin/bash
          cut -d: -f1 /etc/passwd | sort | uniq -d | while read x; do 
            echo "Duplicate login name ${x} in /etc/passwd"
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 6.2.16
        text: "Ensure no duplicate group names exist"
        audit: |
          #!/bin/bash
          cut -d: -f1 /etc/group | sort | uniq -d | while read -r x; do 
            echo "Duplicate group name ${x} in /etc/group"
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true
