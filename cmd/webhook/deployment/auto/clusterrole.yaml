kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: tensorsec-webhook
rules:
  - apiGroups:
      - apps
      - extensions
    resources:
      - replicasets
    verbs:
      - get
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
    verbs:
      - get
      - update
