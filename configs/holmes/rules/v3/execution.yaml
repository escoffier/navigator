- key: Docker build vulnerability(CVE-2019-13139)
  hid: exec_08
  condition: >
    evt.type=execve and proc.name=docker and
    (proc.cmdline contains "build" and proc.cmdline contains "git@" and proc.cmdline contains "--upload-pack") and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,shell=%proc.name,parent=%proc.pname,terminal=%proc.tty,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Docker build vulnerability(CVE-2019-13139)"
      zh: "Docker构建漏洞导致代码执行(CVE-2019-13139)"
    desc:
      en: "Docker build vulnerability(CVE-2019-13139)."
      zh: "Docker构建漏洞导致代码执行(CVE-2019-13139)"
    suggestion:
      en: "Ensure your Docker engine is up to date and if possible avoid using remote context’s for builds, especially if supplied by third-parties."
      zh: "确保Docker版本是最新的,尽可能避免使用远程环境进行构建，特别是由第三方提供的。"
    rule_type: Execution
    priority: CRITICAL
    urgency: true
    tags: [ATT&CK, container, shell, mitre_execution]