- key: Write below etc
  disable: true
  hid: pers_15
  condition: >
    write_etc_common and not (tensorsec_namespace and k8s.pod.name contains "holmes") and shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Write below etc"
      zh: "尝试修改/etc路径下的文件"
    desc:
      en: "an attempt to write to any file below /etc"
      zh: "尝试修改/etc路径下的文件"
    suggestion:
      en: "Usually, few programs can operate on the contents of the /etc directory, which may be a hacker's behavior. Please confirm whether the modified files are at risk."
      zh: "通常很少有程序会操作/etc目录下内容，可能是黑客行为，请确认被修改文件是否存在风险。"
    rule_type: Persistence
    priority: WARNING
    urgency: true
    tags: [ATT&CK, filesystem, mitre_persistence, L2]
