---
controls:
version: "cis-ubuntu-18"
id: 0
text: ""
groups:
  - id: 1.1
    text: "Filesystem Configuration"
    checks:
      - id: 1.1.1.1
        text: "Ensure mounting of cramfs filesystems is disabled"
        audit: "modprobe -n -v cramfs"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.2
        text: "Ensure mounting of freevxfs filesystems is disabled"
        audit: "modprobe -n -v freevxfs | grep -E '(freevxfs|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.3
        text: "Ensure mounting of jffs2 filesystems is disabled"
        audit: "modprobe -n -v jffs2 | grep -E '(jffs2|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.4
        text: "Ensure mounting of hfs filesystems is disabled"
        audit: "modprobe -n -v hfs | grep -E '(hfs|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.5
        text: "Ensure mounting of hfsplus filesystems is disabled"
        audit: "modprobe -n -v hfsplus | grep -E '(hfsplus|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.6
        text: "Ensure mounting of udf filesystems is disabled"
        audit: "modprobe -n -v udf | grep -E '(udf|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.2
        text: "Ensure /tmp is configured"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+'"
        tests:
          bin_op: and
          test_items:
            - flag: "/tmp"
            - flag: "tmpfs"
        type: ""
        scored: true

      - id: 1.1.3
        text: "Ensure nodev option set on /tmp partition"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+' | grep -Ev '\\bnoexec\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.4
        text: "Ensure nosuid option set on /tmp partition"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+' | grep -Ev '\\bnodev\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.5
        text: "Ensure noexec option set on /tmp partition"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+' | grep -Ev '\\bnosuid\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.6
        text: "Ensure /dev/shm is configured"
        audit: |
          output1=$(grep -E '\s/dev/shm\s' /etc/fstab)
          if [ "$output1" = "" ]; then
              echo "FAILED"
          else
              output2=$(findmnt -n /dev/shm)
              echo $output1$output2
          fi
        use_multiple_values: true
        tests:
          bin_op: and
          test_items:
            - flag: "/dev/shm"
            - flag: "tmpfs"
        type: ""
        scored: true

      - id: 1.1.7
        text: "Ensure nodev option set on /dev/shm partition"
        audit: "findmnt -n /dev/shm | grep -Ev '\bnodev\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.8
        text: "Ensure nosuid option set on /dev/shm partition"
        audit: "findmnt -n /dev/shm | grep -Ev '\bnosuid\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.9
        text: "Ensure noexec option set on /dev/shm partition"
        audit: "findmnt -n /dev/shm | grep -Ev '\bnoexec\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.10
        text: "Ensure separate partition exists for /var"
        audit: "cat /proc/1/mounts | grep -E '\\s+/var\\s+'"
        tests:
          test_items:
            - flag: "/var"
        type: ""
        scored: true

      - id: 1.1.11
        text: "Ensure separate partition exists for /var/tmp"
        audit: "findmnt /var/tmp"
        tests:
          test_items:
            - flag: "/var/tmp"
        type: ""
        scored: true

      - id: 1.1.12
        text: "Ensure /var/tmp partition includes the nodev option"
        audit: "findmnt -n /var/tmp | grep -Ev '\bnodev\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.13
        text: "Ensure /var/tmp partition includes the nosuid option"
        audit: "findmnt -n /var/tmp | grep -Ev '\bnosuid\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.14
        text: "Ensure /var/tmp partition includes the noexec option"
        audit: "findmnt -n /var/tmp | grep -Ev '\bnoexec\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.15
        text: "Ensure separate partition exists for /var/log"
        audit: "findmnt /var/log"
        tests:
          test_items:
            - flag: "/var/log"
        type: ""
        scored: true

      - id: 1.1.16
        text: "Ensure separate partition exists for /var/log/audit"
        audit: "findmnt /var/log/audit"
        tests:
          test_items:
            - flag: "/var/log/audit"
        type: ""
        scored: true

      - id: 1.1.17
        text: "Ensure separate partition exists for /home"
        audit: "cat /proc/1/mounts | grep -E '\\s+/home\\s+'"
        tests:
          test_items:
            - flag: "/home"
        type: ""
        scored: true

      - id: 1.1.18
        text: "Ensure /home partition includes the nodev option"
        audit: "findmnt /home | grep -Ev '\bnodev\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.19
        text: "Ensure nodev option set on removable media partitions"
        audit: "mount"
        type: "manual"
        scored: false

      - id: 1.1.20
        text: "Ensure nosuid option set on removable media partitions"
        audit: "mount"
        type: "manual"
        scored: false

      - id: 1.1.21
        text: "Ensure noexec option set on removable media partitions"
        audit: "mount"
        type: "manual"
        scored: false

      - id: 1.1.22
        text: "Ensure sticky bit is set on all world-writable directories"
        audit: "df --local -P 2> /dev/null | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type d \\( -perm -0002 -a ! -perm -1000 \\) 2>/dev/null"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: "manual"
        scored: true

      - id: 1.1.23
        text: Disable Automounting
        audit: |
          systemctl is-enabled autofs 
          dpkg -s autofs
        tests:
          bin_op: or
          test_items:
            - flag: "disabled"
            - flag: "package `autofs` is not installed"
        type: ""
        scored: true

      - id: 1.1.24
        text: "Disable USB Storage"
        audit: "modprobe -n -v usb-storage"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: "install /bin/true"
        type: ""
        scored: true

  - id: 1.2
    text: "Configure Software Updates"
    checks:
      - id: 1.2.1
        text: "Ensure package manager repositories are configured"
        audit: "apt-cache policy"
        type: "manual"
        scored: false

      - id: 1.2.2
        text: "Ensure GPG keys are configured"
        audit: "apt-key list"
        type: "manual"
        scored: true

  - id: 1.3
    text: "Filesystem Integrity Checking"
    checks:
      - id: 1.3.1
        text: "Ensure AIDE is installed"
        audit: |
          dpkg -s aide | grep -E '(Status:|not installed)'
          dpkg -s aide-common'
        tests:
          bin_op: and
          test_items:
            - flag: "Status: install ok installed"
            - flag: "package `aide-common` is not installed"
              set: false
        type: ""
        scored: true

      - id: 1.3.2
        text: "Ensure filesystem integrity is regularly checked"
        audit: "grep -Ers '^([^#]+\\s+)?(\\/usr\\/s?bin\\/|^\\s*)aide(\\.wrapper)?\\s(--?\\S+\\s)*(- -(check|update)|\\$AIDEARGS)\\b' /etc/cron.* /etc/crontab /var/spool/cron/"
        tests:
          test_items:
            - flag: "aide --check"
        type: ""
        scored: true

  - id: 1.4
    text: "Secure Boot Settings"
    checks:
      - id: 1.4.1
        text: "Ensure permissions on bootloader config are not overridden"
        audit: "grep -E '^\\s*chmod\\s+[0-7][0-7][0-7]\\s+\\$\\{grub_cfg\\}\\.new' -A 1 -B1 /usr/sbin/grub-mkconfig"
        tests:
          test_items:
            - flag: |
                if [ "x${grub_cfg}" != "x" ]; then
                  chmod 400 ${grub_cfg}.new || true
                fi
        type: ""
        scored: true

      - id: 1.4.2
        text: "Ensure bootloader password is set"
        audit: |
          grep "^set superusers" /boot/grub/grub.cfg
          grep "^password" /boot/grub/grub.cfg
        tests:
          bin_op: and
          test_items:
            - flag: "set superusers="
            - flag: "password_pbkdf2"
        type: ""
        scored: true

      - id: 1.4.3
        text: "Ensure permissions on bootloader config are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /boot/grub/grub.cfg"
        tests:
          test_items:
            - flag: "400/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 1.4.4
        text: "Ensure authentication required for single user mode"
        audit: "grep -Eq '^root:\\$[0-9]' /etc/shadow || echo \"root is locked\""
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

  - id: 1.5
    text: "Additional Process Hardening"
    checks:
      - id: 1.5.1
        text: "Ensure XD/NX support is enabled"
        audit: "journalctl | grep 'protection: active'"
        tests:
          test_items:
            - flag: "kernel: NX (Execute Disable) protection: active"
        type: ""
        scored: false

      - id: 1.5.2
        text: "Ensure address space layout randomization (ASLR) is enabled"
        audit: "sysctl kernel.randomize_va_space"
        tests:
          test_items:
            - flag: "kernel.randomize_va_space"
              compare:
                op: eq
                value: "2"
        type: ""
        scored: true

      - id: 1.5.3
        text: "Ensure prelink is not installed"
        audit: "dpkg -s prelink | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'prelink' is not installed and no information is available"
        type: ""
        scored: true

      - id: 1.5.4
        text: "Ensure core dumps are restricted"
        audit: |
          grep -Es '^(\*|\s).*hard.*core.*(\s+#.*)?$' /etc/security/limits.conf /etc/security/limits.d/*
          sysctl fs.suid_dumpable
          grep "fs.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*
        tests:
          bin_op: and
          test_items:
            - flag: "hard core 0"
            - flag: "fs.suid_dumpable = 0"
        type: ""
        scored: true

  - id: 1.6
    text: "Mandatory Access Control"
    checks:
      - id: 1.6.1.1
        text: "Ensure AppArmor is installed"
        audit: "dpkg -s apparmor | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "Status: install ok installed"
        type: ""
        scored: false

      - id: 1.6.1.2
        text: "Ensure AppArmor is enabled in the bootloader configuration"
        audit: |
          grep "^\s*linux" /boot/grub/grub.cfg | grep -v "apparmor=1"
          grep "^\s*linux" /boot/grub/grub.cfg | grep -v "security=apparmor"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.6.1.3
        text: "Ensure all AppArmor Profiles are in enforce or complain mode"
        audit: |
          apparmor_status | grep profiles
          apparmor_status | grep processes
        type: "manual"
        scored: false

      - id: 1.6.1.4
        text: "Ensure all AppArmor Profiles are enforcing"
        audit: |
          apparmor_status | grep profiles
          apparmor_status | grep processes
        tests:
          test_items:
            - flag: "0 profiles are in complain mode"
        type: ""
        scored: false

  - id: 1.7
    text: "Command Line Warning Banners"
    checks:
      - id: 1.7.1
        text: "Ensure message of the day is configured properly"
        audit: "grep -E -i \"(\\\\v|\\\\r|\\\\m|\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"//g'))\" /etc/motd"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.7.2
        text: "Ensure permissions on /etc/issue.net are configured "
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/issue.net"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 1.7.3
        text: "Ensure permissions on /etc/issue are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/issue"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 1.7.4
        text: "Ensure permissions on /etc/motd are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/motd"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 1.7.5
        text: "Ensure remote login warning banner is configured properly"
        audit: "grep -E -i \"(\\\\v|\\\\r|\\\\m|\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"//g'))\" /etc/issue.net"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.7.6
        text: "Ensure local login warning banner is configured properly"
        audit: "grep -E -i \"(\\\\v|\\\\r|\\\\m|\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"//g'))\" /etc/issue"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

  - id: 1.8
    text: "GNOME Display Manager"
    checks:
      - id: 1.8.1
        text: "Ensure GNOME Display Manager is removed"
        audit: "dpkg -s gdm3 | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'gdm3' is not installed and no information is available"
        type: "skip"
        scored: true

      - id: 1.8.2
        text: "Ensure GDM login banner is configured"
        audit: "cat /etc/gdm3/greeter.dconf-defaults"
        type: "skip"
        scored: false

      - id: 1.8.3
        text: "Ensure last logged in user display is disabled"
        audit: "grep -E '^\\s*disable-user-list\\s*=\\s*true\\b'"
        tests:
          test_items:
            - flag: "disable-user-list=true"
        type: "skip"
        scored: true

      - id: 1.8.4
        text: "Ensure XDCMP is not enabled"
        audit: "grep -Eis '^\\s*Enable\\s*=\\s*true' /etc/gdm/custom.conf"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: "skip"
        scored: true

  - id: 1.9
    text: ""
    checks:
      - id: 1.9
        text: "Ensure updates, patches, and additional security software are installed"
        audit: "apt -s upgrade"
        type: "manual"
        scored: false

  - id: 2.1
    text: "Special Purpose Services"
    checks:
      - id: 2.1.1.1
        text: "Ensure time synchronization is in use"
        audit: "dpkg -s chrony ntp"
        tests:
          bin_op: and
          test_items:
            - flag: "dpkg-query: package 'chrony' is not installed and no information is available"
              set: false
            - flag: "dpkg-query: package 'ntp' is not installed and no information is available"
              set: false
        type: ""
        scored: true

      - id: 2.1.1.2
        text: "Ensure systemd-timesyncd is configured"
        audit: "dpkg -s chrony ntp"
        tests:
          bin_op: and
          test_items:
            - flag: "dpkg-query: package 'chrony' is not installed and no information is available"
              set: false
            - flag: "dpkg-query: package 'ntp' is not installed and no information is available"
              set: false
        type: "manual"
        scored: false

      - id: 2.1.1.3
        text: "Ensure chrony is configured"
        audit: |
          dpkg -s ntp | grep -E '(Status:|not installed)'
          systemctl is-enabled systemd-timesyncd
          grep -E "^(server|pool)" /etc/chrony/chrony.conf
          ps -ef | grep chronyd
        tests:
          bin_op: and
          test_items:
            - flag: "dpkg-query: package 'ntp' is not installed and no information is available"
            - flag: "masked"
            - flag: "server "
            - flag: "_chrony"
        type: ""
        scored: false

      - id: 2.1.1.4
        text: "Ensure ntp is configured"
        audit: |
          dpkg -s chrony | grep -E '(Status:|not installed)'
          systemctl is-enabled systemd-timesyncd
          grep "^restrict" /etc/ntp.conf
          grep -E "^(server|pool)" /etc/ntp.conf
          grep "RUNASUSER=ntp" /etc/init.d/ntp
        tests:
          bin_op: and
          test_items:
            - flag: "dpkg-query: package 'chrony' is not installed and no information is available"
            - flag: "masked"
            - flag: "restrict -4 default kod nomodify notrap nopeer noquery"
            - flag: "restrict -6 default kod nomodify notrap nopeer noquery"
            - flag: "server "
            - flag: "RUNASUSER=ntp"
        type: ""
        scored: false

      - id: 2.1.2
        text: "Ensure X Window System is not installed "
        audit: "dpkg -l xserver-xorg*"
        tests:
          test_items:
            - flag: "dpkg-query: no packages found matching xserver-xorg*"
        type: ""
        scored: true

      - id: 2.1.3
        text: "Ensure Avahi Server is not installed"
        audit: "dpkg -s avahi-daemon | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'avahi-daemon' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.4
        text: "Ensure CUPS is not installed"
        audit: "dpkg -s cups | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'cups' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.5
        text: "Ensure DHCP Server is not installed"
        audit: "dpkg -s isc-dhcp-server | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'isc-dhcp-server' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.6
        text: "Ensure LDAP server is not installed"
        audit: "dpkg -s slapd | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'slapd' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.7
        text: "Ensure NFS is not installed"
        audit: "dpkg -s nfs-kernel-server | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'nfs-kernel-server' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.8
        text: "Ensure DNS Server is not installed"
        audit: "dpkg -s bind9 | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'bind9' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.9
        text: "Ensure FTP Server is not installed"
        audit: "dpkg -s vsftpd | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'vsftpd' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.10
        text: "Ensure HTTP server is not installed"
        audit: "dpkg -s apache2 | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'apache2' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.11
        text: "Ensure IMAP and POP3 server is not installed"
        audit: "dpkg -s dovecot-imapd dovecot-pop3d | grep -E '(Status:|not installed)'"
        tests:
          bin_op: and
          test_items:
            - flag: "dpkg-query: package 'dovecot-imapd' is not installed and no information is available"
            - flag: "dpkg-query: package 'dovecot-pop3d' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.12
        text: "Ensure Samba is not installed"
        audit: "dpkg -s samba | grep -E '(Status:|not installed)'"
        tests:
          test_items:
            - flag: "dpkg-query: package 'samba' is not installed and no information is available"
        type: ""
        scored: true

      - id: 2.1.13
        text: "Ensure HTTP Proxy Server is not installed"
