  #       storage: 100M

kibana:
  enabled: true

drift-prevention:
  enabled: true
  eventcenter:
    addr: tensorsec-eventcenter
    port: "8080"

postgresql:
  # Note for maintainers:
  # Some confusion may appear here because we use docker image created from "official" dockerhub base image postgresql
  # but we use helm chart designed for bitnami/postgresql.
  enabled: true
  image:
    pullSecret: harbor-admin-secret
    registry: registry.t-appagile.com
    repository: tensorsecurity/tensorsec-postgres # Our image with prefilled vulnerabilities info
    tag: "latest"
    pullPolicy: Always
  # Use the same PGDATA as the travis job that builds arminc/clair-db
  # (https://github.com/arminc/clair-local-scan/blob/master/.travis.yml)
  postgresqlDataDir: /bitnami/postgresql/data 
  postgresqlUsername: postgres
  postgresqlPassword: password
  postgresqlDatabase: postgres
  # Based on https://github.com/timescale/timescaledb/issues/522#issuecomment-437162196
  # Otherwise we get CrashLoopBackoff: chmod: /var/lib/postgresql/clair: Operation not permitted
  securityContext:
    enabled: true
    fsGroup: 70
    runAsUser: 70

  replication:
    enabled: false
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
  persistence:
    enabled: true
    size: 10Gi
  metrics:
    enabled: false

mongodb:
  enabled: true
  image:
    tag: 4.4.2-debian-10-r12
  mongodbUsername: redstone
  mongodbPassword: redstoneMongo123
  mongodbRootPassword: redstoneMongo123
  mongodbDatabase: vegeta

  # https://github.com/helm/charts/issues/18588
  useStatefulSet: true
  replicaSet:
    enabled: true

  volumePermissions:
    enabled: true

seccompGenerator:
  auditdLogging: false
  enabled: false



holmes:
  enabled: true
  ebpf:
    enabled: false
  falco:
    rulesFile:
      - /etc/falco/falco_rules.local.yaml
    jsonOutput: true
    jsonIncludeOutputProperty: true
    httpOutput:
      enabled: false

    webserver:
      enabled: false
      
    programOutput:
      enabled: true
      keepAlive: false
      program: /bin/bash /holmes_export.sh

    syslogOutput:
      enabled: false

    stdoutOutput:
      enabled: true
  # Add extra volumes to Falco daemonset
  extraVolumes:
    - name: client-cert
      secret:
        secretName: eventcenter-tls-client-cert-secret
    - name: ca-cert
      secret:
        secretName: eventcenter-tls-ca-secret

  # Add extra volumeMounts to Falco container in Falco daemonset
  extraVolumeMounts:
    - mountPath: /auth/client
      name: client-cert
      readOnly: true
    - mountPath: /auth/ca
      name: ca-cert
      readOnly: true

