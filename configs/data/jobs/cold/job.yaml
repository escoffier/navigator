---
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorsec-cold-cleaner
spec:
  template:
    metadata:
      labels:
        app: cold-cleaner
    spec:
      containers:
        - name: cold-cleaner
          image: localhost:32000/tensorsec-cleaner:latest
          command: ["/app/tensor-cleaner", "clear-cold-storage-tool"]
          imagePullPolicy: Always
          env:
            - name: MONGO_USERNAME
              value: redstone
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tensorsec-mongodb
                  key: mongodb-password
            - name: MONGO_ENDPOINT
              value: tensorsec-mongodb:27017
            - name: MONGO_DATABASE
              value: vegeta
            - name: AUDIT_PATH
              value: /audit
          volumeMounts:
            - name: audit
              mountPath: /audit
          resources:
            requests:
              memory: "100Mi"
              cpu: "0.1"
            limits:
              memory: "100Mi"
              cpu: "0.1"
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-admin-secret
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: audit-pvc

  backoffLimit: 0
