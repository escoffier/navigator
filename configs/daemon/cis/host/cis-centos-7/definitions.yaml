---
controls:
version: "cis-centos-7"
id: 1
text: ""
groups:
  - id: 1.1
    text: "Filesystem Configuration"
    checks:
      - id: 1.1.1.1
        text: "Ensure mounting of cramfs filesystems is disabled"
        audit: "modprobe -n -v cramfs | grep -E '(cramfs|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.2
        text: "Ensure mounting of squashfs filesystems is disabled"
        audit: "modprobe -n -v squashfs | grep -E '(squashfs|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.1.3
        text: "Ensure mounting of udf filesystems is disabled"
        audit: "modprobe -n -v udf | grep -E '(udf|install)'"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

      - id: 1.1.2
        text: "Ensure /tmp is configured"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+'"
        tests:
          bin_op: and
          test_items:
            - flag: "/tmp"
            - flag: "tmpfs"
        type: ""
        scored: true

      - id: 1.1.3
        text: "Ensure noexec option set on /tmp partition"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+' | grep -Ev '\\bnoexec\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.4
        text: "Ensure nodev option set on /tmp partition"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+' | grep -Ev '\\bnodev\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.5
        text: "Ensure nosuid option set on /tmp partition"
        audit: "cat /proc/1/mounts | grep -E '\\s+/tmp\\s+' | grep -Ev '\\bnosuid\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.6
        text: "Ensure /dev/shm is configured"
        audit: |
          output1=$(grep -E '\s/dev/shm\s' /etc/fstab)
          if [ "$output1" = "" ]; then
              echo "FAILED"
          else
              output2=$(findmnt -n /dev/shm)
              echo $output1$output2
          fi
        use_multiple_values: true
        tests:
          bin_op: and
          test_items:
            - flag: "/dev/shm"
            - flag: "tmpfs"
        type: ""
        scored: true

      - id: 1.1.7
        text: "Ensure noexec option set on /dev/shm partition"
        audit: "findmnt -n /dev/shm | grep -Ev '\\bnoexec\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.8
        text: "Ensure nodev option set on /dev/shm partition"
        audit: "findmnt -n /dev/shm | grep -Ev '\\bnodev\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.9
        text: "Ensure nosuid option set on /dev/shm partition"
        audit: "findmnt -n /dev/shm | grep -Ev '\\bnosuid\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.10
        text: "Ensure separate partition exists for /var"
        audit: "cat /proc/1/mounts | grep -E '\\s+/var\\s+'"
        tests:
          test_items:
            - flag: "/var"
        type: ""
        scored: true

      - id: 1.1.11
        text: "Ensure separate partition exists for /var/tmp"
        audit: "findmnt -n /var/tmp"
        tests:
          test_items:
            - flag: "/var/tmp"
        type: ""
        scored: true

      - id: 1.1.12
        text: "Ensure /var/tmp partition includes the noexec option"
        audit: "findmnt -n /var/tmp | grep -Ev '\\bnoexec\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.13
        text: "Ensure /var/tmp partition includes the nodev option"
        audit: "findmnt -n /var/tmp | grep -Ev '\\bnodev\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.14
        text: "Ensure /var/tmp partition includes the nosuid option"
        audit: "findmnt -n /var/tmp | grep -Ev '\\bnosuid\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.15
        text: "Ensure separate partition exists for /var/log"
        audit: "findmnt /var/log"
        tests:
          test_items:
            - flag: "/var/log"
        type: ""
        scored: true

      - id: 1.1.16
        text: "Ensure separate partition exists for /var/log/audit"
        audit: "findmnt /var/log/audit"
        tests:
          test_items:
            - flag: "/var/log/audit"
        type: ""
        scored: true

      - id: 1.1.17
        text: "Ensure separate partition exists for /home"
        audit: "cat /proc/1/mounts | grep -E '\\s+/home\\s+'"
        tests:
          test_items:
            - flag: "/home"
        type: ""
        scored: true

      - id: 1.1.18
        text: "Ensure /home partition includes the nodev option"
        audit: "findmnt /home | grep -Ev '\\bnodev\\b'"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.19
        text: "Ensure removable media partitions include noexec option"
        audit: |
          for rmpo in $(lsblk -o RM,MOUNTPOINT | awk -F " " '/1/ {print $2}'); do 
            findmnt -n "$rmpo" | grep -Ev "\bnoexec\b" 
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.20
        text: "Ensure nodev option set on removable media partitions"
        audit: |
          for rmpo in $(lsblk -o RM,MOUNTPOINT | awk -F " " '/1/ {print $2}'); do 
            findmnt -n "$rmpo" | grep -Ev '\bnodev\b' 
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.21
        text: "Ensure nosuid option set on removable media partitions"
        audit: |
          for rmpo in $(lsblk -o RM,MOUNTPOINT | awk -F " " '/1/ {print $2}'); do 
            findmnt -n "$rmpo" | grep -Ev '\bnosuid\b' 
          done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.22
        text: Ensure sticky bit is set on all world-writable directories
        # cat /proc/1/mounts | grep -E '^tmpfs|^devtmpfs|^overlay|^/dev|^shm' | awk '{print $2}'
        audit: "cat /proc/1/mounts | awk '{print $2}'  | xargs -I '{}' find '{}' -xdev -type d \\( -perm -0002 -a ! -perm -1000 \\) 2>/dev/null"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: "manual"
        scored: true

      - id: 1.1.23
        text: "Disable Automounting"
        audit: "systemctl show \"autofs.service\" | grep -i unitfilestate=enabled"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.1.24
        text: "Disable USB Storage"
        audit: "modprobe -n -v usb-storage"
        tests:
          test_items:
            - flag: "install /bin/true"
        type: ""
        scored: true

  - id: 1.2
    text: "Configure Software Updates"
    checks:
      - id: 1.2.1
        text: "Ensure GPG keys are configured"
        audit: "rpm -q gpg-pubkey --qf '%{name}-%{version}-%{release} --> %{summary}\n'"
        type: "manual"
        scored: false

      - id: 1.2.2
        text: "Ensure package manager repositories are configured"
        audit: "yum repolist"
        type: "manual"
        scored: false

      - id: 1.2.3
        text: "Ensure gpgcheck is globally activated"
        audit: "grep -P '^\\h*gpgcheck=[^1\\n\\r]+\\b(\\h+.*)?$' /etc/yum.conf /etc/yum.repos.d/*.repo"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

  - id: 1.3
    text: "Filesystem Integrity Checking"
    checks:
      - id: 1.3.1
        text: "Ensure AIDE is installed"
        audit: "rpm -q aide"
        tests:
          test_items:
            - flag: "package aide is not installed"
              set: false
        type: ""
        scored: true

      - id: 1.3.2
        text: "Ensure filesystem integrity is regularly checked"
        audit: "grep -Ers '^([^#]+\\s+)?(\\/usr\\/s?bin\\/|^\\s*)aide(\\.wrapper)?\\s(--?\\S+\\s)*(- -(check|update)|\\$AIDEARGS)\\b' /etc/cron.* /etc/crontab /var/spool/cron/"
        tests:
          test_items:
            - flag: "aide --check"
        type: ""
        scored: true

  - id: 1.4
    text: "Secure Boot Settings"
    checks:
      - id: 1.4.1
        text: "Ensure bootloader password is set"
        audit: |
          #!/bin/bash
          tst1="" tst2="" output=""
          efidir=$(find /boot/efi/EFI/* -type d -not -name 'BOOT')
          gbdir=$(find /boot -maxdepth 1 -type d -name 'grub*')
          if [ -f "$efidir"/grub.cfg ]; then
                  grubdir="$efidir" && grubfile="$efidir/grub.cfg"
          elif [ -f "$gbdir"/grub.cfg ]; then
                  grubdir="$gbdir" && grubfile="$gbdir/grub.cfg"
          fi
          userfile="$grubdir/user.cfg"
          [ -f "$userfile" ] && grep -Pq '^\h*GRUB2_PASSWORD\h*=\h*.+$' "$userfile" && output="\n PASSED: bootloader password set in \"$userfile\"\n\n"
          if [ -z "$output" ] && [ -f "$grubfile" ]; then
                  grep -Piq '^\h*set\h+superusers\h*=\h*"?[^"\n\r]+"?(\h+.*)?$' "$grubfile" && tst1=pass
                  grep -Piq '^\h*password\h+\H+\h+.+$' "$grubfile" && tst2=pass
                  [ "$tst1" = pass ] && [ "$tst2" = pass ] && output="\n\n*** PASSED: bootloader password set in \"$grubfile\" ***\n\n"
          fi
          [ -n "$output" ] && echo -e "$output" || echo -e "\n\n *** FAILED: bootloader password is not set ***\n\n"
        tests:
          test_items:
            - flag: "PASSED"
        type: ""
        scored: true

      - id: 1.4.2
        text: "Ensure permissions on bootloader config are configured"
        audit: |
          #!/bin/bash

          tst1="" tst2="" tst3="" tst4="" test1="" test2="" efidir="" gbdir="" grubdir="" grubfile="" userfile="" 
          efidir=$(find /boot/efi/EFI/* -type d -not -name 'BOOT') 
          gbdir=$(find /boot -maxdepth 1 -type d -name 'grub*')
          for file in "$efidir"/grub.cfg "$efidir"/grub.conf; do
            [ -f "$file" ] && grubdir="$efidir" && grubfile=$file
          done
          if [ -z "$grubdir" ]; then
            for file in "$gbdir"/grub.cfg "$gbdir"/grub.conf; do
              [ -f "$file" ] && grubdir="$gbdir" && grubfile=$file 
            done
          fi
          userfile="$grubdir/user.cfg"
          stat -c "%a" "$grubfile" | grep -Pq '^\h*[0-7]00$' && tst1=pass output="Permissions on \"$grubfile\" are \"$(stat -c "%a" "$grubfile")\""
          stat -c "%u:%g" "$grubfile" | grep -Pq '^\h*0:0$' && tst2=pass output2="\"$grubfile\" is owned by \"$(stat -c "%U" "$grubfile")\" and belongs to group \"$(stat -c "%G" "$grubfile")\""
          [ "$tst1" = pass ] && [ "$tst2" = pass ] && test1=pass
          if [ -f "$userfile" ]; then
            stat -c "%a" "$userfile" | grep -Pq '^\h*[0-7]00$' && tst3=pass output3="Permissions on \"$userfile\" are \"$(stat -c "%a" "$userfile")\""
            stat -c "%u:%g" "$userfile" | grep -Pq '^\h*0:0$' && tst4=pass output4="\"$userfile\" is owned by \"$(stat -c "%U" "$userfile")\" and belongs to group \"$(stat -c "%G" "$userfile")\""
            [ "$tst3" = pass ] && [ "$tst4" = pass ] && test2=pass
          else
             test2=pass
          fi
            [ "$test1" = pass ] && [ "$test2" = pass ] && passing=true # If passing is true we pass
          if [ "$passing" = true ] ; then
             echo "PASSED:"
             echo "$output"
             echo "$output2"
             [ -n "$output3" ] && echo "$output3"
             [ -n "$output4" ] && echo "$output4"
          else
             # print the reason why we are failing
             echo "FAILED:"
             echo "$output"
             echo "$output2"
             [ -n "$output3" ] && echo "$output3"
             [ -n "$output4" ] && echo "$output4"
          fi
        tests:
          test_items:
            - flag: "PASSED:"
        type: ""
        scored: true

      - id: 1.4.3
        text: "Ensure authentication required for single user mode"
        audit: "grep /sbin/sulogin /usr/lib/systemd/system/rescue.service"
        tests:
          test_items:
            - flag: "/sbin/sulogin"
        type: ""
        scored: true

  - id: 1.5
    text: "Additional Process Hardening"
    checks:
      - id: 1.5.1
        text: "Ensure core dumps are restricted"
        audit: |
          grep -E "^\s*\*\s+hard\s+core" /etc/security/limits.conf /etc/security/limits.d/*
          sysctl fs.suid_dumpable
          grep "fs\.suid_dumpable" /etc/sysctl.conf /etc/sysctl.d/*
        tests:
          bin_op: and
          test_items:
            - flag: "hard core 0"
            - flag: "fs.suid_dumpable = 0"
        type: ""
        scored: true

      - id: 1.5.2
        text: "Ensure XD/NX support is enabled"
        audit: "journalctl | grep 'protection: active'"
        tests:
          test_items:
            - flag: "kernel: NX (Execute Disable) protection: active"
        type: ""
        scored: true

      - id: 1.5.3
        text: "Ensure address space layout randomization (ASLR) is enabled"
        audit: "sysctl kernel.randomize_va_space"
        tests:
          test_items:
            - flag: "kernel.randomize_va_space"
              compare:
                op: eq
                value: "2"
        type: ""
        scored: true

      - id: 1.5.4
        text: "Ensure prelink is not installed"
        audit: "rpm -q prelink"
        tests:
          test_items:
            - flag: "package prelink is not installed"
        type: ""
        scored: true

  - id: 1.6
    text: "Mandatory Access Control"
    checks:
      - id: 1.6.1.1
        text: "Ensure SELinux is installed"
        audit: "rpm -q libselinux"
        tests:
          test_items:
            - flag: "package libselinux is not installed"
              set: false
        type: ""
        scored: true

      - id: 1.6.1.2
        text: "Ensure SELinux is not disabled in bootloader configuration"
        audit: |
          #!/bin/bash
          # IF check passes return PASSED
          efidir=$(find /boot/efi/EFI/* -type d -not -name 'BOOT') 
          gbdir=$(find /boot -maxdepth 1 -type d -name 'grub*')
          if [ -f "$efidir"/grub.cfg ]; then
            grep "^\s*linux" "$efidir"/grub.cfg | grep -Eq "(selinux=0|enforcing=0)" && echo "FAILED: \"$()\" exists" || echo "PASSED"
          elif [ -f "$gbdir"/grub.cfg ]; then
            grep "^\s*linux" "$gbdir"/grub.cfg | grep -Eq "(selinux=0|enforcing=0)" && echo "FAILED: \"$()\" exists" || echo "PASSED"
          else
             echo "FAILED"
          fi
        tests:
          test_items:
            - flag: "PASSED"
        type: ""
        scored: true

      - id: 1.6.1.3
        text: "Ensure SELinux policy is configured"
        audit: "grep ^SELINUXTYPE= /etc/selinux/config"
        tests:
          test_items:
            - flag: "SELINUXTYPE"
              compare:
                op: regex
                value: "targeted|mls"
        type: ""
        scored: true

      - id: 1.6.1.4
        text: "Ensure the SELinux mode is enforcing or permissive"
        audit: "getenforce"
        tests:
          bin_op: or
          test_items:
            - flag: "Enforcing"
            - flag: "Permissive"
        type: ""
        scored: true

      - id: 1.6.1.5
        text: Ensure the SELinux mode is enforcing
        audit: "getenforce"
        tests:
          test_items:
            - flag: "Enforcing"
        type: ""
        scored: true

      - id: 1.6.1.6
        text: Ensure no unconfined services exist
        audit: "ps -eZ | grep unconfined_service_t"
        tests:
          test_items:
            - flag: ""
        type: ""
        scored: true

      - id: 1.6.1.7
        text: "Ensure SETroubleshoot is not installed"
        audit: "rpm -q setroubleshoot"
        tests:
          test_items:
            - flag: "package setroubleshoot is not installed"
        type: ""
        scored: true

      - id: 1.6.1.8
        text: "Ensure the MCS Translation Service (mcstrans) is not installed"
        audit: "rpm -q mcstrans"
        tests:
          test_items:
            - flag: "package mcstrans is not installed"
        type: ""
        scored: true

  - id: 1.7
    text: "Command Line Warning Banners"
    checks:
      - id: 1.7.1
        text: "Ensure message of the day is configured properly"
        audit: "grep -E -i \"(\\\\v|\\\\r|\\\\m|\\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/\"//g'))\" /etc/motd"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.7.2
        text: "Ensure local login warning banner is configured properly"
        audit: |
          grep -E -i "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.7.3
        text: "Ensure remote login warning banner is configured properly"
        audit: |
          grep -E -i "(\\\v|\\\r|\\\m|\\\s|$(grep '^ID=' /etc/os-release | cut -d= -f2 | sed -e 's/"//g'))" /etc/issue.net
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 1.7.4
        text: "Ensure permissions on /etc/motd are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/motd"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 1.7.5
        text: "Ensure permissions on /etc/issue are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/issue"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

      - id: 1.7.6
        text: "Ensure permissions on /etc/issue.net are configured"
        audit: "stat -c %a/Uid:%U/%uGid:%G/%g /etc/issue.net"
        tests:
          test_items:
            - flag: "644/Uid:root/0Gid:root/0"
        type: ""
        scored: true

  - id: 1.8
    text: "GNOME Display Manager"
    checks:
      - id: 1.8.1
        text: "Ensure GNOME Display Manager is removed"
        audit: "rpm -q gdm"
        tests:
          test_items:
            - flag: "package gdm is not installed"
        type: "skip"
        scored: false

      - id: 1.8.2
        text: "Ensure GDM login banner is configured"
        audit: "grep -v ^#.* /etc/dconf/db/gdm.d/01-banner-message"
        type: "skip"
        scored: false

      - id: 1.8.3
        text: "Ensure last logged in user display is disabled"
        audit: "grep -v ^#.* /etc/dconf/profile/gdm"
        tests:
          bin_op: and
          test_items:
            - flag: "user-db:user"
            - flag: "system-db:gdm"
            - flag: "file-db:/usr/share/gdm/greeter-dconf-defaults"
        type: "skip"
        scored: true

      - id: 1.8.4
        text: "Ensure XDCMP is not enabled"
        audit: "grep -Eis '^\\s*Enable\\s*=\\s*true' /etc/gdm/custom.conf"
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: "skip"
        scored: true

  - id: 1.9
    text: ""
    checks:
      - id: 1.9
        text: "Ensure updates, patches, and additional security software are installed"
        audit: "yum check-update"
        type: "manual"
        scored: false

  - id: 2.1
    text: "inetd Services"
    checks:
      - id: 2.1.1
        text: "Ensure xinetd is not installed"
        audit: "rpm -q xinetd"
        tests:
          test_items:
            - flag: "package xinetd is not installed"
        type: ""
        scored: true

  - id: 2.2
    text: "Special Purpose Services"
    checks:
      - id: 2.2.1.1
        text: "Ensure time synchronization is in use"
        audit: |
          rpm -q ntp
          rpm -q chrony
        tests:
          bin_op: or
          test_items:
            - flag: "chrony-"
            - flag: "ntp-"
        type: ""
        scored: true

      - id: 2.2.1.2
        text: "Ensure chrony is configured"
        audit: "grep ^OPTIONS /etc/sysconfig/chronyd"
        tests:
          test_items:
            - flag: 'OPTIONS="-u chrony"'
        type: ""
        scored: true

      - id: 2.2.1.3
        text: "Ensure ntp is configured"
        audit: "grep \"^OPTIONS\" /etc/sysconfig/ntpd"
        tests:
          test_items:
            - flag: 'OPTIONS="-u ntp:ntp"'
        type: "manual"
        scored: false

      - id: 2.2.2
        text: "Ensure X11 Server components are not installed"
        audit: "rpm -qa xorg-x11-server*"
        tests:
