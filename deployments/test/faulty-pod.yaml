apiVersion: v1
kind: Pod
metadata:
  name: faulty-pod
  labels:
    app: faulty-pod
spec:
  containers:
  - name: faulty
    image: localhost:32000/faulty
    command: ["/bin/bash", "-c", "sleep 99999"]
    securityContext:
      privileged: true
      runAsUser: 0
    volumeMounts:
      - name: tmp
        mountPath: /host/tmp
  imagePullSecrets:
  - name: harbor-admin-secret
  volumes:
  - name: tmp
    hostPath:
      path: /tmp
