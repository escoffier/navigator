api-test:
  image: harbor.tensorsecurity.com/library/openjdk:17.0.1
  stage: test
  resource_group: api-test
  retry: 2
  tags:
  - k8s
  before_script:
  - cp ~/.docker/metersphere.jar /root/metersphere.jar
  script:
  - java -jar /root/metersphere.jar
  when: delayed
  start_in: 2 minutes
reviewdog:
  stage: reviewdog
  tags:
  - k8s
  before_script:
  - export REVIEWDOG_GITLAB_API_TOKEN=Ux_Ex4z5-payZMS_evgC
  - export GITLAB_API="http://gitlab.gitlab-ce.svc.cluster.local/api/v4"
  - export CI_REPO_OWNER=tensorsecurity-rd
  - export CI_REPO_NAME=tensornavigator
  - export CI_COMMIT=$(git rev-parse HEAD)
  - export REVIEWDOG_INSECURE_SKIP_VERIFY=true
  - git config --global --add url."git@gitlab.com:".insteadOf "https://gitlab.com/"
  - git config --global --add url."ssh://git@10.99.201.85/".insteadOf "http://scm.tensorsecurity.cn/"
  script:
  - reviewdog -reporter=gitlab-mr-discussion -debug -tee || true
  when: always
  allow_failure: true
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
