apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty
  labels:
    app: faulty
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faulty
  template:
    metadata:
      labels:
        app: faulty
        # tensorsec.seccompgenerate.prevent: "faulty-profile"
        tensorsec.seccompprotect: "faulty-profile"
        tensorsec.driftprevent: "prevent"
    spec:
      containers:
      - name: faulty
        image: registry.t-appagile.com/tensorsecurity/faulty
        command: ["/bin/bash", "-c", "sleep 99999"]
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
          - name: tmp
            mountPath: /host/tmp
      imagePullSecrets:
      - name: harbor-admin-secret
      volumes:
      - name: tmp
        hostPath:
          path: /tmp
