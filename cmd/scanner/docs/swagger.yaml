info:
  contact: {}
  description: This is the Vegeta central server - Scanner
  license: {}
  title: Vegeta API·
  version: "1.0"
paths:
  /api/v1/imagereject/online_moniter:
    post:
      description: k8s&在线监控生成接口
      parameters:
      - description: JSON数据
        in: body
        name: body
        required: true
        schema:
          items:
            allOf:
            - $ref: '#/definitions/model.RejectOnlineMoniterImage'
            - properties:
                NotifyContext:
                  allOf:
                  - $ref: '#/definitions/model.NotifyContext'
                  - properties:
                      CustomKV:
                        items:
                          allOf:
                          - $ref: '#/definitions/model.KVHashs'
                          - properties:
                              KVHash:
                                $ref: '#/definitions/model.KVHash'
                            type: object
                        type: array
                    type: object
              type: object
          type: array
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/api.OnlyFlagRes'
                    type: object
              type: object
      summary: TickOnlineScan
      tags:
      - reject
  /api/v1/imagereject/overview:
    get:
      description: 展示阻断信息列表
      parameters:
      - description: 'image like '
        in: query
        name: search
        required: true
        type: string
      - description: '仓库筛选 '
        in: query
        name: library
        required: true
        type: string
      - description: '阻断理由筛选 '
        in: query
        name: reject_reason
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItems'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/model.RejectRecord'
                        type: array
                    type: object
              type: object
      summary: images
      tags:
      - reject
  /api/v1/imagereject/policy:
    get:
      description: 获取策略及全局配置列表
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/model.RejectPolicyConfigResponse'
                    type: object
              type: object
      summary: GetPolicy
      tags:
      - reject
    post:
      description: 新增策略接口
      parameters:
      - description: JSON数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RejectPolicyConfigResponse'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/api.OnlyIdRes'
                    type: object
              type: object
      summary: AddPolicy
      tags:
      - reject
    put:
      description: 修改全局config/更新单条策略
      parameters:
      - description: JSON数据
        in: body
        name: body
        required: true
        schema:
          allOf:
          - $ref: '#/definitions/model.RejectPolicyConfigResponse'
          - properties:
              policies:
                items:
                  allOf:
                  - $ref: '#/definitions/model.RejectPolicy'
                  - properties:
                      reject_vulns:
                        items:
                          $ref: '#/definitions/model.RejectVuln'
                        type: array
                    type: object
                type: array
            type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ApiWithItem'
      summary: AddPolicyConfig
      tags:
      - reject
  /api/v1/imagereject/policy/:id:
    delete:
      description: 删除单条策略
      parameters:
      - description: policy ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ApiWithItem'
      summary: DeletePolicy
      tags:
      - reject
  /api/v1/imagereject/result/cicd:
    post:
      description: CICD的第二个API，获取CICD扫描结果
      parameters:
      - description: JSON数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ScanOneCICDResultRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/model.ScanOneForCICDResponse'
                    type: object
              type: object
      summary: /result/cicd
      tags:
      - reject
  /api/v1/imagereject/scanone/cicd:
    post:
      description: CICD的第一个API，用于触发CICD扫描
      parameters:
      - description: JSON数据
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ScanOneForCICDRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/model.ScanOneStatusResponse'
                    type: object
              type: object
      summary: /scanone/cicd
      tags:
      - reject
  /api/v1/register/registries:
    get:
      description: 获取registry列表信息
      parameters:
      - description: 是否需要配置策略的仓库
        in: query
        name: no_policy
        required: true
        type: boolean
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/api.OnlyAccountRes'
                    type: object
              type: object
      summary: registries
      tags:
      - registry
  /api/v1/register/registry:
    get:
      description: 获取registry具体信息
      parameters:
      - description: 仓库类型
        in: query
        name: usetype
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/api.OnlyAccountRes'
                    type: object
              type: object
      summary: registry
      tags:
      - registry
  /api/v1/scan/harbor/GetScanStatus:
    get:
      description: 获取镜像列表的扫描状态
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        allOf:
                        - $ref: '#/definitions/api.ScanStatusRes'
                        - properties:
                            harborStatus:
                              allOf:
                              - $ref: '#/definitions/harbor.ScanAllStatus'
                              - properties:
                                  metrics:
                                    $ref: '#/definitions/harbor.ScanAllStatusMetrics'
                                type: object
                          type: object
                    type: object
              type: object
      summary: scanStatus
      tags:
      - Scan
  /api/v1/scan/harbor/scanAllNow:
    post:
      description: 扫描全部列表中的镜像
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ApiWithItem'
      summary: ScanAllNow
      tags:
      - Scan
  /api/v1/scan/harbor/scanOneStatus:
    get:
      description: 获取单个镜像的扫描状态
      parameters:
      - description: Image ID
        in: query
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        $ref: '#/definitions/model.ScanOneStatusResponse'
                    type: object
              type: object
      summary: ScanOneStatus
      tags:
      - Scan
  /api/v1/scan/reportsByImageDetails:
    get:
      description: 获取单个镜像的扫描状态
      parameters:
      - description: image id
        in: query
        name: id
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItem'
                  - properties:
                      item:
                        allOf:
                        - $ref: '#/definitions/model.ImageList'
                        - properties:
                            image_scan_virus:
                              items:
                                $ref: '#/definitions/model.VirusFileInfo'
                              type: array
                            image_scan_vuln:
                              $ref: '#/definitions/model.ImageScanSummaryResult'
                            questions:
                              items:
                                $ref: '#/definitions/model.QuestionInfo'
                              type: array
                          type: object
                    type: object
              type: object
      summary: reportsByImageDetails
      tags:
      - Scan
  /api/v1/scan/reportsByImageList:
    get:
      description: 获取单个镜像的扫描状态
      parameters:
      - description: 'for image like '
        in: query
        name: search
        type: string
      - description: 0:vuln,1:vrius,2:senstive
        in: query
        name: kind
        type: integer
      - description: is online?
        in: query
        name: online
        required: true
        type: boolean
      - description: int
        in: query
        name: offset
        required: true
        type: integer
      - description: int
        in: query
        name: limit
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiItems'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/model.ImageResponse'
                        type: array
                    type: object
              type: object
      summary: ScanOneStatus
      tags:
      - Scan
  /api/v1/scan/reportsByImageOverview:
    get:
      description: 获取单个镜像的扫描状态
      parameters:
      - description: registry url
        in: query
        name: fromUrl
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ApiWithItem'
                  - properties:
                      item:
                        allOf:
                        - $ref: '#/definitions/model.OverView'
                        - properties:
                            online:
                              $ref: '#/definitions/model.SafeOver'
                          type: object
                    type: object
              type: object
      summary: reportsByImageOverview
      tags:
      - Scan
  /api/v1/scan/reportsBySimpleImageDetails:
    get:
      description: 获取简略的镜像扫描详情（目前只有风险探索页面在使用，没有前端访问）
      parameters:
      - description: image tag
        in: query
        name: tag
        required: true
        type: string
      - description: image digest
        in: query
        name: digest
        required: true
        type: string
      - description: image from library
        in: query
        name: library
        required: true
        type: string
      - description: image full_repo_name
        in: query
        name: full_repo_name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.ApiWithItem'
            - properties:
