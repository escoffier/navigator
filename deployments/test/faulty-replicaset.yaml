apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: faulty-replicaset
  labels:
    app: faulty-replicaset
spec:
  selector:
    matchLabels:
      app: faulty-replicaset
  template:
    metadata:
      labels:
        app: faulty-replicaset
        # tensorsec.apparmor.faulty: "test"
        # tensorsec.seccomp: "test"
        # tensorsec.drift.faulty: "prevention"
        # tensorsec.commandwhitelist.faulty: "test"
    spec:
      containers:
      - name: faulty
        image: localhost:32000/faulty
        command: ["/bin/bash", "-c", "sleep 99999"]
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
          - name: tmp
            mountPath: /host/tmp
      imagePullSecrets:
      - name: harbor-admin-secret
      volumes:
      - name: tmp
        hostPath:
          path: /tmp
