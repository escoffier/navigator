dependencies:
  - name: scanner
    version: 0.1.0
    repository: "file://./subcharts/scanner"
    condition: scanner.enabled

  - name: console
    version: 0.1.0
    repository: "file://./subcharts/console"
    condition: console.enabled

  - name: clair
    version: 0.1.3
    repository: "file://./subcharts/clair"
    condition: clair.enabled

  - name: daemon
    version: 0.1.0
    repository: "file://./subcharts/daemon"
    condition: daemon.enabled
 
  - name: postgresql
    version: "6.3.9"
    condition: postgresql.enabled
    repository: "alias:stable"

  - name: mongodb
    version: 7.2.10
    repository: "@stable"
    condition: mongodb.enabled

  # TODO: https://github.com/bitnami/charts/tree/master/bitnami/redis#tldr
  - name: redis
    version: 11.2.1
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

  - name: elasticsearch
    version: 7.9.1
    repository: https://helm.elastic.co
    condition: elasticsearch.enabled
