##attck_rule_type=Credential_Access
- key: Gaining environment information
  hid: ca_01
  condition: >
    open_read and container and
    ((proc.name in (show_information_binaries)) and (fd.filename in (sensitive_paths) or fd.name in (sensitive_paths) or fd.directory in (sensitive_paths)) or (proc.name in (show_env_binaries))) and not
    tensorsec_namespace and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,fd_name=%fd.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Gaining environment information"
      zh: "容器内获取环境信息"
    desc:
      en: "Generally, we believe that normal users in the container will not perform this behavior. There is a high probability that after the attack, the attacker will execute env, access hosts, .dockerenv, mountinfo and other sensitive files in order to obtain environment information in the container, which are considered potential attacks. behavior because obtaining environmental information may include attempts to identify and exploit vulnerabilities or weaknesses in the container or host system. Obtain the environment information within the container, including environment variables, host name, IP address, file system structure, process information, network connection information, mount information, etc., to learn more about the container's configuration and potential weaknesses to perform potential malicious activities."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，为了在容器内获取环境信息执行env、访问hosts、.dockerenv、mountinfo等敏感文件被视为潜在的攻击行为，这是因为获取环境信息可能包括试图识别和利用容器或主机系统中的漏洞或弱点。获取容器内的环境信息，包括环境变量、主机名、IP地址、文件系统结构、进程信息、网络连接信息、挂载信息等，以详细了解容器的配置和潜在弱点，从而执行潜在的恶意活动。"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process and whether it is executed by malware, and you can use the immune defense training application to restrict user permissions for sensitive files and commands."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，可使用免疫防御训练应用，限制敏感文件和命令的用户权限。"
    rule_type: Credential_Access
    priority: WARNING
    urgency: true
    tags: [ATT&CK, exec, container, mitre_credential_access, L2]

