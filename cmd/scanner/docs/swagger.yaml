          type: CNNVDVulnerabilityInfo
        type: array
      cnvds:
        items:
          type: CNVDVulnerabilityInfo
        type: array
      cvss:
        type: CVSSVulnerabilityInfo
      description:
        type: string
      featurename:
        type: string
      featureversion:
        type: string
      fixedby:
        type: string
      id:
        type: string
      links:
        items:
          type: string
        type: array
      namespace:
        type: string
      severity:
        type: string
