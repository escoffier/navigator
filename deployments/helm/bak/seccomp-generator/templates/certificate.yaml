apiVersion: certmanager.k8s.io/v1alpha1
kind: Issuer
metadata:
  name: {{ template "seccompGenerator.fullname" . }}-webhook-selfsign
  labels:
    app: "{{ template "seccompGenerator.fullname" . }}-webhook"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
spec:
  selfSigned: {}
---
apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: {{ template "seccompGenerator.fullname" . }}-webhook-ca
  labels:
    app: "{{ template "seccompGenerator.fullname" . }}-webhook"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
spec:
  secretName: {{ template "seccompGenerator.fullname" . }}-webhook-ca
  issuerRef:
    name: {{ template "seccompGenerator.fullname" . }}-webhook-selfsign
  commonName: ca.webhook.{{ template "seccompGenerator.fullname" . }}
  isCA: true
---
apiVersion: certmanager.k8s.io/v1alpha1
kind: Issuer
metadata:
  name: {{ template "seccompGenerator.fullname" . }}-webhook-ca
  labels:
    app: "{{ template "seccompGenerator.fullname" . }}-webhook"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
spec:
  ca:
    secretName: {{ template "seccompGenerator.fullname" . }}-webhook-ca
---
apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: {{ template "seccompGenerator.fullname" . }}-webhook-certificate
  labels:
    app: "{{ template "seccompGenerator.fullname" . }}-webhook"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
spec:
  secretName: {{ template "seccompGenerator.fullname" . }}-webhook-certs
  issuerRef:
    name: {{ template "seccompGenerator.fullname" . }}-webhook-ca
  dnsNames:
  - {{ template "seccompGenerator.fullname" . }}-webhook-service
  - {{ template "seccompGenerator.fullname" . }}-webhook-service.{{ .Release.Namespace }}
  - {{ template "seccompGenerator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
  - {{ template "seccompGenerator.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
