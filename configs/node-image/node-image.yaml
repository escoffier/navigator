---
# log level: debug,info,error,warn
log_level: debug

# 节点镜像上报配置
report:
  # 发送kafka超时设置
  mq_timeout: 5
  # 镜像白名单.正则匹配命中的镜像将不会上报
  exclude_image: [ "tensorsecurity/*", "idss" ]
  # 单节点每批次发送的镜像数
  batch_size: 50


# 扫描任务配置
task:
  # 并发扫描任务数目.增加并发会增加内存消耗
  parallel_num: 5

# 扫描参数配置
scan:
  # 默认扫描超时.秒
  scan_timeout: 1800
  # 为在容器里面扫描主机镜像,需要mount主机上docker的目录.这里配置了mount的路径。
  # 比如：主机上的/var/lib/docker被mount为容器里面的/host/var/lib/docker
  mount_prefix: "/host"
  # 是否打开扫描实时日志。当为true时，irene的扫描日志也会实时输出。
  real_time_log: true

# 扫描工具irene配置
irene:
  # 日志级别
  log_level: debug
  # 是否打开深层debug开关.会打印分析软件包文件等日志
  deeper_debug: false

# deep scan 配置
deep_scan:
  # deep-scan时进行哪些类型的扫描。支持以下：avira(小红伞),tws(tensor webshell scan),clamav
  # types: ["avira", "tws", "clamav"]
  types: [ "avira", "tws" ]

### 以下为deep scan里各个扫描引擎的配置 ###
# 小红伞配置
avira:
  # 小红伞服务监听端口
  listen_port: 9200
  # 客户端并发数目
  client_num: 8

# webshell扫描配置
webshell:
  # 扫描文件类型. 如果为空，则使用默认配置
  # 默认扫描类型为：".php", ".php5", ".php4", ".asp", ".aspx", ".asmx", ".ashx",
  #  ".jsp", ".jspa", ".jspx", ".jspf", ".cer", ".htaccess"
  include_types: [ ".php", ".txt" ]
