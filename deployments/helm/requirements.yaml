dependencies:
  - name: eventcenter-auth
    version: 0.1.0
    repository: "file://./subcharts/eventcenter-auth"
    condition: eventcenterAuth.enabled

  - name: scanner
    version: 0.1.0
    repository: "file://./subcharts/scanner"
    condition: scanner.enabled

  - name: console
    version: 0.1.0
    repository: "file://./subcharts/console"
    condition: console.enabled

  - name: clair
    version: 0.1.3
    repository: "file://./subcharts/clair"
    condition: clair.enabled

  - name: postgresql-ha
    version: 7.8.3
    repository: "file://./subcharts/postgresql-ha"
    condition: postgresql-ha.enabled

  - name: mongodb
    version: 10.19.0
    repository: "file://./subcharts/mongodb"
    condition: mongodb.enabled

  - name: redis-ha
    version: 4.4.6
    repository: "file://./subcharts/redis-ha"
    condition: redis-ha.enabled

  - name: elasticsearch
    version: 7.9.1
    repository: "file://./subcharts/elasticsearch"
    condition: elasticsearch.enabled

  - name: kibana 
    version: 0.1.0
    repository: "file://./subcharts/kibana"
    condition: kibana.enabled

  - name: holmes
    version: 1.7.4
    repository: "file://./subcharts/holmes"
    condition: holmes.enabled

  - name: stan
    version: 0.8.0
    repository: "file://./subcharts/stan"
    condition: stan.enabled

  - name: security-profiles-manager
    version: 0.1.0
    repository: "file://./subcharts/security-profiles-manager"
    condition: security-profiles-manager.enabled

  - name: holmessidekick
    version: 0.3.3
    repository: "file://./subcharts/holmessidekick"
    condition: holmessidekick.enabled

  - name: image-validator
    version: 0.1.0
    repository: "file://./subcharts/image-validator"
    condition: image-validator.enabled

  - name: webhook
    version: 0.1.0
    repository: "file://./subcharts/webhook"
    condition: webhook.enabled

  - name: cluster-manager
    version: 0.1.0
    repository: "file://./subcharts/cluster-manager"
    condition: cluster-manager.enabled

  - name: stan
    version: 0.8.0
    repository: "file://./subcharts/stan"
    condition: stan.enabled

  - name: security-profiles-manager
    version: 0.1.0
    repository: "file://./subcharts/security-profiles-manager"
    condition: security-profiles-manager.enabled

  - name: holmessidekick
    version: 0.3.3
    repository: "file://./subcharts/holmessidekick"
    condition: holmessidekick.enabled

  - name: safenode-image
    version: 0.1.0
    repository: "file://./subcharts/safenode-image"
    condition: safenode-image.enabled

  - name: tensorsec-common
    version: 0.1.0
    repository: "file://./subcharts/tensorsec-common"
    condition: tensorsec-common.enabled
