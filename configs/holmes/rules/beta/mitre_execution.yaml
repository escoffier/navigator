#docker cp 
- key: Write files to the host through local docker.sock
  disable: true
  hid: exec_21
  condition: >
    evt.type = execve 
    and container 
    and not tensorsec_namespace
    and (proc.cmdline contains "docker -H unix:" or proc.cmdline contains "docker --host unix:" or proc.cmdline contains "docker") and  proc.cmdline contains "cp"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Write files to the host through local docker.sock"
      zh: "通过本地docker.sock向宿主机写入文件"
    desc:
      en: "Writing files directly to the host via Docker.sock is a security risk because it can lead to unauthorized access and manipulation. Docker.sock is the UNIX socket for the Docker daemon used to communicate with Docker clients. Generally, we believe that normal users will not perform this behavior in the container. There is a high probability that the attacker is performing a privilege escalation operation."
      zh: "直接通过 Docker.sock 向宿主机写入文件是一个安全风险，因为这可能导致未经授权的访问和操纵。Docker.sock 是 Docker 守护进程的 UNIX 套接字，用于与 Docker 客户端通信。通常我们认为正常用户不会在容器内进行此行为，大概率是攻击者在进行提权操作。"
    suggestion:
      en: "If a container is compromised, you need to isolate the container, obtain the attacker's remote IP address, and investigate other attacks to confirm cluster security."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该更新操作是否符合预期，是否为运维人员触发。"
    rule_type: Execution
    priority: ALERT
    urgency: false
    tags: [ATT&CK, exec, filesystem, mitre_execution, L3]

