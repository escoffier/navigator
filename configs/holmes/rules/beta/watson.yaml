- key: Execute commands through webshell
  hid: hp_03
  category: Watson
  categoryZh: 主动防御
  condition: >
    k8s.pod.name contains "51c1c6" and evt.type = read and (evt.arg.data contains "POST " or evt.arg.data contains "GET ") and evt.arg.data contains "jsp" and fd.sport=8080 and proc.name=java
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_vpgid=%proc.vpgid,proc_cmdline=%proc.cmdline,proc_name=%proc.name,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name,http_request=%evt.args
  steps:
    - name: checkRelatedExists
      params: [Generated child process shell after starting the container, 1s, trigger.payload.output_map.proc_name, payload.output_map.proc_pname]
    - name: checkValue
      params: [trigger.payload.output_map.proc_name, java]
  info:
    name:
      en: "Execute commands through webshell"
      zh: "通过向Tomcat上传webshell并执行命令"
    desc:
      en: "Execute commands through webshell"
      zh: "通过向Tomcat上传webshell并执行命令"
    suggestion:
      en: "It is recommended to check whether an attacker has obtained internal container permissions, and use immune defense to restrict attackers from further attacks"
      zh: "建议排查是否有攻击者已获取内部容器权限，同时使用免疫防御限制攻击者进行进一步攻击。"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [Watson, L4]

