{{- if .Values.managedServiceAccount }}
apiVersion: {{ include "common.capabilities.rbac.apiVersion" . }}
kind: ClusterRole
metadata:
  name: {{ include "common.names.fullname" . }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: sec-prof-man
rules:
- apiGroups:
  - ""
  - "apps"
  - "batch"
  - "extensions"
  resources:
  - daemonsets
  - statefulsets
  - replicasets
  - deployments
  - jobs
  - cronjobs
  verbs:
  - list
  - watch
  - get
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - {{ .Values.holmes.rulesConfigMap }}
  - {{ printf "%s-container" (include "common.names.fullname" .) }}
  verbs:
  - list
  - watch
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
  - watch
  - get
  - delete
{{- end -}}
