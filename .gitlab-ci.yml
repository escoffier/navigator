image: harbor.tensorsecurity.com/library/reviewdog:v5

variables:
  GOPROXY: "https://goproxy.cn"
  GO111MODULE: "on"
  GOPRIVATE: "gitlab.com,scm.tensorsecurity.cn"
  CGO_LDFLAGS: "-no-pie"
  HARBORPASSWD: "Hrbr12@Tensor.*#)"

workflow:
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master/'
      when: always

stages:
  - reviewdog
  - build
  - test

## reviewdog
reviewdog:
  stage: reviewdog
  tags:
    - k8s
  before_script:
    - export REVIEWDOG_GITLAB_API_TOKEN=Ux_Ex4z5-payZMS_evgC
    - export GITLAB_API="http://gitlab.gitlab-ce.svc.cluster.local/api/v4"
    - export CI_REPO_OWNER=tensorsecurity-rd
    - export CI_REPO_NAME=tensornavigator
    - export CI_COMMIT=$(git rev-parse HEAD)
    - export REVIEWDOG_INSECURE_SKIP_VERIFY=true
    - git config --global --add url."git@gitlab.com:".insteadOf "https://gitlab.com/"
    - git config --global --add url."ssh://git@10.99.201.85/".insteadOf "http://scm.tensorsecurity.cn/"
  script:
    - reviewdog -reporter=gitlab-mr-discussion -debug -tee
  rules:
    - changes:
        - cmd/**/*

### build & deploy
all:
  stage: build
  resource_group: all
  tags:
    - k8s
  before_script:
    ## Configuration of Git
    - git merge origin/master
    - git config --global --add url."git@gitlab.com:".insteadOf "https://gitlab.com/"
    - git config --global --add url."ssh://git@10.99.201.85/".insteadOf "http://scm.tensorsecurity.cn/"
    - git clone ssh://git@10.99.201.85/tensorsecurity-rd/tensor-compliance-check.git
    ## Configuration of Make
    - sed -i 's#RELEASEVERSION?=v0.0.1#RELEASEVERSION?=ci#g' Makefile
    - sed -i "s#latest#ci#g" Makefile
    - sed -i "s#DOCKER_REGISTRY=$(REPOPREFIX)#DOCKER_REGISTRY=harbor.tensorsecurity.com/tensorsecurity#g" Makefile
    - sed -i "s#REPOPREFIX?=localhost:32000#REPOPREFIX?=harbor.tensorsecurity.com/tensorsecurity#g" Makefile
    - 'find ./ -name "Dockerfile"|xargs sed -i "s#registry.t-appagile.com#harbor.tensorsecurity.com#g"'
    ## Copy tools
    - mkdir ~/.kube/
    - cp ~/.docker/config-ci ~/.kube/config
    - cp ~/.docker/kubectl /bin/
    - cp ~/.docker/xray ./
    - chmod +755 /bin/kubectl
  script:
    - USEMIRROR=true FETCHTAG=latest make all
    - make pushimages
    - make rm-local-images
    - kubectl get pod --no-headers -n tensorsec|grep -v "mariadb\|redis\|elasticsearch\|stan\|frontend\|eventcenter\|microseg"|awk '{print $1}'|xargs -i kubectl delete pod {} -n tensorsec --force --grace-period=0
  rules:
    - changes:
        - pkg/**/*
        - Makefile
        - go.mod
        - configs/**/*

