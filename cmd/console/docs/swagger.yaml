info:
  contact: {}
  description: This is the Vegeta central server - Console
  license: {}
  title: Vegeta API
  version: "1.0"
paths:
  /api/v1/alarms/alerts:
    get:
      description: Get all Alerts
      operationId: v1-alarms-alerts
      produces:
      - application/json
      responses:
        "200":
          description: Alerts Alarms Data
          schema:
            $ref: '#/definitions/api.alarmsAlerts'
      summary: Alarm Alerts API
  /api/v1/alarms/reports:
    get:
      description: Get all Reports
      operationId: v1-alarms-reports
      produces:
      - application/json
      responses:
        "200":
          description: Reports Alarms Data
          schema:
            $ref: '#/definitions/api.alarmsReports'
      summary: Alarm Reports API
  /api/v1/alarms/reports/problems:
    get:
      description: Get all Problems in Reports
      operationId: v1-alarms-reports-problems
      produces:
      - application/json
      responses:
        "200":
          description: Reports Problems Alarms Data
          schema:
            $ref: '#/definitions/api.alarmsReportsProblems'
      summary: Alarm Reports Problems API
  /api/v1/alarms/vulnerabilities:
    get:
      description: Get all Vulnerabilities
      operationId: v1-alarms-vulnerabilities
      produces:
      - application/json
      responses:
        "200":
          description: Vulnerability Alarms Data
          schema:
            $ref: '#/definitions/api.alarmsVulnerabilities'
      summary: Alarm Vulnerabilities API
  /api/v1/alarms/vulnerabilities/tags:
    get:
      description: Get all Vulnerabilities Tags
      operationId: v1-alarms-vulnerabilities-tags
      produces:
      - application/json
      responses:
        "200":
          description: Vulnerabilities Tags Alarms Data
          schema:
            $ref: '#/definitions/api.alarmsVulnsTags'
      summary: Alarm Vulnerabilities Tags API
  /api/v1/assets/clusters:
    get:
      description: Get Different Type of Assets in Cluster
      operationId: v1-assets-clusters
      produces:
      - application/json
      summary: Clusters Detail API
  /api/v1/assets/containers:
    get:
      description: Get Different Type of Assets in Cluster
      operationId: v1-assets-containers
      parameters:
      - description: node id
        in: query
        name: node
        type: integer
      produces:
      - application/json
      summary: Images Detail API  Only for docker container
  /api/v1/assets/images:
    get:
      description: Get Different Type of Assets in Cluster
      operationId: v1-assets-images
      parameters:
      - description: image name
        in: query
        name: name
        type: string
      - description: ' status '
        in: query
        name: status
        type: integer
      - description: ' reference low bound '
        in: query
        name: numberAbove
        type: integer
      - description: 'reference high bound '
        in: query
        name: numberBelow
        type: integer
      - description: ' last scan time '
        in: query
        name: date
        type: string
      - description: repo name
        in: query
        name: repoName
        type: string
      - description: image sha
        in: query
        name: sha
        type: string
      produces:
      - application/json
      summary: Images Detail API
  /api/v1/config/agent/{agentID}:
    get:
      description: Get an agent
      operationId: v1-config-agent-get
      parameters:
      - description: agent ID
        in: path
        name: agentID
        required: true
        type: string
      - description: return yaml only if yaml = true
        in: query
        name: yaml
        type: boolean
      produces:
      - application/json
      summary: Delete an agent by agent ID
  /api/v1/config/agents:
    get:
      description: Get the list of Agents
      operationId: v1-config-agents-get
      parameters:
      - description: from offset
        in: query
        name: offset
        type: integer
      - description: returned data limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      summary: Get the list of Agents
    post:
      description: Create an agent entry with YAML
      operationId: v1-config-agents-post
      parameters:
      - description: agent name
        in: body
        name: name
        required: true
        schema:
          type: string
      - description: 'agent type: daemonset, scanner, sidecar'
        in: body
        name: type
        required: true
        schema:
          type: string
      - description: the namespace the agent is running in
        in: body
        name: namespace
        required: true
        schema:
          type: string
      - description: 'the etcd endpoint: <host>:<port>'
        in: body
        name: etcd
        required: true
        schema:
          type: string
      produces:
      - application/json
      summary: Create an agent entry with YAML
  /api/v1/config/cluster:
    post:
      description: Add new cluster
      operationId: v1-config-cluster-post
      parameters:
      - description: clusterName
        in: body
        name: name
        required: true
        schema:
          type: string
      - description: 'kubeConfig -- base64String '
        in: body
        name: config
        required: true
        schema:
          type: string
      - description: Kubenetes 1, OpenShift 2, Docker 3
        in: body
        name: type
        required: true
        schema:
          type: integer
      produces:
      - application/json
      summary: Add new cluster
  /api/v1/config/cluster/{clusterID}:
    delete:
      description: Delete a cluster by cluster ID
      operationId: v1-config-cluster-delete
      parameters:
      - description: clusterID
        in: path
        name: clusterID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: MongoDB DeletedCount
          schema:
            type: string
      summary: Delete a cluster
    get:
      description: Get single cluster information
      operationId: v1-config-cluster-get
      parameters:
      - description: clusterID
        in: path
        name: clusterID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.cluster'
        "400":
          description: clusterID is not provided
          schema:
            type: string
      summary: Get single cluster information
    put:
      description: Update single cluster information
      operationId: v1-config-cluster-put
      parameters:
      - description: clusterID
        in: path
        name: clusterID
        required: true
        type: string
      - description: clusterID
        in: body
        name: name
        required: true
        schema:
          type: string
      - description: kubeConfig -- base64String
        in: body
        name: config
        required: true
