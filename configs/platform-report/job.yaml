---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-report
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: platform-report
    spec:
      containers:
        - name: platform-report
          image: localhost:32000/platform-report:latest
          command: ["/platform-report"]
          imagePullPolicy: Always
          resources:
            requests:
              memory: "1000Mi"
              cpu: "500m"
            limits:
              memory: "1000Mi"
              cpu: "500m"
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-admin-secret
  backoffLimit: 0
