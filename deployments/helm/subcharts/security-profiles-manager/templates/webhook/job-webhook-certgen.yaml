apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "secProfilesManager.fullname" . }}-webhook-certgen-{{ .Release.Revision }}
  labels:
    app: "{{ template "secProfilesManager.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
spec:
  template:
    metadata:
      name: {{ template "secProfilesManager.fullname" . }}-webhook-certgen-{{ .Release.Revision }}
      labels:
        app: {{ template "secProfilesManager.fullname" . }}
    spec:
      initContainers:
        - name: create
          image: {{ include "tensorsec.secProfilesManager.certgen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - create
            - --host={{ template "secProfilesManager.fullname" . }}-webhook-service,{{ template "secProfilesManager.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc
            - --namespace={{ .Release.Namespace }}
            - --secret-name={{ template "secProfilesManager.fullname" . }}-webhook-certs
            - --cert-name=tls.crt
            - --key-name=tls.key
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: patch
          image: {{ include "tensorsec.secProfilesManager.certgen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - patch
            - --webhook-name={{ template "secProfilesManager.fullname" . }}-webhook
            - --namespace={{ .Release.Namespace }}
            - --patch-mutating=true
            - --patch-validating=false
            - --secret-name={{ template "secProfilesManager.fullname" . }}-webhook-certs
            - --patch-failure-policy=Ignore
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      restartPolicy: OnFailure
      serviceAccountName: {{ template "secProfilesManager.serviceAccount" . }}-webhook-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
