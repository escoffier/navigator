    harborURL: https://harbor.example
    harborUsername: admin
    harborPassword: Harbor12345
    harborSecretName: harbor-api-tensorsec
  emailCheck:
    enabled: false
    host: smtp.feishu.cn
    port: 465
    username: console-robot@tensorsecurity.cn
    password: password 

daemon:
  enabled: false 
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    pullSecret: harbor-admin-secret
  extraInitContainers:
    esListerner:
      image:
        registry: "{{ .Values.global.image.registry }}"
        repository: "{{ .Values.global.image.repository }}"
    pgListerner:
      image:
        registry: "{{ .Values.global.image.registry }}"
        repository: "{{ .Values.global.image.repository }}"
  eventcenter:
    eventGrpcUrl: tensorsec-eventcenter:9090
    eventGrpcCertServerName: tensorsec-eventcenter

eventcenterAuth:
  enabled: true

redis:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    name: redis
    tag: 6.0.8-debian-10-r35
    pullSecret: harbor-admin-secret
  sentinel:
    image:
      registry:  "{{ .Values.global.image.registry }}"
      repository: "{{ .Values.global.image.repository }}"
      name: redis-sentinel
      tag: 6.0.8-debian-10-r36
  password: Redis12345
  usePassword: true
  cluster:
    slaveCount: 1
  master:
    persistence:
      enabled: true
    disableCommands: []
  slave:
    persistence:
      enabled: true

elasticsearch:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    name: elasticsearch
    tag: 7.9.1
    pullSecret: harbor-admin-secret
  persistence:
    enabled: true
  minimumMasterNodes: 1
  replicas: 1
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: Elastic12345
    - name: ELASTIC_USERNAME
      value: elasticsearch
  # Below settings for local dev environment
  # sysctlInitContainer:
  #   enabled: false
  # esConfig:
  #   elasticsearch.yml: |
  #     node.store.allow_mmap: false
  # antiAffinity: "soft"
  # esJavaOpts: "-Xmx128m -Xms128m"
  # resources:
  #   requests:
  #     cpu: "100m"
  #     memory: "512M"
  #   limits:
  #     cpu: "1000m"
  #     memory: "512M"
  # volumeClaimTemplate:
  #   accessModes: [ "ReadWriteOnce" ]
  #   storageClassName: "microk8s-hostpath"
  #   resources:
  #     requests:
  #       storage: 100M
  lifecycle:
    postStart:
       exec:
         command:
           - bash
           - -c
           - |
             #!/bin/bash
             # Add a template to adjust number of shards/replicas
             ES_URL=http://localhost:9200
             while [[ "$(curl -s -o /dev/null -w '%{http_code}\n' $ES_URL)" != "200" ]]; do sleep 1; done
             curl -s -XGET "http://localhost:9200/_cluster/health?pretty=true"  |grep yellow
             if [ "$?" == "0" ]; then   curl -H "Content-Type: application/json" -XPUT 'http://localhost:9200/_settings' -d '{"index":{"number_of_replicas":0}}'; fi

kibana:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    pullSecret: harbor-admin-secret

postgresql:
  # Note for maintainers:
  # Some confusion may appear here because we use docker image created from "official" dockerhub base image postgresql
  # but we use helm chart designed for bitnami/postgresql.
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    name: tensorsec-postgres
    tag: "latest"
    pullSecret: harbor-admin-secret
    pullPolicy: Always
  volumePermissions:
      image:
        registry: "{{ .Values.global.image.registry }}"
        repository: "{{ .Values.global.image.repository }}"
  persistence:
    enabled: true
    size: 10Gi
  # Use the same PGDATA as the travis job that builds arminc/clair-db
  # (https://github.com/arminc/clair-local-scan/blob/master/.travis.yml)
  postgresqlDataDir: /bitnami/postgresql/data 
  postgresqlUsername: postgres
  postgresqlPassword: password
  postgresqlDatabase: postgres
  # Based on https://github.com/timescale/timescaledb/issues/522#issuecomment-437162196
  # Otherwise we get CrashLoopBackoff: chmod: /var/lib/postgresql/clair: Operation not permitted
  securityContext:
    enabled: true
    fsGroup: 70
    runAsUser: 70
  replication:
    enabled: false
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m
  metrics:
    enabled: false


mongodb:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    tag: 4.4.6-debian-10-r8
    pullSecret: harbor-admin-secret
  volumePermissions:
    enabled: true
    image:
      registry:  "{{ .Values.global.image.registry }}"
      repository: "{{ .Values.global.image.repository }}"
  auth:
    username: redstone
    password: redstoneMongo123
    database: vegeta
    rootPassword: redstoneMongo123
  architecture: replicaset
  # https://github.com/helm/charts/issues/18588
  useStatefulSet: true
  #
  persistence:
    enabled: true


seccompGenerator:
  auditdLogging: false
  enabled: false

holmes:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    tag: latest
    pullSecret: harbor-admin-secret
  tensorsecDaemon:
    image:
      registry:  "{{ .Values.global.image.registry }}"
      repository: "{{ .Values.global.image.repository }}"
      tag: latest
    db:
      host: tensorsec-postgresql
      port: 5432
      user: postgres
      password: password
      name: postgres
  ebpf:
    enabled: false
  falco:
    rulesFile:
      - /etc/falco/falco_rules.local.yaml
    jsonOutput: true
    jsonIncludeOutputProperty: true
    httpOutput:
      enabled: false
    webserver:
      enabled: false
    programOutput:
      enabled: true
      keepAlive: false
      program: /bin/bash /holmes_export.sh
    syslogOutput:
      enabled: false
    stdoutOutput:
      enabled: true
  # Add extra volumes to Falco daemonset
  extraVolumes:
    - name: client-cert
      secret:
        secretName: eventcenter-tls-client-cert-secret
    - name: ca-cert
      secret:
        secretName: eventcenter-tls-ca-secret
  # Add extra volumeMounts to Falco container in Falco daemonset
  extraVolumeMounts:
    - mountPath: /auth/client
      name: client-cert
      readOnly: true
    - mountPath: /auth/ca
      name: ca-cert
      readOnly: true

image-validator:
  enabled: true
  image:
    registry:  "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    tag: latest
