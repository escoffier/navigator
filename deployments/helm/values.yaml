clair:
  enabled: true
  image:
    registry: "{{ .Values.global.image.registry }}"
    repository: "{{ .Values.global.image.repository }}"
    tag: latest
    pullSecret: harbor-admin-secret
  init: 
    loadSql:
      image:
        registry: "{{ .Values.global.image.registry }}"
        repository: "{{ .Values.global.image.repository }}"
        name: tensorsec-postgres
        tag: latest
    waitpg:
      image:
        registry: "{{ .Values.global.image.registry }}"
        repository: "{{ .Values.global.image.repository }}"
