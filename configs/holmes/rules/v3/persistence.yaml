##attck_rule_type=Persistence
- key: Schedule Cron Jobs
  disable: true
  hid: pers_01
  condition: >
    ((open_write and cron_dir_action) or
     (spawned_process and proc.name = "crontab")) and
    not consider_all_cron_jobs and container and
    not user_known_cron_jobs and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Schedule Cron Jobs"
      zh: "运行计划任务"
    desc:
      en: "Detect cron jobs scheduled"
      zh: "检测到运行计划任务"
    suggestion:
      en: "Please judge through the process tree whether the command belongs to the normal behavior of known processes, whether it is executed by malware, confirm whether the planned task is operated by operation and maintenance personnel, if it is a necessary operation can use whitelist to let go of the alarm, otherwise it may be a hacker backdoor."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该计划任务是否为运维人员操作，如果是必要操作可采用白名单放过告警，否则则可能为黑客后门。"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, file, mitre_persistence, L2]

- key: Run user mgmt binaries
  hid: pers_02
  condition: >
    spawned_process and proc.name in (user_mgmt_binaries) and shell_parent_procs and
    not proc.name in (su, sudo, lastlog, nologin, unix_chkpwd) and
    not proc.pname in (cron_binaries, systemd, systemd.postins, udev.postinst, run-parts) and
    not proc.cmdline startswith "passwd -S" and
    not proc.cmdline startswith "useradd -D" and
    not proc.cmdline startswith "systemd --version" and
    not run_by_qualys and
    not run_by_sumologic_securefiles and
    not run_by_yum and
    not run_by_ms_oms and
    not run_by_google_accounts_daemon and
    not chage_list and
    not user_known_user_management_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Run user management binaries"
      zh: "运行管理用户、密码或权限的命令"
    desc:
      en: "Activity by any programs that can manage users, passwords, or permissions. sudo and su are excluded. Activity in containers is also excluded--some containers create custom users on top of a base linux distribution at startup. Some innocuous commandlines that don't actually change anything are excluded."
      zh: "任何可以管理用户、密码或权限的程序的活动。sudo和su除外。一些容器在启动时在基本的Linux发行版之上创建自定义用户除外。一些不会实际更改任何内容的无害命令行也被排除在外。"
    suggestion:
      en: "Please use the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, and confirm whether it is an administrator or trusted application operation, otherwise it may be a hacker operation, please check the system security."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认是否为管理员或可信应用操作，否则则可能是黑客操作，请排查系统安全。"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, host, users, mitre_persistence, L2]

- key: Package management process launched in container
  hid: pers_03
  condition: >
    spawned_process
    and container
    and user.name != "_apt"
    and package_mgmt_procs
    and shell_parent_procs
    and not package_mgmt_ancestor_procs
    and not user_known_package_manager_in_container
    and not (tensorsec_namespace and k8s.pod.name contains "-frontend")
  output: >
    Pproc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Package management process launched in container"
      zh: "容器内启动包安装管理流程"
    desc:
      en: "Package management process ran inside container"
      zh: "容器内启动包安装管理流程"
    suggestion:
      en: "Please go through the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, and whether package management normally does not occur in the container to confirm that the process is as expected."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，通常容器内不会出现包管理情况，确认该流程是否符合预期。"
    rule_type: Persistence
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, process, mitre_persistence, L3]

- key: Update package repository
  hid: pers_04
  condition: >
    ((open_write and access_repositories) or (modify and modify_repositories))
    and shell_parent_procs
    and not package_mgmt_procs
    and not package_mgmt_ancestor_procs
    and not exe_running_docker_save
    and not user_known_update_package_registry
    and shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Update package repository"
      zh: "更新软件源"
    desc:
      en: "Update package repository"
      zh: "更新软件源"
    suggestion:
      en: "Please go through the process tree to determine whether the command is a normal behavior of a known process, whether it is executed by malware, and whether the update operation is as expected and triggered by operation and maintenance personnel."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，确认该更新操作是否符合预期，是否为运维人员触发。"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, filesystem, mitre_persistence, L3]

