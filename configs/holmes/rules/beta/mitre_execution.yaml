- key: Terminal shell in container
  hid: exec_03
  condition: >
    spawned_process and container
    and shell_procs and proc.tty != 0
    and container_entrypoint
    and not user_expected_terminal_shell_in_container_conditions
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,shell=%proc.name,parent=%proc.pname,terminal=%proc.tty,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Terminal shell in container"
      zh: "通过entrypoint/exec的shell进入容器"
    desc:
      en: "Usually we think that normal users will not enter the container through the entrypoint/exec shell. It may be that the attacker uses database injection attacks to obtain database permissions and then execute system commands through the database."
      zh: "通常我们认为正常用户不会通过entrypoint/exec的shell进入容器，可能是攻击者通过数据库注入攻击，获取数据库权限然后通过数据库执行系统命令现象。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and judge after investigation The security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the parent process name is runc, etc., and contact security personnel in a timely manner for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看父进程名是否为runc等，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, shell, mitre_execution, L3]

- key: Running k8s malicious tools in the container
  hid: exec_04
  condition: >
    evt.type = execve and container and
    (not tensorsec_namespace) and
    (proc.cmdline contains "cdk eva" or
     proc.cmdline contains "k0otkit" or
     proc.cmdline contains "kubesploit" or
     proc.cmdline contains "red-kube" or
     proc.cmdline contains "kubestriker" or
     proc.cmdline contains "kube-hunter" or
     proc.cmdline contains "kubiscan"
      )
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,shell=%proc.name,parent=%proc.pname,terminal=%proc.tty,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Running k8s malicious tools in the container"
      zh: "容器内运行k8s恶意工具"
    desc:
      en: "We believe that there should be no such obvious malicious tools in the container. The high probability is that after the attack, the attacker runs Kubernetes (k8s) malicious tools (such as: cdk, k0otkit, etc.) in order to gain control of the cluster, destroy the cluster, and spread horizontally. , resource abuse, stealing credentials and sensitive information, deploying backdoors, etc."
      zh: "我们认为在容器内不应当存在这类明显恶意工具，大概率是攻击者在进行攻击后，运行Kubernetes（k8s）恶意工具(如：cdk、k0otkit等)为了获取集群控制权、破坏集群、横向扩散、资源滥用、窃取凭据和敏感信息、部署后门等。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line includes k0otkit, cdk, red-kube Wait for k8s to use tools and promptly contact security personnel for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行中是否包括k0otkit、cdk、red-kube等k8s利用工具，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, k8s, mitre_execution, L4]

- key: Connecting to a remote server through redis client in container
  hid: exec_05
  condition: >
    evt.type = connect and container and
    fd.sport = 6379  and
    proc.cmdline contains "redis-cli -h " and not proc.cmdline contains "localhost" and not proc.cmdline contains "127.0.0.1" and not k8s.pod.name contains "51c1c6"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,terminal=%proc.tty,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Connecting to a remote server through redis client in container"
      zh: "容器内通过redis客户端连接远程服务器"
    desc:
      en: "Generally, we believe that normal users in the container will not directly manually perform remote redis connections. The high probability is that after the attack, the attacker connects to the remote server through the Redis client in the container to steal sensitive data and obtain unauthorized access. Execute malicious commands, etc."
      zh: "通常我们认为在容器内正常用户不会直接手动执行远程redis连接，大概率是攻击者在进行攻击后，在容器内通过Redis客户端连接远程服务器的目的是窃取敏感数据、获取未授权访问权限、执行恶意命令等。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container id, associated alarm list, etc., and check whether the command line includes redis-cli and ip address, and whether the server port number is port 6379, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行中是否包括redis-cli与ip地址，并且服务端端口号是否为6379端口，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, exec, mitre_execution, mitre_data_leakage, mitre_lateral_movement, L4]

- key: Run the tool for brute-force cracking
  hid: exec_06
  condition: >
    spawned_process and proc.name in (brute_force_binaries)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Run the tool for brute-force cracking"
      zh: "运行暴力破解工具"
    desc:
      en: "Generally, we believe that such tools should not exist in normal containers. There is a high probability that the attacker will use brute force cracking tools (such as hydra and ncrack) to obtain unauthorized access detection of the attacked system after carrying out the attack. This may be accomplished by brute-forcing credentials for SSH, MySQL, or other services. Once the attacker has gained access, they can further probe, manipulate, or compromise the target system."
      zh: "通常我们认为正常容器内不应存在该类工具，大概率是攻击者在进行攻击后，使用暴力破解工具(如：hydra、ncrack)获取受攻击系统的未经授权访问权限探测。这可能是通过暴力破解SSH、MySQL或其他服务的凭证来实现的，一旦攻击者获得了访问权限，他们可以进一步探测、操纵或破坏目标系统。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, And after investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the process name is hydra, john, medusa , ncrack and the command line includes the IP address, please contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为hydra、john、medusa、ncrack并且命令行中包括ip地址，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: ALERT
    urgency: true
    tags: [ATT&CK, network, mitre_execution, L2]

- key: Brute force hacking detected
  hid: exec_07
  condition: >
    evt.type in (connect,sendto,sendmsg)
    and fd.name contains "->"
    and not fd.sport in ("", 53)
    and fd.name != "" and fd.name exists and fd.type in ("ipv4", "ipv6")
    and proc.name in (brute_force_binaries)
    and not proc.name in (known_system_procs_network_activity_binaries)
    and not proc.pname in (known_system_procs_network_activity_binaries)
    and not (package_mgmt_procs or package_mgmt_ancestor_procs)
    and not login_doing_dns_lookup
    and not user_expected_system_procs_network_activity_conditions and container
    and not tensorsec_namespace
    and not proc.cmdline contains "redis-cli -h"
    and not fd.name contains "->127.0.0.1"
    and not fd.name contains "->0.0.0.0:"
    and not fd.name contains "->::1"
  output: >
    pod_id=%k8s.pod.id,syscall_name=%syscall.type,terminal=%proc.tty,user_uid=%user.uid,container_id=%container.id,container_name=%container.name,fd.num=%fd.num,fd.type=%fd.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pgid=%proc.vpgid,proc_name=%proc.name,parent=%proc.pname,proc.aname[0]=%proc.aname[0],proc.aname[1]=%proc.aname[1],gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4]
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
    - name: checkRuleRecentCount
      params: [ 'Brute force hacking detected', 3s, 5, '["fd_sip", "fd_sport", "fd_cip"]', '[]', 1m ]
  info:
    name:
      en: "Brute force hacking detected"
      zh: "检测到正在暴力破解"
    desc:
      en: "We discovered this behavior by detecting high-frequency access and monitoring sensitive ports. The attacker may be using brute force cracking tools (such as hydra, ncrack) to detect unauthorized access to the attacked system. This may be accomplished by brute-forcing credentials for SSH, MySQL, or other services. Once the attacker has gained access, they can further probe, manipulate, or compromise the target system."
      zh: "我们通过检测高频访问及对敏感端口的监控来发现此行为，攻击者可能正在使用暴力破解工具(如：hydra、ncrack)对受攻击系统进行未经授权访问权限探测。这可能是通过暴力破解SSH、MySQL或其他服务的凭证来实现的，一旦攻击者获得了访问权限，他们可以进一步探测、操纵或破坏目标系统。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, file path and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a recurring expectation Behavior, and after investigation, it is judged that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the process name is hydra, john , medusa, ncrack and the command line includes the ip address, and check whether the system call is connect, sendto, sendmsg, and contact the security personnel in time for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为hydra、john、medusa、ncrack并且命令行中包括ip地址，并且查看系统调用是否为connect、sendto、sendmsg，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: ALERT
    urgency: true
    tags: [ATT&CK, network, mitre_execution, L2]

- key: System procs network activity
  hid: exec_08
  condition: >
    (fd.sockfamily = ip and system_procs)
    and (inbound_outbound)
    and not proc.name in (known_system_procs_network_activity_binaries)
    and not login_doing_dns_lookup
    and not user_expected_system_procs_network_activity_conditions
    and container
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,connection=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "System procs network activity"
      zh: "系统二进制发起通信"
    desc:
      en: "Generally, we believe that this behavior will not be performed by normal users or business activities. The high probability is that after the attack, the attacker uses the system binary to communicate with the external server and download malicious applications, or malicious code, backdoors, etc., which are used to execute Malicious actions such as stealing sensitive information, taking control of a system, spreading additional malware, or creating persistent attacks."
      zh: "通常我们认为正常用户或业务活动中不会执行此行为，大概率是攻击者在进行攻击后，利用系统二进制与外部服务器通信，从中下载恶意应用程序，或恶意代码、后门等，被用来执行恶意操作，如窃取敏感信息、控制系统、传播其他恶意软件，或者创建持久性攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, file path and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a recurring expectation Behavior, and after investigation, it is judged that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the system call is accept or listen. , connect and whether the process name is rm, mv, cp, echo and many other binary files, contact security personnel in time for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为accept、listen、connect并且进程名是否为rm、mv、cp、echo等很多二进制文件，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, exec, network, mitre_execution, L3]

- key: Launch Remote File Copy Tools in Container
  hid: exec_09
  condition: >
    spawned_process
    and container
    and remote_file_copy_procs
    and not user_known_remote_file_copy_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent_process=%proc.pname,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Launch Remote File Copy Tools in Container"
      zh: "容器内运行远程文件复制工具"
    desc:
      en: "This event is mainly triggered by the execution of some remote file copy tools in the container. We know that containers have special file copy instructions, and usually such commands are not executed in the container. Once such behavior is discovered, it is most likely because the attacker mistakenly Judgment environment, caused by operating the container as a host"
      zh: "该事件主要是在容器内执行一些远程文件拷贝工具触发，我们知道容器有专门的文件拷贝指令，通常不会在容器内执行该类命令，一旦发现这种行为执行，大概率也是因为攻击者误判环境，将容器当做主机操作造成的"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and it is safe after investigation The risk is controllable and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the process name is rsync, scp, sftp, dcp, and contact security in time. Personnel further investigation"
