  hid: exec_36
  condition: >
    container
    and evt.type = sendfile
    and not tensorsec_namespace and k8s.pod.name contains "ng"
  output: >
    connection=%fd.name,file=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,user=%user.name,user_loginuid=%user.loginuid,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Nginx integer overflow vulnerability"
      zh: "Nginx整数溢出漏洞"
    desc:
      en: "CVE-2017-7529 is an integer overflow vulnerability for Nginx. Generally, we believe that normal users will not actively perform CVE (known vulnerability) related attacks. There is a high probability that attackers will try to exploit it, including denial of service attacks and remote execution. Code, information leakage, abuse of system resources, and persistence intrusion."
      zh: "CVE-2017-7529是一种针对Nginx整数溢出漏洞 ，通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击行为，大概率是攻击者尝试利用它，包括拒绝服务攻击、远程执行代码、信息泄露、滥用系统资源和入侵持久性等目的。"
    suggestion:
      en: "Check whether the open port of k8s Service is the nginx service port, and check the nginx version to ensure that it is not within the 0.5.6 - 1.13.2 version."
      zh: "查看 k8s Service开放端口是否为nginx服务端口，并检查nginx版本确保不在0.5.6 - 1.13.2版本内。"
    rule_type: Discovery
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, mitre_execution, L1]
