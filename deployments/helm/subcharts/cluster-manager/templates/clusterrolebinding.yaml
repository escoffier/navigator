apiVersion: {{ template "rbac.apiVersion" . }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-manager.fullname" . }}
  labels:
{{ include "cluster-manager.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-manager.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "cluster-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}