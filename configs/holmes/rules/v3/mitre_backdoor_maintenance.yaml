- key: Detect outbound connections to common miner pool ports
  disabled: true
  hid: pers_08
  condition: >
    net_miner_pool and not trusted_images_query_miner_domain_dns
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,domain_name=%fd.sip.name,container=%container.info,image=%container.image.repository,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Detect outbound connections to common miner pool ports"
      zh: "检测到连接到常见挖矿池端口的出站连接"
    desc:
      en: "Under normal circumstances, normal systems will not connect to outbound connections to common mining pool ports unless the system's operation and maintenance personnel or administrators explicitly configure mining activities or have related business needs. Normal servers and workstations usually do not actively connect to mining pools, as this is a resource-intensive activity that is usually performed by miners or related business leaders. If there is no clear business need or authorized mining behavior, the presence of outbound connections to the mining pool port in the system may be an anomaly. It may be infected, running a mining program, and trying to connect to the mining pool in order to exploit Computing resources to conduct cryptocurrency mining activities."
      zh: "一般情况下，正常的系统不会连接到常见挖矿池端口的出站连接，除非系统的运维人员或管理员明确配置了挖矿活动或有相关的业务需求。正常的服务器和工作站通常不会主动连接到挖矿池，因为这是一种资源密集型活动，通常由矿工或相关业务负责人执行。如果没有明确的业务需求或授权挖矿行为，系统中出现连接到挖矿池端口的出站连接可能是异常情况，可能受到感染，正在运行挖矿程序，并试图连接到挖矿池，以利用计算资源进行加密货币挖矿活动。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the server address is a mining domain name, and promptly Contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看服务端地址是否为挖矿域名，及时联系安全人员进一步排查"
    rule_type: Persistence
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, mitre_backdoor_maintenance, L1]

- key: Detect crypto miners using the Stratum protocol
  hid: pers_09
  condition: >
    spawned_process and (proc.cmdline contains "stratum+tcp" or proc.cmdline contains "stratum2+tcp" or proc.cmdline contains "stratum+ssl" or proc.cmdline contains "stratum2+ssl")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,image=%container.image.repository,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Detect crypto miners using the Stratum protocol"
      zh: "检测到使用Stratum协议的挖矿程序"
    desc:
      en: "The common abnormal behavior of mining programs using the Stratum protocol has been detected, aiming to identify possible mining activities in the system. Stratum protocol is a protocol used for communication between mining pools and miners to distribute work tasks and receive mining results. Without a clear need or authorization for mining activity, the detection of a mining program using the Stratum protocol may indicate that there may be unauthorized mining activity on the system, which may be caused by malware or unauthorized users. This situation can lead to resource misuse, performance issues, and security risks."
      zh: "检测到使用Stratum协议的挖矿程序通常异常行为，旨在识别系统中可能存在的挖矿活动。Stratum协议是一种用于挖矿池与矿工之间进行通信的协议，用于分发工作任务和接收挖矿结果。如果没有明确的挖矿活动需求或授权，检测到使用Stratum协议的挖矿程序可能表明系统可能存在未经授权的挖矿活动，这可能是由恶意软件或未经授权的用户引起的。这种情况可能会导致资源滥用、性能问题以及安全风险。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the command line contains stratum+tcp, and contact us in time Security personnel further investigate"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含stratum+tcp，及时联系安全人员进一步排查"
    rule_type: Persistence
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, mitre_backdoor_maintenance, L4]
