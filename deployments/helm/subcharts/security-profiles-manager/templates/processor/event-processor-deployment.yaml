apiVersion: {{ include "tensorsec.common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ template "secProfilesManager.fullname" . }}-processor
  labels:
{{ include "secProfilesManager.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "secProfilesManager.name" . }}-processor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "secProfilesManager.name" . }}-processor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ template "secProfilesManager.serviceAccount" . }}-ep
      initContainers:
      - name: "stan-listener"
        image: {{ include "initContainers.image" . }}
        imagePullPolicy: "IfNotPresent"
        command: [
          "sh", "-c",
          "for i in $(seq 1 200); do nc -z -w3 {{ .Values.stan.host }} {{ .Values.stan.port }} && exit 0 || sleep 3; done; exit 1"
        ]
        resources:
{{ toYaml .Values.initContainers.resources | indent 10 }} 
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "eventProcessor.image" . }}
        env:
        - name: STAN_URL
          value: {{ .Values.stan.host }}:{{ .Values.stan.port }}
        - name: STAN_CLUSTER_ID
          value: tensorsec
        - name: CONSOLE_HTTP_ADDR
          value: {{ .Values.console.httpAddr }}
        - name: REDIS_ENDPOINT
          value: "tensorsec-redis-ha-announce-0:26379,tensorsec-redis-ha-announce-1:26379,tensorsec-redis-ha-announce-2:26379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.redisSecretName }}
              key: auth
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TENSORSEC_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.redisSecretName }}
              key: auth
        - name: EVENT_GRPC_URL
          value: {{ .Values.eventcenter.eventGrpcUrl }}
        - name: EVENT_GRPC_CERT_PATH
          value: /auth/server/tls.crt
        - name: EVENT_GRPC_CERT_SERVER_NAME
          value: {{ .Values.eventcenter.eventGrpcCertServerName }}
        volumeMounts:
        - mountPath: /auth/server
          name: server-cert
          readOnly: true
        imagePullPolicy: {{ .Values.eventProcessor.image.pullPolicy }}
        resources:
{{ toYaml .Values.eventProcessor.resources | indent 10 }}
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.image.pullSecret }}
      {{- else if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      volumes:
      - name: server-cert
        secret:
          defaultMode: 400
          secretName: eventcenter-tls-server-cert-secret
