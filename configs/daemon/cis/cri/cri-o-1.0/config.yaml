---
## Controls Files.
# These are YAML files that hold all the details for running checks.
# In here you can set all parameter substitution for cri-bench

components:
  - cri-o

cri-o:
  storages:
    - "/var/lib/containers/storage"
    - "/data/containers/storage"
  defaultstorage: /var/lib/containers/storage

  runstorages:
    - "/var/run/containers/storage"
    - "/run/containers/storage"
  defaultrunstorages: /var/run/containers/storage

  confs:
    - /etc/crio/crio.conf
  defaultconf: /etc/crio/crio.conf
