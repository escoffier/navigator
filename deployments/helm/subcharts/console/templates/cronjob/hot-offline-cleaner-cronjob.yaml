{{- if .Values.persistence.enabled -}}
apiVersion: {{ include "common.capabilities.cronjob.apiVersion" . }}
kind: CronJob
metadata:
  name: cron-data-gc-hotofflinecleaner
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: hotofflinecleaner
spec:
  schedule: {{ .Values.persistence.Cleaner.hotOfflineCronjob.cronString }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      completions: 1
      template:
        spec:
          containers:
            - command:
                - /app/cleaner
                -  clear-hot-offline-storage-tool
              env:
                - name: CONF_PATH
                  value: /app/hot-offline-conf.json
                - name: RDB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "common.postgresql.defaultName" . }}
                      key: postgresql-password
                - name: ELASTIC_URL
                  value: "http://{{ include "common.elasticsearch.defaultName" . }}:9200"
              envFrom:
                - configMapRef:
                    name: common-env
              image: {{ include "jobs.cleaner.image" . }}
              imagePullPolicy: {{ .Values.persistence.Cleaner.image.pullPolicy }}
              name: hotofflinecleaner
              resources:
{{ toYaml .Values.persistence.Cleaner.hotOfflineCronjob.resources | trim | indent 16 }}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /audit
                  name: audit
          restartPolicy: Never
          {{- if .Values.global.image.pullSecret }}
          imagePullSecrets:
          - name: {{ .Values.global.image.pullSecret }}
          {{- else if .Values.image.pullSecret }}
          imagePullSecrets:
          - name: {{ .Values.image.pullSecret }}
          {{- end }}
          volumes:
            - name: audit
              persistentVolumeClaim:
                claimName: audit-pvc
{{- end -}}