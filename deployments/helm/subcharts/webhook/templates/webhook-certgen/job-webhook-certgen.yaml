apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-certgen" (include "common.names.fullname" .) }}-{{ .Release.Revision }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  template:
    metadata:
      name: {{ printf "%s-certgen" (include "common.names.fullname" .) }}-{{ .Release.Revision }}
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app: webhook
    spec:
      initContainers:
        - name: create
          image: {{ include "webhook.certgen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - create
            - --host={{ include "common.names.fullname" . }},{{ include "common.names.fullname" . }}.{{ .Release.Namespace }}.svc
            - --namespace={{ .Release.Namespace }}
            - --secret-name={{ include "common.names.fullname" . }}
            - --cert-name=tls.crt
            - --key-name=tls.key
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: patch
          image: {{ include "webhook.certgen.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - patch
            - --webhook-name={{ include "common.names.fullname" . }}
            - --namespace={{ .Release.Namespace }}
            - --patch-mutating=true
            - --patch-validating=true
            - --secret-name={{ include "common.names.fullname" . }}
            - --patch-failure-policy=Ignore
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      restartPolicy: OnFailure
      serviceAccountName: {{ include "common.names.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
