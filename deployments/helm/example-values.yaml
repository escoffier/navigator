global:
  image:
    registry: harbor.local.tensorsecurity.cn
    repository: tensorsecurity
  verison: &tensorsecVerison 1.0.0
  persistence:
    enabled: &persistenceStorage true
  imagePullSecret:
    url: &imageRegistryURL harbor.local.tensorsecurity.cn
    username: &imageRegistryUsername admin
    password: &imageRegistryPassword Harbor12345
  multiCluster:
    ## Both 'isMasterCluster' and 'isMemberCluster' all need be modified 
    ## and the values of them must be opposite
    isMasterCluster: &isMasterCluster true
    isMemberCluster: &isMemberCluster false
    configs:
      ## console address, use short servicename for MainCluster and exposed address for MemberCluster
      masterAddr: &masterAddr http://tensorsec-console:8889
      ## Unique cluster name, use "default" for MainCluster and other name for MemberCluster
      clusterName: &clusterName default
      ## ApiServer address 
      apiServerAddr: &apiServerAddr 192.168.0.1:6443
      
      




clair:
  enabled: *isMasterCluster
  image:
    tag: *tensorsecVerison

console:
  enabled: *isMasterCluster
  image:
    tag: *tensorsecVerison
  scap:
    tag: *tensorsecVerison
  persistence:
    #enabled: false
    enabled: *persistenceStorage
    tensorsecCleaner:
      image:
        tag: *tensorsecVerison
  imagePullSecret:
    imageRegistryURL: *imageRegistryURL
    imageRegistryUsername: *imageRegistryUsername
    imageRegistryPassword: *imageRegistryPassword
  emailCheck:
    smtpEnabled: false
    smtpHost: smtp.feishu.cn
    smtpPort: 465
    smtpUsername: console-robot@tensorsecurity.cn
    smtpPassword: password
  version:
    softName: tensor
    softVersion: v1.9

scanner:
  enabled: *isMasterCluster
  image:
    tag: *tensorsecVerison
  dockerregistry:
    persistence:
      enabled: *persistenceStorage
      size: 10Gi
    secrets:
      # If you update the username or password of registry, make sure use cli tool htpasswd to generate the bcrypt hash
      # e.g. "htpasswd -nbBC10 $username $password"
      # Default: tensorsec:TensorSec@Passw0rd
      htpasswd: "tensorsec:$2y$10$zYHR.AGhdeKnjpxIKU3.3.XH9MeEUdmSJZil9MUWlqB8b2Q3th7PK"
    service:
      type: ClusterIP
      # clusterIP:
      port: 5000
      # nodePort:
  webshell:
    replicas: 2
#  hostAliases:
#  - ip: "192.168.3.2"
#    hostnames:
#    - "harbor.local.tensorsecurity.cn"

holmes:
  enabled: true
  image:
    tag: *tensorsecVerison
  tensorsecDaemon:
    image:
      tag: *tensorsecVerison
    multicluster:
      consoleaddr: *masterAddr   

image-validator:
  enabled: false
  image:
    #tag: 1.6.8
    tag: *tensorsecVerison

webhook:
  enabled: true
  image:
    tag: *tensorsecVerison
  args:
    consoleUrl: *masterAddr
    

cluster-manager:
  enabled: true
  image:
    tag: *tensorsecVerison
  args:
    masterAddr: *masterAddr
    clusterName: *clusterName
    apiServerAddr: *apiServerAddr

eventcenterAuth:
  enabled: *isMasterCluster

security-profiles-manager:
  enabled: *isMasterCluster
  image:
    tag: *tensorsecVerison
  webhook:
    image:
      tag: *tensorsecVerison
  loader:
    image:
      tag: *tensorsecVerison
  audit:
    image:
      tag: *tensorsecVerison
  eventProcessor:
    image:
      tag: *tensorsecVerison
stan:
  enabled: *isMasterCluster
  store:
    volume:
      enabled: *persistenceStorage
holmessidekick:
  enabled: *isMasterCluster

redis-ha:
  enabled: *isMasterCluster
  persistentVolume:
    enabled: *persistenceStorage
postgresql-ha:
  enabled: *isMasterCluster
  persistence:
    enabled: *persistenceStorage
mongodb:
  enabled: *isMasterCluster
  persistence:
    enabled: *persistenceStorage
elasticsearch:
  enabled: *isMasterCluster
  persistence:
    enabled: *persistenceStorage
kibana:
  enabled: *isMasterCluster

