    type: object
  model.ScanOneForCICDResponse:
    properties:
      is_scan:
        type: boolean
      reject_msg:
        items:
          items:
            type: string
          type: array
        type: array
      safe:
        type: boolean
      sensitive:
        items:
          items:
            type: string
          type: array
        type: array
      virus:
        items:
          items:
            type: string
          type: array
        type: array
      vulu:
        items:
          items:
            type: string
          type: array
        type: array
    type: object
  model.ScanOneStatusResponse:
    properties:
      end_time:
        type: string
      has_malicious:
        type: boolean
      has_sensitive:
        type: boolean
      has_vulu:
        type: boolean
      overall_severity:
        type: string
      overall_severity_int:
        type: integer
      risk_score:
        type: number
      scan_status:
        type: string
    type: object
  model.Sensitive:
    properties:
      description:
        type: string
      description_en:
        type: string
      description_zh:
        type: string
      name:
        type: string
