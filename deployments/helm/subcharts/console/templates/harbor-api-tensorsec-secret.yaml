---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.harbor.harborSecretName }}
  labels:
    helm.sh/chart: {{ include "console.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  password: {{ .Values.harbor.harborPassword | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.pullSecret }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "console.genImagePullSecret" . }}
