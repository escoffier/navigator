- key: Write below binary dir
  hid: exec_17
  condition: >
    bin_dir and evt.dir = < and open_write
    and shell_family_procs
    and not package_mgmt_procs
    and not exe_running_docker_save
    and not python_running_get_pip
    and not python_running_ms_oms
    and not user_known_write_below_binary_dir_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,parent=%proc.pname,gparent=%proc.aname[2],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Write below binary dir"
      zh: "尝试修改二进制目录下面的文件"
    desc:
      en: "Attackers modify files in binary directories, such as /bin, /sbin, /usr/bin and /usr/sbin, usually to implement backdoor implants, privilege escalation attacks, tamper with system behavior, hide malicious activities, or conduct data theft and Tampering and other malicious activities."
      zh: "攻击者修改二进制目录下的文件，如/bin、/sbin、/usr/bin和/usr/sbin，通常是为了实施后门植入、提权攻击、篡改系统行为、隐藏恶意活动或进行数据窃取和篡改等恶意活动。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the file path contains /bin, /sbin, /usr /bin and other directories and whether the system calls include open, openat, etc., contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件路径是否包含/bin、/sbin、/usr/bin等目录并且系统调用是否包含open、openat等，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: WARNING
    urgency: false
    tags: [ATT&CK, exec, filesystem, mitre_execution, L3]

