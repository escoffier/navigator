#/proc/sys/kernel/randomize_va_space
- key: Get the level of address space randomization
  disable: true
  hid: exec_20
  condition: >
    open_read and container
    and fd.name = /proc/sys/kernel/randomize_va_space
    and not falco_sensitive_mount_containers
    and not user_sensitive_mount_containers
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Get the level of address space randomization"
      zh: "获取地址空间随机化的级别"
    desc:
      en: "/proc/sys/kernel/randomize_va_space is a virtual file in Linux systems used to control the level of address space randomization (ASLR). ASLR is a computer security mechanism designed to increase the security of the system by randomizing the allocation of memory addresses to prevent malicious attackers from exploiting memory vulnerabilities. Generally, we believe that normal users will not perform this behavior in the container. There is a high probability that the attacker will read randomize_va_space to obtain the address space randomization (ASLR) level of the system after carrying out the attack to understand the security configuration of the system."
      zh: "/proc/sys/kernel/randomize_va_space 是一个Linux系统中的虚拟文件，用于控制地址空间随机化（ASLR）的级别。ASLR是一种计算机安全机制，旨在增加系统的安全性，通过随机化内存地址的分配来防止恶意攻击者利用内存漏洞。通常我们认为正常用户不会在容器内进行此行为，大概率是攻击者在进行攻击后，读取 randomize_va_space 获取系统的地址空间随机化（ASLR）级别，以了解系统的安全配置。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container id, associated alarm list, etc., and check whether the file path is /proc/sys/kernel/randomize_va_space , promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件路径是否为/proc/sys/kernel/randomize_va_space，及时联系安全人员进一步排查"
    rule_type: Execution
    priority: INFO
    urgency: false
    tags: [ATT&CK, exec, filesystem, mitre_execution, L3]

