global:
  image: 
    registry: ""
    repository: ""


# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1
logLevel: debug
insecureTls: false
nameOverride: clair
fullnameOverride: "tensorsec-clair"
image:
  registry: localhost:32000
  repository: tensorsecurity
  name: tensorsec-clair
  tag: latest
  pullPolicy: Always
  pullSecret: harbor-admin-secret
init: 
  loadSql:
    image:
      registry:  localhost:32000
      repository: tensorsecurity
      name: tensorsec-postgres
      tag: latest
    resources:
      limits:
        cpu: 50m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 128Mi
  waitpg:
    image:
      registry: localhost:32000
      repository: tensorsecurity
      name:  postgres
      tag: 11.3
    resources:
      limits:
        cpu: 50m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 128Mi


## Deployment pod host aliases
#  hostAliases:
#  - ip: "192.168.x.x"
#    hostnames:
#    - "xxx.xxx.com"
hostAliases: []
  
service:
  type: ClusterIP
  internalApiPort: 6060
  externalApiPort: 6060
  internalHealthPort: 6061
  externalHealthPort: 6061
ingress:
  enabled: false
  # Used to create Ingress record (should used with service.type: ClusterIP).
  hosts:
    - chart-example.local
  annotations:
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls:
    # Secrets must be manually created in the namespace.
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local
resources:
  limits:
    cpu: 200m
    memory: 1500Mi
  requests:
    cpu: 200m
    memory: 1500Mi
config:
  postgresServiceName: "tensorsec-postgresql"
  postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"
  paginationKey: "XxoPtCUzrUv4JV5dS+yQ+MdW7yLEJnRMwigVY/bpgtQ="
  updateInterval: 0
  # notificationWebhookEndpoint: https://example.com/notify/me
  enabledUpdaters:
  - debian
  - ubuntu
  - redhat
  # - oracle
  - alpine
  - redhat
  enabledNamespaceDetectors:
  - os-release
  - lsb-release
  - apt-sources
  - alpine-release
  - redhat-release
  enabledFeatureListers:
  - apk
  - dpkg
  - rpm
nodeSelector: {}
tolerations: []
