- key: Schedule Cron Jobs
  disabled: true
  hid: pers_01
  condition: >
    ((open_write and cron_dir_action) or
     (spawned_process and proc.name = "crontab")) and
    not consider_all_cron_jobs and container and
    not user_known_cron_jobs and
    shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,file=%fd.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Schedule Cron Jobs"
      zh: "运行计划任务"
    desc:
      en: "Scheduled tasks are widely used as a regular task execution capability, but in the k8s environment, they are also often used by attackers to create malicious scripts or programs, set up backdoor programs, and continue to tamper with data to maintain persistent access rights. Therefore, this type of task is should be focused on."
      zh: "计划任务作为一种定期任务执行能力被广泛使用，但在k8s环境中也经常被攻击者用于创建恶意脚本或程序、设立后门程序、持续进行数据篡改来维持持久性访问权限，因此对该类型为应进行重点关注。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the process name is crontab, and contact security personnel in a timely manner Further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为crontab，及时联系安全人员进一步排查"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, file, network, mitre_backdoor_maintenance, L2]

- key: Run user mgmt binaries
  hid: pers_02
  condition: >
    spawned_process and proc.name in (user_mgmt_binaries) and shell_parent_procs and
    not proc.name in (su, sudo, lastlog, nologin, unix_chkpwd) and
    not proc.pname in (cron_binaries, systemd, systemd.postins, udev.postinst, run-parts) and
    not proc.cmdline startswith "passwd -S" and
    not proc.cmdline startswith "useradd -D" and
    not proc.cmdline startswith "systemd --version" and
    not run_by_qualys and
    not run_by_sumologic_securefiles and
    not run_by_yum and
    not run_by_ms_oms and
    not run_by_google_accounts_daemon and
    not chage_list and
    not user_known_user_management_activities
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Run user management binaries"
      zh: "运行管理用户、密码或权限的命令"
    desc:
      en: "The reason for being judged to be an attack is usually because the activity of managing users, passwords or permissions may have potential risks and possibilities for abuse, especially without appropriate authorization or supervision (Note: sudo and su are excluded. Some Exceptions are the custom user created on top of the base Linux distribution when the container is started. Some innocuous command lines that don't actually change anything are also excluded). Attackers may attempt to manage users, passwords, or permissions to escalate privileges, access sensitive resources, modify access controls, steal or tamper with data, compromise systems, bypass authentication, move laterally, build backdoors, etc. These actions are generally considered attacks, as they can lead to security issues, data leaks, and privacy violations."
      zh: "被判断为攻击的原因通常是因为对用户、密码或权限进行管理的活动可能存在潜在的风险和滥用的可能性，特别是在没有适当授权或监督的情况下(注：sudo和su除外。一些容器在启动时在基本的Linux发行版之上创建自定义用户除外。一些不会实际更改任何内容的无害命令行也被排除在外)。攻击者可能会试图管理用户、密码或权限，以提升权限、访问敏感资源、修改访问控制、窃取或篡改数据、破坏系统、绕过身份验证、横向移动、建立后门等，这些行为通常被视为攻击，因为它们可能导致安全问题、数据泄漏和隐私侵犯。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process command line uses the following (su, sudo , lastlog, nologin, etc.), promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程命令行是否使用如下(su、sudo、lastlog、nologin等)，及时联系安全人员进一步排查"
    rule_type: Persistence
    priority: WARNING
    urgency: false
    tags: [ATT&CK, exec, mitre_backdoor_maintenance, L2]

