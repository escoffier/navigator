{{- if .Values.auditLog.enabled }}
kind: Service
apiVersion: v1
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  {{- if .Values.falco.webserver.nodePort }}
  type: NodePort
  {{- end }}
  selector: {{- include "common.labels.matchLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.falco.webserver.listenPort }}
    {{- with .Values.falco.webserver.nodePort }}
    nodePort: {{ . }}
    {{- end }}
{{- end }}
{{- if and .Values.falco.grpc.enabled (not .Values.falco.grpc.unixSocketPath)}}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "common.names.fullname" . }}-grpc
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: grpc
spec:
  clusterIP: None
  selector:
    app: {{- include "common.labels.matchLabels" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.falco.grpc.listenPort }}
{{- end }}