      en: "Modify binary dirs"
      zh: "移动或删除二进制目录"
    desc:
      en: "an attempt to modify any file below a set of binary directories"
      zh: "移动或删除二进制目录"
    suggestion:
      en: "Please use the process tree to determine whether the command belongs to the normal behavior of known processes, whether it is executed by malware, the behavior may be a hacker backdoor residency behavior, please confirm the modified file function, you can use offset defense to block new or modified executable files."
      zh: "请通过进程树判断该命令是否属于已知进程的正常行为，是否由恶意软件执行，该行为可能为黑客后门驻留行为，请确认被修改文件功能，可使用偏移防御阻拦新的或被修改的可执行文件。"
    rule_type: Persistence
    priority: ERROR
    urgency: false
    tags: [ATT&CK, filesystem, mitre_persistence, L3]

