producers:
    syscalls:
      - syscallSocket:
        name: socket
        filters:
          - protoFilter:
            id: f1
            field: protocol
            operation: equalTo
            values:
            - v: 132 #IPPROTO_SCTP
          - familyFilter:
            id: f2
            field: family
            operation: equalTo
            values:
            - v: 17 #AF_PACKET
        logic: f1||f2    
      - syscallExecve:
        name: execve
        filters:
          - filenameFilter:
            id: f1
            field: filename
            operation: equalTo
            values:
              - v: /usr/bin/sudo
          - argv1Filter:
            id: f2
            field: argv1
            operation: inArray
            values:
              - v: -u#-1
              - v: -u#4294967295
        logic: f1&&f2
      - syscallOpen:
        name: open
        filters:
          - filenameFilter:
            id: f1
            field: filename
            operation: startsWithArray
            values: 
              - v: /proc/self/exed
            # - v: /proc/self/fd
      - syscallOpenat:
        name: openat
        filters:
          - filenameFilter:
            id: f1
            field: filename
            operation: startsWithArray
            values: 
              - v: /proc/self/exed
            # - v: /proc/self/fd
consumers:
  - Json
