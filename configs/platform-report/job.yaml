---
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorsec-platform-report
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: platform-report
    spec:
      containers:
        - name: platform-report
          image: localhost:32000/tensorsec-platform-report:latest
          command: ["/tensor-platform-report"]
          imagePullPolicy: Always
          env:
            - name: PGSQL_HOST
              value: tensorsec-postgresql
            - name: PGSQL_PORT
              value: 5432
            - name: PGSQL_USER
              value: postgres
            - name: PGSQL_DBNAME
              value: postgres
            - name: PGSQL_SSL_MODE
              value: disable
            - name: PGSQL_PASSWORD
              value: password
          volumeMounts:
            - name: audit
              mountPath: /audit
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "1000Mi"
              cpu: "0.5"
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-admin-secret
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: audit-pvc

  backoffLimit: 0
