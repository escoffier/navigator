  - id: 3.1
    text: "Disable unused network protocols and devices"
    checks:
      - id: 3.1.1
        text: "Disable IPv6"
        audit: "grep \"^\\s*linux\" /boot/grub2/grub.cfg | grep -v ipv6.disable=1"
        type: "manual"
        scored: false

      - id: 3.1.2
        text: "Ensure wireless interfaces are disabled"
        audit: |
          #!/bin/bash
          if command -v nmcli >/dev/null 2>&1 ; then
              if nmcli radio all | grep -Eq '\s*\S+\s+disabled\s+\S+\s+disabled\b'; then
                  echo "Wireless is not enabled"
              else
                  nmcli radio all
              fi
          elif [ -n "$(find /sys/class/net/*/ -type d -name wireless)" ]; then t=0
              mname=$(for driverdir in $(find /sys/class/net/*/ -type d -name wireless | xargs -0 dirname); do basename "$(readlink -f "$driverdir"/device/driver/module)";done | sort -u)
              for dm in $mname; do
                  if grep -Eq "^\s*install\s+$dm\s+/bin/(true|false)" /etc/modprobe.d/*.conf; then
                      /bin/true
                  else
                      echo "$dm is not disabled"
                      t=1
                  fi
              done
              [ "$t" -eq 0 ] && echo "Wireless is not enabled"
          else
              echo "Wireless is not enabled"
          fi
        tests:
          test_items:
            - flag: "Wireless is not enabled"
        type: ""
        scored: true

  - id: 3.2
    text: "Network Parameters (Host Only)"
    checks:
      - id: 3.2.1
        text: "Ensure IP forwarding is disabled"
        audit: "sysctl net.ipv4.ip_forward"
        tests:
          test_items:
            - flag: "net.ipv4.ip_forward"
              compare:
                op: eq
                value: "0"
        type: ""
        scored: true

      - id: 3.2.2
        text: "Ensure packet redirect sending is disabled"
        audit: |
          sysctl net.ipv4.conf.all.send_redirects
          sysctl net.ipv4.conf.default.send_redirects
        tests:
          bin_op: and
          test_items:
            - flag: "net.ipv4.conf.all.send_redirects"
              compare:
                op: eq
                value: "0"
            - flag: "net.ipv4.conf.default.send_redirects"
              compare:
