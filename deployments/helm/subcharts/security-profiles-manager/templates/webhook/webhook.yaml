apiVersion: {{ include "common.capabilities.admissionregistration.apiVersion" . }}
kind: MutatingWebhookConfiguration
metadata:
  name: {{ printf "%s-webhook" (include "common.names.fullname" .) }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: sec-prof-man-webhook
webhooks:
  - name: {{ printf "%s-webhook" (include "common.names.fullname" .) }}.{{ .Release.Namespace }}.svc
    clientConfig:
      caBundle: 
      service:
        name: "{{ printf "%s-webhook" (include "common.names.fullname" .) }}"
        namespace: "{{ .Release.Namespace }}"
        path: "/mutate"
    rules:
      - operations: [ "CREATE" ]
        apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        resources: [ "pods" ]
    failurePolicy: Ignore
    namespaceSelector:
      matchExpressions:
        - key: "name"
          operator: "NotIn"
          values:
            - "kube-system"
            - "{{ .Release.Namespace }}"
    sideEffects: None
    {{- if eq (include "common.capabilities.admissionregistration.apiVersion" .) "admissionregistration.k8s.io/v1" }}
    admissionReviewVersions:
      - v1beta1
      - v1
    {{- end }}
