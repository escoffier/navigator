apiVersion: {{ include "tensorsec.common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ template "scanner.fullname" . }}
  labels:
{{ include "scanner.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "scanner.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "scanner.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
    # {{- with .Values.imagePullSecrets }}
    #   imagePullSecrets:
    #     {{- toYaml . | nindent 8 }}
    # {{- end }}
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.image.pullSecret }}
      {{- else if .Values.image.pullSecret }}87
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      initContainers:
      - name: "postgres-listener"
        image: {{ include "scanner.init.image" . }}
        imagePullPolicy: "IfNotPresent"
        command: [
          "sh", "-c",
          "for i in $(seq 1 200); do nc -z -w3 tensorsec-postgresql 5432 && exit 0 || sleep 3; done; exit 1"
        ]
        resources:
{{ toYaml .Values.init.resources | trim | indent 10 }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ include "scanner.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/tensor-scanner"]
        args:
        - --image-cache-server-ip={{ include "scanner.fullname" . | quote }}
        - --image-cache-server-port={{ .Values.service.ImageCacheServerPort | quote}}
        - --redis-endpoint="tensorsec-redis-ha-announce-0:26379,tensorsec-redis-ha-announce-1:26379,tensorsec-redis-ha-announce-2:26379"
        - --http-listen-addr=":8080"
        - --db-connect-str={{ .Values.postgresql.postgresURI | quote }}
        - --pvc-path="/root/alldb"
        - --web-shell-server-addr="http://{{ include "scanner.fullname" . }}-webshell-server:80"
        env:
          - name: TENSORSEC_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.redis.redisSecretName }}
                key: auth
          - name: CICD-BUF-REGISTRY-URL
            value: http://{{ template "scanner.fullname" . }}-dockerregistry:{{ .Values.dockerregistry.service.httpPort }}
          - name: CICD-BUF-REGISTRY-USER
            value: "tensorsec"
          - name: CICD-BUF-REGISTRY-PASSWORD
            value: "TensorSec@Passw0rd"
          - name: REGISTRY_GC_PORT
            value: {{ .Values.dockerregistry.service.gcPort | quote }}
          - name: SAFENODE-BUF-REGISTRY-URL
            value: http://{{ template "scanner.fullname" . }}-dockerregistry:{{ .Values.dockerregistry.service.httpPort }}
          - name: SAFENODE-BUF-REGISTRY-USER
            value: "tensorsec"
          - name: SAFENODE-BUF-REGISTRY-PASSWORD
            value: "TensorSec@Passw0rd"
          - name: SAFENODE-BUF-INTERNAL
            value: "5"
        ports:
          - containerPort: {{ .Values.service.ApiContainerPort }}
            name: {{ include "scanner.name" . }}-api
          - containerPort: {{ .Values.service.ImageCacheServerPort }}
            name: {{ include "scanner.name" . }}-cache
        volumeMounts:
          - name: scannerfiles
            mountPath: "/config/patterns.json"
            subPath: patterns.json
          - name: dockersock
            mountPath: "/var/run/docker.sock"
          - name: tmp
            mountPath: "/tmp/"
          - mountPath: /eventcenter-config
            name: scanner-eventcenter-config
          - mountPath: /auth/ca
            name: ca-cert
          - mountPath: /root/alldb
            name: vuln-db
        resources:
{{ toYaml .Values.resources | indent 10 }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "tensorsec.tplvalues" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      volumes:
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
      - name: tmp
        hostPath:
          path: /tmp/
      - name: scannerfiles
        configMap:
          name: {{ template "scanner.fullname" . }}-configmap
          items:
            - key: patterns.json
              path: patterns.json
      - name: scanner-eventcenter-config
        secret:
          defaultMode: 420
          secretName: eventcenter-tls-client-cert-secret
      - name: ca-cert
        secret:
          defaultMode: 400
          secretName: eventcenter-tls-ca-secret
      {{- if .Values.persistence.enabled }}
      - name: vuln-db
        persistentVolumeClaim:
          claimName: {{ template "scanner.fullname" . }}-vulndb
      {{- else }}
      - name: vuln-db
        emptyDir: {}
      {{- end }}
