apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: {{ .Values.data.coldCronjob.fullnameOverride }}
  labels:
    app: {{ .Values.data.coldCronjob.nameOverride }}
spec:
  schedule: {{ .Values.data.coldCronjob.cronString }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      completions: 1
      template:
        spec:
          containers:
            - command:
                - /app/tensor-cleaner
                - clear-cold-storage-tool
              env:
                - name: MONGO_USERNAME
                  value: {{ .Values.mongo.mongoUsername }}
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongo.mongoSecretName }}
                      key: mongodb-password
                - name: MONGO_ENDPOINT
                  value: tensorsec-mongodb:27017
                - name: MONGO_DATABASE
                  value: {{ .Values.mongo.mongoDatabase }}
                - name: AUDIT_PATH
                  value: /audit
              image: "{{ .Values.global.ourDockerRepo }}/{{ .Values.data.image.name }}:{{ .Values.data.image.tag }}"
              name: {{ .Values.data.coldCronjob.nameOverride }}
              resources:
{{ toYaml .Values.data.coldCronjob.resources | indent 16 }}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /audit
                  name: audit
          restartPolicy: Never
          imagePullPolicy: {{ .Values.data.image.pullPolicy }}
          imagePullSecrets:
            - name: {{ .Values.data.image.pullSecret }}
          volumes:
            - name: audit
              persistentVolumeClaim:
                claimName: audit-pvc