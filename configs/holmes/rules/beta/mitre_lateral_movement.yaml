- key: Contact K8S API Server From Container
  hid: move_05
  condition: >
    evt.type=connect and evt.dir=< and
    (fd.typechar=4 or fd.typechar=6) and
    container and
    not k8s_containers and
    k8s_api_server and
    not ignore_proc_args and
    not user_known_contact_k8s_api_server_activities
    and not fd.sport = 22
    and not k8s.ns.name = "kube-system" and not k8s.ns.name = "argocd" and not k8s.ns.name = "monitoring" and not k8s.ns.name = "stio-system" and not k8s.ns.name = "tensorsec" and not k8s.ns.name = "istio-system"
    and not proc.name in (antrea-controll, kube-state-metr, pilot-agent)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,connection=%fd.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Contact K8S API Server From Container"
      zh: "容器内访问K8S-API-Server"
    desc:
      en: "Generally, we believe that normal users will not directly manage k8s clusters in containers. There is a high probability that attackers will gain unauthorized access to the entire cluster by accessing the Kubernetes API Server after conducting an attack. This could allow them to perform malicious actions such as creating, modifying, or deleting Pods, services, configurations, and other resources taking control of the entire cluster."
      zh: "通常我们认为正常用户不会在容器中直接管理k8s集群，大概率是攻击者在进行攻击后，通过访问Kubernetes API Server获取对整个集群的未经授权访问权限。这可能允许他们执行恶意操作，如创建、修改或删除Pod、服务、配置和其他资源控制整个集群。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains kubectl, curl, and server Check whether the address is apiserver port 8080 or 6443. Contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含kubectl、curl及服务端地址是否为apiserver 8080、6443端口，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: NOTICE
    urgency: true
    tags: [ATT&CK, k8s, network, container, mitre_lateral_movement, L4]

- key: Program run with disallowed http proxy env
  hid: move_06
  condition: >
    spawned_process and
    http_proxy_procs and
    not allowed_ssh_proxy_env and
    proc.env icontains HTTP_PROXY
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Program run with disallowed http proxy env"
      zh: "尝试运行含有代理的程序"
    desc:
      en: "We know that the image is usually packaged and deployed online to become a container. The environment has satisfied the normal operation of the business and will not suddenly change the business in the container. The high probability is that after the attack, the attacker uses a proxy to: Network Stealth and bypassing network restrictions. Through proxies, attackers can hide their true online identity and location, making tracking and detection more difficult. At the same time, they can bypass network firewalls or filtering rules through proxy servers, access blocked or restricted resources, and even attack external targets."
      zh: "我们知道，镜像通常在被打包好后部署上线成为容器，其环境已经满足业务正常运行，不会突然对容器内业务进行更改等操作，大概率是攻击者在进行攻击后，使用代理为了：网络隐匿性和绕过网络限制。通过代理，攻击者可以隐藏其真实的网络身份和位置，使追踪和检测变得更加困难。同时，他们可以通过代理服务器绕过网络防火墙或过滤规则，访问被封锁或限制的资源，甚至对外部目标进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the process is curl, wget, and contact security in time Personnel further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程是否为curl、wget，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: INFO
    urgency: false
    tags: [ATT&CK, network, mitre_lateral_movement, L3]

- key: Try ssh connection in container
  hid: move_07
  condition: >
    (inbound_outbound) and allowed_ssh_hosts and container and not fd.name contains "->127.0.0.1" and not fd.name contains "->0.0.0.0:" and not fd.name contains "->::1"
  output: >
    connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Try ssh connection in container"
      zh: "检测到在容器内尝试ssh连接"
    desc:
      en: "SSH connections are generally a legitimate operation performed by system administrators or authorized users. SSH connections within a container may be considered unusual behavior, as containers are typically used to host services rather than provide SSH access, and access to a container is usually not via SSH. There is a high probability that the attacker attempts an SSH connection within the container after carrying out the attack to gain unauthorized access. It can use password guessing and brute force cracking, establish SSH tunnels and proxies, conduct system detection and vulnerability exploitation, and steal and tamper with sensitive data, as well as move laterally and penetrate laterally in the network."
      zh: "SSH连接通常是由系统管理员或经授权的用户执行的合法操作。在容器内进行SSH连接可能被视为不寻常的行为，因为容器通常用于承载业务，而不是提供SSH访问，进入容器通常也不通过SSH的方式。大概率是攻击者在进行攻击后在容器内尝试SSH连接是为了获取未经授权的访问权限。可以通过密码猜测和暴力破解、建立SSH隧道和代理、进行系统探测和漏洞利用，以及窃取和篡改敏感数据，以及在网络中横向移动和侧向渗透。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the client IP address and process command line contain ssh or other unknown programs, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看客户端IP地址及进程命令行是否包含ssh或其他未知程序，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: WARNING
    urgency: false
    tags: [ATT&CK, network, exec, container, mitre_lateral_movement, L2]

- key: Try ssh connection in host
  hid: move_08
  condition: >
    (inbound_outbound) and allowed_ssh_hosts and not container and not proc.cmdline = "sshd -D" and not fd.name contains "->127.0.0.1" and not fd.name contains "->0.0.0.0:" and not fd.name contains "->::1"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Try ssh connection in host"
      zh: "检测到在主机上尝试ssh连接"
    desc:
      en: "Normally in a cluster, normal users will not SSH to a host and then SSH to other hosts on that host. It may be that an attacker, after obtaining certain permissions, uses the current host as a springboard and attempts an SSH connection to gain unauthorized access. . It can use password guessing and brute force cracking, establish SSH tunnels and proxies, conduct system detection and vulnerability exploitation, and steal and tamper with sensitive data, as well as move laterally and penetrate laterally in the network."
      zh: "通常集群情况下正常用户不会ssh连接到主机后再在该主机上ssh连接其他主机，可能是攻击者在获取一定权限后，将当前主机作为跳板并尝试SSH连接以获取未经授权的访问权限。可以通过密码猜测和暴力破解、建立SSH隧道和代理、进行系统探测和漏洞利用，以及窃取和篡改敏感数据，以及在网络中横向移动和侧向渗透。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the server port is 22, 62222, etc. ssh port, contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看服务端端口是否为22、62222等常见ssh端口，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: WARNING
    urgency: false
    tags: [ATT&CK, network, exec, mitre_lateral_movement, L2]

#find /var -name docker.sock
- key: Find the docker.sock file
  disable: true
  hid: move_09
  condition: >
    spawned_process 
    and not container
    and (proc.name = "find" and evt.arg.args contains "docker.sock")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Find the docker.sock file"
      zh: "查找docker.sock文件"
    desc:
      en: "The docker.sock file is a Unix Domain Socket for the Docker daemon, which allows local processes to communicate with the Docker daemon to perform container operations such as creating, running, stopping, and deleting containers. The high probability is that the attacker is looking for the docker.sock file on the Kubernetes (K8s) node. In order to carry out a container escape (Container Escape) attack, by gaining access to the file, they can perform dangerous operations inside the container, including starting a privileged container, Attempts to container escape, modify, or destroy other containers."
      zh: "docker.sock 文件是 Docker 守护程序的 Unix 域套接字（Unix Domain Socket），它允许本地进程与 Docker 守护程序进行通信，以执行容器操作，例如创建、运行、停止和删除容器。大概率是攻击者在 Kubernetes (K8s) 节点上查找 docker.sock 文件为了实施容器逃逸（Container Escape）攻击，通过获取对该文件的访问权限，他们可以在容器内部执行危险操作，包括启动特权容器、尝试容器逃逸、修改或破坏其他容器。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process command line contains docker.sock, and promptly Contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程命令行是否包含docker.sock，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: INFO
    urgency: true
    tags: [ATT&CK, file, exec, mitre_lateral_movement, L1]

#docker build .
- key: The host builds a container image
  hid: move_10
  condition: >
    (evt.type = execve or evt.type = clone)
    and not container
    and (evt.dir = < or evt.dir = >>)
    and proc.name = "docker" 
    and proc.cmdline contains "build" 
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "The host builds a container image"
      zh: "宿主机构造容器镜像"
    desc:
      en: "Constructing container images on the host is generally not a normal practice because it introduces potential security risks. Under normal circumstances, container images are usually created in a developer's development environment or a dedicated build server, and then the image is pushed to the container registry, and finally deployed on the node by a container orchestration system (such as Kubernetes). There is a high probability that the attacker constructs a malicious container image on the node after conducting the attack to implement container escape attacks, gain control of the host, create privileged containers to abuse host resources, perform malicious operations, inject malicious code or backdoors, and steal Sensitive information, misuse of container resources to interfere with other containers or applications, or even serve as a starting point for launching network attacks."
      zh: "宿主机上构造容器镜像通常不是正常的做法，因为这会引入潜在的安全风险。正常情况下，容器镜像的创建通常在开发者的开发环境或专门的构建服务器上进行，然后将镜像推送到容器注册表中，最后由容器编排系统（如Kubernetes）在节点上进行部署。大概率是攻击者在进行攻击后在节点上构造恶意容器镜像，以实施容器逃逸攻击、获取对宿主主机的控制权、创建特权容器以滥用主机资源、执行恶意操作、注入恶意代码或后门、窃取敏感信息、滥用容器资源干扰其他容器或应用程序，甚至作为发起网络攻击的起点。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process command line contains docker and dockerfile, and promptly Contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程命令行是否包含docker及dockerfile，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: INFO
    urgency: true
    tags: [ATT&CK, exec, docker, mitre_lateral_movement, L1]

#docker inspect ca59be69b71e
- key: View container details
  disable: true
  hid: move_11
  condition: >
    (evt.type = execve or evt.type = clone)
    and not container
    and proc.name = "docker"
    and proc.cmdline contains "inspect"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "View container details (such as: the absolute path of the container on the host, etc.)"
      zh: "查看容器详细信息(如：容器在宿主机绝对路径等)"
    desc:
      en: "Generally, we believe that normal users within the container will not perform this behavior. The high probability is that the attacker views the container details on the node after conducting the attack to obtain sensitive information about the container, including configuration, vulnerabilities, network settings, and mounted volumes. etc. for subsequent attacks or penetration testing. This may include information gathering, vulnerability detection, subsequent attack preparation, reconnaissance and intelligence gathering, misuse of configuration information and network reconnaissance."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后在节点上查看容器详细信息是为了获取关于容器的敏感信息，包括配置、漏洞、网络设置和挂载卷等，以便进行后续的攻击或渗透测试。这可能包括信息搜集、漏洞探测、后续攻击准备、侦察和情报收集、滥用配置信息和网络侦察。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains docker, inspect, etc., and promptly Contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含docker、inspect等，及时联系安全人员进一步排查"
    rule_type: Lateral_Movement
    priority: INFO
    urgency: false
    tags: [ATT&CK, exec, docker, mitre_lateral_movement, L1]

- key: nps proxy
  disable: true
  hid: move_12
  condition: >
    container
    and evt.args contains "type="
    and ((syscall.type = read and evt.args contains ".server_addr=" and evt.args contains ".vkey=")
    or (syscall.type = clone and evt.args contains "-vkey=" and evt.args contains "-server="))
  output: >
    pod_id=%k8s.pod.id,syscall_name=%syscall.type,terminal=%proc.tty,user_uid=%user.uid,container_id=%container.id,container_name=%container.name,fd.num=%fd.num,fd.type=%fd.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pgid=%proc.vpgid,proc_name=%proc.name,parent=%proc.pname,proc.aname[0]=%proc.aname[0],proc.aname[1]=%proc.aname[1],gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],evt_args=%evt.args
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.evt_args ]
  info:
    name:
      en: "nps proxy"
      zh: "nps 代理"
    desc:
      en: "Running an nps proxy in a container is usually not a normal user behavior. It is most likely an operation performed by an attacker after an attack to hide network traffic, establish persistent access channels, bypass firewalls and security policies, expand the attack surface, and collect sensitive information. Attackers use proxies to conceal their network activities, ensure persistent access, and obtain intelligence on system and network configurations to further carry out attacks."
      zh: "容器中运行 nps 代理通常不会是正常用户的行为，这大概率是攻击者在进行攻击后为隐藏网络流量、建立持久访问通道、绕过防火墙和安全策略、扩大攻击面以及收集敏感信息等目的而进行的操作。攻击者利用代理来隐蔽其网络活动，确保持久访问，并获取系统和网络配置的情报，从而进一步实施攻击。"
