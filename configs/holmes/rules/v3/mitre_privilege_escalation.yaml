- key: Mount the host root directory to the container
  disabled: true
  hid: priv_31
  condition: >
    spawned_process 
    and not container
    and shell_parent_procs
    and (proc.name = "docker" or proc.name = "kubectl")
    and (proc.cmdline contains "exec" and proc.cmdline contains "mount" and proc.cmdline contains "/root")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Mount the host root directory to the container"
      zh: "将宿主机root目录挂载到容器"
    desc:
      en: "Unsafe mounting is prone to hacker privilege escalation attacks. Please confirm whether the mounting is necessary. If not necessary, please change the mounting path."
      zh: "将宿主机的root目录挂载到容器是一种高风险的操作，因为它允许容器内的用户访问并修改宿主机操作系统的核心文件和目录，这可能导致严重的安全和稳定性问题。攻击者如果获得对容器的访问权限，可以借此机会修改宿主机上的文件、破坏系统、获取系统权限等。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process name is docker, kubectl, and command line Whether it contains /root, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为docker、kubectl及命令行是否包含/root，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: INFO
    urgency: false
    tags: [ATT&CK, network, docker, mitre_privilege_escalation, L1]

#Escape via SYS_PTRACE permissions
- key: Escape via SYS_PTRACE permissions
  disabled: true
  hid: priv_32
  condition: >
    container 
    and syscall.type = ptrace
    and shell_parent_procs
    and not proc.cmdline contains "strace"
    and not falco_sensitive_mount_containers
    and not user_sensitive_mount_containers
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Escape via SYS_PTRACE permissions"
      zh: "通过SYS_PTRACE权限逃逸"
    desc:
      en: "The SYS_PTRACE permission is a Linux kernel permission that allows a process to monitor and track the execution of other processes, including reading and modifying their memory, register state, etc. Usually we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts. The high probability is that attackers obtain SYS_PTRACE permissions and try to inject malicious code into other processes, or modify the memory and execution status of the process. Elevate the privilege level of its process to bypass system security measures. This allows them to access resources outside the container and carry out attacks on the host machine or other containers."
      zh: "SYS_PTRACE 权限是一个 Linux 内核权限，允许进程监视和跟踪其他进程的执行，包括读取和修改其内存、寄存器状态等。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者获取 SYS_PTRACE 权限，尝试注入恶意代码到其他进程中，或者修改进程的内存和执行状态，来提升其进程的权限级别，以绕过系统安全措施。这可以让他们访问容器外部的资源，对宿主主机或其他容器进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains strace and whether the system call is ptrace, contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含strace及系统调用是否为ptrace，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: false
    tags: [ATT&CK, mitre_privilege_escalation, L2]

#cat /test/lxcfs/cgroup/devices.allow
- key: lxcfs escape
  disabled: true
  hid: priv_33
  condition: >
    container and (open_write or open_read)
    and (fd.name contains "lxcfs" and fd.name endswith "devices.allow") 
    and not falco_sensitive_mount_containers
    and not user_sensitive_mount_containers
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent=%proc.pname,file=%fd.name,program=%proc.name,gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4],container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "lxcfs escape"
      zh: "lxcfs逃逸"
    desc:
      en: "Mounting LXCFS (Linux Containers Filesystem) into a container is usually to improve the performance and resource isolation of the container to provide a better file system view and resource statistics. LXCFS allows processes within the container to view the virtualized file system and process information without accessing the real file system of the host host. Usually we think that normal users in the container will not perform this behavior. The high probability is that the attacker will use the vulnerability or improper configuration in LXCFS after the attack to escape from the container to the operating system of the host host and gain complete control of the host. , which may lead to host abuse and intrusion."
      zh: "将LXCFS（Linux Containers Filesystem）挂载到容器中通常是为了改善容器的性能和资源隔离，以提供更好的文件系统视图和资源统计。LXCFS允许容器内的进程查看虚拟化的文件系统和进程信息，而不会访问到宿主主机的真实文件系统。通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后利用LXCFS中的漏洞或配置不当，从容器内逃逸到宿主主机的操作系统，获取对主机的完全控制权，可能导致主机被滥用和入侵。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the file descriptor contains lxcfs and ends with devices. .allow, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否包含lxcfs及结尾是devices.allow，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, filesystem, mitre_privilege_escalation, L3]

