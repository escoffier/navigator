---
{{- if .Values.stan.nats.serviceRoleAuth.enabled }}
apiVersion: nats.io/v1alpha2
kind: NatsServiceRole
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    nats_cluster: {{ .Values.stan.nats.serviceRoleAuth.natsClusterName }}
spec:
  permissions:
    publish: [">"]
    subscribe: [">"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "common.names.fullname" . }}
{{- end }}
