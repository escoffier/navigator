##attck_rule_type=Privilege_Escalation
- rule: Launch Privileged Container
  hid: priv_01
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "This behavior is likely to cause hackers to escape from the container to the host. Please confirm whether it is necessary to start the privileged container with privileges. This can be controlled through the privileged parameter when the container starts."
    zh:
      key: "处置建议"
      value: "该行为容易导致黑客从容器中逃逸到主机，请确认该特权容器采用特权启动是否必要，可通过容器启动时privileged参数进行控制。"
  desc: Detect the initial process started in a privileged container. Exceptions are made for known trusted images.
  condition:
    container_started and container
    and container.privileged=true
    and not falco_privileged_containers
    and not user_privileged_containers
    and not tensorsec_namespace
  output: >
    Privileged container started (zh_msg=特权容器启动,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,original_info=user=%user.name user_loginuid=%user.loginuid %container.info image=%container.image.repository:%container.image.tag,container_id=%container.id,container_name=%container.name)
  priority: INFO
  tags: [ATT&CK, container, cis, mitre_privilege_escalation, mitre_lateral_movement, strict]

- rule: Non sudo setuid
  hid: priv_02
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "Setuid is usually a system management permission operation. A non root call may be a hacker's authorization act. Please confirm whether the system has been invaded."
    zh:
      key: "处置建议"
      value: "setuid通常为系统管理权限操作，非root调用可能为黑客提权行为，请确认系统是否遭到入侵。"
  desc: >
    an attempt to change users by calling setuid. sudo/su are excluded. users "root" and "nobody"
    suing to itself are also excluded, as setuid calls typically involve dropping privileges.
  condition: >
    evt.type=setuid and evt.dir=>
    and (known_user_in_container or not container)
    and not user.name=root
    and not somebody_becoming_themself
    and not proc.name in (known_setuid_binaries, userexec_binaries, mail_binaries, docker_binaries,
                          nomachine_binaries)
    and not proc.name startswith "runc:"
    and not java_running_sdjagent
    and not nrpe_becoming_nagios
    and not user_known_non_sudo_setuid_conditions
  output: >
    Unexpected setuid call by non-sudo, non-root program (zh_msg=非sudo、非root程序意外调用setuid,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,original_info=user=%user.name user_loginuid=%user.loginuid cur_uid=%user.uid parent=%proc.pname
    uid=%evt.arg.uid container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: NOTICE
  tags: [ATT&CK, users, mitre_privilege_escalation]

- rule: System user interactive
  hid: priv_03
  hthreats: 0
  suggestion:
    en:
      key: "Suggestions"
      value: "This behavior usually exists when hackers use application vulnerabilities to execute commands. Please confirm whether any applications have been attacked by hackers."
    zh:
      key: "处置建议"
      value: "该行为通常存在于黑客利用应用漏洞执行命令，请确认是否有应用遭到黑客攻击。"
  desc: an attempt to run interactive commands by a system (i.e. non-login) user
  condition: spawned_process and system_users and interactive and not user_known_system_user_login
  output: >
    System user ran an interactive command (zh_msg=未登录用户试图运行交互式命令,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,original_info=user=%user.name user_loginuid=%user.loginuid container_id=%container.id container_name=%container.name image=%container.image.repository)
  priority: ALERT
  tags: [ATT&CK, users, mitre_remote_access_tools]

- rule: Set Setuid or Setgid bit
  hid: priv_04
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "Please confirm the purpose of this operation, and whether the modified file is an externally imported dangerous file."
    zh:
      key: "处置建议"
      value: "请确认该操作行为目的，被修改文件是否为外部引入危险文件。"
  desc: >
    When the setuid or setgid bits are set for an application,
    this means that the application will run with the privileges of the owning user or group respectively.
    Detect setuid or setgid bits set via chmod
  condition: >
    consider_all_chmods and chmod and (evt.arg.mode contains "S_ISUID" or evt.arg.mode contains "S_ISGID")
    and not proc.name in (user_known_chmod_applications)
    and not exe_running_docker_save
    and not user_known_set_setuid_or_setgid_bit_conditions
  output: >
    Setuid or setgid bit is set via chmod (zh_msg=通过chmod修改文件访问权限,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,original_info=fd=%evt.arg.fd filename=%evt.arg.filename mode=%evt.arg.mode user=%user.name user_loginuid=%user.loginuid process=%proc.name
    container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [ATT&CK, process, mitre_persistence]

- rule: Delete or rename shell history
  hid: priv_05
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "Usually, this behavior occurs when the hacker clears the attack trace. Please confirm whether it is invaded."
    zh:
      key: "处置建议"
      value: "通常该行为发生于黑客清除攻击痕迹，请确认是否遭到入侵。"
  desc: Detect shell history deletion
  condition: >
    (modify_shell_history or truncate_shell_history) and
       not var_lib_docker_filepath and
       not proc.name in (docker_binaries)
  output: >
    Shell history had been deleted or renamed (zh_msg=删除或重命名shell历史记录,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,original_info=user=%user.name user_loginuid=%user.loginuid type=%evt.type fd_name=%fd.name name=%evt.arg.name path=%evt.arg.path oldpath=%evt.arg.oldpath %container.info container_id=%container.id,container_name=%container.name)
  priority: WARNING
  tags: [ATT&CK, process, mitre_defense_evasion]

- rule: Escape to access by chroot
  hid: priv_06
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container is intruded, and the hacker escapes by attaching the directory. Please check whether the cluster permissions are trapped, and confirm whether the container is started by privileges. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，黑客通过挂载目录逃逸，请排查集群权限是否陷落，并确认该容器是否通过特权启动，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: Container escape to access host system
  condition: >
    (evt.type=chroot and container and proc.name !=sshd and proc.name !=vsftpd)
    and not (tensorsec_namespace and (k8s.pod.name contains "-host-" or k8s.pod.name contains "-docker-" or k8s.pod.name contains "-kube-"))
  output: >
    container escape to access host system (zh_msg=容器内挂载主机目录逃逸,rule_type=Privilege_Escalation,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK]

- rule: Escape to access rule by procfs
  hid: priv_07
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container has been invaded. Please check whether the cluster permissions have fallen. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，请排查集群权限是否陷落，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: Container escape to access host system
  condition: >
    open_write and container and fd.name contains /sys/kernel/core_pattern
  output: >
    container escape to access host system (zh_msg=容器内通过procfs逃逸,rule_type=Privilege_Escalation,fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK]

- rule: Escape to access rule by debugfs
  hid: priv_08
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container has been invaded. Please check whether the cluster permissions have fallen. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，请排查集群权限是否陷落，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: Detect file system debugger debugfs launched inside a privileged container which might lead to container escape.
  condition: >
   evt.type = write and container and evt.arg.data contains "debugfs " and not evt.arg.data contains "-w" and proc.cmdline contains " -w"
  output: >
    container escape to access host system (zh_msg=容器内通过debugfs逃逸,rule_type=Privilege_Escalation,fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name)
  priority: ALERT
  tags: [ATT&CK]

- rule: Escape to access rule by cgroup
  hid: priv_09
  hthreats: 1
  suggestion:
    en:
      key: "Suggestions"
      value: "The container has been invaded. Please check whether the cluster permissions have fallen. You can try to use micro isolation and immune defense to prevent the risk from spreading further."
    zh:
      key: "处置建议"
      value: "容器遭到入侵，请排查集群权限是否陷落，可尝试采用微隔离和免疫防御阻止风险进一步扩散。"
  desc: Container escape to access host system
  condition: >
   evt.type=mount and evt.arg.type = "cgroup" and container and user.uid=0
