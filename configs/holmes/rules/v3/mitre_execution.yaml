      zh: "/etc是 Linux 系统中的一个重要目录，用于存储配置文件和系统相关的信息。通常用户不会轻易修改里面的文件，大概率是攻击者在进行攻击后，为了更改系统配置，插入后门或恶意代码以维持持久性访问，窃取敏感信息，或破坏系统的正常运行，可能导致系统崩溃或数据损坏。"
