global:
  image: 
    registry: ""
    repository: ""


image:
  registry: localhost:32000
  repository: library
  name: webhook
  tag: latest
  pullPolicy: Always
  pullSecret: harbor-admin-secret

certgen:
  image:
    registry: localhost:32000
    repository: library
    name: kube-webhook-certgen
    tag: v1.1.1

nameOverride: "webhook"
fullnameOverride: "webhook"

service:
  type: ClusterIP
  port: 443
  targetPort: 9443
  ## Specify the nodePort value for the NodePort service types.
  #nodePort:

resources:
  limits:
    cpu: 100m
    memory: 200Mi
  requests:
    cpu: 100m
    memory: 200Mi

validators: ImageTrustValidator
mutators: "DriftPreventionMutator,MicroSegMutator,ImageTrustMutator"

presets:
  volumes:
    clientName: "client-cert"
    clientSecretName: "eventcenter-tls-client-cert-secret"
    clientMountPath: "/auth/client"
    caName: "ca-cert"
    caSecretName: "eventcenter-tls-ca-secret"
    caMountPath: "/auth/ca"

nats:
  natsSubject: "security-api"

sidecar:
  image:
    registry: localhost:32000
    repository: library
    name: security-proxy
    tag: latest
  init:
    image:
      registry: localhost:32000
      repository: library
      name: proxyv2
      tag: v1.9
  ## Specify which namespace of your cluster will not use image-validator webhook
  ## suggestion is "kube-system" and teh namespace which deployed Tensorsec profduct
  ignoredNameSpaces: kube-system
    