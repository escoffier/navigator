{{- if .Values.persistence.enabled -}}
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: {{ .Values.persistence.tensorsecCleaner.hotOfflineCronjob.fullnameOverride }}
  labels:
    app: {{ .Values.persistence.tensorsecCleaner.hotOfflineCronjob.nameOverride }}
spec:
  schedule: {{ .Values.persistence.tensorsecCleaner.hotOfflineCronjob.cronString }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      completions: 1
      template:
        spec:
          containers:
            - command:
                - /app/tensor-cleaner
                -  clear-hot-offline-storage-tool
              env:
                - name: CONF_PATH
                  value: /app/hot-offline-conf.json
                - name: MONGO_USERNAME
                  value: {{ .Values.mongo.mongoUsername }}
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mongo.mongoSecretName }}
                      key: mongodb-password
                - name: MONGO_ENDPOINT
                  value: tensorsec-mongodb-0.tensorsec-mongodb-headless:27017
                - name: MONGO_DATABASE
                  value: {{ .Values.mongo.mongoDatabase }}
                - name: ELASTIC_URL
                  value: "http://tensorsec-elasticsearch-master:9200"
              image: {{ include "console.cleaner.image" . }}
              imagePullPolicy: {{ .Values.persistence.tensorsecCleaner.image.pullPolicy }}
              name: {{ .Values.persistence.tensorsecCleaner.hotOfflineCronjob.nameOverride }}
              resources:
{{ toYaml .Values.persistence.tensorsecCleaner.hotOfflineCronjob.resources | indent 16 }}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /audit
                  name: audit
          restartPolicy: Never
          imagePullSecrets:
            - name: {{ .Values.persistence.tensorsecCleaner.image.pullSecret }}
          volumes:
            - name: audit
              persistentVolumeClaim:
                claimName: audit-pvc
{{- end -}}