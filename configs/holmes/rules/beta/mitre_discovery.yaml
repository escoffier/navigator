- key: Launch Suspicious Network Tool on Host
  hid: disc_03
  condition: >
    spawned_process and
    not container and
    (network_tool_procs or proc.name contains "fscan")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent_process=%proc.pname,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Launch Suspicious Network Tool on Host"
      zh: "在主机中启动可疑的网络工具"
    desc:
      en: "When the system detects unusual, suspicious network activity or tools (such as nmap) on a host, it may flag it as a sign of a potential attack. These tools may be used to perform malicious activities such as scanning, reconnaissance, vulnerability exploitation, or denial of service attacks that may result in system security risks."
      zh: "当系统检测到主机上出现了不寻常的、可疑的网络活动或工具时(比如nmap)，可能会将其标记为潜在的攻击迹象。这些工具可能用于执行恶意活动，如扫描、侦察、漏洞利用或拒绝服务攻击，可能导致系统安全风险。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line or process name includes nc, nmap, masscan , telnet and other network connections, detect related commands or process names, and promptly contact security personnel for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行或进程名是否包括nc、nmap、masscan、telnet等网络连接、探测相关命令或进程名，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: ERROR
    urgency: true
    tags: [ATT&CK, network, mitre_discovery, L4]

- key: View process information in the container
  hid: disc_04
  condition: >
    open_read and container and
    fd.name startswith "/proc/" and fd.name contains "pid_max" and evt.arg.flags = O_RDONLY and
    not (k8s.pod.name contains "holmes" or k8s.pod.name contains "calico" or k8s.pod.name contains "node-exporter" or k8s.pod.name contains "console" or k8s.pod.name contains "51c1c6" or k8s.pod.name contains "prometheus" or k8s.ns.name = "kube-system") and not proc.cmdline contains "ps cax"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,shell=%proc.name,parent=%proc.pname,terminal=%proc.tty,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "View process information in the container"
      zh: "容器内查看进程信息"
    desc:
      en: "Generally, we believe that normal users in the container will not perform this behavior. The high probability is that the attacker will conduct reconnaissance and information collection to view process information in the container after the attack, and use this information to understand the target system, discover weaknesses, and perform further attacks. and control container."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，为了在容器内查看进程信息侦察和信息收集、利用这些信息来了解目标系统、发现弱点、执行进一步攻击和控制容器。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line or process name includes ps, top, etc. command or process name, contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行或进程名是否包括ps、top等关命令或进程名，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: INFO
    urgency: true
    tags: [ATT&CK, container, exec, mitre_discovery, mitre_execution, L3]

- key: View disk information in the container
  hid: disc_05
  condition: >
    open_read and container and
    (proc.cmdline contains "fdisk -l" or (fd.name startswith "/sys/dev/block/" and evt.arg.flags contains O_RDONLY)) and
    not tensorsec_namespace
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "View disk information in the container"
      zh: "容器内查看磁盘信息"
    desc:
      en: "Generally, we believe that normal users in the container will not perform this behavior. There is a high probability that the attacker will steal sensitive data, exploit vulnerabilities, implant malicious files, and tamper with the file system in order to view the disk in the container after the attack."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，为了在容器内查看磁盘进行敏感数据窃取、利用漏洞、恶意文件植入和篡改文件系统等。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line or process name includes fdisk and other related commands. Contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行或进程名是否包括fdisk等关命令，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, exec, mitre_discovery, mitre_execution, L4]

- key: Scanning web directories in the container
  hid: disc_06
  condition: >
    open_read and container
    and (fd.directory contains "www" or fd.directory contains "apache" or fd.directory contains "tomcat" or fd.directory contains "web" or fd.directory contains "http")
    and (fd.name contains ".jsp" or fd.name contains ".php" or fd.name contains ".config" or fd.name contains ".bak" or fd.name contains ".old" or fd.name contains ".log")
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Scanning web directories in the container"
      zh: "容器内扫描web目录"
    desc:
      en: "Usually we believe that normal users in the container will not perform this behavior. The high probability is that the attacker scans the Web directory in the container to find sensitive files (such as database configuration files, cloud service AK\\SK, etc.) after obtaining certain permissions. , expose vulnerabilities and plan attack paths."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在获取一定权限后，为了在容器内扫描Web目录发现敏感文件(如：数据库配置文件、云服务AK\\SK等)、暴露漏洞和规划攻击路径。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container id, associated alarm list, etc., and check whether the file path contains www, web, http and other directories. .jsp, .php, .config and other suffix files, promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件路径是否包含www、web、http等目录下.jsp、.php、.config等后缀文件，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, mitre_discovery, L4]

- key: Find files with suid privilege by non-root users
  hid: disc_07
  condition: >
    spawned_process and 
    user.uid != 0 and proc.name = find and (
    (proc.cmdline contains "-perm" and (proc.cmdline contains "4000" or proc.cmdline contains "-u+s")) and
    (proc.cmdline contains "-print" or proc.cmdline contains "-exec" or proc.cmdline contains "-ls" or proc.cmdline contains "-fls" or proc.cmdline contains "-xargs")
    )
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Find files with suid privilege by non-root users"
      zh: "非root用户查找具有suid权限的文件"
    desc:
      en: "SUID is a permission bit that allows a user to run with the permissions of the file owner (usually root) when executing an executable file with SUID permissions. Usually we think that normal non-root users will not search for files with suid permissions. There is a high probability that they are attackers trying to find files with SUID permissions to gain the opportunity to execute commands with root permissions, thereby elevating their own permissions."
      zh: "SUID是一种权限位，允许用户在执行具有SUID权限的可执行文件时，以文件所有者（通常是root）的权限运行。通常我们认为正常非root用户不会进行查找具有suid权限的文件，大概率是攻击者，试图查找具有SUID权限的文件，以获取以root权限执行命令的机会，从而提升自己的权限。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process name is find and whether the command line includes - perm, -print, etc., contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为find并且命令行中是否包括-perm、-print等，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, mitre_discovery, L4]

- key: View login information in the container
  hid: disc_08
  condition: >
    open_read and container and
    (fd.name="/var/log/lastlog" or fd.name="/var/log/wtmp") and
    not shell_procs and
    not tensorsec_namespace and not k8s.pod.name contains "calico"
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "View login information in the container"
      zh: "容器内查看登录信息"
    desc:
      en: "The purpose of attackers viewing login log information in the container includes detecting traces of attacks, hiding identities (forging common users), detecting weaknesses, obtaining login IP addresses, evading security audits, and planning attack paths."
      zh: "攻击者在容器内查看登录日志信息的目的包括探测攻击痕迹、隐藏身份(伪造常用用户)、探测弱点、获取登录ip地址、规避安全审计和规划攻击路径。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the file path is /var/log/lastlog or / var/log/wtmp, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件路径是否为/var/log/lastlog或/var/log/wtmp，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, file, mitre_discovery, L1]

- key: View history command file in container
  hid: disc_09
  condition: >
    open_read and (fd.name contains ".bash_history" or fd.name contains ".zsh_history") and
    container and not shell_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "View history command file in container"
      zh: "容器内查看历史命令文件"
    desc:
      en: "Usually we think that normal users in the container will not perform this behavior. It may be that after the attack, the attacker wants to view historical commands in the container to detect traces of attacks, hide identities (tamper with logs), detect weaknesses, understand operating habits, and obtain sensitive information. information, circumvent security audits, and plan attack paths."
      zh: "通常我们认为在容器内正常用户不会进行此行为，可能是攻击者在进行攻击后，为了在容器内查看历史命令探测攻击痕迹、隐藏身份(篡改日志)、探测弱点、了解操作习惯、获取敏感信息、规避安全审计和规划攻击路径。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the file path is .bash_history or .zsh_history, and contact us in time Security personnel further investigate"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件路径是否为.bash_history或.zsh_history，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, exec, file, mitre_discovery, L1]

- key: Get ApiServer_token through kubectl
  hid: disc_10
  condition: >
    evt.type = execve and
    (proc.cmdline contains "kubectl config view" or proc.cmdline contains "kubectl describe secrets")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Get ApiServer_token through kubectl"
      zh: "通过kubectl获取ApiServer_token"
    desc:
      en: "Usually we think that administrators will not execute k8s related commands in the container. The high probability is that the attacker will achieve unauthorized access, lateral movement, steal sensitive information and bypass security measures in order to obtain the ApiServer_token after the attack."
      zh: "通常我们认为管理员不会在容器中执行k8s相关命令，大概率是攻击者在进行攻击后，为了获取ApiServer_token实现未授权访问、横向移动、窃取敏感信息和绕过安全措施。"
    suggestion:
      en: "(1). Please first combine the process command line, (parent) process name, file path and other fields of the alarm to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and after investigation After judging that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line includes kubectl config view, kubectl describe secrets , promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行中是否包括kubectl config view、kubectl describe secrets，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: WARNING
    urgency: true
    tags: [ATT&CK, container, k8s, mitre_discovery, L1]

- key: Run the tool for scanning ports
  hid: disc_11
  condition: >
    spawned_process and proc.name in (scan_ports_tool_binaries)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Run the tool for scanning ports"
      zh: "运行端口扫描工具"
    desc:
      en: "Usually we believe that normal users will not directly perform port scanning in the container. The high probability is that after the attack, the attacker uses a port scanning tool (such as nmap) to detect the open ports, services and network topology of the target system. for subsequent attacks or penetration testing."
      zh: "通常我们认为正常用户不会直接在容器内进行端口扫描，大概率是攻击者在进行攻击后，为了探测目标系统的开放端口、服务和网络拓扑，使用端口扫描工具(如：nmap)进行扫描探测以便进行后续攻击或渗透测试。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, file path and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a recurring expectation Behavior, and after investigation, it is judged that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., to check whether the process name is nmap, zmap , masscan, naabu and other network scanning tools and whether the command line includes the ipv4 address, contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为nmap、zmap、masscan、naabu等网络扫描工具并且命令行中是否包括ipv4地址，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: ALERT
    urgency: true
    tags: [ATT&CK, network, mitre_discovery, L2]

- key: Launch Suspicious Network Tool in Container
  hid: disc_12
  condition: >
    spawned_process and container and (network_tool_procs or proc.name contains "fscan") and not ignore_proc_args and not user_known_network_tool_activities and not proc.cmdline contains "-w 2 localhost 2181" and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,parent_process=%proc.pname,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
  info:
    name:
      en: "Launch Suspicious Network Tool in Container"
      zh: "容器内运行可疑网络工具"
    desc:
      en: "Usually we think that normal users in the container will not perform this behavior. The high probability is that after the attack, the attacker uses a port scanning tool (such as: nmap) to conduct reconnaissance and scan the target network, trying to find vulnerabilities and exposed services in the network. or weaknesses in order to prepare for subsequent attacks."
      zh: "通常我们认为在容器内正常用户不会进行此行为，大概率是攻击者在进行攻击后，使用端口扫描工具(如：nmap)进行侦察和扫描目标网络，尝试发现网络中的漏洞、暴露的服务或弱点，以便为后续攻击做准备。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, file path and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a recurring expectation Behavior, and after investigation, it is judged that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the process name is nmap, ncat , nc, tcpdump and other network tools, and promptly contact security personnel for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否为nmap、ncat、nc、tcpdump等网络工具，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: ALERT
    urgency: false
    tags: [ATT&CK, network, mitre_discovery, L4]

- key: Scanning port detected
  hid: disc_13
  condition: >
    evt.type in (connect,sendto,sendmsg)
    and fd.name contains "->"
    and fd.name != "" and fd.name exists and fd.type in ("ipv4", "ipv6")
    and proc.name in (scan_ports_tool_binaries)
    and not fd.sport in ("", 53)
    and not proc.name in (known_system_procs_network_activity_binaries)
    and not proc.pname in (known_system_procs_network_activity_binaries)
    and not (package_mgmt_procs or package_mgmt_ancestor_procs)
    and not login_doing_dns_lookup
    and not user_expected_system_procs_network_activity_conditions and container
    and not tensorsec_namespace
    and not proc.cmdline contains "redis-cli -h"
    and not k8s.ns.name = "kube-system"
    and not fd.name contains "->127.0.0.1"
    and not fd.name contains "->0.0.0.0:"
    and not fd.name contains "->::1" 
  output: >
    pod_id=%k8s.pod.id,syscall_name=%syscall.type,terminal=%proc.tty,user_uid=%user.uid,container_id=%container.id,container_name=%container.name,fd.num=%fd.num,fd.type=%fd.type,connection=%fd.name,client_ip=%fd.cip,client_port=%fd.cport,server_ip=%fd.sip,server_port=%fd.sport,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pgid=%proc.vpgid,proc_name=%proc.name,parent=%proc.pname,proc.aname[0]=%proc.aname[0],proc.aname[1]=%proc.aname[1],gparent=%proc.aname[2],ggparent=%proc.aname[3],gggparent=%proc.aname[4]
  steps:
    - name: checkRegexMatch
      params: [ '(((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})(\.((2(5[0-5]|[0-4]\d))|[0-1]?\d{1,2})){3})', trigger.payload.output_map.proc_cmdline ]
    - name: checkRuleRecentCount
      params: [ 'Scanning port detected', 5s, 5, '["fd_sip", "fd_cip"]', '["fd_sport"]', 1m ]
  info:
    name:
      en: "Scanning port detected"
      zh: "检测到正在扫描端口"
    desc:
      en: "Attackers are conducting sensitive port scans, an activity in which attackers connect to various ports to determine which ones are open, often automated using tools such as Nmap. The scanning tool also attempts to identify version information of services and applications running on the target host so that attackers are aware of potential vulnerabilities. Detection of a sensitive port scan may suggest an attacker is searching for vulnerabilities that could lead to unauthorized access, system intrusion, or other cybersecurity threats."
      zh: "攻击者正在进行端口扫描，这是一种活动，攻击者通过连接到各种端口，以确定哪些端口是开放的，通常使用工具如Nmap自动化进行。扫描工具还尝试识别目标主机上运行的服务和应用程序的版本信息，以便攻击者了解潜在漏洞。检测到敏感端口扫描可能暗示着攻击者寻找漏洞，可能会导致未经授权的访问、系统入侵或其他网络安全威胁。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address, file path and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a recurring expectation Behavior, and after investigation, it is judged that the security risk is controllable, you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the system call is connect, sendto , sendmsg, whether the process name is a network scanning tool such as nmap, zmap, masscan, naabu and whether the command line includes the IP address, contact security personnel in time for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址、文件路径等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为connect、sendto、sendmsg，进程名是否为nmap、zmap、masscan、naabu等网络扫描工具并且命令行中是否包括ip地址，及时联系安全人员进一步排查"
    rule_type: Discovery
    priority: ALERT
    urgency: true
    tags: [ATT&CK, network, k8s, mitre_discovery, L2]
