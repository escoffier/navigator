  - id: 5.4
    text: "Configure PAM"
    checks:
      - id: 5.4.1
        text: "Ensure password creation requirements are configured"
        audit: |
          minlen=$(grep '^\s*minlen\s*' /etc/security/pwquality.conf | awk {'print $3'})
          if [ $minlen -lt 14 ]; then
              echo "FAILED"
          else
              minclass=$(grep '^\s*minclass\s*' /etc/security/pwquality.conf | awk {'print $3'}) 
              if [ $minclass -eq 4 ]; then
                  echo "PASSED"
              else
                  passing=true
                  for c in d u o l ; do
                      grep -Eq '^\s*"$c"credit\s*=\s*-1' /etc/security/pwquality.conf
                      if [ $? -ne 0 ]; then
                          passing=false
                          break
                      fi
                  done

                  if [ "$passing" = true ]; then
                      echo "PASSED"
                  else
                      echo "FAILED"
                  fi
              fi
          fi
        tests:
          test_items:
            - flag: "PASSED"
        type: ""
        scored: true


      - id: 5.4.2
        text: "Ensure lockout for failed password attempts is configured"
        audit: "grep -E '^\\s*auth\\s+\\S+\\s+pam_(faillock|unix)\\.so' /etc/pam.d/system-auth /etc/pam.d/password-auth"
        type: "manual"
        scored: false

      - id: 5.4.3
        text: "Ensure password hashing algorithm is SHA-512"
        audit: "grep -P '^\\h*password\\h+(sufficient|requisite|required)\\h+pam_unix\\.so\\h+([^#\\n\\r]+)?sha512(\\h+.*)?$' /etc/pam.d/system-auth /etc/pam.d/password-auth"
        tests:
          test_items:
            - flag: "sha512"
        type: ""
        scored: true

      - id: 5.4.4
        text: "Ensure password reuse is limited"
        audit: "grep -P '^\\s*password\\s+(sufficient|requisite|required)\\s+pam_unix\\.so\\s+([^#]+\\s+)*remember=([5-9]|[1-9][0-9]+)\\b' /etc/pam.d/system-auth /etc/pam.d/password-auth"
        tests:
          test_items:
            - flag: "remember=5"
        type: "manual"
        scored: false

  - id: 5.5
    text: "User Accounts and Environment"
    checks:
      - id: 5.5.1.1
        text: "Ensure password expiration is 365 days or less"
        audit: "grep ^\\s*PASS_MAX_DAYS /etc/login.defs"
        tests:
          test_items:
            - flag: "PASS_MAX_DAYS"
              compare:
                op: lte
                value: "365"
        type: ""
        scored: true


      - id: 5.5.1.2
        text: "Ensure minimum days between password changes is configured"
        audit: "grep ^\\s*PASS_MIN_DAYS /etc/login.defs"
        tests:
          test_items:
            - flag: "PASS_MIN_DAYS"
              compare:
                op: gte
                value: "1"
        type: ""
        scored: true

      - id: 5.5.1.3
        text: "Ensure password expiration warning days is 7 or more"
        audit: "grep ^\\s*PASS_WARN_AGE /etc/login.defs"
        tests:
          test_items:
            - flag: "PASS_WARN_AGE"
              compare:
                op: gte
                value: "7"
        type: ""
        scored: true

      - id: 5.5.1.4
        text: "Ensure inactive password lock is 30 days or less"
        audit: "useradd -D | grep INACTIVE"
        tests:
          test_items:
            - flag: "INACTIVE"
              compare:
                op: lte
                value: "30"
        type: ""
        scored: true

      - id: 5.5.1.5
        text: "Ensure all users last password change date is in the past"
        audit: |
          for usr in $(cut -d: -f1 /etc/shadow); do [[ $(chage --list $usr | grep '^Last password change' | cut -d: -f2) > $(date) ]] && echo \"$usr :$(chage --list $usr | grep '^Last password change' | cut -d: -f2)\"; done
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.5.2
        text: "Ensure system accounts are secured"
        audit: |
          awk -F: '($1!="root" && $1!="sync" && $1!="shutdown" && $1!="halt" && $1!~/^\+/ && $3<'"$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"' && $7!="'"$(which nologin)"'" && $7!="/bin/false") {print}' /etc/passwd
        tests:
          test_items:
            - flag: ""
              compare:
                op: eq
                value: ""
        type: ""
        scored: true

      - id: 5.5.3
        text: "Ensure default group for the root account is GID 0"
        audit: "grep \"^root:\" /etc/passwd | cut -f4 -d:"
        tests:
          test_items:
            - flag: "0"
        type: ""
        scored: true

      - id: 5.5.4
        text: "Ensure default user shell timeout is configured"
        audit: |
          #!/bin/bash
          output1="" output2=""
          [ -f /etc/bashrc ] && BRC="/etc/bashrc"
          for f in "$BRC" /etc/profile /etc/profile.d/*.sh ; do
              grep -Pq '^\s*([^#]+\s+)?TMOUT=(900|[1-8][0-9][0-9]|[1-9][0-9]|[1-9])\b' "$f" && grep -Pq '^\s*([^#]+;\s*)?readonly\s+TMOUT(\s+|\s*;|\s*$|=(900|[1-8][0-9][0-9]|[1-9][0-9]|[1-9]))\b' "$f" && grep -Pq '^\s*([^#]+;\s*)?export\s+TMOUT(\s+|\s*;|\s*$|=(900|[1-8][0-9][0-9]|[1-9][0- 9]|[1-9]))\b' "$f" && output1="$f"
          done
          grep -Pq '^\s*([^#]+\s+)?TMOUT=(9[0-9][1-9]|9[1-9][0-9]|0+|[1-9]\d{3,})\b' /etc/profile /etc/profile.d/*.sh "$BRC" && output2=$(grep -Ps '^\s*([^#]+\s+)?TMOUT=(9[0-9][1-9]|9[1-9][0-9]|0+|[1-9]\d{3,})\b' /etc/profile /etc/profile.d/*.sh $BRC)
          if [ -n "$output1" ] && [ -z "$output2" ]; then
              echo -e "\nPASSED\n\nTMOUT is configured in: \"$output1\"\n"
          else
              [ -z "$output1" ] && echo -e "\nFAILED\n\nTMOUT is not configured\n"
              [ -n "$output2" ] && echo -e "\nFAILED\n\nTMOUT is incorrectly configured in: \"$output2\"\n"
          fi
        tests:
          test_items:
            - flag: "PASSED"
        type: ""
        scored: true

      - id: 5.5.5
        text: "Ensure default user umask is configured"
        audit: |
          #!/bin/bash
          passing=""
          grep -Eiq '^\s*UMASK\s+(0[0-7][2-7]7|[0-7][2-7]7)\b' /etc/login.defs && grep -Eqi '^\s*USERGROUPS_ENAB\s*"?no"?\b' /etc/login.defs && grep -Eq '^\s*session\s+(optional|requisite|required)\s+pam_umask\.so\b' /etc/pam.d/common-session && passing=true
          grep -REiq '^\s*UMASK\s+\s*(0[0-7][2-7]7|[0-7][2-7]7|u=(r?|w?|x?)(r?|w?|x?)(r?|w?|x?),g=(r?x?|x?r?),o=)\b' /etc/profile* /etc/bashrc* && passing=true
          if [ "$passing" = true ]; then
              grep -RPiq '(^|^[^#]*)\s*umask\s+([0-7][0-7][01][0-7]\b|[0-7][0-7][0-7][0-6]\b|[0-7][01][0-7]\b|[0-7][0-7][0-6]\b|(u=[rwx]{0,3},)?(g=[rwx]{0,3},)?o=[rwx]+\b|(u=[rwx]{1,3},)?g=[^rx]{1,3}( ,o=[rwx]{0,3})?\b)' /etc/login.defs /etc/profile* /etc/bashrc*
              if [ $? -ne 1 ]; then 
                  echo "PASSED"
              else
                  echo "FAILED"
              fi
          else
              echo "PASSED"
          fi
        tests:
          test_items:
            - flag: "PASSED"
        type: ""
        scored: false

