apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "webhook.fullname" . }}
  labels:
{{ include "webhook.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "webhook.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "webhook.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccount: {{ template "webhook.fullname" . }}
      containers:
      - name: {{ template "webhook.fullname" . }}
        image: "{{ template "tensorsec.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 9443
          protocol: TCP
        args:
        {{- if .Values.global.multiCluster.isMasterCluster }}
        - --validators={{ .Values.validators }}
        - --mutators={{ .Values.mutators }}
        {{- else if .Values.global.multiCluster.isMemberCluster }}
        - proxy
        - --target-host={{ .Values.args.consoleUrl }}
        - --clusterMgrAddress={{ .Values.args.clusterManagerUrl }}
        {{- end }}
        resources:
{{ toYaml .Values.resources | trim | indent 10 }}
        volumeMounts:
        - mountPath: /etc/tensorsec/certs
          name: webhook-certs
          readOnly: true
        {{- if .Values.global.multiCluster.isMasterCluster }}
        - mountPath: /etc/tensorsec/config
          name: webhook-config
        {{- end }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      restartPolicy: Always
      volumes:
      - name: webhook-certs
        secret:
          secretName: {{ template "webhook.fullname" . }}-certs
      {{- if .Values.global.multiCluster.isMasterCluster }}
      - name: webhook-config
        configMap:
          name: {{ template "webhook.fullname" . }}
      {{- end }}   

