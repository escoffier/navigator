- key: Change thread namespace
  disable: true
  hid: move_02
  condition: >
    evt.type=setns and evt.dir=<
    and proc_name_exists
    and shell_parent_procs
    and not (container.id=host and proc.name in (docker_binaries, k8s_binaries, lxd_binaries, nsenter))
    and not proc.name in (sysdigcloud_binaries, sysdig, calico, oci-umount, cilium-cni, network_plugin_binaries)
    and not proc.name in (user_known_change_thread_namespace_binaries)
    and not proc.name startswith "runc"
    and not proc.cmdline startswith "containerd"
    and not proc.pname in (sysdigcloud_binaries, hyperkube, kubelet, protokube, dockerd, tini, aws)
    and not python_running_sdchecks
    and not java_running_sdjagent
    and not kubelet_running_loopback
    and not rancher_agent
    and not rancher_network_manager
    and not calico_node
    and not weaveworks_scope
    and not user_known_change_thread_namespace_activities
    and not ignore_proc_args
    and not (tensorsec_namespace and k8s.pod.name contains "holmes")
    and not proc.cmdline contains 'ns-mnt'
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,parent=%proc.pname,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Change thread namespace"
      zh: "更改线程命名空间"
    desc:
      en: "In a multi-user or multi-tenant environment, changing namespaces may require appropriate permissions and authorization. If a user or program attempts to change the namespace without authorization, there is a high probability that the attacker will call the setns function to change the namespace of the program or thread after the attack, mainly to evade detection and isolation by removing the process or thread. Move to a different namespace to bypass detection, perform malicious activities in an isolated environment, move laterally to other namespaces, invade different resources and systems, escalate privileges and conceal their activities."
      zh: "在多用户或多租户环境中，更改命名空间可能需要适当的权限和授权。如果某个用户或程序未经授权地尝试更改命名空间，大概率是攻击者在进行攻击后，为了调用setns函数更改程序或线程的命名空间后，主要是逃避检测和隔离，通过将进程或线程移动到不同的命名空间绕过检测，在隔离的环境中执行恶意活动，横向移动到其他命名空间，侵入不同资源和系统，提升权限并隐蔽其活动。"
    suggestion:
      en: "Immune defense is used to prevent sensitive directories and files from being mounted, prevent sensitive containers from being started, and update the software version in the containers."
      zh: "采用免疫防御禁止挂载敏感目录和文件，禁止敏感容器启动，更新容器内软件版本。"
    rule_type: Lateral_Movement
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, mitre_lateral_movement, mitre_privilege_escalation, L1]

- key: The k8s client is executed in a container
  disable: true
  hid: move_03
  condition: >
    spawned_process and container and not user_known_k8s_client_container_parens and proc.name in (k8s_client_binaries) and not tensorsec_namespace and shell_parent_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,parent=%proc.pname,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "The k8s client is executed in a container"
      zh: "容器中使用k8s相关二进制程序"
    desc:
      en: "Under normal circumstances, we believe that normal users in the container will not manage the k8s cluster in the container (but on the node). This behavior may occur because the attacker is able to execute the Kubernetes (K8s) client tool in the container after carrying out the attack. , they may exploit this opportunity to conduct attacks or activities to gain unauthorized access, steal sensitive information, compromise containers or clusters, and conduct lateral movement and sideways penetration."
      zh: "通常情况下我们认为在容器内正常用户不会在容器中（而是在节点）管理k8s集群，出现该行为可能是攻击者在进行攻击后，为了能够在容器中执行Kubernetes（K8s）客户端工具，他们可能会利用此机会实施未经授权的访问、窃取敏感信息、破坏容器或集群，以及横向移动和侧向渗透的攻击或活动。"
    suggestion:
      en: "Please confirm whether the program is introduced as expected, or use offset defense to limit the program's operation, and check whether the container is invaded by hackers."
      zh: "请确认该程序引入是否符合预期，否则则采用偏移防御限制该程序运行，并排查容器是否遭到黑客入侵。"
    rule_type: Lateral_Movement
    priority: WARNING
    urgency: true
    tags: [ATT&CK, k8s, container, mitre_lateral_movement, L2]

