  model.SimpleImageDetail:
    properties:
      sensitive_info:
        items:
          $ref: '#/definitions/model.Sensitive'
        type: array
      vuln_info:
        items:
          $ref: '#/definitions/model.VulnerabilityInfo'
        type: array
    type: object
  model.VirusFileInfo:
    properties:
      filename:
