# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
image: harbor.tensorsecurity.com/library/reviewdog:v5
variables:
  GOPROXY: https://goproxy.cn
  GO111MODULE: 'on'
  GOPRIVATE: gitlab.com,scm.tensorsecurity.cn
  CGO_LDFLAGS: "-no-pie"
  HARBORPASSWD: Hrbr12@Tensor.*#)
workflow:
  rules:
  - if: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^master/"
    when: always
stages:
- build
- test
- sast
- reviewdog
all:
  stage: build
  resource_group: all
  tags:
  - k8s
  before_script:
  - git merge origin/master
  - git config --global --add url."git@gitlab.com:".insteadOf "https://gitlab.com/"
  - git config --global --add url."ssh://git@10.99.201.85/".insteadOf "http://scm.tensorsecurity.cn/"
  - sed -i 's#RELEASEVERSION?=v0.0.1#RELEASEVERSION?=ci#g' Makefile
  - sed -i "s#latest#ci#g" Makefile
  - sed -i "s#DOCKER_REGISTRY=$(REPOPREFIX)#DOCKER_REGISTRY=harbor.tensorsecurity.com/tensorsecurity#g"
    Makefile
  - sed -i "s#REPOPREFIX?=localhost:32000#REPOPREFIX?=harbor.tensorsecurity.com/tensorsecurity#g"
    Makefile
  - find ./ -name "Dockerfile"|xargs sed -i "s#registry.t-appagile.com#harbor.tensorsecurity.com#g"
  - mkdir ~/.kube/
  - cp ~/.docker/config-ci ~/.kube/config
  - cp ~/.docker/kubectl /bin/
  - cp ~/.docker/xray ./
  - chmod +755 /bin/kubectl
  - mkdir avira/
  - cp ~/.docker/savapi-sdk-linux64.tgz avira/
  script:
  - USEMIRROR=true FETCHTAG=latest make all
  - make pushimages
  - make rm-local-images
  - kubectl get pod --no-headers -n tensorsec|grep -v "mysql\|redis\|elasticsearch\|stan\|kafka\|frontend\|eventcenter\|microseg"|awk
    '{print $1}'|xargs -i kubectl delete pod {} -n tensorsec --force --grace-period=0
  - kubectl -n test delete pod -l app=faulty --force --grace-period=0
  rules:
  - changes:
    - pkg/**/*
    - Makefile
    - go.mod
    - configs/**/*
