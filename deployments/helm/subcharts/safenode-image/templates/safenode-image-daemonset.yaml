apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "common.labels.matchLabels" . | nindent 6 }}
  template:
    metadata:
      name: {{ include "common.names.fullname" . }}
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
    spec:
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.global.image.pullSecret }}
      {{- else if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: {{ include "common.names.name" . }}
          image: {{ include "safenode.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: docker-socket
          securityContext:
            privileged: true
            runAsUser: 0
          args: 
            - --pushInterval={{ .Values.pushConfigs.pushInterval }}
            - --batchInterval={{ .Values.pushConfigs.batchInterval }}
            - --batchSize={{ .Values.pushConfigs.batchSize }}
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAFENODE-BUF-REGISTRY-URL
              value: {{ .Values.global.bufRegistryExternalUrl }}
            - name: SAFENODE-BUF-REGISTRY-USER
              value: {{ .Values.bufRegistry.bufRegistryUser }}
            - name: SAFENODE-BUF-REGISTRY-PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-dockerregistry-normal" (include "common.scanner.defaultName" .) }}
                  key: pass
            - name: CLUSTER-MANAGER-ADDR
              value: "http://{{ include "common.cluster-manager.defaultName" . }}:9443"
          resources:
{{ toYaml .Values.resources | trim | indent 12 }}
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
