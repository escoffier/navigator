##attck_rule_type=Privilege_Escalation
- key: Launch Privileged Container
  disabled: true
  hid: priv_01
  condition: >
    container_started and container
    and container.privileged=true
    and not falco_privileged_containers
    and not user_privileged_containers
    and not tensorsec_namespace
    and not k8s.ns.name = "kube-system"
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container.info=%container.info,image=%container.image.repository,image_tag=%container.image.tag,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Launch Privileged Container"
      zh: "启动特权容器"
    desc:
      en: "Starting a privileged container means that users in the container can mount the host disk into the container without restrictions. Once the container is compromised, the attacker can easily escape to the host by mounting the host directory to control the host. Therefore In our opinion, the startup of this type of container carries certain risks."
      zh: "启动特权容器意味着容器内的用户可以不受限制的挂载主机磁盘到容器内，一旦容器被攻陷，攻击者可以很容易的通过挂载主机目录逃逸到主机上从而实现对主机的控制，因此该类容器的启动在我们看来是具备一定风险的。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check the /proc/1/status file in the container Whether it contains 0:3ffffffff, analyze the k8s api request log to check the log of creating the container, and contact the security personnel in time for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看该容器中/proc/1/status文件是否包含0:3fffffff，分析k8s api请求日志查看创建该容器的日志，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: INFO
    urgency: false
    tags: [ATT&CK, container, mitre_privilege_escalation, L1]

- key: Non sudo setuid
  hid: priv_02
  condition: >
    evt.type=setuid and evt.dir=>
    and (known_user_in_container or not container)
    and shell_parent_procs
    and not user.name=root
    and not somebody_becoming_themself
    and not proc.name in (known_setuid_binaries, userexec_binaries, mail_binaries, docker_binaries,
                          nomachine_binaries)
    and not proc.name startswith "runc:"
    and not java_running_sdjagent
    and not nrpe_becoming_nagios
    and not user_known_non_sudo_setuid_conditions
    and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,cur_uid=%user.uid,parent=%proc.pname,uid=%evt.arg.uid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "Non sudo setuid"
      zh: "非sudo、非root程序意外调用setuid"
    desc:
      en: "setuid (set user ID) is a special permission bit that allows ordinary users to execute certain programs with superuser (root) permissions. Normal users do not need to directly call the setuid function in daily use. Instead, they complete the task by using tools or applications that already have the required permissions. To use it, they also use sudo or the root user to call setuid. This behavior is likely to be an attack. After the attacker carries out the attack, in order to achieve privilege escalation (Privilege Escalation). Therefore, when an attacker successfully calls setuid, they can gain higher permissions than their original permissions."
      zh: "setuid（set user ID）是一种特殊的权限位，允许普通用户以超级用户（root）的权限执行某些特定程序。正常用户在日常使用中不需要直接调用 setuid 函数，而是通过使用已经具有所需权限的工具或应用程序来完成任务，要使用也是使用sudo、或root用户调用setuid，这种行为大概率是攻击者在进行攻击后，为了实现特权升级（Privilege Escalation）。因此，当攻击者成功调用setuid，他们可以获得比其原始权限更高的权限。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the process is an unknown program and whether the system call is setuid, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程是否为未知程序及系统调用是否为setuid，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: NOTICE
    urgency: false
    tags: [ATT&CK, users, mitre_privilege_escalation, L2]

- key: System user interactive
  hid: priv_03
  condition: >
    spawned_process and system_users and interactive and not user_known_system_user_login
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,user_loginuid=%user.loginuid,container_id=%container.id,container_name=%container.name,image=%container.image.repository
  info:
    name:
      en: "System user interactive"
      zh: "未登录用户试图运行交互式命令"
    desc:
      en: "Attempts by non-logged-in users to run interactive commands are generally considered potential attacks, because normal users typically do not attempt to execute interactive commands while logged in. Under normal circumstances, users need to first log into the system, authenticate their identity, and gain access before they can execute interactive commands. The main reason why attackers run interactive commands without logging in as a user is to gain control and broader access to the target system. Using an interactive shell provides more flexibility and the tools needed to carry out malicious activities."
      zh: "未登录用户试图运行交互式命令通常被视为潜在的攻击行为，因为正常用户通常不会以未登录的状态尝试执行交互式命令。在正常情况下，用户需要首先登录到系统，验证其身份，并获得访问权限，然后才能执行交互式命令。攻击者在未登录用户的情况下运行交互式命令的主要原因是为了获取对目标系统的控制权和更广泛的访问权限。使用交互式shell提供了更多的灵活性和实施恶意活动所需的工具。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and contact security personnel in a timely manner for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: false
    tags: [ATT&CK, shell, mitre_privilege_escalation, L4]

- key: Set Setuid or Setgid bit
  hid: priv_04
  condition: >
    consider_all_chmods and chmod and (evt.arg.mode contains "S_ISUID" or evt.arg.mode contains "S_ISGID")
    and shell_parent_procs
    and not proc.name in (user_known_chmod_applications)
    and not exe_running_docker_save
    and not user_known_set_setuid_or_setgid_bit_conditions
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,fd=%evt.arg.fd,filename=%evt.arg.filename,mode=%evt.arg.mode,user=%user.name,user_loginuid=%user.loginuid,process=%proc.name,container_id=%container.id,container_name=%container.name,image=%container.image.repository,image_tag=%container.image.tag
  info:
    name:
      en: "Set Setuid or Setgid bit"
      zh: "设置Setuid或Setgid位"
    desc:
      en: "Setting the Setuid (set user ID) or Setgid (set group ID) bit is a potentially offensive behavior because it can cause a program to run with higher privileges, without being subject to usual permission controls. Normal users generally do not set the Setuid or Setgid bit arbitrarily, as this can lead to security risks and abuse. An attacker may abuse the setuid or setgid bit to run an application with higher privileges to gain broader permissions to system resources and functionality. This abuse may be used for privilege escalation attacks, bypassing permission restrictions, bypassing access controls, lateral movement, building backdoors and other malicious activities."
      zh: "设置Setuid（设置用户ID）或Setgid（设置组ID）位是一种潜在的攻击行为，因为它可以导致程序以更高权限运行，而不受通常的权限控制约束。正常用户通常不会随意设置Setuid或Setgid位，因为这可能会引发安全风险和滥用。攻击者可能会滥用setuid或setgid位来以更高权限的身份运行应用程序，以获取对系统资源和功能的更广泛权限。这种滥用可能用于提权攻击、绕过权限限制、绕过访问控制、横向移动、建立后门等恶意活动。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the process is an unknown program and whether the system call is chmod, fchmod, and fchmodat, contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程是否为未知程序及系统调用是否为chmod、 fchmod,、fchmodat，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: WARNING
    urgency: true
    tags: [ATT&CK, users, mitre_privilege_escalation, L4]

- key: Escape to access by chroot
  hid: priv_05
  condition: >
    (evt.type=chroot and container and proc.name !=sshd and proc.name !=vsftpd)
    and not (tensorsec_namespace and (k8s.pod.name contains "-host-" or k8s.pod.name contains "-docker-" or k8s.pod.name contains "-kube-")) and shell_family_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access by chroot"
      zh: "容器内挂载主机目录逃逸"
    desc:
      en: "Mounting the host directory within a container is usually considered a potential attack behavior because it may cause the container to access the file system of the host host without permission, destroying the isolation and security of the container. Normal users would not typically perform such operations within a container, since one of the design purposes of containers is to isolate applications and file systems to ensure security and portability. Attackers usually mount the host directory in the container to move laterally between the container and the host, trying to invade other containers or host resources to expand the scope of the attack. Or steal sensitive data, tamper with configurations, ensure persistent access and control container contents, etc."
      zh: "容器内挂载主机目录通常被认为是潜在的攻击行为，因为它可能导致容器越权访问宿主主机的文件系统，破坏了容器的隔离性和安全性。正常用户通常不会在容器内执行这样的操作，因为容器的设计目的之一是隔离应用程序和文件系统，以确保安全性和可移植性。攻击者在容器内挂载主机目录的行为通常为了在容器和主机之间进行横向移动，尝试侵入其他容器或主机资源，扩大攻击范围。或窃取敏感数据、篡改配置、确保持久性访问和控制容器内容等。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the system call is chroot and whether the parent process is sh, bash, etc., contact security personnel promptly for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看系统调用是否为chroot及父进程是否为sh、bash等，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, container, mitre_privilege_escalation, L4]

- key: Escape to access rule by procfs
  hid: priv_06
  condition: >
    open_write and container and fd.name contains /sys/kernel/core_pattern
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access rule by procfs"
      zh: "容器内挂载procfs目录逃逸"
    desc:
      en: "Mounting the procfs directory within a container is usually considered a potential attack behavior because procfs is a virtual file system in the Linux operating system that provides access to kernel and process information. Normal users usually do not need to mount the procfs directory directly, as it is usually automatically mounted by the operating system, and accessing this information usually requires privileged permissions. When the procfs (/proc) directory is mounted in a container, an attacker may try to escape or bypass the isolation environment of the container to gain access to the host operating system."
      zh: "容器内挂载procfs目录通常被视为潜在的攻击行为，因为procfs是Linux操作系统中的虚拟文件系统，提供了对内核和进程信息的访问。正常用户通常不需要直接挂载procfs目录，因为它通常由操作系统自动挂载，并且访问这些信息通常需要特权权限。当容器内挂载procfs（/proc）目录时，攻击者可能会尝试逃逸（escape）或绕过容器的隔离环境，获取对宿主操作系统的访问权限。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the file descriptor contains /sys/kernel/ core_pattern, contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否包含/sys/kernel/core_pattern，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, container, mitre_privilege_escalation, L4]

#debugfs -w debugfs_priv
- key: Escape to access rule by debugfs
  hid: priv_07
  condition: >
    evt.type = write and container and evt.arg.data contains "debugfs " and not evt.arg.data contains "-w" and proc.cmdline contains " -w"
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access rule by debugfs"
      zh: "容器内通过debugfs逃逸"
    desc:
      en: "debugfs is a virtual file system of the Linux kernel that allows users to view and modify debugging and performance data while the kernel is running. Normal users usually do not need to directly access and operate debugfs. There is a high probability that an attacker will try to use the debugfs file system of the Linux operating system to bypass the isolation of the container and gain access to the host operating system after conducting an attack."
      zh: "debugfs是Linux内核的一个虚拟文件系统，允许用户查看和修改内核运行时的调试和性能数据。正常用户通常不需要直接访问和操作debugfs大概率是攻击者在进行攻击后，试图利用Linux操作系统的debugfs文件系统来绕过容器的隔离，获取对宿主操作系统的访问权限。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., check whether the command line contains debugfs, and contact security in time Personnel further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行中是否包含debugfs，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, container, mitre_privilege_escalation, L4]

- key: Escape to access rule by cgroup
  hid: priv_08
  condition: >
    evt.type=mount and evt.arg.type = "cgroup" and container and user.uid=0
  output: >
    fd_name=%fd.name,proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Escape to access rule by cgroup"
      zh: "特权容器挂载cgroup逃逸"
    desc:
      en: "Cgroups (control groups) are a feature of the Linux kernel used to manage and control the resource usage of process groups. Mounting a cgroup on a privileged container is usually considered an attack because this behavior can be used to bypass the security isolation mechanism of the container and have unrestricted effects on the host system. Normal users usually do not use it in this way. There is a high probability that the attacker attempts to bypass the isolation and restrictions of the container by mounting the cgroup file system in the privileged container after carrying out the attack, and obtain higher-level access to the host operating system."
      zh: "Cgroups（控制组）是Linux内核的一个功能，用于管理和控制进程组的资源使用。特权容器挂载cgroup通常被判断为攻击，因为这个行为可以用于绕过容器的安全隔离机制，对宿主系统产生不受限制的影响，正常用户通常不会这样使用。大概率是攻击者在进行攻击后试图通过在特权容器内挂载cgroup文件系统，绕过容器的隔离和限制，获取对宿主操作系统的更高级别访问权限。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains the mount and cgroup keywords. Contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行是否包含mount、cgroup关键字，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, container, mitre_privilege_escalation, L4]

- key: CVE-2021-3156(Linux sudo Privilege_Escalation)
  hid: priv_09
  condition: >
    evt.type=execve and container and proc.name in (sensitive_cmd)
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2021-3156(Linux sudo Privilege_Escalation)"
      zh: "CVE-2021-3156(sudo权限提升)"
    desc:
      en: "CVE-2021-3156, also known as the Sudo Baron Samedit vulnerability, is a serious vulnerability affecting Linux systems. It contains a heap overflow vulnerability in the code of Sudo versions 1.8.2 to 1.8.31p2. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts. There is a high probability that the attacker will trigger this vulnerability through specially crafted command line parameters after carrying out the attack, thus causing Sudo's runtime stack to overflow. , ultimately allowing the attacker to execute arbitrary commands with root privileges."
      zh: "CVE-2021-3156，也被称为Sudo Baron Samedit漏洞，是一个影响Linux系统的严重漏洞，它存在于Sudo版本1.8.2到1.8.31p2之间的代码中存在一个堆溢出漏洞。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击后通过特制的命令行参数来触发这个漏洞，从而导致Sudo的运行时堆栈溢出，最终使攻击者能够以root权限执行任意命令。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc. to check whether the process name contains sudedit and whether it is an unknown process. , promptly contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看进程名是否包含sudedit及是否为未知进程，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, container, mitre_privilege_escalation, L4]

- key: CVE-2019-5736(Modify Container Entrypoint)
  hid: priv_10
  condition: >
    open_read and container
    and (fd.name=/proc/self/exe or fd.name startswith /proc/self/fd/)
    and not docker_procs
    and not (tensorsec_namespace
    and proc.pname != "<NA>"
    and (k8s.pod.name contains "-host-" or k8s.pod.name contains "-docker-" or k8s.pod.name contains "-kube-" or k8s.pod.name contains "-holmes-" or k8s.pod.name contains "-webhook-" or k8s.pod.name contains "-scanner"))
    and not proc.cmdline contains "runc init"
    and not proc.cmdline = "runc:[1:CHILD] init"
    and not proc.cmdline contains "kube-bench "
    and not proc.cmdline contains "scanner "
    and not proc.cmdline contains "systemd-tmpfile --create"
    and not proc.name contains "fscan"
    and shell_family_procs
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,proc_name=%proc.name,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2019-5736(Modify Container Entrypoint)"
      zh: "CVE-2019-5736(runc逃逸漏洞)"
    desc:
      en: "CVE-2019-5736 is a vulnerability affecting Docker container technology. The main purpose is container escape, that is, gaining access to the host system from inside the container. This vulnerability allows an attacker to bypass the isolation of the container, execute malicious code from inside the container, and ultimately gain control of the host system. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "CVE-2019-5736是一个影响Docker容器技术的漏洞，主要目的是容器逃逸，也就是从容器内部获得对宿主系统的访问权限。这个漏洞使攻击者可以绕过容器的隔离性，从容器内部执行恶意代码，并最终获得对宿主系统的控制。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the file descriptor is /proc/self/ exe or starts with /proc/self/fd/, check whether the container name contains -host-, -docker-, -kube-, -webhook-, -scanner-, and contact security personnel in time for further investigation."
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看文件描述符是否为/proc/self/exe或以/proc/self/fd/开头，查看容器名是否包含-host-、-docker-、-kube-、-webhook-、-scanner-，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, users, docker, container, mitre_privilege_escalation, L4]

- key: CVE-2019-14287(Sudo Potential bypass of Run as user restrictions)
  hid: priv_11
  condition: >
    open_read and evt.args contains "/usr/lib/sudo/sudoers.so" and
    (proc.cmdline contains "-u#-1" or proc.cmdline contains "-u#4294967295")
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "CVE-2019-14287(Sudo Potential bypass of Run as user restrictions)"
      zh: "CVE-2019-14287(sudo有可能绕过以用户身份运行的限制)"
    desc:
      en: "When sudo is configured to allow a user to run commands as any user via the ALL keyword in the Runas specification, commands can be run as root by specifying user ID -1 or 4294967295. This can be used by a user with sufficient sudo rights to run commands as root, even if the Runas specification does not contain the ALL keyword. This can be used to bypass restrictions imposed by the Runas specification. Generally, we believe that normal users will not actively execute CVE (known vulnerabilities) related attack tools or scripts, and there is a high probability that attackers are conducting attacks."
      zh: "当sudo配置为允许用户通过Runas规范中的ALL关键字以任意用户身份运行命令时，可以通过指定用户ID -1或4294967295来运行命令作为root。这可以由具有足够sudo权限的用户用来运行命令作为root，即使Runas规范不包含ALL关键字。这可以用来绕过由Runas规范施加的限制。通常我们认为正常用户不会主动执行CVE（已知漏洞）相关的攻击工具或脚本，大概率是攻击者在进行攻击。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line contains sudo -u#. Contact security personnel promptly for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行中是否包含sudo -u#，及时联系安全人员进一步排查"
    rule_type: Privilege_Escalation
    priority: ALERT
    urgency: true
    tags: [ATT&CK, filesystem, mitre_privilege_escalation, L4]

- key: CVE-2022-0185(in Linux Kernel Can Allow Container Escape in Kubernetes Linux)
  hid: priv_12
  condition: >
    evt.type = unshare and proc.name=unshare and proc.args contains r and not proc.args contains "mount" and container
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,user=%user.name,container=%container.info,container_id=%container.id,container_name=%container.name
