global:
  image:
    registry: localhost:32000
    repository: tensorsecurity
    pullSecret: harbor-admin-secret
  certgen:
    image:
      name: tensorsec-certgen
      tag: v1.5.1

clair:
  enabled: false
  image:
    name: tensorsec-clair
    tag: latest
    pullSecret: harbor-admin-secret
  init:
    loadSql:
      image:
        name: tensorsec-postgres
        tag: latest
    waitpg:
      image:
        name:  postgres
        tag: 11.3
  config:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"

scanner:
  enabled: true
  image:
    name: tensorsec-scanner
    tag: latest
    pullSecret: harbor-admin-secret
  # TODO: reference below variables from the original setting (maybe Helm enables it?)
  redis:
    redisSecretName: tensorsec-redis-ha
  clair:
    postgresURI: "postgres://postgres:password@tensorsec-postgresql:5432/postgres?sslmode=disable"
  dockerregistry:
    persistence:
      enabled: true
      size: 50Gi
    secrets:
      # If you update the username or password of registry, make sure use cli tool htpasswd to generate the bcrypt hash
      # e.g. "htpasswd -nbBC10 $username $password"
      # Default: tensorsec:TensorSec@Passw0rd
      htpasswd: "tensorsec:$2y$10$9fuDB4Of8Zw.6OVaQvduhe9gsI/T3NTVYBbvvtU2cHeianQH5iLM2"
    service:
      type: ClusterIP
      # clusterIP:
      httpPort: 5000
      gcPort: 8081
      # httpNodePort:
      # gcNodePort:
  webshell:
    image:
      registry:  localhost:32000
      repository: tensorsecurity
      name: webshell-server
      tag: latest
    replicas: 2
    resources:
      limits:
        cpu: "300m"
        memory: "500Mi"
      requests:
        cpu: "100m"
        memory: "200Mi"

console:
  enabled: true
  image:
    name: tensorsec-console
    tag: latest
    pullSecret: harbor-admin-secret
  # TODO: reference below variables from the original setting (maybe Helm enables it?)
  scap:
    tag: latest
  persistence:
    enabled: true
    tensorsecCleaner:
      image:
        registry: localhost:32000
        repository: tensorsecurity
        name: tensorsec-cleaner
        tag: latest
  elasticsearch:
    elasticSecretName: elastic-secret
    extraEnvs:
      - name: ELASTIC_PASSWORD
        value: Elastic12345
      - name: ELASTIC_USERNAME
        value: elasticsearch
  eventcenter:
    eventGrpcUrl: tensorsec-eventcenter:9090
    eventGrpcCertServerName: tensorsec-eventcenter
  postgresql:
    postgresqlDataDir: /bitnami/postgresql/data
    postgresqlUsername: postgres
    postgresqlPassword: password
    postgresqlDatabase: postgres
  imagePullSecret:
    imageRegistryURL: https://harbor.example
    imageRegistryUsername: admin
    imageRegistryPassword: Harbor12345
  emailCheck:
    smtpEnabled: false
    smtpHost: smtp.feishu.cn
    smtpPort: 465
    smtpUsername: console-robot@tensorsecurity.cn
    smtpPassword: password
  version:
    softName: tensor
    softVersion: v1.9

cluster-manager:
  enabled: true
  image:
    name: tensorsec-cluster-manager
    tag: latest
    pullSecret: harbor-admin-secret
#  args:
#    masterAddr:
#    clusterName:
#    apiServerAddr:

eventcenterAuth:
  enabled: true

redis-ha:
  enabled: true
  image:
    name: redis
    tag: 6.2.5-alpine
    pullSecret: harbor-admin-secret
  auth: true
  redisPassword: Redis12345
  hardAntiAffinity: false
  persistentVolume:
    enabled: true

elasticsearch:
  enabled: true
  image:
    name: elasticsearch
    tag: 7.9.1
    pullSecret: harbor-admin-secret
  persistence:
    enabled: true
  minimumMasterNodes: 1
  replicas: 1
  extraEnvs:
    - name: ELASTIC_PASSWORD
      value: Elastic12345
    - name: ELASTIC_USERNAME
      value: elasticsearch
  # Below settings for local dev environment
  # sysctlInitContainer:
  #   enabled: false
  # esConfig:
  #   elasticsearch.yml: |
  #     node.store.allow_mmap: false
  # antiAffinity: "soft"
  # esJavaOpts: "-Xmx128m -Xms128m"
  # resources:
  #   requests:
  #     cpu: "100m"
  #     memory: "512M"
  #   limits:
  #     cpu: "1000m"
  #     memory: "512M"
  # volumeClaimTemplate:
  #   accessModes: [ "ReadWriteOnce" ]
  #   storageClassName: "microk8s-hostpath"
  #   resources:
  #     requests:
  #       storage: 100M
  lifecycle:
    postStart:
       exec:
         command:
           - bash
           - -c
           - |
             #!/bin/bash
             # Add a template to adjust number of shards/replicas
             ES_URL=http://localhost:9200
             while [[ "$(curl -s -o /dev/null -w '%{http_code}\n' $ES_URL)" != "200" ]]; do sleep 1; done
             while true ; do
               curl -s -XGET "http://localhost:9200/_cluster/health?pretty=true"  |grep green
               if [ "$?" == "0" ]; then   break; fi
               curl -s -XGET "http://localhost:9200/_cluster/health?pretty=true"  |grep yellow
               if [ "$?" == "0" ]; then   curl -H "Content-Type: application/json" -XPUT 'http://localhost:9200/_settings' -d '{"index":{"number_of_replicas":0}}'; break; fi
               sleep 1;
             done


kibana:
  image:
    name: kibana-oss
    tag: 7.4.2
    pullSecret: harbor-admin-secret

postgresql-ha:
  # Note for maintainers:
  # Some confusion may appear here because we use docker image created from "official" dockerhub base image postgresql
  # but we use helm chart designed for bitnami/postgresql.
  enabled: true
  postgresqlImage:
    name: postgresql-repmgr
    tag: 12.8.0
    pullSecrets: ["harbor-admin-secret"]
    pullPolicy: Always
  postgresql:
    username: postgres
    password: password
    database: postgres
    maxConnections: "1024"
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m
  pgpoolImage:
    name: pgpool
    tag: 4.2.3-debian-10-r38
    pullSecrets: ["harbor-admin-secret"]
    pullPolicy: Always
  pgpool:
    numInitChildren: "64"
    maxPool: "15"
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m
  volumePermissionsImage:
    name: bitnami-shell
    tag: 10-debian-10-r125
    pullSecrets: ["harbor-admin-secret"]
    pullPolicy: Always
  volumePermissions:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  persistence:
    enabled: true
    size: 20Gi


mongodb:
  enabled: true
  image:
    name: mongodb
    tag: 4.4.6-debian-10-r8
    pullSecret: harbor-admin-secret
  volumePermissions:
    enabled: true
    image:
      name: bitnami-shell
      tag: 10-debian-10-r91
  auth:
    username: redstone
    password: redstoneMongo123
    database: vegeta
    rootPassword: redstoneMongo123
  architecture: replicaset
  # https://github.com/helm/charts/issues/18588
  useStatefulSet: true
  #
  persistence:
    enabled: true

holmes:
  enabled: true
  image:
    name: tensorsec-holmes
    tag: latest
    pullSecret: harbor-admin-secret
  extraArgs:
    - "-A"
  tensorsecDaemon:
    image:
      name: tensorsec-daemon
      tag: latest
    multicluster:
      consoleaddr: http://tensorsec-console:8889
  ebpf:
    enabled: false
  falco:
    resources:
      requests:
        cpu: 2
        memory: 2048Mi
      limits:
        cpu: 2
        memory: 2048Mi
    rulesFile:
      - /etc/holmes/rules.d
      - /etc/holmes/holmes_rules.yaml
    jsonOutput: true
    jsonIncludeOutputProperty: true
    httpOutput:
      enabled: true
      url: http://tensorsec-holmessidekick:2801
    webserver:
      enabled: false
    programOutput:
      enabled: false
      keepAlive: false
      program: /bin/bash /holmes_export.sh
    syslogOutput:
      enabled: false
    stdoutOutput:
      enabled: true

  # Add extra volumes to Falco daemonset
  extraVolumes:
    - name: client-cert
      secret:
        secretName: eventcenter-tls-client-cert-secret
    - name: ca-cert
      secret:
        secretName: eventcenter-tls-ca-secret
    - name: server-cert
      secret:
        secretName: eventcenter-tls-server-cert-secret
  # Add extra volumeMounts to Falco container in Falco daemonset
  extraVolumeMounts:
    - mountPath: /auth/client
      name: client-cert
      readOnly: true
    - mountPath: /auth/ca
      name: ca-cert
      readOnly: true
    - mountPath: /auth/server
      name: server-cert
      readOnly: true

image-validator:
  enabled: false
  image:
    name: tensorsec-image-validator
    tag: latest
  certgen:
    image:
      name: tensorsec-certgen
      tag: v1.5.1

webhook:
  enabled: true
  image:
    name: tensorsec-webhook
    tag: latest
  certgen:
    image:
      name: tensorsec-certgen
      tag: v1.5.1
  args:
    consoleUrl: "http://tensorsec-console:8889"
    clusterManagerUrl: "http://tensorsec-cluster-manager:9443"

stan:
  enabled: true
  image:
    name: nats-streaming
    tag: 0.21.2
    pullSecret: harbor-admin-secret
  stan:
    clusterID: tensorsec
    authToken: ""
  store:
    volume:
      enabled: true

security-profiles-manager:
  enabled: true
  image:
    name: tensorsec-security-profiles-manager
    tag: latest
    pullSecret: harbor-admin-secret
  initContainers:
    image:
      name: alpine
      tag: latest
  webhook:
    image:
      name: tensorsec-security-profiles-webhook
      tag: latest
      pullSecret: harbor-admin-secret
  loader:
    image:
      name: tensorsec-security-profiles-loader
      tag: latest
      pullSecret: harbor-admin-secret
  audit:
    image:
      name: tensorsec-go-audit
      tag: latest
      pullSecret: harbor-admin-secret
  eventProcessor:
    image:
      name: tensorsec-event-processor
      tag: latest
      pullSecret: harbor-admin-secret
  holmes:
    rulesConfigMap: tensorsec-holmes-rules
    podLabel: tensorsec-holmes
  stan:
    clientID: sec-profile-manager
    clusterID: tensorsec

holmessidekick:
  enabled: true
  replicaCount: 1
  image:
    repository: falcosecurity
    name: falcosidekick
    tag: "2.22.0"
    pullSecret: harbor-admin-secret
  config:
    stan:
      hostport:  "nats://tensorsec-stan-headless:4222"
      clusterid: tensorsec
      clientid:  falco

