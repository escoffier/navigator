- key: Linux Privilege Escalation using nmap suid binaries
  hid: priv_14
  condition: >
    (evt.type = stat and evt.arg.path contains "nmap.xsl" and user.uid != 0 and ((proc.cmdline contains "interactive") or (proc.cmdline contains "script") or (proc.cmdline contains "-oG"))) and not tensorsec_namespace
  output: >
    proc_pid=%proc.pid,proc_ppid=%proc.ppid,proc_cmdline=%proc.cmdline,proc_pname=%proc.pname,pod_id=%k8s.pod.id,syscall_name=%syscall.type,container=%container.info,container_id=%container.id,container_name=%container.name
  info:
    name:
      en: "Linux Privilege Escalation using nmap suid binaries"
      zh: "尝试利用nmap_suid进行linux提权"
    desc:
      en: "SUID (Set User ID) is a special permission bit used to specify that when an executable file is executed, the file will run with the permissions of the file owner, not the executor. Usually attackers abuse SUID permissions and use the nmap tool to escalate Linux privileges, gain access to higher privileges on the system, and may perform dangerous operations. Normal users will not deliberately abuse SUID permissions to escalate privileges."
      zh: "SUID（Set User ID）是一种特殊的权限位，用于指定在执行可执行文件时，该文件将以文件所有者的权限运行，而不是执行者的权限。通常攻击者滥用SUID权限并使用nmap工具来进行Linux提权，获得对系统更高权限的访问，可能执行危险的操作。而正常用户不会故意滥用SUID权限来提权。"
    suggestion:
      en: "(1). Please first combine the alarm process command line, (parent) process name, server IP address and other fields to initially determine whether it is a business, R&D/operation and maintenance behavior (2). If it is a repeated expected behavior, and After investigation, it is judged that the security risk is controllable, and you can consider whitening it (3). If it is an unexpected behavior, please conduct correlation analysis through the container ID, associated alarm list, etc., and check whether the command line parameters include interactive and script, and promptly Contact security personnel for further investigation"
      zh: "(1).请先结合告警的进程命令行、(父)进程名、服务端IP地址等字段初步判断是否为业务、研发/运维的行为 (2).如果是重复出现的预期行为，且经排查后判断安全风险可控，可以考虑对其进行加白 (3).如果是非预期行为，请通过容器id、关联告警列表等内容进行关联分析，查看命令行参数是否包含interactive、script,及时联系安全人员进一步排查"
