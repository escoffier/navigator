apiVersion: {{ include "tensorsec.common.capabilities.rbac.apiVersion" . }}
kind: Role
metadata:
  name: {{ template "secProfilesManager.serviceAccount" . }}-role
  labels:
    app: "{{ template "secProfilesManager.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - create
