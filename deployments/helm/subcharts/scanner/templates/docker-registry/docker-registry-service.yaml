apiVersion: v1
kind: Service
metadata:
  name: {{ template "scanner.fullname" . }}-dockerregistry
  labels:
    app: {{ template "scanner.fullname" . }}-dockerregistry
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.dockerregistry.service.type }}
  {{- if (and (eq .Values.dockerregistry.service.type "ClusterIP") (not (empty .Values.dockerregistry.service.clusterIP))) }}
  clusterIP: {{ .Values.dockerregistry.service.clusterIP }}
  {{- end }}
  ports:
    - port: {{ .Values.dockerregistry.service.httpPort }}
      protocol: TCP
      name: http
      targetPort: 5000
      {{- if (and (eq .Values.dockerregistry.service.type "NodePort") (not (empty .Values.dockerregistry.service.httpNodePort))) }}
      nodePort: {{ .Values.service.httpNodePort }}
      {{- end }}
    - port: {{ .Values.dockerregistry.service.gcPort }}
      protocol: TCP
      name: gc
      targetPort: 8081
      {{- if (and (eq .Values.dockerregistry.service.type "NodePort") (not (empty .Values.dockerregistry.service.gcNodePort))) }}
      nodePort: {{ .Values.service.gcNodePort }}
      {{- end }}
  selector:
    app: {{ template "scanner.fullname" . }}-dockerregistry
    release: {{ .Release.Name }}