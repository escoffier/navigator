apiVersion: rbac.authorization.k8s.io/v1beta1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-console-cluster-role-binding
  labels:
    app: {{ .Release.Namespace }}-app
roleRef:
  kind: ClusterRole
  name: {{ .Release.Namespace }}-console-cluster-role
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Namespace }}-console-sa
    namespace: {{ .Release.Namespace }}
